    <g filter="url(#blur)" opacity="0.45"><circle cx="820" cy="60" r="230" fill="#12b9a8"/><circle cx="1010" cy="250" r="250" fill="#a98fe0"/><circle cx="1190" cy="90" r="210" fill="#ef5ba6"/><circle cx="640" cy="300" r="170" fill="#46c5cd"/><circle cx="1260" cy="300" r="160" fill="#2fc1bd"/></g>
    <rect width="1280" height="320" fill="url(#fade)"/>
    <rect width="1280" height="320" fill="url(#scan)"/>
    <rect y="316" width="1280" height="4" fill="url(#holo)"/>
    <g fill="url(#mark)"><path d="M75 750H225V600H75ZM0 0H75V525H225V-75H150V-150H0Z" transform="translate(96.0,213) scale(0.16,-0.16)"/><path d="M0 525H75V600H450V525H525V75H450V0H75V75H0ZM375 450H150V150H375Z" transform="translate(144.0,213) scale(0.16,-0.16)"/><path d="M0 900H150V750H0ZM300 900H450V750H300ZM0 0H75V75H150V150H75V225H0V600H150V300H225V225H300V600H450V150H375V75H300V0H225V-75H150V-150H0Z" transform="translate(240.0,213) scale(0.16,-0.16)"/></g>
