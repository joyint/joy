      <text x="372" y="132" font-size="30" font-weight="600" fill="#111114">Product management</text>
      <text x="372" y="172" font-size="30" font-weight="600" fill="#111114">that lives in your Git repo.</text>
      <text x="372" y="222" font-size="19" fill="#56554F"><tspan fill="#1F9480">$</tspan> joy add story "User login" --priority high</text>
