<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Joy: terminal-native product management that lives in your Git repo">
  <defs>
    <linearGradient id="holo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="320"><stop offset="0%" stop-color="#12b9a8"/><stop offset="20%" stop-color="#46c5cd"/><stop offset="45%" stop-color="#a98fe0"/><stop offset="70%" stop-color="#ef5ba6"/><stop offset="100%" stop-color="#2fc1bd"/></linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="96" y1="70" x2="312" y2="240"><stop offset="0%" stop-color="#12b9a8"/><stop offset="50%" stop-color="#46c5cd"/><stop offset="100%" stop-color="#a98fe0"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
