# Upload workspace crates to crates.io on a version tag push.
# Uses just publish-crates which only touches the registry, not the
# forge release (that is created by the local `joy release publish`
# before this workflow runs). See ADR-032 for the local-first
# release paradigm.
#
# joy-core depends on joy-crypt via a path dependency
# (`../crypt/crates/joy-crypt`). cargo metadata, cargo pkgid and
# cargo publish all read the path even though the published manifest
# strips it back to a version-only spec, so we clone joyint/crypt
# as a sibling before invoking cargo. Both repos are public; default
# GITHUB_TOKEN suffices.

name: Publish to crates.io

on:
  push:
    tags:
      # Stable releases only. Pre-release tags like vX.Y.Z-rc1 or vX.Y.Z-test1
      # do not trigger this workflow so they cannot pollute crates.io
      # (published crate versions are permanent, only yankable).
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Read-only access is enough: publishing is to crates.io via
# CARGO_REGISTRY_TOKEN, no GitHub release or branch update needed.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # joy-core depends on joy-crypt via a path dep at ../crypt/crates/joy-crypt.
      # actions/checkout refuses paths above $GITHUB_WORKSPACE, so we shell-
      # clone crypt into the parent directory of the workspace.
      - name: Clone joyint/crypt sibling
        run: git clone --depth 1 https://github.com/joyint/crypt.git ../crypt

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v3

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: just publish-crates
