# TEMPORARY (JOY-0190): one-off smoke test for the Windows signing path.
# Builds a throwaway exe, signs it via the shared action (OIDC -> Artifact
# Signing), and verifies the signature. Delete after a green run.
name: Sign smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build a throwaway exe
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          cargo new --bin signtest
          cd signtest
          cargo build --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/release/signtest.exe "$GITHUB_WORKSPACE/out/"
      - name: Sign it
        uses: ./.github/actions/sign-windows-exe
        with:
          files-folder: out
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature out/signtest.exe
          $sig | Format-List
          Write-Host "Subject: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "Signature status is $($sig.Status), expected Valid"
            exit 1
          }
          Write-Host "Signature is Valid."
