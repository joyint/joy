name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Read-only access is enough: this workflow does not push, comment,
# or create releases. Tightens the default GITHUB_TOKEN scope.
permissions:
  contents: read

# joy-core depends on joy-crypt via a path dependency
# (`../crypt/crates/joy-crypt`) plus a version constraint so that
# `cargo publish` resolves the version from crates.io while local
# builds use the sibling checkout. The standalone joy CI therefore
# also clones joyint/crypt into a sibling directory before running
# any cargo command. On GitHub both repos are public and no PAT is
# needed; on a private mirror (e.g. the internal Gitea) the sibling
# is private too, so the checkout uses the ORG_READ_TOKEN org secret
# when present and falls back to the default token otherwise.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: joy
      - uses: actions/checkout@v4
        with:
          repository: joyint/crypt
          path: crypt
          token: ${{ secrets.ORG_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: joy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with:
          path: joy
      - uses: actions/checkout@v4
        with:
          repository: joyint/crypt
          path: crypt
          token: ${{ secrets.ORG_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy
          # Persist the dependency/target cache even when the job fails, so
          # iterating on a red build does not recompile every dependency from
          # scratch on the next run (matters most for the slow windows leg).
          cache-on-failure: true
      - run: cargo clippy --workspace -- -D warnings
        working-directory: joy

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: joy
      - uses: actions/checkout@v4
        with:
          repository: joyint/crypt
          path: crypt
          token: ${{ secrets.ORG_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy
          cache-on-failure: true
      # joy-core's identity resolution reads git user.email as the local
      # fallback identity; GitHub-hosted runners have none configured, so set
      # one (dev machines and the self-hosted runner image already have it).
      - name: Configure a git identity for the tests
        run: |
          git config --global user.email "ci@joyint.dev"
          git config --global user.name "Joyint CI"
      # --no-fail-fast: run every test binary even if an earlier one fails,
      # so a single CI run surfaces all platform-specific failures at once
      # (important for the slow windows-latest leg). See JOY-01A4-5B.
      - run: cargo test --workspace --no-fail-fast
        working-directory: joy

  # The windows leg runs only on GitHub: a private mirror (internal Gitea)
  # has no windows runner, and a job with no matching runner sits blocked
  # forever. Same steps as `test`, split out so the gate stays job-level.
  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    needs: fmt
    if: ${{ !contains(github.server_url, 'gitea') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: joy
      - uses: actions/checkout@v4
        with:
          repository: joyint/crypt
          path: crypt
          token: ${{ secrets.ORG_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy
          cache-on-failure: true
      - name: Configure a git identity for the tests
        run: |
          git config --global user.email "ci@joyint.dev"
          git config --global user.name "Joyint CI"
      - run: cargo test --workspace --no-fail-fast
        working-directory: joy

  integration:
    name: Integration (bats)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
        with:
          path: joy
      - uses: actions/checkout@v4
        with:
          repository: joyint/crypt
          path: crypt
          token: ${{ secrets.ORG_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: joy
          cache-on-failure: true
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      # The bats suite drives the debug joy binary built with fast-kdf
      # (minimal Argon2id) for speed, matching `just test-int`. The
      # setup helper finds it at target/debug/joy. Windows coverage is
      # tracked separately (JOY-01A7-35).
      - run: cargo build -p joy-cli --features fast-kdf
        working-directory: joy
      - run: bats tests/integration/*.bats
        working-directory: joy
