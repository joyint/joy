[package]
name = "joy-gitea"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Joy forge connector for Gitea and Forgejo: claims, identity, store, files over the REST API"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

[lib]
name = "joy_gitea"
path = "src/lib.rs"

# The legacy name of D2.2a: a PATH fallback for `cargo install` users
# until the deprecation window closes.
[[bin]]
name = "joy-gitea"
path = "src/main.rs"

[dependencies]
joy-forge-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
joy-forge-net = { workspace = true, features = ["fake-api"] }
