[package]
name = "joy-chat"
version = "0.19.0"
edition = "2021"
license = "MIT"
description = "Encrypted chat subsystem for Joy (human and AI chat)"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

[dependencies]
joy-core = { version = "0.19.0", path = "../joy-core" }
joy-crypt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10.9"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
base64ct = { version = "1", features = ["alloc"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
ts-rs = { version = "12", features = ["serde-compat"], optional = true }

[features]
ts = ["dep:ts-rs", "joy-core/ts"]

[dev-dependencies]
tempfile = "3"
insta = { version = "1.41", features = ["yaml"] }
