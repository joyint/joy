[package]
name = "joy-process"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Every child process joy starts, built the same way: no console window under a GUI host on Windows"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# The console-window test asks whether the child's console has a VISIBLE
# window, which is the symptom the operator saw.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
