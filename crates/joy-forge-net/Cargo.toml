[package]
name = "joy-forge-net"
# Inherited from [workspace.package]: this manifest is in no
# release.version-files list, the workspace manifest is, so the
# bump reaches this crate through it (JOY-02A4-89).
version.workspace = true
edition = "2021"
license = "MIT"
description = "Shared network layer of the Joy forge connectors: HTTP client, proxies, trust store, instance configuration, scope sets"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

# Not a cargo-dist App: only joy-cli is. Why every
# publishable crate beside it carries this key is written once, in the
# "Check the release shape" step of .github/workflows/release.yml, which
# is also what fails when a crate loses it.
[package.metadata.dist]
dist = false

[dependencies]
joy-process = { workspace = true }
# The cross process advisory file lock. It exists ONCE,
# as `joy_core::util::file_lock`, and nothing else carries a lock
# dependency of its own for locking.
# The refresh lock of `auth::lock` takes that primitive, and
# `joy_core::auth::session` says where a person's app state lives, which
# is where the lock files and the login pin belong.
# The version pin is inherited too, so a bump cannot leave it
# asking crates.io for a joy-core that no longer exists there.
# The operating system credential store is reached through
# `joy_core::keychain` and nowhere else (JOY-02DB-25), so this crate
# carries no keyring of its own. `keychain-vendored` because the
# connector has to start in a container without libdbus (joy-core's
# Cargo.toml says why).
joy-core = { workspace = true, features = ["keychain-vendored"] }
# PKCE S256, the token fingerprint and the lock file name are
# all SHA-256; the challenge and the verifier are base64url without
# padding, and the verifier and the CSRF state come from the OS random
# source.
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
rand = "0.8"
hex = "0.4"
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# The connector's own HTTP client. Blocking, because a connector
# is one short lived process that asks a handful of questions and exits;
# an async runtime would be the larger half of the binary. rustls with
# the platform verifier is the OS trust store, and no proxy is
# read from the environment by ureq itself: joy decides the proxy in
# `proxy.rs` so that the rules (NO_PROXY with trimmed entries,
# ALL_PROXY, git config, the SOCKS refusal) hold here exactly as they
# hold in the engine.
ureq = { version = "3.4", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
    "gzip",
] }
rustls-pki-types = "1"

[features]
# The in process fake forge API the connector crates test against. It is
# a dev dependency of theirs, so a shipped connector never carries it.
fake-api = []

[dev-dependencies]
# What a test never inherits from the person's shell and session, said
# once (JOY-02BB-C7). Path only, so a publish drops it.
joy-test-env = { path = "../joy-test-env" }
# This crate's own tests drive the fake too (the proxy cases), and a
# crate cannot dev-depend on itself, so the feature is turned on for
# the test build here.
joy-forge-net = { path = ".", features = ["fake-api"] }
tempfile = "3"
