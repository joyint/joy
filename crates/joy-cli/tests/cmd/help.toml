# Smoke test: `joy --help` runs and exits 0 on every platform.
#
# The stdout text is intentionally NOT asserted here. trycmd's `...`
# elision over clap's help output is not portable across OSes (it passes
# on Unix but fails on windows-latest), and the help text is generated by
# clap, so a brittle cross-platform snapshot adds fragility without real
# coverage. See JOY-01A5-CA. The exit-code check still guards against the
# command panicking or erroring on any platform.
bin.name = "joy"
args = ["--help"]
status.code = 0
