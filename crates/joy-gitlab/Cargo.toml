[package]
name = "joy-gitlab"
version = "0.21.1"
edition = "2021"
license = "MIT"
description = "Joy forge connector for GitLab: claims, identity, store, files over the REST API"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

[lib]
name = "joy_gitlab"
path = "src/lib.rs"

# The legacy name: a PATH fallback for `cargo install` users
# until the deprecation window closes.
[[bin]]
name = "joy-gitlab"
path = "src/main.rs"

# The connector ships as ONE binary in the joy archive.
# This legacy name exists for `cargo install joy-gitlab` users during the
# deprecation window and must not become a cargo-dist App of
# its own: four extra Apps per tag also make the winget
# `installers-regex` ambiguous (.github/workflows/release.yml).
[package.metadata.dist]
dist = false

[dependencies]
joy-forge-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# What a test never inherits from the person's shell and session, said
# once (JOY-02BB-C7). Path only, so a publish drops it.
joy-test-env = { path = "../joy-test-env" }
joy-forge-net = { workspace = true, features = ["fake-api"] }
