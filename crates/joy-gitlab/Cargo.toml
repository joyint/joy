[package]
name = "joy-gitlab"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Joy forge connector for GitLab: claims, identity, store, files over the REST API"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

[lib]
name = "joy_gitlab"
path = "src/lib.rs"

# The legacy name of D2.2a: a PATH fallback for `cargo install` users
# until the deprecation window closes.
[[bin]]
name = "joy-gitlab"
path = "src/main.rs"

# The connector ships as ONE binary in the joy archive (design D2.1).
# This legacy name exists for `cargo install joy-gitlab` users during the
# deprecation window of D2.2a and must not become a cargo-dist App of
# its own: four extra Apps per tag also make the winget
# `installers-regex` ambiguous (.github/workflows/release.yml).
[package.metadata.dist]
dist = false

[dependencies]
joy-forge-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
joy-forge-net = { workspace = true, features = ["fake-api"] }
