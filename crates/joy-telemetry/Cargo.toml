[package]
name = "joy-telemetry"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "The telemetry core of joy's Rust components: OTel-shaped records from tracing, a rolling file sink, redaction"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

# Not a cargo-dist App: only joy-cli is (design D2.1). Why every
# publishable crate beside it carries this key is written once, in the
# "Check the release shape" step of .github/workflows/release.yml, which
# is also what fails when a crate loses it.
[package.metadata.dist]
dist = false

[dependencies]
joy-core = { version = "0.20.0", path = "../joy-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
