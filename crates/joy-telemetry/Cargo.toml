[package]
name = "joy-telemetry"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "The telemetry core of joy's Rust components: OTel-shaped records from tracing, a rolling file sink, redaction"

# Not a cargo-dist App. The release ships exactly one archive set per
# target, the one joy-cli produces, with joy and joy-forge in it (design
# D2.1). This crate is publishable, so the day it grows a binary it would
# otherwise become an App of its own at the next tag and make the winget
# `installers-regex` match more than one asset.
[package.metadata.dist]
dist = false

[dependencies]
joy-core = { version = "0.20.0", path = "../joy-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
