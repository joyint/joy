# joy:start -- managed by joy, do not edit manually (JOY-02AC-53, JOY-02DD-D2)
# Joy stores its items, comments and logs as files in this repository.
# When two branches touch the same item or the same day's log, GitLab
# cannot put them back together: it merges with plain git, which does
# not run Joy's merge rules. Your own clone can, because joy init
# registered the merge driver there.
#
# This job tries the merge where joy is installed and, only when Joy
# files stand in the way, writes into its log what to do: switch to the
# branch, pull the target, push. It then ends as a warning, which the
# merge request shows, and the rest of the pipeline runs on. It pushes
# nothing and needs no token (JOY-02DD-D2). Where plain git can merge,
# the job passes and says nothing.
#
# Include it from your .gitlab-ci.yml:
#   include:
#     - local: .joy/ci/gitlab.yml
#
# GitLab starts no pipeline that holds only jobs of the .pre and .post
# stages: the project needs one more job that runs for merge requests,
# or this one never runs.
joy-merge:
  stage: .pre
  image: debian:stable-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure:
    exit_codes: [3]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates git xz-utils
    - curl --proto '=https' --tlsv1.2 -LsSf https://github.com/joyint/joy/releases/latest/download/joy-cli-installer.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - git checkout "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    # the runner's own clone credentials bring the target in, so joy
    # needs none of its own
    - git fetch origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - joy merge ci --advise /tmp/joy-merge-advice.md
    - if [ -f /tmp/joy-merge-advice.md ]; then exit 3; fi
# joy:end
