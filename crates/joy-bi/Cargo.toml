[package]
name = "joy-bi"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Joy BI reference plugin: milestone and velocity reports as JoyNode JSON"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

# Not a cargo-dist App, and the one crate that was one: joy-bi has a
# binary, so its Windows zip is what made the winget `installers-regex`
# match two assets. It is a reference plugin a person builds or
# `cargo install`s, not part of the archive set the release ships
# (design D2.1; the rule is in .github/workflows/release.yml).
[package.metadata.dist]
dist = false

[dependencies]
joy-core = { version = "0.20.0", path = "../joy-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
