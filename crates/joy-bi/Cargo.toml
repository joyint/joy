[package]
name = "joy-bi"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Joy BI reference plugin: milestone and velocity reports as JoyNode JSON"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

# Not a cargo-dist App. joy-bi is a reference plugin that a person builds
# or `cargo install`s; it is not part of the one archive set the release
# ships (design D2.1), and as an App of its own it made the winget
# `installers-regex` of .github/workflows/release.yml match two Windows
# zips instead of one.
[package.metadata.dist]
dist = false

[dependencies]
joy-core = { version = "0.20.0", path = "../joy-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
