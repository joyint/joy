[package]
name = "joy-chat-store"
version = "0.20.0"
edition = "2021"
license = "MIT"
description = "Git storage for Joy's sealed chats: blobs, trees and the chats ref"
repository = "https://github.com/joyint/joy"
homepage = "https://joyint.com/en/joy"

# Not a cargo-dist App. The release ships exactly one archive set per
# target, the one joy-cli produces, with joy and joy-forge in it (design
# D2.1). This crate is publishable, so the day it grows a binary it would
# otherwise become an App of its own at the next tag and make the winget
# `installers-regex` match more than one asset.
[package.metadata.dist]
dist = false

[dependencies]
joy-chat = { version = "0.20.0", path = "../joy-chat" }
joy-core = { version = "0.20.0", path = "../joy-core" }
joy-model = { workspace = true }
joy-crypt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = "0.10.9"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# Chats live on a dedicated ref (refs/joy/chats, ADR JAPP-00DC-FC), which is
# never checked out, so it needs git plumbing (blob/tree/commit/ref) that the
# CLI cannot express cleanly.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[features]
ts = ["joy-chat/ts", "joy-core/ts"]

[dev-dependencies]
tempfile = "3"
# The maintenance cases age the store the way the operator's store is
# aged, so the shipped 14 day window can be asserted instead of a zero
# window no host ever runs.
filetime = "0.2"
insta = { version = "1.41", features = ["yaml"] }
