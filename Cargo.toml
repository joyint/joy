[workspace]
resolver = "2"
members = [
    "crates/joy-model",
    "crates/joy-core",
    "crates/joy-cli",
    "crates/joy-ai",
    "crates/joy-chat",
    "crates/joy-chat-store",
    "crates/joy-bi",
    "crates/joy-forge-net",
    "crates/joy-github",
    "crates/joy-gitlab",
    "crates/joy-gitea",
    "crates/joy-telemetry",
    "crates/joy-process",
]

[workspace.package]
# The one version of every crate this workspace publishes. Cargo.toml
# is in release.version-files (.joy/project.yaml), so `joy release bump`
# rewrites this literal, and a crate that inherits it with
# `version.workspace = true` is bumped even when its own manifest is in
# no list. That is how crates/joy-process, crates/joy-forge-net and
# crates/joy-telemetry stay in step with their dependents (JOY-02A4-89).
version = "0.20.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
minijinja = "2.18"
joy-model = { version = "0.20.0", path = "crates/joy-model" }
joy-process = { version = "0.20.0", path = "crates/joy-process" }
joy-core = { version = "0.20.0", path = "crates/joy-core" }
joy-forge-net = { version = "0.20.0", path = "crates/joy-forge-net" }
joy-github = { version = "0.20.0", path = "crates/joy-github" }
joy-gitlab = { version = "0.20.0", path = "crates/joy-gitlab" }
joy-gitea = { version = "0.20.0", path = "crates/joy-gitea" }
joy-crypt = { version = "0", path = "../crypt/crates/joy-crypt" }
joy-token = { version = "0", path = "../crypt/crates/joy-token" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
