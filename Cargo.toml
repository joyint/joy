[workspace]
resolver = "2"
members = [
    "crates/joy-model",
    "crates/joy-core",
    "crates/joy-cli",
    "crates/joy-ai",
    "crates/joy-chat",
    "crates/joy-chat-store",
    "crates/joy-bi",
    "crates/joy-github",
    "crates/joy-gitlab",
    "crates/joy-gitea",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
minijinja = "2.18"
joy-model = { version = "0.20.0", path = "crates/joy-model" }
joy-crypt = { version = "0", path = "../crypt/crates/joy-crypt" }
joy-token = { version = "0", path = "../crypt/crates/joy-token" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
