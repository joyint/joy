  date: 2026-05-05T22:13:13.995012Z
  text: |-
    [x] joy-core/init.rs: ensure_lazy_activation(root) calls ensure_gitattributes + register_merge_driver. update_gitattributes_block now skips write+auto-stage when content already matches (idempotent on hot path).
    [x] joy-cli/main.rs: invokes ensure_lazy_activation early on every command, best-effort, swallows errors.
    [x] 3 bats tests: re-creates deleted .gitattributes; re-registers wiped git config; does not dirty clean working tree.
