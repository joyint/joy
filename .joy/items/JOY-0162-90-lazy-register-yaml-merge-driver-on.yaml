description: |-
  After joy v0.14.1 shipped the YAML-aware merge driver but without auto-activation, the binary upgrade alone does not protect existing repos: .gitattributes and the local merge.joy-yaml.driver config are written only by joy init/onboard. Users who upgrade joy and never re-run init keep the old (broken) merge behaviour and silently re-introduce duplicate-key incidents.

  Fix: every joy invocation that finds a project root checks the local merge driver registration cheaply (two git config reads) and re-runs ensure_gitattributes + register_merge_driver if anything is stale. Best-effort, never fails a user-facing command. Cost target under 5ms.

  This is a stopgap; see follow-up rework item.
comments:
