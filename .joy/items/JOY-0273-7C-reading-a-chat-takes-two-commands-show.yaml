description: 'Horst, 2026-08-30: joy chat show prints a chat and joy chat read marks it read, so the read state on the forge only moves when someone remembers the second command; the apps know no such step, opening a chat is reading it. And show has no way to see only what is new. Decision (Horst): show marks the chat read and takes --unread, --last N and --since 30m|2h|3d; read goes.'
