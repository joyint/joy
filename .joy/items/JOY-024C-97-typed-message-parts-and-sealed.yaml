description: 'joy-chat: ChatMessage grows content PARTS (text, image, audio, embedded resource, resource link) with the text field staying the markdown backbone; attachments are sealed blobs in the chats ref next to the message, addressed per part, with hard size caps (media in a git ref needs limits) and an honest refusal above them. Store: seal/unseal of attachment blobs under the existing chat crypt epochs; migration for existing chats (none carry parts, so read-side tolerance only per ADR JOY-0244-9E); wasm bindings so the client can open parts. CLI: joy chat rendering names non-text parts.'
