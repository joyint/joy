description: 'vcs::tests::git_detect_forge calls detect_forge(Path::new(".")) on the actual working checkout and asserts Forge::GitHub (comment: We''re on GitHub). The assertion encodes the hosting of the moment: it fails on any clone whose origin is not github.com, e.g. the private Gitea mirror used during the 2026-07 embargo week, a GitLab fork, or a bare-git checkout. Fix: build a temp repo with an explicit github origin so the plumbing path (default_remote + remote_url + parse) is tested deterministically; the per-forge URL parsing is already covered by the forge_detection_* unit tests.'
