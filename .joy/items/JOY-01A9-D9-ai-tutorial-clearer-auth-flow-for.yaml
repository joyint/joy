description: |-
  AI tools, especially GitHub Copilot Chat in VS Code, struggle to authenticate with Joy. The current ai tutorial assumes the AI already has a registered member identity from a tool instruction file, so chat-only tools with no joy ai init have no path to a session and get stuck.

  Rework the Authentication section of crates/joy-cli/docs/ai/Tutorial.md so a cold start works in one operator interaction:
  - Start with 'joy project member' to detect whether the AI is already registered.
  - Not registered: ask the operator to run 'joy project member add ai:<name>@joy --with-token' (any tool, incl. chat-only) or 'joy ai init' (detectable tools). Suggest a name like ai:copilot-chat@joy / ai:cursor@joy; real ID comes back with the token.
  - Label every command with who runs it (you vs the operator); simple technical sentences.
  - Redeem once, then always pass --session on writes; JOY_SESSION env var only as a special case.
  - Auth-failure guide incl. 'guard denied' = stale/missing --session.

  Also add a short proactive tripwire to templates/ai/instructions.md (always loaded once joy ai init has run): read the tutorial each session; on 'must authenticate', check joy project member and bootstrap via the operator. SKILL.md keeps its existing tutorial reference.

  Run just sync-tutorial and just check; the embedded copy must stay byte-identical.
