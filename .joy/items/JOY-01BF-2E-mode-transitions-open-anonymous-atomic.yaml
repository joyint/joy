description: 'open->anonymous (needs auth + manage): per member generate an ID, move e-mail from project.yaml to members.yaml, rekey map to the ID, write the email_match verifier, create encrypted members.yaml — all in one atomic commit (never incremental). anonymous->open: the reverse. New project: joy init --anonymous flag AND a Y/n prompt (flag does not replace the prompt). Onboarding a new member in anonymous mode: OTP flow unchanged, wrap the members.yaml zone key for the new member. Ref ADR-042 §6.'
