description: 'open->anonymous (needs auth + manage): per member generate an ID, move e-mail from project.yaml to members.yaml, rekey map to the ID, write the email_match verifier, create encrypted members.yaml — all in one atomic commit (never incremental). anonymous->open: the reverse. New project: joy init --anonymous flag AND a Y/n prompt (flag does not replace the prompt). Onboarding a new member in anonymous mode: OTP flow unchanged, wrap the members.yaml zone key for the new member. Ref ADR-042 §6.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T17:49:15.158866526Z
  text: 'Guarantee to enforce here: switching to anonymous must require BOTH the manage capability AND an unlocked/authenticated identity. Manage is already enforced (ctx.enforce(ManageProject) on joy project set) and covered by bats (project_privacy.bats and privacy_anonymous.bats: ''requires the manage capability''). This migration also needs the unlocked seed to encrypt members.yaml, so it must require a real session/passphrase and must not fall back to implicit solo trust. Add a bats case asserting the anonymous switch fails when not authenticated.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T22:21:24.932542439Z
  text: Der verbleibende offene Teil dieses Tasks, das anonyme OTP-Onboarding eines Menschen, wird in JOY-01C3-A7 herausgeloest und dort weiter geloest. Die uebrigen Teile (open/anonymous Transition in beide Richtungen sowie joy init mit dem anonymous-Flag und Y/n-Prompt) sind umgesetzt.
