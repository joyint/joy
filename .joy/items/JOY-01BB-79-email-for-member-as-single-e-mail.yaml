description: 'Introduce one function (email_for(member)) that resolves a member''s e-mail by mode: open -> member entry in project.yaml; anonymous -> decrypted members.yaml. Route every e-mail consumer (attestation, signatures, event log, display) through it so the rest of the code is mode-agnostic and the e-mail is bit-identical regardless of source. Ref ADR-042 §1.'
