description: 'Operator 2026-10-17: the history of a job on joyint-forge-test shows only the creation; every later status change, by a person or by the platform, is missing. The trail is derived from the event log (JOY-0175-9B) over ITEM_ATTRIBUTE_EVENTS, which lists item.status_changed but not job.status_changed, the event every job step writes. Fix: job.status_changed joins the list, and joy show says what an entry changed where the log says it (a status step names its statuses, and the platform''s reason where it had one).'
