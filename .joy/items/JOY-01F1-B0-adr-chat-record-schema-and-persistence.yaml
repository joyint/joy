description: 'A chat is .joy/chats/<chat-id>.yaml: id, created, participants (member refs), ai_sessions (member -> ACP session id, so an AI participant''s thread survives restarts), messages (at, author member-ref, text). Written through joy-core with the same governed-write/signing posture as items. Cadence: append persists per message in this slice (honest and simple); batching/debounce is a later optimization item, NOT a different data home. Display of authors follows the no-raw-ID rule (MemberRef resolution).'
