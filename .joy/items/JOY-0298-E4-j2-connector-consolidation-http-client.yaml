  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j2, commits 11d3e6c17fec8206f9a889aa10b86c0b14de9c20 [JOY-0298; merged into feat/forge-connection-ng by the integrator).\n\nAll four must-fix findings are fixed and proven, and six of the nine should-fix items are fixed; the remaining three are stated in the code with their reason and listed here. The protocol 1 regression is the important one: joy passed `--remote` to `release`, which a protocol 1 connector's clap rejects with exit 2 and an empty stdout, i.e. exactly D2.2a's stale-binary detector, so `joy release publish` died on any machine with an old joy-github. The target now travels to a protocol 1 binary only for the three verbs whose old parser takes it (claims, store, files), verified against the J1 branch's actual binary. J2's GH_TOKEN acceptance is met for real: the connector reads the forge's own token variables when no caller names one (GH_TOKEN/GITHUB_TOKEN for github.com, the enterprise pair elsewhere, GITLAB_TOKEN, GITEA_TOKEN), a caller-named variable stays the whole answer for that call, and the bats case now runs with neither gh nor curl on the PATH and asserts the Bearer value the fake forge saw. GitLab no longer tells a read-only member their repository is gone on a 404, Gitea's scope_missing lists are the right way round, the racy ps test polls for the complete argv, create-repository spends one GET /user instead of two, a public_repo token is refused locally for a private repository, repositories stops losing rows at a page boundary, and the unreachable asset upload is gone. Everything is green: workspace tests, joy-core with forge-net, clippy, fmt, and all 576 bats cases.\n\nAcceptance:\n- [met] MUST FIX 1: `release` must not send `--remote` to a protocol 1 connector (D2.2a, J10): forge_plugins.rs now has LEGACY_TARGET_VERBS = claims, store, files: the target travels to a protocol 1 binary only for the three verbs whose old parser takes it, which also removes the same latent trap on `identity`. Ne\n- [met] MUST FIX 2: GitLab `store` must not turn every 404 into `gone` (D2.7c): gitlab.rs gained may_see_private(ctx, host): no token, or a granted set without read_api/api, makes the 404 `unknown` instead of `gone`. The scope question is asked lazily, only on that branch, so the request budget of D\n- [met] MUST FIX 3: Gitea `scope_missing` lists were inverted (D2.7c): gitea.rs parses both lists out of Gitea's own refusal: `required=` goes into `needed`, the new token_scopes() reads `token scope=` into `have`. The fake-forge case now asserts needed=[write:repository], have=[read:user] \n- [met] MUST FIX 4: `joy release publish` succeeds without curl with `GH_TOKEN` set: The connector reads the forge's own variables when no caller named one: GH_TOKEN/GITHUB_TOKEN for github.com, GH_ENTERPRISE_TOKEN/GITHUB_ENTERPRISE_TOKEN for every other host (gh's own split), GITLAB_TOKEN, GITEA_TOKEN. \n- [met] SHOULD FIX 1: the racy `ps` acceptance test: It polls until /proc/<pid>/cmdline contains the last argument joy passes (`--host-kind background`) and additionally asserts the line is the connector's own path, instead of breaking on the first non-empty read. Six cons\n- [met] SHOULD FIX 2: two identical GET /user in create-repository: current_account() returns the account and the X-OAuth-Scopes set from one answer; last_scopes() is gone; current_user() is a thin wrapper over it.\n- [met] SHOULD FIX 3: unreachable upload_asset: Dropped, with a comment naming what would bring it back. Wiring it would need an `--asset` option, which decision 29 does not name, and joy's own publish never uploaded an asset (verified against the J1 gh path), so noth\n- [met] SHOULD FIX 4: public_repo passes the pre-check for a private repository: scope::missing_for_create(forge, private, granted) implements D2.7a's sentence; github.rs uses it in the local pre-check and in the post-refusal classification, so a `public_repo` token is refused locally for a private r\n- [met] SHOULD FIX 5: `repositories` loses rows and mis-reports truncated: All three connectors: the page size is now bounded by the caller's limit too, a page that would carry the answer past the limit is left UNREAD so the cursor points at it, and `truncated` is false when the forge's page wa\n- [not_met] SHOULD FIX 6: Gitea has no local scope pre-check: Deliberate, stated in the code with its reason: D2.7c's pre-check rests on the connector recording the granted set beside its own token, which is J3. Gitea names the set nowhere a token can read (GET /user does not carry\n- [not_met] SHOULD FIX 7: no proxy credential from the credential helper: Deferred by design and now stated in proxy.rs: D1.11 resolves it through the helper runner of D1.3, which is J4p's work in the engine. When it lands it feeds into one place here (the result of choose()) and nothing else \n- [not_met] SHOULD FIX 8: store and files collapse 401/403 into unknown: Not safe inside J2: joy-core's StoreAnswer and FilesAnswer are closed internally tagged enums with no scope_missing variant, so emitting that state would turn the answer into PluginError::Unparsable for every reader (CLI\n- [partly] SHOULD FIX 9: size per release target, and decision 6's premise: The Linux row is re-measured and now exact (3.79 MB, 3 971 064 bytes). The four other rows stay open: this host has no aarch64, Apple or MSVC linker (only x86_64-unknown-linux-gnu and x86_64-pc-windows-msvc targets are i\n- [met] J2: `joy-forge github identity --remote <url>` answers on a machine without curl: crates/joy-cli/tests/forge_connector.rs empties PATH for the whole test binary, so no curl and no gh exists; identity answers from the fake forge over the connector's own HTTP client.\n- [met] J2: `joy release publish` against a github.com remote succeeds without curl, with GH_TOKEN set or with gh signed in: Both halves now hold: the gh half through the bats cases with the gh token stub, the GH_TOKEN half through the trimmed-PATH bats case and the Rust end-to-end case. Before this commit the GH_TOKEN half passed only because\n- [met] J2: `ps` during any call shows no token: The token travels as a variable NAME in argv and as a header on the wire; the test reads the child's own /proc argv and asserts the name is there and the value is not.\n- [met] J2: an internal host listed in forges.yaml is claimed with no forge CLI installed: Rust case with an empty PATH plus a bats case; unchanged by this commit.\n- [met] J2: a GHES host asks its own /api/v3/user/emails, not api.github.com: api_base() per host with the forges.yaml override; pinned by joy-github's fake-forge tests. Unchanged by this commit.\n- [met] J2: the GitLab read write set answers store, files, repositories and answers create-repository with scope_missing naming api: One fake-forge case carries all four, and the three new 404 cases sit beside it.\n- [partly] J2: the stripped size of joy-forge is measured and recorded per release target; decision 6 revisited past 10 MB: One target measured here, four recorded as open with the reason and the reproduction command. Far below the 10 MB threshold.\n\nOpen questions:\n- The git2-only rule is not yet true of the release path itself: `joy release publish` reaches joy-core's vcs, which spawns a git binary (vcs/mod.rs git_output/git_run). That is D3.2's package, not J2's, but it is what stopped the acceptance case from running with an empty PATH, an\n- SHOULD FIX 8 needs a decision above J2: giving `store` and `files` a `scope_missing` answer means adding states to joy-core's StoreAnswer/FilesAnswer and teaching the CLI, the desktop and the platform to render them. Recommended home is J3 (where the connector holds the granted s\n- Gitea keeps no local scope pre-check until J3 gives the connector its own token entry with the granted set beside it; there is no Gitea endpoint that names the set of the token in use.\n- The proxy credential from the machine's credential helper (D1.11) reaches the connector only when J4p's helper runner exists; until then a corporate proxy whose Basic password lives in the helper works for neither engine nor connector.\n- For the operator, from D5/decision 6: the consolidation grew the shipped total (three protocol 1 plugins were 3.3 MB stripped, one connector is 3.79 MB), so decision 6's size argument no longer holds even though its packaging argument (one archive, one receipt, one sidecar, an un\n- The four non-Linux size rows need the release workflow (no cross linker on this host).\n\nRemaining: Gitea has no local scope pre check until J3 stores the granted set; store and files cannot answer scope_missing until the joy-core answer types gain the state (J3); the release path still reaches the git binary through vcs (J6); sizes measured only for x86_64 Linux (3.97 MB stripped)."
