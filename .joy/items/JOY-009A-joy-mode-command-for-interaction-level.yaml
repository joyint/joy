description: |-
  New command `joy mode <ID>` to inspect effective interaction levels per member per item. Flags: `--mine` (all statuses for caller), `--member <id>` (all statuses for a member), `--status <status>` (filter to a specific status). Combinable. Default (no flags): current status, all members. Output follows Joy UI standard: full-width header/footer, dimmed annotations. The AI uses `joy mode <ID> --mine` to determine how to interact. Resolves all four layers (project defaults, project overrides, personal preference, item override) clamped by max-mode. See ADR-025 for resolution logic.

  Output must include the **semantic description** of each level, not just the name, so the AI knows what behaviour the level implies without having to look elsewhere. The canonical description set (single source of truth) lives next to the level definitions in joy-core and is what `joy config get modes.* --describe` (see JOY-0187-D0) returns too.
