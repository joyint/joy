description: 'Operator 2026-07-27: a sandbox project with about 20 chats of 10 messages carries 39 MB in .git. Measured on the exact copy he sent: 6140 loose objects, 38.89 MiB, ZERO packs. Of that, 1703 objects are reachable and weigh 0.7 MiB uncompressed; 4437 objects (22 MiB, mostly trees) are unreachable. The rest of the disk figure is loose-object overhead, one file per object padded to a filesystem block. Cause: every chat write goes through libgit2, which never runs the auto-gc that the git binary runs at 6700 loose objects, and nothing else ever packs or prunes either, so the number only rises. Proof: git gc --prune=now on his copy took .git from 41 MB to 476 KB with all 12 chats intact. Fix: run repository maintenance from the write path, best effort, so a long-lived project stays small; joy already shells out to the git binary (joy-ai/ai_setup.rs), so this needs no new dependency. The garbage that maintenance sweeps up is produced by the ref race in the sibling item.'
