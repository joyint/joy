description: |-
  A person works in a branch, opens a pull request and presses the merge button. Today the forge answers with a conflict in the Joy files, and the button stays locked: forges do not run Joy's merge driver. Verified on 2026-09-16: GitHub ignores a repository's .gitattributes entirely (its own statement in community discussion 9288, request open since 2021), GitLab honours only the built-in union, Gitea merges with the real git binary so union works there but a custom driver still needs the joy binary on the server. Replaying our failing pull requests with .gitattributes removed reproduces the forge result exactly.

  This hits every customer who merges through the web interface, so it belongs in the product, not in our operations notes.

  The way that works, demonstrated end to end with a bare repository as the forge: do the hard merge where joy is installed, then the forge only fast forwards, which cannot fail. A hidden 'joy merge ci' does it, and joy init writes the CI file that calls it, like it writes .gitattributes today.

  - [ ] joy merge ci: merge the target branch into the pull request branch with the Joy driver and publish the result; stop and explain when both sides really changed the same field
  - [ ] Hidden like joy merge driver, because only the CI calls it
  - [ ] joy init writes the CI file for the forge it detects, inside a joy marked block, and never touches a foreign file
  - [ ] joy init ci --forge <name> for local repositories and for adding it later; a forge change through joy config updates the file
  - [ ] Templates for GitHub Actions, Gitea Actions and GitLab CI
  - [ ] Contributions from a fork: the job cannot write there, so it comments on the pull request and asks the contributor to merge the target branch in
  - [ ] The person sees a check line and a green button, nothing about drivers
  - [ ] Tutorial: own chapter about merging
  - [ ] git2 only, no git process (JOY-01FD-ED)
