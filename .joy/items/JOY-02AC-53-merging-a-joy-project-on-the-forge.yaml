  text: |-
    Plan, after reading the code on main (1f59f25):

    libgit2 runs no external merge driver, so 'joy merge ci' cannot lean on .gitattributes either. It resolves the Joy files itself, in process, which also keeps the git2 only rule (JOY-01FD-ED):
    1. joy-core, next to forge::merge_branch: merge a ref into HEAD with git2, then walk the index conflicts. A .joy YAML file goes through merge::merge_yaml_doc, a .joy log through a line union, an encrypted blob takes the newer side (the rule merge.rs already states). Anything else stays a conflict and the function reports it.
    2. joy-cli, next to merge driver: the hidden 'merge ci' subcommand. It reads the target branch from its argument or from the CI environment, fetches it, runs the merge, commits and pushes. On a real conflict it exits with the file and field named.
    3. joy-core init: embedded CI templates per forge, written like the hooks and .gitattributes, inside a joy marked block. New: joy init ci --forge <name> for local repositories and for adding it later.
    4. Tutorial: own chapter about merging.

    Worktree .claude/worktrees/forgemerge/joy on feat/joy-merge-ci, so the other sessions are not disturbed.
