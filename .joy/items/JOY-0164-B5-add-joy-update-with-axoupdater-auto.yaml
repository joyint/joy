description: |-
  Implement the hybrid update mechanism designed in JOY-0163-6B.

  Components:
  1. axoupdater dependency in joy-cli; install-updater = true in dist-workspace.toml.
  2. Subcommand 'joy update' wraps axoupdater (binary swap via GitHub Releases receipt). Graceful fallback for non-cargo-dist installs (brew, cargo install): prints clear 'use your installer' message via load_receipt() error handling.
  3. 'joy update --check' aggregates checks across binary version, .gitattributes block, merge driver config, SECURITY.md, project.yaml schema, AI tool files. Exit 2 if anything would refresh, JSON output for AI tools.
  4. Sync orchestrator runs lazy-activation + the work auth update + ai update do internally. Single output protocol: 'refreshed: <path>' / 'registered: <key>' lines.
  5. Per-clone version marker in local git config: joy.last-sync-version. Add config_get / config_set to the Vcs trait (ADR-010 compliance) so other VCS backends can implement when needed.
  6. Auto-sync hook in main.rs: after lazy-activation, compare CARGO_PKG_VERSION to joy.last-sync-version. Mismatch -> run sync orchestrator, print summary, then proceed.
  7. .joy/config.yaml gains auto-sync: bool (default true). Plumbing into Config struct + read in the auto-sync hook.
  8. joy ai update + joy auth update remain in the CLI as deprecated aliases for one release cycle, then go away.
  9. CLAUDE.md / Copilot instructions / Qwen / Vibe templates updated: drop 'run joy ai update --check at session start', add 'watch joy command output for refreshed: <your-instruction-file> and re-read'.
  10. Tests: bats E2E for joy update, joy update --check, auto-sync trigger via faked stale marker, output protocol, CLAUDE.md template re-read advice.

  Acceptance:
  - joy update on a cargo-dist-installed binary fetches and replaces.
  - joy update on a brew/cargo-install build prints a clear non-clobbering message.
  - After a binary upgrade with no in-repo run, the next joy invocation in the repo silently runs the sync and prints the same output joy update would have, marker is updated, working tree only carries the legitimate file changes.
  - joy update --check exits 2 with structured output when anything is stale.
  - AI templates use the new 'watch refreshed:' contract.
