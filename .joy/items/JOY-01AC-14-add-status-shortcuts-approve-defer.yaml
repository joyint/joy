description: |-
  Pilot users could not tell why the 'open' status exists when an item could go straight from new to in-progress. The vision already names the transitions (new->open: approve, ->deferred: defer, review->in-progress: rework) but only start/submit/close/reopen are implemented as CLI shortcuts. Close the gap so the workflow verbs match the vision and the purpose of 'open' (triage/approval gate, esp. for AI-generated items) becomes visible.

  Add shortcuts (crates/joy-cli/src/commands/status.rs + joy --help + the workflow diagram in joy project / status help):
  - joy approve : new -> open (the explicit triage/approval step; relevant when the new->open gate is active, e.g. allow_ai:false for AI items)
  - joy defer   : from ANY active state (new, open, in-progress, review) -> deferred. There can always be a reason to set something aside. (Not from closed; that is reopen.)
  - joy rework  : review -> in-progress

  Keep start tolerant: new->in-progress AND open->in-progress both allowed, so solo users without a gate never notice 'open' (zero ceremony). close stays the verb for review->closed (do NOT rename to accept).

  Tests: each new shortcut performs its transition and rejects invalid source states; defer works from all four active states; start still works directly from new. Update joy --help and the workflow visualization. just check.
