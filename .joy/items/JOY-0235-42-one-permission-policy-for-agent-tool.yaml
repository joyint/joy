description: 'JI-0179-4F step 2. The question "may this agent tool call run" was answered three times: the desktop streaming session had a per-mode match, the desktop chat turn had a kind allowlist, and the platform lanes had allow = is_joy or not-plan. The disagreements were bugs found one at a time; the plan-mode stranding (JAPP-0140-8B) was fixed on the desktop and still live on the platform, which rejected reads and switch_mode in plan mode. joy_chat::model::permission owns the rule now: joy invocations always allowed (operator 2026-07-21, with the hardened bare-command detection moved from the platform, chaining refused); everything non-mutating always allowed in every mode; mutations follow the mode (autonomous all, accept-edits edits only, plan none); unknown kinds count as mutating. The classification maps ACP wire names in this one module so no host classifies on its own. A Deny is escalatable: a host with a human attached asks, a host without one rejects.'
