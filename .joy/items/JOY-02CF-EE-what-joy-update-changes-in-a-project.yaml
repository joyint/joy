description: |-
  When a newer joy brings a project up to date it rewrites the files it manages: the ignore and attribute blocks, the CI merge file, the hooks, SECURITY.md, the defaults, the project file and, with joy update, the member files. Nobody commits them. They lie in the checkout as changes nobody remembers making, get taken for leftovers and are discarded, and then something stops working with no trace of why.

  Wanted (operator, 2026-10-13):
  - joy update at a terminal shows what it refreshed, as today, and then asks: Commit Joy project updates? [Y/n]. Yes writes ONE commit with exactly the files the update touched and nothing else that is changed in the checkout.
  - joy update --force commits without asking. Without a terminal there is nobody to ask, so it commits as well.
  - The sync joy runs by itself on the first call after a version change commits without asking, and its one line names the commit.
  - The commit says in general words that the project was brought from joy X to joy Y, and its subject carries [no-item].
  - With workflow.auto-git off joy touches git for nobody, so nothing is committed there.
  - The CLI help and the tutorial say it, as briefly as the other entries.

  The platform and the desktop client run the same sync when a project is opened. They commit without asking as well, signed by the person who opened the project; that is an item in each of their projects, built on what this one adds to joy-core.
