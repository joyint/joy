description: 'ADR-042 says no Joy output ever shows a raw member id. The CLI builds the resolver per command (joy-cli member_resolver.rs: project privacy, then members.yaml decrypted with the members-zone key cached in the session, else locked). The desktop app never installed one and showed opaque ids in an anonymous project (operator validation 2026-10-07). Move the session-based construction into joy-core (member_ref::resolver_for(root) and install_for(root)) so the CLI and every host call the one function; the CLI keeps its JOY_PASSPHRASE fallback on top. Companion: the app item for the desktop and shell.'
