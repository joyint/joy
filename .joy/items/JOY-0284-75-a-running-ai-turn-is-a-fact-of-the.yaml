  text: 'Done on feat/adapter-behaviour (joy 4b80969): MessageKind::Turn, silent for the decision, skipped by the prompts, not the member''s last own line for the delta; the fold''s richer-copy rule makes the reply replace it and a later heartbeat outrank an earlier one (tests). The chat-crypto wasm in the app is rebuilt from it.'
