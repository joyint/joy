description: 'Horst 2026-09-10 (JP-0134-48): a running turn is visible only to the session that started it; other participants and a reloaded page see nothing, and when the starting client goes away nobody writes the outcome. Decision (Horst): the turn stays client-driven, but its status is persisted in the chat, so everyone sees the skeleton where the answer will stand and, once the turn is no longer awaited, the warning box in its place. Model side: the marker is a message of its own kind under the id the reply will carry; the reply replaces it by the existing richer-copy rule; the turn decision and the prompts ignore markers.'
