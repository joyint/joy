description: 'The shared, git-native foundation for AI orchestration: an AI job is .joy/ai/jobs/<id>.yaml and an AI member''s execution config is .joy/ai/agents/<member>.yaml, owned by joy-core so the CLI, the desktop app, and the platform read/write the SAME data. Forge is the source of truth; audit is .joy/logs; history is git; the product is a forge branch. Corrects the earlier platform-only Postgres job store. Real CLI use case: local standalone Repo work (App concept 6.2) creates and tracks jobs with no platform. Refs: App concept https://docs.int.joydev.com/doc/joyint-app-CENsubhWLG (Mermaid: Postgres=chat pub/sub only, all data in .joy/); Vision https://docs.int.joydev.com/doc/vision-YwqVtDpJO5 ; Automations https://docs.int.joydev.com/doc/joy-automations-execution-layer-fuer-ai-gesteuerte-entwicklung-ynJRnxaFE9 (its PostgreSQL joy_jobs is superseded by git-native .joy/ai/jobs).'
