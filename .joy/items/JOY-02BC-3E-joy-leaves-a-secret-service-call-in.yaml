description: 'Observed 2026-10-04 01:11:27: gnome-keyring-daemon aborted (SIGABRT) on a client that was gone in the middle of its Secret Service negotiation (''gkd_secret_service_get_pkcs11_session: assertion client failed'', then g_variant_new on a null value), during a run of joy''s test suite whose connectors asked the session bus for their test hosts. The abort is a defect of the daemon, but joy produces the trigger by design: joy-forge-net/src/auth/store.rs runs every store call on its own thread, waits KEYRING_BOUND (5 s) and on silence leaves the thread behind ''with its prompt, which the process end collects''. A process that exits while that call is still negotiating is exactly such a client. On a person''s machine this needs only a keyring slower than the bound (a locked collection, a busy session) and it takes their keyring daemon down, with every unlocked secret of the session. Expected: joy does not end a process with a Secret Service call in flight, or ends the call in a way the service survives; decide the shape (wait out the call before exit, cancel it properly, or do not start it where the answer cannot be waited for). Found while working on JOY-02BB-C7 - One list of the variables a test never inherits from the person''s shell.'
