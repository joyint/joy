description: 'Found in the review of JAPP-026C-DC on 2026-09-14 and confirmed in the code on origin/main: when the permission policy denies a chat tool call and no person is asked (every platform turn, and a desktop turn without a present person), the lane answers with reject_option (crates/joy-ai/src/acp_lane.rs). That picks a RejectOnce or RejectAlways option and otherwise falls back to the request''s first option. An agent that offers only allow options therefore gets its call allowed while the record says denied. The person''s decline path on the branch already refuses to pick an allow option (JOY-028A-DC); the policy deny path does not.'
