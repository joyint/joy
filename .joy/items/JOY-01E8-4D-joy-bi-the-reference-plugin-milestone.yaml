description: 'The first real Joy plugin and the reference for plugin authors (app ADR JAPP-0088): a joy-bi crate whose binary computes on the project via joy-core and prints a JoyNode tree as JSON on stdout. Commands: joy-bi milestone <MS-ID> (progress, per-type and per-status breakdown, the mockup milestone chart) and joy-bi velocity <window> with h/d/w/m units (closed items per bucket from the event log). Errors go to stderr with a non-zero exit. Ships with author documentation (docs/plugins.md): protocol, node kinds, versioning, how a joy-<name> binary becomes available in the app and CLI.'
