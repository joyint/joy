description: 'Horst''s finding of 2026-08-19: joy-gitea claimed codeberg.org hardcoded, although Codeberg is only ONE Forgejo instance, while joy-github and joy-gitlab could not recognise GitHub Enterprise or self-hosted GitLab instances at all. The rule now, the same for all three: a plugin claims its own product domain plus every host this person''s forge CLI is signed in to (gh hosts.yml, glab config.yml, tea config.yml). Alias forms are no longer bound to a domain but to their shape. Instances with no sign-in still take the project.yaml forge override.'
