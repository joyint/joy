  date: 2026-08-31T15:38:23.847331703Z
  text: 'State in English for the record (2026-08-31): delivered in commit 46ae473 - all three plugins converted, alias forms domain-free, documentation extended; workspace tests, clippy and the six bats tests green. Added on 2026-08-19 after Horst pointed it out: Gitea does have a product domain (gitea.com, Gitea Cloud and Enterprise) and Codeberg is a compatible alternative on Forgejo, so joy-gitea claims gitea.com plus the hosts signed in through tea, like the other two. The claims tests are hermetic now (pure host predicates instead of set environment variables). Covered by joy/tests/integration/forge_alias.bats, cases for an enterprise host from gh''s own config and a lookalike host that is not claimed.'
