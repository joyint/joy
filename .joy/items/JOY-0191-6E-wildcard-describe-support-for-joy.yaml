  text: |-
    Plan: mirror the JOY-0187-D0 shape in three steps.
    1) Add describe_value(key, value) in joy-core::model::project covering name/acronym/description/language/created and docs.*; descriptions live next to the Project struct so the CLI is the single source of truth.
    2) Build a serde_json::Value snapshot of the project (using the *_or_default() docs helpers so wildcard listings show the effective paths, not just the explicit overrides) and reuse joy_core::model::config::flatten_under for the wildcard walk. Same wildcard syntax: trailing .* (or bare *).
    3) Rewrite get_value to support: (a) scalar key with optional --describe annotation; (b) wildcard prefix returns a table (display) or {key, entries:[{key,value,description?}]} (JSON); (c) object-valued non-wildcard keys keep the existing YAML/object payload for backwards compat.
    Add --describe to GetArgs (same flag name as on joy config get).
    Tests: tests/integration/project_describe.bats with the same cases as config_describe.bats (wildcard listing, --describe annotation, JSON entries, legacy payload preserved, unknown prefix exits non-zero).
