description: |-
  The GitHub job did not start for a pull request that conflicts (see the bug beside this one under JOY-02AC-53). The GitLab file, .joy/ci/gitlab.yml, runs on merge_request_event. Nobody has tried whether a merge request pipeline starts when the merge request already conflicts in a Joy file, for example .joy/logs/<day>.log written on both sides.

  To do: on a GitLab project with the file included, open a merge request that conflicts only in a Joy file and see whether joy-merge runs and pushes the merge. If it does not, change the file so that it does, with a test that holds the rule.
