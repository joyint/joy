  text: |-
    Trial, 2026-10-13, on a GitLab CE 19.4.2 started for it in Docker on the operator's machine, with a project runner (docker executor) and the released joy 0.22.0 that the job installs. The repository: a joy project with .joy/ci/gitlab.yml included, one item, and a comment on that item on main and another on the branch. Plain git conflicts in the item file; joy's rules merge it.

    What the question was: GitLab DOES start the merge request pipeline for a merge request it shows as conflicting (has_conflicts true, detailed_merge_status conflict, pipeline source merge_request_event). The trigger needs no change. With the three defects below worked around by hand, joy-merge said 'resolved by Joy's rules: .joy/items/GT-0001-08-...' and 'merged main in and published the result', the branch got the commit 'Merge main into the pull request branch [no-item]' by Joy CI, the item carried both comments, the merge request turned mergeable and merged. The pipeline the job's own push starts finds 'main is already in this branch, nothing to do': no loop.

    What stopped the file from working at all, conflict or not:
    1. The job fails in every project: debian:stable-slim has no xz, and the installer unpacks a .tar.xz ('tar (child): xz: Cannot exec'). apt-get has to install xz-utils.
    2. The push address is written as https://...@${CI_SERVER_HOST}/...: an instance on http or on another port is not reached ('No connection to gitlab.trial'). GitLab gives CI_SERVER_PROTOCOL and CI_SERVER_PORT; with both the push arrived.
    3. The job stands in stage .pre, and GitLab creates no pipeline that holds only jobs of .pre or .post ('The resulting pipeline would have been empty'). In a project with no other job that runs for merge requests, joy-merge never runs. With one ordinary job under the same rule it ran.

    Plan:
    - gitlab.yml installs xz-utils and builds the push address from CI_SERVER_PROTOCOL, CI_SERVER_HOST and CI_SERVER_PORT.
    - The head of the file and the note joy init ci prints say that a pipeline needs one more job that runs for merge requests. The stage stays .pre: a job in a named stage breaks the whole configuration of a project that defines its own stages without that name. Whether more is wanted here is the operator's call.
    - Tests in joy-core init.rs hold the two fixes and the sentence in the note.
    - The changed file is tried once more on the same GitLab before the pull request.
