description: 'Fund Horst 2026-08-19: Seit Codeberg auf der Integrate-Instanz als Gitea-kompatibler Forge eingerichtet ist, fehlt fuer genau diese Repos die Alias-Aufloesung; die Registry kannte nur github und gitlab, fuer ein Codeberg-Remote fuehlte sich kein Plugin zustaendig. Gitea und Forgejo haben dieselbe Problemklasse: Keep Email Private liefert Adressen der Form <benutzer>@noreply.<instanz>. joy-gitea nach dem Muster von joy-gitlab: claims fuer codeberg.org (andere Instanzen ueber den forge-Override), Alias-Parsing, tea-Konfiguration, API fuer die verifizierten Adressen; Registry-Zeile in joy-core, dazu install, publish, CI, Platform-Image und Doku.'
