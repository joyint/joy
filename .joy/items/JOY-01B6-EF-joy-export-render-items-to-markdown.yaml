description: Add joy export to render items into a document, markdown or json, to the terminal. Support selecting item sets, e.g. --items decisions,bugs. For decisions this materialises the living specification. Items are the source of truth; rendered docs are generated artifacts. Separate theme from the validity/decisions-view work.
