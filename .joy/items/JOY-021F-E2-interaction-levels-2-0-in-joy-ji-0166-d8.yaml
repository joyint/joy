description: 'Implement the umbrella ADR JI-0166-D8 (Interaction Levels 2.0) in joy: three enforceable levels (proposing, confirmed, autonomous) replace the five, the word mode leaves the product vocabulary, levels live in project.yaml only, and adapters derive their native agent modes one-way from the effective level. Children cover the core model change, the joy update migration, the setup enforcement, and the decision hygiene on the affected joy ADRs. Hard switch, no alias layer (alpha stage).'
