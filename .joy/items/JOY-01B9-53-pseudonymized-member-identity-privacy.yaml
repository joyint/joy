description: 'Implement the ADR-042 privacy-mode model so member PII (name, e-mail) stays out of the versioned cleartext artifacts (GDPR Art. 17 erasure) without touching the immutable audit trail. Per-project setting privacy: open (default, today''s behaviour) | anonymous (e-mail in an encrypted members.yaml; project.yaml carries an opaque member ID + email_match verifier; no Joy output ever shows a raw ID). Mirrors umbrella decision JI-011F-14.'
