description: |-
  Implement the ADR-042 privacy-mode model so member PII (name, e-mail) stays out of the versioned cleartext artifacts (GDPR Art. 17 erasure) without touching the immutable audit trail. Per-project setting privacy: open (default, today's behaviour) | anonymous (e-mail in an encrypted members.yaml; project.yaml carries an opaque member ID + email_match verifier; no Joy output ever shows a raw ID). Mirrors umbrella decision JI-011F-14.

  References:
  - Canonical decision: JI-011F-14 (umbrella). The Outline ADR-042 document was deleted, so JI-011F-14 is the source of truth.
  - Concept — Pseudonyme Identitäten und Löschrecht (DSGVO): https://docs.int.joydev.com/doc/pseudonyme-identitaten-und-loschrecht-dsgvo-aHLoWMECii
  - Concept — Projekte und Identitäten in der Plattform: https://docs.int.joydev.com/doc/projekte-und-identitaten-in-der-plattform-hzy1kyYNtm
