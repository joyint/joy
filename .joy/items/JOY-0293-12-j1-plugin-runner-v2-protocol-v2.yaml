description: |-
  Package J1 of the forge connection NG rebuild (JI epic JI-0190-3A; wave 0; owner project JOY). Design: joy/docs/design/forge-connection-ng.md (v5), section 4, and the design sections the package names. Read those sections before starting; every rule there is binding.

  Files: joy/crates/joy-core/src/forge_plugins.rs, joy/docs/plugins.md.
  Work: concurrent stdout read with a deadline, piped stderr, structured `PluginOutcome`, streaming runner, process group kill, per verb timeouts, rootless invocation, `--host` and `--host-kind` accepted everywhere, the resolution contract (`set_plugin_dirs`, executable directory, PATH) with the `joy-forge` first name order, the `version` verb and the protocol 1 detector (exit 2, empty stdout), a warn log on spawn failure, non zero exit and timeout (the same log P1a needs). The approved JI item of decision 29, working title "forge connection NG: new commands, flags and features", exists before this package's first commit, because `--host` and `--host-kind` are part of it.
  Acceptance: a plugin answer of 1 MB is returned intact instead of timing out; a plugin that exits 3 with text on stderr produces an error naming the plugin and the text, not `None`; a binary placed next to the calling executable is found on macOS and Linux without PATH; `claims --host github.com` works with no project on disk; a protocol 1 `joy-github` placed in `~/.cargo/bin` is reported as protocol 1 and a protocol 2 binary named `joy-forge` in the same directory (a test stub in J1; the real binary is J2's) wins the name order.
  Parallel with: J4a, J5, J7, J9, P1a.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-17T05:08:32.366878476Z
  text: 'Plan (J1, approved options per JI-0191-99): runner v2 in forge_plugins.rs (run_once with concurrent stdout read and deadline, piped stderr, PluginOutcome with exit code, stderr, timed_out, spawn_error; run_stream for newline delimited JSON events; process group kill; per verb timeouts; rootless calls; --host and --host-kind on every call; --login pass through), the resolution contract (set_plugin_dirs, executable directory, PATH, joy-forge first name order), the version verb handshake and the protocol 1 detector (exit 2 with empty stdout), docs/plugins.md protocol section. The warn logging in run_query_full already landed with P1a (bc54359) and is kept. Worktree .claude/worktrees/fcng-J1/joy, branch feat/forge-connection-ng-j1.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-17T10:32:11.775962579Z
  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j1, commits d61613f [JOY-0293-12] Rebuild the forge connector , a4d3d8e [JOY-0293-12] Bound the call by the deadli; merged into feat/forge-connection-ng by the integrator).\n\nAll three must_fix items and nine of the ten should_fix items are fixed in one commit (a4d3d8e) on feat/forge-connection-ng-j1; the tenth (wiring set_plugin_dirs) is answered with the reason the review allowed. The deadline now bounds the call rather than the connector's own lifetime: the process group is ended after the child is reaped on every path in both runners, which was verified by removing each fix and watching the new cases fail at 60 s under a 5 s deadline. A connector that is not installed and one that speaks protocol 1 leave a warn line again on the path every caller takes, which is P1a's acceptance sentence verbatim. The handshake now goes over the wire as `joy-forge version` with no forge id and is cached by canonical path and mtime, so one file is asked once per process instead of once per registry row: that is the shape J2 will parse against, and docs/plugins.md carries it. Beyond those, a failed handshake is cached for a minute, the exit-2 protocol 1 detector no longer contradicts a cached protocol 2, resolve/store/files got their _full twins, JOY_PLUGIN_DIR is a development build hook only, login's one-shot deadline is 15 s rather than 900 s, a wait failure no longer claims the child never started, a timeout carries the connector's last words, and the rootless case runs with the working directory in an empty temp dir so the acceptance sentence is observed. The runner suite grew from 14 to 19 cases and still finishes in 2.7 s; joy-core (plain and with forge-net), joy-cli, workspace clippy in debug and release, and cargo fmt are all clean.\n\nAcceptance:\n- [met] a plugin answer of 1 MB is returned intact instead of timing out: a_one_megabyte_answer_comes_back_whole: 1 MiB through the files verb, asserted intact and well inside the deadline.\n- [met] a plugin that exits 3 with text on stderr produces an error naming the plugin and the text, not None: a_refusal_with_stderr_becomes_an_error_that_carries_both: PluginError::Failed with the path, exit 3 and the connector's own sentence.\n- [partly] a binary placed next to the calling executable is found on macOS and Linux without PATH: a_connector_beside_the_calling_executable_is_found_without_path proves it on Linux and the case first asserts the directory is NOT on PATH. macOS uses the same std::env::current_exe path but no macOS runner exists here.\n- [met] claims --host github.com works with no project on disk: was the weakest criterion in the review. a_rootless_call_carries_the_host_the_host_kind_and_the_pin now moves the working directory into an empty temp dir for the call, so the handshake and the verb both run outside any \n- [met] a protocol 1 joy-github in ~/.cargo/bin is reported as protocol 1 and a protocol 2 joy-forge in the same directory wins the name o: joy_forge_wins_the_name_order_over_a_stale_legacy_binary, with the rm line and the shadowed legacy candidate still visible.\n- [met] Work: process group kill (D2.3, 'because child.kill() leaves curl or gh grandchildren behind'): must_fix 1. The group is now ended after the child is reaped on EVERY path in run_path, and run_stream additionally notices the connector's exit and closes the last write end so it leaves through the stream's own end ins\n- [met] Work: a warn log on spawn failure, non zero exit and timeout (the log P1a needs): must_fix 2. The two states that reach no process, plugin_missing and plugin_outdated, now warn too, on the path every caller takes (query and query_resolved), with the connector and the verb. a_removed_and_a_stale_connec\n- [met] Work: the version verb and the protocol 1 detector (D2.2a): must_fix 3. The wire shape is now `joy-forge version` with no forge id, cached by canonical path and mtime, so one file is asked once per process however many registry rows resolve to it. one_file_is_asked_its_protocol_o\n- [met] Work: per verb timeouts, rootless invocation, --host and --host-kind everywhere, the resolution contract, structured PluginOutcome: unchanged from the first commit except: timeout_for('login') returns the 15 s first event bound (the 900 s cap stays in StreamBounds), PluginOutcome gained wait_error, and PluginError::TimedOut gained the stderr the runn\n- [met] D2.3: every caller distinguishes known:false, plugin missing, plugin outdated, plugin failed and timed out: should_fix 3. resolve_full, store_full and files_full added beside claims_full and identity_full, so the desktop setup mask and the platform's forge facts can use them in the A and P packages.\n- [met] D2.2: JOY_PLUGIN_DIR is a documented test hook, not a product switch: should_fix 4. It is read in debug_assertions builds only, so no released joy can be redirected by an environment variable that A6 would import from a shell profile. The hook keeps its position in front of the registered \n- [met] D2.2a: the handshake is not asked per verb, so the 1 Hz chat poll costs no extra process: should_fix 1. A failed handshake (spawn error or timeout) is now cached for 60 s, so a connector whose version hangs no longer costs a fresh 5 s spawn on every verb.\n- [not_met] D2.2 step 1: the CLI passes its own install directory to set_plugin_dirs: deliberate, with the reason in the commit body. For the CLI the install directory IS the directory of its own executable under cargo install and under the installers alike, so step 2 already covers it byte for byte; and \n\nOpen questions:\n- should_fix 5 (wire set_plugin_dirs) is answered in the commit body rather than by code, which is the alternative the review allowed. If you would rather have the call anyway, the safe shape is not cli_main but an append-style registration, and that is an API change J1 should not \n- The warn lines for plugin_missing and plugin_outdated are emitted per call, not deduplicated. That restores exactly the pre-commit behaviour ('the forge plugin could not be started' on every ENOENT) and is what P1a's acceptance asks to see, but on a machine with no connector at a\n- run_stream still waits up to bounds.total when a connector closes stdout and then hangs without exiting (the case its own comment names). The cap bounds it, but for login that cap is 900 s. Tightening it means a second deadline on the wait after the stream ends, and login's calle\n- The Windows half of D2.3 (the job object, the kill-on-job-close limit) compiles but is exercised by no test in this repository: the stubs are shell scripts and there is no Windows runner. The same holds for the macOS half of the 'beside the calling executable' criterion.\n- HANDSHAKE_FAILURE_TTL is 60 s, chosen so that a 1 Hz poll re-spawns a broken connector once a minute at worst while a person who replaces the binary sees the change quickly. It is a judgement call the design does not fix; the mtime key means a REPLACED binary is asked again at on\n\nRemaining: the Windows job object compiles (checked for x86_64-pc-windows-msvc) but runs on no host here; set_plugin_dirs for the CLI is answered by the executable directory rule."
