description: 'Found while investigating JAPP-014E-4D. turn_engine::run_chat_turns has one branch that produces nothing: Ok(_) with an empty reply. The waiting marker opens, Done closes it a moment later, and the room looks exactly as before - a turn that ran, cost money and vanished without a trace. It matches the first half of the operator report exactly (skeleton appears, skeleton disappears, no message). Not theoretical: an agent that only ran tools and said nothing returns an empty reply, and a native ACP adapter makes that MORE likely, because tool calls no longer leak into the message text. Fix: the empty answer gets an honest notice like every other outcome.'
