description: 'ADR JAPP-002A-30 clarified (whole file encrypted, not just content). joy-core foundation: (1) chat_events.rs - append-only sealed event model with HLC/LWW stamps, order-independent fold (events -> Chat) and diff (Chat -> delta), so whole-file encryption survives the keyless blind merge of refs/joy/chats (concurrent field edits no longer clobber); (2) chat_wrap.rs - anonymous ephemeral-sender content-key wraps (108-byte uniform slots, no member id/verify_key/epoch in plaintext, decoy-paddable), reusing pairwise_kek + wrap verbatim. Next: storage cutover (chat_ref), epochs/cover, migration, read markers, CLI, server gate, lock UX.'
