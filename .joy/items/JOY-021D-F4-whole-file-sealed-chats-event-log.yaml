  text: 'Checked against the code on 2026-09-01: delivered, and the crate split moved it. The foundation lives in joy-chat: chat_events.rs with the HLC stamps and the order-independent fold and diff, chat_wrap.rs with anonymous 108-byte slots that carry no recipient id, no verify key and no epoch in plaintext, plus decoy slots. The follow-ups this description lists (storage cutover, migration, read markers, CLI, server gate, lock UX) shipped with the sealed chat under their own items.'
