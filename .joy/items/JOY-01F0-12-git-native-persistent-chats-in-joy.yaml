description: 'The chat truth lives in the repo (App concept: ''Repo (.joy/ inkl. chat)''): a chat is .joy/chats/<id>.yaml holding participants (member refs), the AI session ids of participating AIs, and the messages; committed like items so the forge stays the source of truth. Postgres pub/sub on the platform is ONLY the real-time delivery optimization, never the data home (git-native rule). Consumers: platform chat service (JP), app chat UI (JAPP).'
