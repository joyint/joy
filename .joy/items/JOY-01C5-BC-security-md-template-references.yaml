description: |-
  The generated SECURITY.md (rendered by joy into every downstream project) leaks joy-internal references that external users cannot reach or interpret:

  1. A dead link to docs/dev/vision/trustship/Auth.md, which is not published in the public joy repository.
  2. Two references to internal ADR-042, which downstream users cannot look up.
  3. The block heading 'Security policy' reads as the project-wide policy, although it only documents joy's own auth artifacts.

  Fix in crates/joy-core/templates/SECURITY.md: rename the heading to 'Joy Security' with a scoping intro, drop the (ADR-042) mentions, and replace the dead Auth link with the public docs at https://joyint.com/joy/docs/features/ (Authentication and Onboarding section).
