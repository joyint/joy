description: |-
  GitHub starts no pull_request workflow while a pull request has a merge conflict, and the conflict the forge sees in the Joy files is the one this job is there to merge: plain git on the forge stops at .joy/logs/<day>.log as soon as the branch and the target both logged that day. So the job runs only for a pull request that is still conflict free when it is opened. Seen on 2026-10-12: joyint/app#88 and joyint/website#43 had no workflow run at all and stayed at CONFLICTING until main was merged into the branch by hand.

  Tried on joyint/website on 2026-10-13 (website#44): with the trigger pull_request_target the job starts for website#43 although it conflicts, merges main into the branch, pushes, and the pull request turns MERGEABLE/CLEAN. No run is created for the commit the job pushes.

  To do: the GitHub and the Gitea file listen on pull_request_target. Under that trigger a pull request from a fork gets a token that may write, so the job no longer checks out a fork's code and the step that asks the contributor names the repository it comments in. A test holds both. Gitea is changed in the same way and is not tried on a Gitea yet: that trial is still owed.
