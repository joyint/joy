  text: |-
    Plan:
    1. crates/joy-core/data/ci/github.yml and gitea.yml listen on pull_request_target instead of pull_request; the head comment says in one sentence that the job starts for a pull request that conflicts.
    2. Under that trigger a fork's pull request gets a token that may write. The checkout step and the install step run only for a branch of this repository; the step that asks a fork's contributor names the repository it comments in (GH_REPO), since it no longer stands in a checkout.
    3. A unit test beside the templates in joy-core holds for both files: the trigger, no pull_request trigger left, the checkout bound to the same repository.
    4. gitlab.yml stays as it is: JOY-02D0-A1.
    5. just check before the push. A deployed file is refreshed by joy update, as for every change of these templates.
    Not tried: a pull request from a fork, and any Gitea.
