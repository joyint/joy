description: 'Operator 2026-10-16, after the job JOY-JOB-0001-53 went to review over a missing API key. The job rules are spread over four places (platform runner round end, watcher refusal and resume, change_job_status, and the app computing ''unavailable'' itself). One module in joy-core, job_lifecycle, without database or network, decides: after_round(outcome) -> the status (succeeded and failed go to review; a question too; aborted stays); start_block(project, job, person, default budget, host fact) -> the reason a job cannot start (no assignee, no key or agent as the host says, budget used up, capability or level); signal(job, block) -> normal | blocked(reason) | failed(error) | question | delivered, what the app''s square next to the status bar shows; offered(job, signal) -> what the pills offer (nothing while blocked in new); the words the platform lends the AI for an escalated tool request (as the AI would ask, with the job''s level and the level it needs). Budget helpers move here from the platform. The whole table of status x outcome x feedback x block is tested exhaustively, and a test applies the rules repeatedly and proves every job settles. Review stays the one place where a person is needed; new plus blocked means ''not set up yet''. The dialog with the AI runs over the job''s comments as before.'
