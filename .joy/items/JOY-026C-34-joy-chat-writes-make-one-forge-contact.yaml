description: 'Measured 2026-08-29 with the new forge spans: every ''joy chat send'' makes three contacts (fetch before the command, fetch again after the append, then push). At 09:52 that was 1.3+1.2+2.2 s = 4.8 s; at 10:01 Codeberg answered slower and the same three took 3.0+3.6+6.6 s = 13 s. The second fetch is waste (3 ms after the first); the first is unnecessary for a write because the chat store is built push-first (the desktop does it: push, and only when the forge refuses, fetch, unite the messages, push again). Requirement: write commands (send, add, leave, rename, read, delete) append locally and push; on a refused push they fetch, reconcile and push once more. Read commands (ls, show, info) keep the fetch before. One contact per message in the common case.'
