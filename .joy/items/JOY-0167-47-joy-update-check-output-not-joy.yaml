    [x] color::empty_mark() helper added (returns '[ ] ' in ascii, '  ' in emoji mode) for not-installed/inactive rows.
    [x] ai.rs not-installed branch now uses empty_mark, aligning with check_mark/warn_mark widths.
    [x] ai.rs dry_run path no longer prints its own color::header / color::section / color::footer; the joy update --check aggregator owns them.
    [x] update.rs run_check wrapped in color::header('Joy update check') + per-block color::section + color::footer (success / stale variant).
    [x] auth::run_check_default output uses [ok]/[!] mark + aligned columns matching the AI tool layout.
    [x] joy ai update -> joy update in remaining user-visible strings (ai.rs setup hint, store.rs legacy schema warning); rustdoc comments brought in line.
    [x] update_command.bats assertion updated to the new sectioned format; 32 sanity bats green, 319 unit tests green, clippy + fmt clean.
