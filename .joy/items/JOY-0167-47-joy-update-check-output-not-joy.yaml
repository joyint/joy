description: |-
  After JOY-0166-BE removed joy ai update / joy auth update from the CLI, residual references to those commands stayed in user-facing strings:

  - ai.rs dry-run footer: 'files need update -- run joy ai update'
  - ai.rs setup_new_tools: 'Use joy ai update to update files'
  - store.rs migration warning: 'run joy auth update to normalise'
  - code-internal rustdoc comments mentioning the removed commands

  Plus the new joy update --check output had no Joy-typical header/section/footer formatting and the AI tool list 'not installed' branch used 4-space indent without a marker, which broke vertical alignment with the configured rows.

  Fix: replace user-facing strings with joy update; update rustdoc comments; add color::empty_mark() ([ ] in ascii, two spaces in emoji) and use it for the not-installed branch; wrap joy update --check in color::header / color::section / color::footer; suppress ai::update's own header/section/footer when called in dry-run mode (joy update --check provides them).
