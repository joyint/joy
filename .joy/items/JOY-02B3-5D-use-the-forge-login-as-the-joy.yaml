- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-27T10:35:31.924649318Z
  text: |-
    Why this story cannot deliver "no passphrase ever, on every device and in the web app" without somebody holding a key. Written 2026-09-27 at the operator's request so it can be checked later, including by another AI. Every claim below is either a documented fact about the forges or a property of the cryptography joy uses; the checklist at the end says what to verify.

    THE GOAL. After signing in at the forge (gh auth login, glab, tea, or joy's own device-flow login), joy commands need no passphrase: not for items, and not for sealed chats or crypt zones either. On every machine, in the CLI and in the web app, for the same project. Constraints the operator set: no OS keystore beyond the desktop app (Linux/Windows/macOS keystores are too complex; the CLI must never need one); nothing SSH-based (SSH handshakes made everything slow, the forge account exists to get past SSH); nothing device-bound (a second machine or the web app must work at once); no private storage at the forge such as gists, snippets or a private repo (a cheap trick).

    HOW JOY ENCRYPTS TODAY. Every human member has one identity seed (32 random bytes, created at joy auth init). The Ed25519 signing key and the X25519 key that chats and zones are sealed for are derived from that seed. The seed is stored only in wrapped form in project.yaml: seed_wrap_passphrase (KEK from the passphrase via Argon2id with kdf_nonce) and seed_wrap_recovery (KEK from the recovery key). Opening a sealed chat or an encrypted item means: obtain the seed, derive the private key, decrypt. Nothing else opens it; that is the whole point of "sealed" (docs/user/Tutorial.md, section Chats, Sealing: the platform never holds a chat key). A session file caches the seed for 24 hours (chat_seed, JOY-0269-BC), owner-only, on the device where the passphrase was typed.

    WHAT A FORGE LOGIN ACTUALLY HANDS OVER. (1) GitHub OAuth device flow (what gh and joy's plugin use): the response is an access_token (an opaque random string minted by GitHub at that moment), token_type and scope; nothing else. Classic OAuth app tokens (gho_...) do not expire unless revoked; GitHub App user tokens expire after 8 hours and are replaced through a refresh token; a re-login always mints a new string. (2) GitLab OAuth: access tokens expire after 2 hours and are replaced through refresh tokens. (3) Gitea OAuth: access tokens expire (default one hour) and are refreshed. (4) Personal access tokens on all three: stable until revoked or rotated, but still credentials the person is expected to rotate, and readable by anyone who can read the tool's config. (5) GET /user (and /user/emails with user:email): login, id, node_id, name, avatar, e-mail addresses. All of it is either public or guessable; none of it is secret. (6) OIDC: GitHub is not an OpenID provider for end users (only GitHub Actions gets OIDC tokens); GitLab and Gitea are, but an id_token is a signed assertion ("this is user 12345"), readable by anyone who receives it; it is proof of identity, not a secret. (7) No API of GitHub, GitLab or Gitea returns a stable per-user secret, and none offers a key-management or key-escrow endpoint for third-party apps.

    WHY NO KEY CAN BE DERIVED FROM THAT. A key that protects data must have two properties: it must be the same every time (data sealed yesterday must open today), and it must be known only to the person (otherwise anyone can decrypt). The access token fails the first: it changes on every login, refresh and revocation, so a seed wrapped under a token-derived key becomes unreadable the moment the token changes, silently, on GitLab and Gitea within hours. Login, id, e-mail, name fail the second: they are public, so anyone can compute the same derivation. A KDF (HKDF, Argon2, anything) only transforms its input; it adds no secrecy. HKDF(username) is exactly as public as the username; HKDF(token) rotates exactly like the token. An id_token is public by construction (it is meant to be shown to third parties). There is no third kind of input in the exchange. Registering joy as an app at the forge and confirming through a browser link changes none of this: it is the same device flow the plugins already run (joy forge login), and it yields the same token and the same public profile.

    WHAT THE LOGIN CAN DO: it proves identity. resolve_identity already finds the member through the forge account (JOY-02AE-1A, step 5, verified against the forge API by the plugin's identity verb). Treating a bound, signed-in account as authenticated removes joy auth for everything that needs no seed: add, status, assign, comment, ls, show, project settings, opening a project in the app. That is real, but the operator has stated it is worth nothing to him as long as sealed chats still ask for the passphrase.

    THE ONLY WAYS TO OPEN SEALED CONTENT WITHOUT A PASSPHRASE, AND WHY EACH IS OUT. Somebody has to hold the seed (or a key that unwraps it) and hand it to joy after the forge login. Candidates: (a) the device: OS keystore (excluded, complexity) or a joy-owned 0600 file in the state dir (excluded: a second machine and the web app have nothing, the operator rejected device-bound); (b) the forge's private user storage: gist, snippet, private repo (excluded as a cheap trick; also the forge operator and any token holder could read the identity); (c) the forge token as key material (excluded above: rotation breaks it); (d) an SSH key the forge publishes for the account, with ssh-agent (excluded: nothing SSH-based); (e) the Joyint platform holding a wrap and releasing it after forge OAuth (breaks "the platform never holds a chat key"; the platform mirrors repositories, so it alone could decrypt everything); (f) deriving from public identity data (not a secret, see above). There is no (g): decryption needs a secret only the person has, and the forge does not hold one for her. This is the same reason end-to-end messengers need a device key or a backup PIN despite the user being logged in.

    CONCLUSION AS OF 2026-09-27. Under the operator's constraints the story can deliver authentication without a passphrase (everything unsealed), but not passphrase-free access to sealed chats and zones from every device. The operator does not want the story built for the first half alone. What would change the conclusion: a forge that offers a user-held secret or a key-escrow API to third-party apps (none of the three does), or the operator accepting one of the holders in (a), (b) or (e).

    CHECKLIST FOR AN INDEPENDENT VERIFICATION. Ask: 1. What does the GitHub OAuth device flow return, and does GitHub return any stable per-user secret to an OAuth or GitHub App? 2. Do GitLab and Gitea OAuth access tokens expire and rotate by default? 3. Is GitHub an OpenID Connect provider for end users? Is an OIDC id_token secret? 4. Can a key derived (HKDF/Argon2) from public data such as a username, user id or e-mail protect encrypted data? 5. Can data encrypted for an X25519 public key be decrypted without the matching private key or the seed it derives from? 6. Is there a way for a third-party application to obtain, from GitHub, GitLab or Gitea, a secret that is the same at every login, known only to the user, and available on every device the user logs in from, without the application storing anything on the device or in the user's forge account? If the answer to 6 is yes for any forge, this story is buildable as the operator wants it and the reasoning above is wrong.
