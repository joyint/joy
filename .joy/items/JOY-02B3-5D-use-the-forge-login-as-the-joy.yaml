  text: 'Operator, 2026-09-27: nothing that exists is removed or rebuilt. joy forge login/status/logout/plugins, the plugin protocol (claims, identity, resolve, login, token-store), the credential sources (gh, glab, tea, joy''s own store) and the app''s forge sign-in stay exactly as they are: the app, and in particular the web app for the portal, needs the forge login to connect to forge repositories. This story only ADDS on top of them: the binding (joy forge connect/disconnect, the field on the member) and the authenticated answer of resolve_identity for a bound, signed-in account. Whatever the app and the portal do with forge logins today keeps working unchanged.'
