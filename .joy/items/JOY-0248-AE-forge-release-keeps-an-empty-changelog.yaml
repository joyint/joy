description: 'joy release publish is idempotent on an existing forge release, but only returns its URL: when the tag push triggers the dist workflow first (exactly what happened for v0.20.0 after the crates upload failed and publish was retried), the release exists with just the installer section and the whole changelog is silently dropped. Fix: when the release already exists, fetch its body and prepend the rendered notes unless they are already present, via gh release edit.'
