description: |-
  Operator, 2026-10-04: 'joy forge plugins' printed three near identical 'rm' lines for the stale connector files of the earlier version. Shortened to a pattern, 'rm joy-*', that removes joy-forge too. Afterwards 'joy update' answered 'up to date' and 'nothing to refresh' while every forge verb failed with plugin_missing.

  - 'joy update' and 'joy update --check' name a missing connector in the Binary section, with the command that reinstalls it; --check counts it as stale.
  - 'joy forge plugins' names the stale files once, in full, in one command, and says which file to keep.
  - User messages stay short: no item ids, no dashes.

  Tests: a_missing_connector_is_named_with_the_command_that_restores_it, stale_connector_files_are_listed_once_in_one_command.
