description: |-
  joy release publish currently fails with 'no forge configured' unless forge: is set explicitly in .joy/project.yaml. Make detection the default by probing configured git remotes for supported forges (today: github via github.com host).

  Selection rules:
  - exactly one supported forge detected: use it silently
  - multiple supported forges detected: interactive pick on TTY; on non-TTY, fail with an actionable error suggesting --forge or setting forge: in project.yaml
  - no supported forge detected: fail with a clear message listing configured remotes and how to add one
  - forge: in project.yaml present: respected as override, detection skipped
  - --forge <value> flag: highest precedence

  Scope: only joy release publish reads the forge. bump, record, show, ls stay forge-agnostic.
comments:
