  date: 2026-05-17T14:45:16.270510126Z
  text: 'Plan: (1) Add all_remotes() and detect_supported_forges() helpers to joy-core/vcs.rs (today only GitHub is a supported forge backend). (2) Add resolve(root, project_forge, flag_value) to joy-cli/forge.rs with precedence: --forge flag > project.yaml > auto-detect from configured remotes. Single-supported -> use silently; multi-supported -> interactive pick on TTY, hard fail on non-TTY with hint to use --forge; zero-supported -> hard fail with hint to add a remote or set forge: none. (3) PublishArgs gains --forge <value>. Resolution runs before push so the operation fails early if the forge can''t be determined. forge: none keeps publishing the tag without a forge release. (4) Tests: unit tests on the resolver covering each precedence/branch path; bats test for the error message when no supported remote is configured and forge is unset.'
