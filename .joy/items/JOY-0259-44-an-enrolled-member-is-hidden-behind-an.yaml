description: 'Roland''s finding of 2026-08-17: when an account''s address set contains both the real, enrolled member entry and a never-redeemed invitation under another address of the same person, the accidental order of the candidates decided which won. The empty invitation slot hid the real membership: the app demanded an OTP that no longer exists, while the passphrase and the wraps hang on the real entry. The rule now: a verify key beats an invitation slot, and a slot resolves only when it is the single match (the OTP posture for genuinely new invitees stays).'
