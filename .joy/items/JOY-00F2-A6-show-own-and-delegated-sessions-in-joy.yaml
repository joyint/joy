  text: 'Plan: extend run_status to enumerate the calling user''s ai_delegations and check each one''s session (using the same predicates as member_auth_status). Output uses a framed multi-section layout (header rule, ''Your session'' section, ''Delegated AI sessions'' section) similar to joy ls --tree. Status payload (--json) gains a delegated_sessions[] array per ADR-036. BATS test: human with two AI delegations -- one with active session, one without; status output reflects both states.'
