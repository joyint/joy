description: 'joy project member add prüft den Manage-Gate (ctx.enforce) bevor die per --passphrase übergebene Passphrase irgendwo verarbeitet wird; die dient nur der Attestierungs-Signatur. Ohne bestehende joy-auth-Session endet der Befehl mit ''must authenticate. Run joy auth'', obwohl die korrekte Passphrase am Befehl hängt. Reproduktion: frisches XDG_STATE_HOME, dann member add --passphrase in einem Projekt mit Auth-Material. Erwartung: die mitgegebene Passphrase authentifiziert auch den Gate (oder die Meldung sagt ehrlich, dass erst joy auth nötig ist).'
