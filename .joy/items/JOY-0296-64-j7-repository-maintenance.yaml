- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-17T02:54:42.878697670Z
  text: "Result (implemented, adversarially reviewed, review findings fixed; branch feat/forge-connection-ng-j7, commits: 456410e [JOY-0296-64] Pack and sweep the chat store with git, 89f2a03 [JOY-0296-64] Fix the J7 review findings on maintena).\n\nThe branch now carries two commits. The first (456410e, unchanged) replaced the `git gc --auto` spawn in `chat_ref::maintain_occasionally` with `joy_core::vcs::maintenance`, a git2 only pack and guarded sweep. The second (89f2a03) answers the adversarial review. All four must_fix findings are fixed. Maintenance no longer takes `forge::checkout_gate`, which the desktop's chat transport already holds on the same thread, and which made `maintain_if_due` answer `Ok(None)` on every desktop write for ever; it takes its own per store gate, and a new unit case holds the checkout gate and asserts a run still happens. Every path of every step is addressed through `repo.commondir()` instead of `repo.path()`, so a linked worktree sees the object store it shares; a new case builds a real `git worktree`, sweeps through the linked handle and checks that `discard_loose_object` removes the file rather than reporting a success it did not perform. The discard after a lost compare and swap now carries both of D3.7's protections: the commit buffer is hashed and the odb asked before the write, so only an object this attempt created can go, and the live chats history must not reach it (tip or ancestor); the rule is extracted into `discard_lost_commit` and tested for all four combinations. The two git processes on the CLI chat write path are down to one: `vcs::remote_exists` is git2 now, and the push stays a git process until joy-cli enables `forge-net` in J6; the bats fixture gained a real local remote so the pin counts something, and the design's J7 acceptance sentence is corrected to say so. Of the eleven should_fix items, ten are fixed in code or in the design: the freshen probe no longer writes on an object (it probes a scratch file in the same directory and compares owners), the keep set walk is bounded and abandons the whole run rather than sweeping with a partial set, `unlink_best_effort` reads the raw OS error and retries on git's ladder with the read only attribute restored, `skipped_in_use` no longer conflates other failures, the second process case fails loudly instead of returning, the trigger case no longer clears a process global map, the store key is canonicalised once, bats case 4 asserts the sweep really removed the held object, the headline acceptance case runs the shipped 14 day window against a backdated store, and D3.7 records the stamp file, `insert_object`, the single odb refresh, the budget and the trees left to the sweep. The eleventh, the 24 hour window\n\nAcceptance criteria:\n- [met] A store built from 20 chats of 10 messages ends below 1 MB with all chats intact and under 6700 loose objects: chat_ref::tests::the_sweep_reclaims_lost_writes_and_every_chat_survives now runs the SHIPPED configuration (Options::foreign_checkout, the 14 day window) against a store whose objects are backdated past the window, the way the operator's store is aged; it asserts 200 orphans removed, the store under\n- [met] A second process holding an object open does not crash the sweep and the object is still readable afterwards: joy-core case a_second_process_holding_an_object_open_does_not_break_the_sweep (it now FAILS instead of returning silently when the shell cannot be spawned) plus bats case 4, which was blind before: it now holds the chat tip open (a keep set member, so class A really removes it), asserts the loose f\n- [met] No object younger than the grace window is removed: an_object_younger_than_the_grace_window_survives, an_object_older_than_the_grace_window_goes, an_mtime_in_the_future_is_left_alone, the_reflog_of_a_branch_keeps_its_older_commits, plus the new the_freshen_probe_leaves_every_object_mtime_where_it_was, which pins that joy's own writability question ca\n- [partly] No git process is spawned anywhere in the chat write path: The chat store and joy's maintenance spawn none (git gc --auto is gone, maintenance is git2 throughout) and vcs::remote_exists now answers from git2, which removes the second spawn. ONE git process remains on the CLI path, the delivery push (vcs::push_ref), because a push needs a transport and joy-c\n\nDeviations from the design:\n- D3.7 said maintenance runs inside forge::checkout_gate(root). It now takes maintenance's own per store gate. Reason: the desktop chat transport holds the checkout gate across the whole chat write and the write calls maintenance, so try_lock on the same thread answered WouldBlock on every desktop write for ever (a blocking lock would deadlock); and the checkout gate's contract is about paths that M\n- D3.7's paths named repo.path(). Everything now comes off repo.commondir(), and the floor and the gate are keyed by the canonicalised common directory. Reason: in a linked worktree repo.path() has no object store, so the estimate answered 0, the sweep found nothing and discard_loose_object reported a success it had not performed; and the worktrees of one store must share one floor. D3.7 amended.\n- D3.7 said insert_commit for the keep set commits and insert_recursive for the rest. The pack builder gets insert_object per loose keep set member, because the other two recurse into the tree and would copy the whole packed snapshot into a second pack on every run. D3.7 amended.\n- D3.7 said Odb::refresh() on every live odb in the process. Only joy's own odb is refreshed; git2 exposes no handle on the others and they refresh themselves on the first missing loose read. D3.7 amended with that argument.\n- New, undesigned state: <commondir>/joy/maintenance-stamp, the on disk half of the ten minute floor (a CLI run is one process per write). Now named in D3.7's trigger paragraph.\n- New: a one second budget on the keep set walk, and running out of it abandons the WHOLE run rather than sweeping with a partial keep set. Not in v4's D3.7; added to it, with the 15 us per object measurement the review supplied.\n- The freshen question is asked on a scratch file in the same fanout directory (plus an owner comparison), never by writing an mtime back onto an object, so joy cannot erase a concurrent freshen. D3.7 amended.\n- vcs::remote_exists (a J6 file, vcs/mod.rs) moved to git2 inside this package, because it sits on the chat write path that J7's last acceptance criterion is about and needs no transport. The J7 acceptance sentence in section 4 is corrected to name the remaining push and its owner (J6).\n- chat_ref::maintain_occasionally still asks for Options::foreign_checkout() on every host, so the platform's project clone gets 14 days instead of D3.7's 24 hours. The write path cannot tell the two kinds of store apart from where it stands; owned_store() now documents that P8 is its consumer and that the only mistake this makes is the expensive one, never the unsafe one.\n- The trees and blobs of a refused write are still built by the caller before commit_root is entered and are left to the sweep (class B collects them after the grace window). D3.7 now says so explicitly instead of implying the commit fix covers them.\n\nOpen questions:\n- Should the ref check move up into the tree building loop of chat_store.rs:369-414, so a refused write costs no tree either? The design now states the trees are left to the sweep, which closes the review point, but a caller side check would make a lost race free of garbage entirely. That is a change \n- Options::owned_store() still has no caller. The platform's project clone deserves the 24 hour window, but selecting it needs a store kind parameter through chat_store::commit and joy_service (P8). Named in the code comment and here rather than added as a switch.\n- The Windows half of unlink_best_effort (raw error 32 and 5, the 0/1/10/20/40 ms ladder, clearing and restoring the read only attribute) is written from git's own mingw_unlink and libgit2's share flags and compiles only under cfg(windows); nothing here could execute it. It needs one run on a Windows \n- bats is not installed on this machine, so the integration file was run through npx bats@1.11.1. If CI pins a different bats, case 1's new fixture (a local bare remote plus git remote add) should be confirmed there.\n- The 214 ms per 14 402 objects measurement that justifies the one second keep set budget comes from the review, not from a run in this worktree; the budget is deliberately conservative, but a measurement on a large repository would let the number be chosen rather than guessed.\n\nTests:\n- cargo test -p joy-core: ok, 446 passed, 0 failed, 2 ignored (network, already marked)\n- cargo test -p joy-core --features forge-net: ok, 446 passed, 0 failed, 2 ignored\n- cargo test -p joy-chat-store: ok, 50 passed, 0 failed\n- cargo test -p joy-cli: ok, 87 + 2 + 2 passed, 0 failed (vcs::remote_exists changed under it)\n- npx --yes bats@1.11.1 tests/integration/chat_store_maintenance.bats: ok, 4 of 4 cases pass (bats is not installed on this host, so it was fetched through npx)\n- cargo clippy -p joy-core -p joy-chat-store --all-targets: clean, no warnings\n- cargo fmt -p joy-core -p joy-chat-store -- --check: clean"
