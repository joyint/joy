  text: 'Result: commits 486b52e, 8624914, eb64727, 93ee2ce merged at e015a41. All nine findings fixed and verified on the Windows runner VM: 728 joy-core tests and 152 joy-cli tests pass there, no hang (the silent forge case returns in 20 s through joy''s own silence bound in vcs::bound, because WinHTTP has none), GCM obtains a credential with no git on PATH, an exhausted chain is needs_sign_in with the login help, the ssh sentence no longer contradicts itself, maintenance runs on read only objects, status --json carries state and help; plus a ~ expansion fix in the ssh config and clippy clean on Windows. Design D1.9a records the bound and its cost (an abandoned thread per given up contact, at most two per host).'
