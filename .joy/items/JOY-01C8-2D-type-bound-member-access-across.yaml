description: |-
  Problem: project.members is a public BTreeMap<String, Member> whose key is polymorphic by privacy mode (cleartext e-mail in open, opaque id in anonymous, ADR-042). The compiler cannot tell an e-mail from a map key, so every members.get(&email) compiles but is silently wrong in anonymous mode. 135 direct accesses exist (90 in joy-cli, 45 in joy-core); the anonymous-mode fix on branch claude/anonymous-mode-copilot-fix-23lcpx patched only 4 of them. Confirmed reproduction: 'joy auth token add' and 'joy project member add --with-token' (shared create_delegation_token, auth.rs:1404) still fail with 'is not a registered project member' in an anonymous project even on the fixed binary, because that call site was not among the four. Point-fixing never closes the class: each new feature reintroduces the foot-gun.

  Worse, the write/creation direction is unguarded and higher-stakes: member creation is duplicated (init.rs:137, project.rs:1413, ai.rs:1083), the anonymous PII-placement invariant (human -> opaque id + email_match + encrypted members.yaml) lives only in switch_to_anonymous, and a naive insert(email, member) in anonymous mode would leak cleartext PII into the committed project.yaml -- a privacy breach, not just an error. The privacy field also carries a 'never by a bare field write' comment but is written directly at project.rs:1000-1001 (set privacy open/none), bypassing the switch_to_open migration.

  Goal: bind the guarantee to the type system, mirroring what MemberRef already does for the display direction. Scope:
  - Seal joy-core: make members, members.insert/remove, and privacy private so direct keyed access does not compile outside the model.
  - Provide privacy-aware gates: member_by_email[_mut], member_by_key[_mut], resolve_member(email)->ResolvedMember{key,member,email}, and register_member(identity,caps,keys) that sets key + PII placement per mode (open: e-mail key; anonymous: opaque id + email_match + members.yaml). This completes the intent of JOY-01BB-79 (single e-mail source, route all consumers) rather than leaving it half-done.
  - privacy writes only through switch_to_anonymous/switch_to_open (incl. set privacy open/none).
  - Lint/test backstop: fail CI when any serializable model field carries a member as a raw String instead of MemberRef, so the display/--json guarantee is as airtight against future code as the sealed-map lookup guarantee.
  - bats matrix: every member-touching command (auth token add, member add --with-token, ai init, crypt grant/revoke, auth recover, set privacy) exercised in BOTH open and anonymous mode.
  - Migrate the ~135 call sites onto the gates; the .unwrap() panics fall away because the accessors return Option.

  Sequence: joy-core API + register_member -> compile-driven joy-cli migration -> lint -> bats matrix -> full test run. Relates to JOY-01BB-79 (absorbs its goal) and JOY-01C3-A7 (anonymous human onboarding becomes possible once register_member exists).
