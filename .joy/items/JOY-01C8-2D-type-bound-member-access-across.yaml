  text: |-
    [x] Done. joy-core: sealed Project.members and Project.privacy (private); added typed gates member_by_email[_mut], member_by_key[_mut], has_member_key, members()/member_keys()/member_values()/member_count()/has_members(), member_key_for_email, register_member (mode-correct creation: ai: id either mode, e-mail in open, refuses human-in-anonymous to avoid PII leak -> JOY-01C3-A7), remove_member, privacy() read + set_privacy_non_anonymous (privacy writes otherwise only via switch_to_anonymous/open). Migrated all ~135 call sites (joy-core + joy-cli); the member-lookup .unwrap() panics are gone.

    The 4-site branch patch was confirmed insufficient: beyond create_delegation_token, the guard identity and the session keying in the token path also used the cleartext e-mail, so 'joy auth token add' / 'member add --with-token' still failed in anonymous mode ('guard denied'). Now fixed end to end (token issued, redeemed, AI acts; no operator e-mail in project.yaml).

    Backstop: crates/joy-core/tests/member_field_lint.rs fails the build if a persisted-model field naming a member is a raw String instead of MemberRef. bats: tests/integration/anonymous_member_commands.bats (auth token add, member add --with-token, full redeem round-trip, register_member human-in-anonymous guard) + a member-add-after-switch case in privacy_anonymous.bats.

    Tests: 379 lib + 113 integration rust + lint + trycmd, all green; 511 bats, 0 failures; no clippy warnings.

    Out of scope, newly surfaced: once the AI acts, its delegated-by (operator) is recorded into items/logs from the token's cleartext delegated_by claim -> a separate anonymous-mode leak (delegation-identity propagation through token claim/identity/audit-trail/git-trailer), not the member-map sealing. Needs a follow-up bug; the relevant bats assertion is deliberately relaxed with a pointer.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-28T10:02:06.854993214Z
  text: 'Update: the delegated-by audit-trail leak (initially flagged as a separate follow-up) is fixed within this work -- it is the same ADR-042 no-PII guarantee. Root cause: the delegating operator was recorded from the cleartext git e-mail / token claim at three at-rest writers -- the JOY_SESSION AI path and the human-session path in resolve_identity (item created_by/updated_by, item-event logs, commit trailer) and the hand-built actor of the auth.session_created log event. Centralized the policy in joy_core::privacy::delegated_by_at_rest(project, operator_email): the operator''s at-rest member key (opaque id in anonymous, e-mail in open), returning None in anonymous mode rather than ever falling back to a cleartext e-mail. Applied at all three writers. Verified end to end: no operator e-mail in any .joy file in anonymous mode; at-rest actor is ''ai:x delegated-by:m-<id>'', resolved back to the e-mail for an authorized viewer (joy show). bats tightened (no-leak + resolves-on-display). Full ''just check'' green: fmt, clippy -D warnings, 379 lib + integration + lint + trycmd, 511 bats.'
