description: 'Product management of the 21st century needs chats that live with the project: a non-deletable General chat for all members, team chats with leave/delete-for-all semantics, notices, and CLI participation without joyint.com. Shared state stays in .joy/chats (kind general|team, subtitle, created_by, read_only, deleted_for, message kind text|notice; General has fixed id ''general'' and participants=[] meaning all members); personal state (pinned, sidebar order, last_read, hidden) lives in gitignored .joy/chat-state.yaml so reading/pinning/dragging never commits.'
