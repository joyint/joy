  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j0c, 5 commits; merged into feat/forge-connection-ng by the integrator).\n\nThe must_fix is fixed and guarded: joy-forge-net is published before joy-core in justfile:403, and a new test (crates/joy-core/tests/publish_order.rs) reads the publish list and the manifests and fails on any dependent that would be uploaded before its dependency; restoring the old order reproduces the exact failure. Six of the eight should_fix items are fixed. The connector now reads a bracketed IPv6 host bare, as the engine does, so NO_PROXY=[::1] excludes the host on both sides; it reads the lower case spelling of no_proxy and all_proxy first, the engine's and curl's order; the corpus test asserts the required answer per row instead of f(x) == f(x); the chat store logs the classified state and the detail line instead of guessing (offline?) and discarding the verdict, including the poll's healing push; a new store level test shows a distinguishing state (offline) arriving at a caller through a loopback port with no listener, no network involved; and as_joy_error documents that its non contact arm cannot be reached from the three chat ref boundaries. Two remain open and are reported with reasons: the dependency direction and joy-core's lean graph (both cheaper shapes need either a .joy edit or a second cargo feature, neither of which I may take), and the platform's own log line, which lives outside this worktree. All touched crates are formatted, clippy clean and green: 810 tests across joy-core (with and without forge-net), joy-forge-net and joy-chat-store, plus the three connector crates.\n\nAcceptance:\n- [met] MUST FIX 1: the release does not break; joy-core is not published before joy-forge-net: justfile:403 now reads crates=(joy-process joy-model joy-chat joy-forge-net joy-core joy-bi ...) and the comment records why. A new test, crates/joy-core/tests/publish_order.rs, reads the crates=(...) line and every list\n- [met] Item (1): the connector no longer degrades NO_PROXY=\"acme.example:99999\" into \"names no port\"; engine and connector share one func: joy_core::vcs::proxy::no_proxy_matches is an #[inline] call into joy_forge_net::proxy::no_proxy_matches; the corpus test now asserts the required answer per row (17 rows) and the identity as a second guard.\n- [met] SHOULD FIX 1: one grammar, same answer on both sides for a literal IPv6 host: crates/joy-forge-net/src/url.rs host_of reads the bracketed form (https://[::1]:8443/x yields ::1, as the engine's RemoteUrl::parse does) and skips colons inside brackets in the scp-like form; new tests cover choose() wi\n- [met] SHOULD FIX 2: both sides read the same NO_PROXY variable: crates/joy-forge-net/src/proxy.rs choose() now reads no_proxy before NO_PROXY, libgit2's own order as the engine uses it; all_proxy before ALL_PROXY was corrected in the same function for the same reason. A test sets bot\n- [met] SHOULD FIX 4: the corpus test proves the answers, not f(x) == f(x): crates/joy-core/src/vcs/proxy/tests.rs: every row carries its expected boolean and a comment naming the rule it stands for; the cross-crate identity assertion follows it.\n- [met] Item (2): a chat ref failure carries the classifier's verdict to the caller (D1.8b): JoyError::Contact plus contact()/failure(), and vcs::contact::as_joy_error at the three chat ref boundaries (from the pre-review commit, unchanged).\n- [met] SHOULD FIX 5: a distinguishing state reaches a caller at the chat store boundary: New test a_chat_sync_nobody_answers_reaches_the_caller_as_offline points origin at a loopback port with no listener, entirely local and instant, and asserts Failure::Offline out of sync_with_forge plus the operation on t\n- [met] SHOULD FIX 6: the desktop delivery path stops guessing and stops discarding the verdict: chat_ref.rs log_failed_contact prints the classified state word, the plain sentence and the detail line; it replaces eprintln!(\"joy: chats delivery failed (offline?)\") in deliver_detached and the bare `let _ =` on poll_o\n- [partly] SHOULD FIX 7: a log line names the operation again: In joy it does: the detail line, which begins with \"chats push\" / \"chats fetch\" / \"chats ls-remote\", is printed at the store boundary. The platform half (platform/src/git/mod.rs:257, anyhow!(\"chats: {e}\")) is untouched: \n- [met] SHOULD FIX 8: the dead branch at the three call sites is documented: as_joy_error's doc comment now says that contact::run wraps every failure of push_ref/fetch_ref/ls_remote_ref, local faults included, so the JoyError::Git arm is unreachable from them and exists for callers that hand in \n- [not_met] SHOULD FIX 3: the direction of the shared function (joy-core -> joy-forge-net) and joy-core's lean graph: Measured again after the fix: cargo tree -p joy-core -e normal is 134 crates and contains clap, clap_derive, ureq, rustls, ring, rustls-webpki, rustls-native-certs and rustls-platform-verifier, while joy-core/Cargo.toml:\n- [not_testable_here] Design package block in section 4 met: docs/design/forge-connection-ng.md has no package block for J0c: the item is a Wave 1 follow up written after the A3 review, so the spec is the item text plus D1.11 and D1.8b, which the criteria above track.\n\nOpen questions (carried to the packages named or to follow up items):\n- SHOULD FIX 3, the direction of the edge, stays open and needs the operator. Keeping joy-core -> joy-forge-net costs joy-core a second TLS stack and a CLI arg parser (134 crates now, clap/ureq/rustls/ring included) in a library the Tauri desktop and jyn link, and it permanently fo\n- joy-telemetry blocks the next `just publish-crates` at its last crate, joy-cli. Fix is either uploading joy-telemetry (adding it to the list, after joy-core, registers a new public crate name) or removing the edge from joy-cli. This predates J0c and is flagged in crates/joy-core/\n- platform/src/git/mod.rs:257 still flattens the operation into `chats: {e}` and reads no state. The platform is not in this worktree, so a follow up there should read JoyError::contact() for the state and the detail line, the way chat_ref::log_failed_contact now does."
