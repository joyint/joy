description: 'AIs are chat participants with full context: they answer only when @mentioned; between AIs at most two follow-up turns each since the last human message, then the system posts a notice (the leave-notice format) that a human must moderate on. Only the member who configured an AI (locally or with an API key) may address it — everyone else reads along until they configure it themselves (their use is then delegated-by them). The shared rule module (mention resolution against participants, the AI-chain guard, the moderation notice, the context prompt from the chat history) lives in joy-core so desktop and platform behave identically.'
