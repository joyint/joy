description: Shared chat file carries only member-identical state (membership, lifecycle, messages); per-member preferences (pinned/order/last_read/hidden) go to gitignored .joy/chat-state.yaml — a drag or a read must never create a commit or merge war. Leave = remove from participants + notice message; delete-for-all = read_only:true + notice, file garbage-collected once deleted_for covers all participants; General (id 'general') is not deletable/leavable, enforced in joy-core APIs.
