  text: 'Result: tests/fixtures/members/{open,anonymous} hold two projects in the 0.22 format (founder, second person, AI member with delegation, issued ten-year token), written by generate.sh with a debug binary. crates/joy-cli/tests/member_fixtures.rs opens each the way the platform (update sync, data reach), the desktop (checkout reach) and joy update do, then asks through the real binary: both people sign in, the second writes and may not manage, the founder manages, the token redeems, the AI writes and may not manage, the old item is listed. Six cases, half a second. The anonymous fixture is an open project switched over, because adding a person to an anonymous project is refused today.'
