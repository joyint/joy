description: |-
  Safety net for JI-019E-40 (delivery 0), against today's code, before any format change lands.

  Fixtures: two small repos checked in under tests/ in today's .joy format, one open and one anonymous (privacy: anonymous, encrypted members.yaml), each with a founder, a second human with an attestation, an AI member with attestation, adapter and delegation, and an issued delegation token plus the passphrases used (test material only).

  Test: for each fixture, copy to a temp dir, run the shared reconciles the hosts run (joy_core/joy_chat_store update::sync with Reach::Data as the platform does and Reach::Checkout as the desktop does) and the CLI path (joy update), then: joy auth as the second human with the passphrase succeeds, joy auth --token redeems the AI token, a joy add as the AI succeeds, joy project member show lists the same members with the same capabilities as before. The test is written so that the migration of JI-019D-46 can be dropped in and the same assertions still have to hold (the fixtures stay in the old format on purpose).
