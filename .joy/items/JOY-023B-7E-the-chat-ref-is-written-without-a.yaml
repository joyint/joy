  text: 'Verifiziert 2026-08-19: gefixt, Bug besteht nicht mehr. commit_root in crates/joy-chat-store/src/chat_ref.rs committet mit repo.commit(None, ...) und bewegt die Ref danach per reference_matching gegen die erwartete Basis; Ok(None) bedeutet die Ref hat sich bewegt, und save/commit in chat_store.rs wiederholen die ganze Arbeit (REF_MOVE_ATTEMPTS = 8), danach ehrlicher Fehler statt stillem Verlust. Unit-Tests in chat_ref.rs decken den Verlierer ab. Commit f0fd151. Notiz: die Sync-/Merge-Pfade schreiben weiter forced, sind aber durch das Projekt-Lock des Aufrufers serialisiert.'
