description: |-
  When a person is first there with their key, a project from before the member files is brought over (JI-019D-46): the members move from project.yaml into files of their own, and the person signs what the AI members may do. That part is the change itself.

  In the same step joy also replaces the legacy form of an AI member's name with the name in every item, job, milestone, release and log file. In jyn that is 117 files (operator, 2026-10-12). It is not needed: since the name is cut where it is READ (joy_model::migrations::ai_member_name, the one place), every such file reads right as it stands, and the module says so itself: "Old data is not rewritten for it". The rewrite is a leftover of the first round, from before the read-time rule existed. It makes huge diffs and merge conflicts, and it touches log files, which are a record.

  Wanted: bringing a project over writes project.yaml and the member files, and nothing else. Items, jobs, milestones, releases and logs stay byte for byte as they are and read with the name.

  Where: crates/joy-core/src/member_migration.rs (finish). The same code runs on the platform (prepare/finish) and the desktop (migrate), so they follow with the joy bump.
comments:
