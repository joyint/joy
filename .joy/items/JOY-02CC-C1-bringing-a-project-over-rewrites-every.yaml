  date: 2026-10-12T06:38:47.113499526Z
  text: 'Plan: remove the rewrite of project.yaml by text and of the five directories from member_migration::finish, and with it the list of renamed members that only fed it. project.yaml is written through the model, which already holds the names. Turn the fixture test around: member_fixtures.rs today demands that no file under .joy says the legacy form; it will put an item and a log line from before into the fixture that say it, and demand that both are byte for byte the same after the project was brought over, that project.yaml and the member files do not say it, and that joy show and joy log give the name.'
- author: claude delegated-by:horst.schwarz@joydev.com
  date: 2026-10-12T06:48:38.886240186Z
  text: 'Result: two things, both on the operator''s order of 2026-10-12. (1) member_migration::finish writes project.yaml and the member files and nothing else; the text replacement over items, jobs, milestones, releases and logs is gone, with the list that fed it. (2) A project is brought over ONLY by joy update of a person signed in (the operator: ''silently'' was meant for joy update). The calls at joy auth, at every command of somebody signed in, at a passphrase prompt and inside the core login are removed; joy update shows a row ''members: moved to their own files'', or says that it waits for a sign-in, and reports it in --json. Tests: member_fixtures.rs now puts an item and a log line from an AI member of that time into the fixture and holds that sign-ins, writes and an AI session bring nothing over, that joy update without a key waits, that joy update of the founder brings it over, that the two records are byte for byte the same afterwards and read with the name; chat_from_before.rs holds that reading, writing and addressing leave the recording as it was. just check green. Not in this change: the platform (web unlock) and the desktop (unlock) still call the bring-over themselves; they get the first half with the joy bump and need their own change for the second.'
