description: |-
  joy milestone link accepts short-form milestone IDs (TST-MS-01 for TST-MS-01-A1) and stores them verbatim in the items milestone field. Like the recently fixed parent/deps short-form bug, internal lookups use exact match, so:

    - joy roadmap shows the milestone as "(undefined)" because the bucket key does not match any known milestone file
    - joy ls --milestone TST-MS-01-A1 misses items linked via short form

  Fix: same approach as JOY-011F-65 but for milestone refs. Either rewrite milestone refs in load_items by looking up the matching milestone file, or have joy milestone link store the resolved full ID. The load-time normalization is consistent with how parent and deps are handled.

  Reproducer:
    joy milestone add "First"            # generates e.g. TST-MS-01-A1
    joy milestone link ITEM TST-MS-01    # short form accepted
    joy roadmap                          # bucket appears as "(undefined)"
