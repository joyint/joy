description: 'Coverage audit of the items in review (2026-08-20): the forge and alias items all hung on one happy path in forge_alias.bats, and each item had a claim nobody tested. Six new cases close that, all on the real product path with the forge CLI as the only marked stub: an enrolled member wins over an open invitation for the same person even when the forge names the invited address first (JOY-0259-44, the reported case); GitHub''s older privacy address without a numeric id (JOY-0254-3C); an Enterprise host taken from gh''s own config is claimed and a lookalike host is not (JOY-025C-A7); a GitLab alias resolves through joy-gitlab with a new glab stub (JOY-0255-B3); joy auth --user carries through to the session lookup (JOY-0253-8A). Both central rules were mutation-checked, so the tests are known to bite.'
