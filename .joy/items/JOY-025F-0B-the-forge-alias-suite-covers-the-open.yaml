  text: 'Implemented in cc77bbe. Two mutation probes prove the tests bite: putting member_key_for_any back on first-match turns the enrolled-beats-invited case red, ignoring the CLI''s configured hosts turns the Enterprise case red; both reverted afterwards. Full suite 554 bats green.'
