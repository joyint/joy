updated_by: horst.schwarz@joydev.com
description: In a chat turn, a tool call the permission policy does not allow at the turn's level is rejected at once, even when the person the turn runs for is at the desktop app and could approve it. The lane has no way to put the question to a present person and wait for the answer. joy_chat::model::permission already says a host with a human attached asks (JOY-0235-42). Needed by JAPP-026C-DC and JP-0135-17 part 2.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-14T02:20:35.306073250Z
  text: 'Built on feat/desktop-one-chat-path (ai:claude@joy): commits 2ace6b4, e0e05e7, 739760d, 027a5db. The lane asks the present person on a policy Deny that offers an allow option (acp_lane gate.rs TurnGate, turn-gate on the one wire), awaits the answer until the turn is cancelled (idle span or spend cap) or the agent withdraws, records allowed (person), denied (person) or denied (no answer), and never lets a refusal select an allow option. Without a person it denies as before. Tests: 13 lane unit tests, 5 platform lane tests against the mock agent, 4 desktop e2e cases on the real binary. JOY just check EXIT 0.'
