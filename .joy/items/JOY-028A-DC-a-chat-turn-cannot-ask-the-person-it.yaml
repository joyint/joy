description: In a chat turn, a tool call the permission policy does not allow at the turn's level is rejected at once, even when the person the turn runs for is at the desktop app and could approve it. The lane has no way to put the question to a present person and wait for the answer. joy_chat::model::permission already says a host with a human attached asks (JOY-0235-42). Needed by JAPP-026C-DC and JP-0135-17 part 2.
