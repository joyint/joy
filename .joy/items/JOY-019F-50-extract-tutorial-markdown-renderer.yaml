description: Move the tutorial and markdown rendering helpers (run_markdown, render_markdown, and the termimad-based skin selection) out of joy-cli into joy-core so jyn-cli and future CLIs can reuse them instead of duplicating. joy-cli keeps its tutorial and show wiring but calls into joy-core. Add the termimad dependency to joy-core and run downstream just check across all dependents per the contributing guide. Prerequisite for the jyn tutorial command (JYN-0005).
