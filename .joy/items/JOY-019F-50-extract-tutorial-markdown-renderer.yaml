  date: 2026-05-21T14:22:21.681743Z
  text: 'Plan: Extract tutorial/markdown rendering and interactive browsing from joy-cli into a new joy-core module tutorial, gated behind a default-off cargo feature tutorial (optional deps termimad, inquire, terminal_size) so non-CLI consumers like joyint-server keep a lean joy-core. Move render_markdown, render_markdown_with_width, run_markdown, print_full pager logic, parse_chapters, run_interactive, chapter_loop plus a local terminal_width. Functions return std::io::Result to avoid pulling anyhow into joy-core. joy-cli enables joy-core/tutorial; its commands/tutorial.rs keeps only the embedded Tutorial.md, the drift test, and thin wrappers calling joy_core::tutorial. ai.rs and show.rs switch to joy_core::tutorial. Verify with cargo build/test in joy and downstream just check.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-21T14:34:57.733103Z
  text: '[x] Extracted tutorial/markdown rendering and interactive browsing into joy_core::tutorial behind a default-off feature tutorial (optional deps termimad, inquire, terminal_size). Verified joy-core stays lean without the feature: termimad absent from the default dependency tree, present only with --features tutorial. joy-cli now enables the feature and its commands/tutorial.rs is a thin wrapper; ai.rs and show.rs call joy_core::tutorial; removed the now-unused direct termimad/inquire deps from joy-cli. cargo fmt --check and clippy --workspace -D warnings clean; joy-core 332 unit tests pass and the joy-cli tutorial drift tests pass; downstream jyn builds against the change.'
