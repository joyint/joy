  date: 2026-05-15T16:51:10.831097062Z
  text: '[x] Extracted create_delegation_token helper in auth.rs and added --with-token flag to MemberAddArgs in project.rs. The shared helper handles validation, session bootstrap, guard check, delegation key derivation (bootstrap or re-derive), token creation, and project.yaml persistence, returning (encoded_token, ttl_hours). The wrapper joy auth token add reads the passphrase, calls the helper, then prints just the bare token on stdout so the operator can pipe it to the AI (per follow-up feedback). joy project member add --with-token captures the passphrase once and reuses it for both attestation signing and token issuance, avoiding a double prompt. JSON output is preserved on both commands (.data.token / .data.ttl_hours). Test coverage: tests/integration/member_add_with_token.bats (4 cases) plus updates to existing token-parsing tests across auth.bats, ai.bats, identity.bats, traceability.bats, json_auth.bats, setup.bash, and member_add_ai_hint.bats. All 368 bats tests pass.'
