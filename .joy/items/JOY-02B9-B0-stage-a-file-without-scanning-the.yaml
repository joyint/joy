description: |-
  stage_paths (joy-core/src/vcs/forge.rs) stages a single file with index.add_all followed by index.update_all. libgit2 computes a full index to working tree comparison for each of the two calls and applies the path as a filter afterwards, so staging one file costs two scans of the whole working tree. A write command stages at least the item file and the event log: four scans. Measured: joy add in a repository with 60000 tracked files takes 320 ms instead of 11 ms, with about 265000 stat calls; in the 160 item test project the scans are 1152 of 3841 accesses.

  Change:
  - Per path: index.add_path when the file exists, index.remove_path when it is gone.
  - A directory keeps the current add_all/update_all route (one production caller in joy-cli/src/commands/project.rs, two tests).

  Unchanged: an untracked ignored file stays out, a deleted file leaves the index, staged work that is not joy's is not touched.

  Done when:
  - A test shows that staging one path leaves a modified and an untracked file elsewhere in the working tree out of the index.
  - A test covers the deleted file and the ignored file.
  - Existing staging and commit tests are green.
  - joy add in a repository with many tracked files no longer scales with the size of the working tree; the count is reported on the parent.
