  text: 'Addition from the direct connector run on 2026-09-18: the device poll loop in crates/joy-forge-net/src/auth/verbs.rs device_login gives up on the first transient transport error (a DNS hiccup produced {"event":"error","code":"network","message":"https://github.com/login/oauth/access_token could not be reached: ... Temporary failure in name resolution"} after 16 polls while the person was still on GitHub''s page). A transient transport error during polling must be retried until the code expires, and only then reported; the same for pkce_login''s exchange. Also check why the CLI kept printing ''Still waiting'' with a wrong countdown after the connector had ended, and why the first attempt ended with ''the forge plugin did not answer in time and was stopped'' after eight minutes although the login bound is the code''s expiry.'
