description: 'Found by the organisation probe on 2026-09-18 (checklist section 6, joyint-test with the third party access policy restricted). (1) crates/joy-core/src/vcs/contact.rs:907 and :950 gate the 403 and 404 rows of D1.8b on token_worked_before, a process local map (contact.rs:1750-1765, filled only at :1860 after a successful credentialed contact in the same process). A one shot CLI command makes exactly one contact, so a real 404 to a fetch that carried a valid GitHub token produced state error (''github.com does not have this repository'') instead of needs_org_approval. Make ''this token authenticated'' a fact that survives the process (per host in joy''s own state file, written when a credentialed contact succeeds, or taken from the connector, which validated the token when it answered) so the row fires on the first contact of a process too. (2) crates/joy-github/src/github.rs:897-913 reaches_repo treats 403 and 404 from GET /repos/{owner}/{repo} as ''this login is not the one'', so crates/joy-forge-net/src/auth/choose.rs:72-89 answers no-login-for-repo and the person reads ''None of your GitHub logins can reach <repo>. Sign in with the login that can.'' Under an organisation wall no login can: distinguish the 403 that names OAuth App access restrictions (and a 404 on a repository under an organisation the token''s user belongs to per GET /user/orgs) from ''not the login'', and answer needs_org_approval with the organisation''s settings URL (D2.7c). Also record that chose_by memory or pin skips the probe, so whether the token is presented under a wall depends on a memory row: make the behaviour the same both ways. (3) Note for the checklist: gh''s own OAuth app is owned by GitHub and is not subject to the organisation policy, so the gh login is no stand in for this test; a device flow token of the Joyint Desktop app is needed. JI epic JI-0190-3A.'
