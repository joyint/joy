updated_by: ai:claude@joy delegated-by:horst.schwarz@joydev.com
description: |-
  Production platform, 2026-10-03 (see JP-0167-AF). The notice in the chat reads '@vibe could not finish this turn: acp chat lane could not be established: agent docker exec -i -w .../repo --env JOY_CHAT_MODE=autonomous --env JOY_CHAT_SESSION=... --env JOY_ADAPTE' and ends there. The text is shortened to 240 characters (joy-ai turn_engine), the command comes first, so the reason never reaches the person, the log record or the feedback mail. The command the platform hands to the lane also contains --env MISTRAL_API_KEY=<key>. In this case the cut came before the key, and a search of the production OTel logs and spans found no key. That was luck of the argument order, not a guarantee.

  Not known: where the text 'agent <command> ...' is composed (acp_lane last_error or the agent-client-protocol crate), every place the unshortened text is written to (chat message on the forge, server log, OTel, feedback records), and whether a key has been written anywhere in the past.

  Task: analyse first. Find the root cause and write it into this item before any fix is designed: trace the error text from its origin to every sink, and state for each sink whether a secret can reach it. Reproduce with an automated test we own that fails before the fix and passes after. No workaround for the symptom.
