- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-10-04T01:03:27.618943081Z
  text: |-
    Analysis 2026-10-04. Code read at the commits deployed on 2026-10-03 06:53 to 08:06 UTC (umbrella 2bb6895: platform c1d6833, joy a7a948d, app d9e4cac; production run of 2026-10-02 20:58 UTC, next deploy 2026-10-03 14:34 UTC).

    VERIFIED
    1. Origin: crates/joy-ai/src/acp_lane.rs, run_lane: on a failed connection, reason = format!("agent '{command_shown}': {e:#}") with the complete spawn command. It is stored in last_error and printed with eprintln ('joyint: acp lane ended: ...'). A second place prints the command the same way ('acp lane refused: agent command ...').
    2. The platform builds that command with --env MISTRAL_API_KEY=<key> and --env JOY_SESSION=<session> inside (platform src/agent/container.rs, chat_turn).
    3. Sinks: (a) stderr of the server process, in full, twice per failed turn (two attempts). Reproduced with a made-up key: the line contains 'MISTRAL_API_KEY=FAKEKEY123' in clear. In production that is the docker json-file log of joyint-platform-production. (b) LaneSet::turn returns it in the error; the platform wraps it and joy-ai turn_engine shortens it to 240 characters for the notice. The notice goes into the chat message, the OTel log record 'chat turn refused or failed' and from there into feedback mails.
    4. Why the reason is missing: the 240 characters are counted from the start of the text, the command comes first, the reason (docker's message) after it.
    5. Whether the cut keeps the key out depends on the argument order and path lengths only. In production on 2026-10-03 the cut fell inside JOY_ADAPTER, before the key. A search of the production OTel logs and spans for 'MISTRAL_API_KEY' found nothing.

    NOT CHECKED: the container logs of 2026-10-03 no longer exist, so it cannot be shown whether the key was written there; by the code it was, on each of the two failed turns.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-10-04T21:28:13.655406757Z
  text: 'Fixed on fix/joy-02bc-c8-lane-error-names-no-command: the reason of a failed lane now leads with the cause and closes with the program only (agent ''docker''), for the command line and the JSON spec, at the parse and the connect stage. The command, its arguments and its environment are in neither the stored reason nor stderr. Test a_lane_failure_names_the_cause_and_no_secret covers both forms and both stages.'
