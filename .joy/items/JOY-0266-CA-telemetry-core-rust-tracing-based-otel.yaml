description: 'The Rust counterpart of the app''s telemetry core (JAPP-01A1-3B): a tracing subscriber that produces the same OTel-shaped log records, spans and metrics with the same resource attributes (service.name joy-cli / joyint-desktop backend, version, project id, session id), writes rolling JSON-lines files in the state directory when telemetry is off, exports over OTLP/HTTP when on, and reads telemetry.level from ~/.config/joyint/settings.toml. One record format across all components so an incident reads as one trace.'
