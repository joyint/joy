description: |-
  Add clap ValueHint annotations so shells can offer tab completion for path arguments:
  - -w / --working-dir: DirPath
  - joy crypt add/rm <target>: AnyPath (item ID OR file glob)
  - joy crypt read/write/edit/unlock/lock <file>: FilePath

  Without the hint, shells fall back to default arg completion and offer nothing useful for paths.
