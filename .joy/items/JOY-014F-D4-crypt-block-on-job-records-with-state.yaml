description: Adds the optional crypt block to Job records (.joy/jobs/<ITEM-ID>/JOB-XXXX.yaml). On status change that creates a Job for an AI assignee on an encrypted item, the triggering principal wraps the zone keys for the AI's session pubkey and writes them into the Job. Decrypt operations validate Job state (assignee, item status, capability) before unwrapping. Wraps become inert when the Job closes. Depends on JOY-0031 (Job tracking with automatic lifecycle).
