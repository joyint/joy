  text: 'Retired 2026-06-15 (JI-0120 joy pass). This ADR records an implementation/packaging detail, not an architecturally significant decision. The joyint-server it describes (a single REST daemon) will not exist in this form: the server is now the platform container model (JP-002D-FF) over gRPC (JP-002C-9B), and the open/commercial licensing boundary lives in the open-core ADR (JI-00FD-EA, umbrella). Nothing joy-specific remains here that other decisions depend on, so it is retired rather than rewritten.'
