description: 'Lazy-registration in every joy invocation (JOY-0162) is a quick fix for the gap between binary upgrade and per-clone .gitattributes/git-config setup. Every command pays a small overhead, the magic is invisible to users, and it leaves a code path that has to stay behind any future schema change. Better long-term options to design through: (a) a clone/checkout hook installed by joy init that triggers onboard-equivalent on first command, (b) a dedicated ''joy migrate'' that compares stored vs current binary version and runs needed steps, (c) shipping a richer .gitattributes that does not require per-clone git config, (d) something else. Pick after JOY-0162 has stabilised and we have field signal.'
