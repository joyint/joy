  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j4p, commits 232d768 [JOY-029A-5A] Decide a clone's proxy after, bd1d80a [JOY-029A-5A] Prove the criteria in the de, fea2d49 [JOY-029A-5A] Decide the proxy of a contac, fc1ffa9 [JOY-029A-5A] Apply the certificate author, 908533d [JOY-029A-5A] Carry the proxy on every con; merged into feat/forge-connection-ng by the integrator).\n\nThe must_fix is fixed and proven: clone_raw now calls git_environment() before proxy_for, so the proxy decision of a clone can no longer read http.proxy, remote.<name>.proxy or http.<url>.proxy out of the machine's /etc/gitconfig in a process where GIT_CONFIG_NOSYSTEM is set, and a Config::open_default() can no longer race the unsafe set_search_path. A new single-test binary (crates/joy-core/tests/clone_config_environment.rs) points a fake system gitconfig at a SOCKS proxy that joy refuses by name and dials a closed loopback port, so the two orders differ by a sentence rather than a timeout; reverting the one line makes it fail. All nine should_fix items were fixed, none deferred: the CA test file is gated only where it needs a TLS backend (4 tests now run in the default suite, 5 under forge-net, where 0 ran before), the applying loop is a testable apply_ca_decision so the \"could not be applied\" branch is actually executed and asserted by key, source and path, the https CONNECT proxy test is ungated and runs by default (it needs no network), an unparsable NO_PROXY port now matches nothing instead of every port, the proxy credential is looked up with protocol=http as D1.11 says, the macOS/Windows CA refusal sentence and the design were reconciled by updating the design, libgit2's own message is run through proxy::scrubbed on the detail line whenever this contact's proxy URL carried a credential, the \"no password in any log line\" proof uses set_global_default so it covers the helper runner's own threads, and the doc block above git_environment/git_config_environment now describes what each function does. cargo fmt, clippy (with and without forge-net) and the whole joy-core suite are green; nothing under .joy/ was touched and nothing was pushed.\n\nAcceptance:\n- [partly] with HTTPS_PROXY set and a proxy that requires Basic, a fetch succeeds and no proxy password appears in any log line or error text: The fetch that SUCCEEDS end to end is the HTTP_PROXY/absolute-form one (a_fetch_through_a_proxy_that_requires_basic_succeeds_and_leaks_nothing): one 407, one replay carrying Basic, objects downloaded. With HTTPS_PROXY th\n- [met] with NO_PROXY=\"a.com, b.com\" a contact to b.com bypasses the proxy: Proven on the wire (no_proxy_keeps_a_named_host_away_from_the_proxy): every request asks for a path, none is addressed to a proxy, and no 407 is ever demanded. The trimming difference from libgit2 is unit-tested, and a p\n- [met] a socks5:// proxy produces the named sentence and no attempt: a_socks_proxy_is_refused_before_the_contact asserts the exact sentence and nothing is dialled; the refusal is raised before any socket.\n- [met] an intercepting CA installed with update-ca-certificates is trusted on Linux with no joy setting: joy's own half now runs in the default suite (nothing_configured_is_nothing_applied_and_the_system_store_decides): with an empty HOME the decision is CaDecision::Nothing and applying it touches no libgit2 option and logs\n- [met] the same CA not installed produces tls_untrusted with the issuer in the detail line and libgit2's own verdict is what refused it: the_issuer_this_branch_stashed_reaches_the_tls_untrusted_detail_line drives all three TLS backends' texts and asserts the state, the sentence and \"issued by 'Acme Corporate Root CA', chain not trusted; libgit2: ...\". The\n- [not_testable_here] the desktop app and the CLI behave identically on one machine with a proxy set only in the shell profile: The joy half is done: one options_for on every FetchOptions, PushOptions and connect_auth, reading the same variables in both processes, and proxy_basic_auth sets them in its own process to prove it. The other half is th\n- [met] every FetchOptions, PushOptions and connect_auth in joy-core carries a ProxyOptions built by one function: The clone, the two downloads, the three pushes and the three advertisements all go through proxy_for/options_for, and the clone now does so only after git_environment(), so the decision never reads a system gitconfig git\n\nOpen questions:\n- The design edit (D1.12's refusal sentence) lives only on feat/forge-connection-ng-j4p. Other packages read the design through /home/horst/Work/Joyint/project/.claude/worktrees/forge-connection-ng/joy/docs/design/forge-connection-ng.md, so that copy still carries the old sentence \n- The first acceptance criterion is reported as partly on purpose: proving \"with HTTPS_PROXY set ... a fetch succeeds\" literally needs a certificate authority installed on the machine running the test (or a joy-owned test CA fed through the D1.12 hatch, which would then be testing \n- joy_core::apply_ca_decision is now public so the reporting branch can be driven from an integration test. If the crate's surface is meant to stay smaller, it could be #[doc(hidden)] or moved behind a test-only feature.\n\nRemaining: an HTTPS_PROXY end to end run needs a CA on the host (the HTTP_PROXY form is proven end to end with one 407 and one Basic replay); the desktop half of the environment import is A6's and landed."
