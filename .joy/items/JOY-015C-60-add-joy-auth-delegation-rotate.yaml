  date: 2026-08-31T15:20:14.360150956Z
  text: 'State in English for the record (2026-08-31), replacing the German notes. A naming refactor plus a new view verb for AI tool delegations: joy auth token rm became joy auth delegation rotate <ai-member> (the semantics stay - a fresh per-operator delegation, and every token of that AI issued by this operator dies), and joy auth delegation ls lists the delegations registered in project.yaml for all operators with created, rotated and the delegation verifier''s prefix. TokenCommand::Rm and run_token_rm are removed, and the bats tests cover rotate and ls.'
