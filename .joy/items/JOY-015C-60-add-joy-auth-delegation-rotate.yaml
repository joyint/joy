    [x] Rotate ruft die existierende run_ai_rotate Funktion (per-Operator-Semantik passend zu ADR-041 §7)
    [x] Ls listet alle in project.yaml registrierten Delegations, optional gefiltert nach AI-Member
    [x] TokenCommand::Rm + run_token_rm entfernt (semantisch ersetzt durch delegation rotate)
    [x] bats Tests aktualisiert: zwei tests für rotate, zwei tests für ls
