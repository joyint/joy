description: |-
  Found by the desktop client's test for JAPP-0319-10 on 2026-10-13: the client founds a project (joy_core::init) and then runs the checkout reconcile, which renders SECURITY.md. Since JOY-02CF-EE the sync commits what it changed, and here that commit is the first one in the repository and carries SECURITY.md alone, while everything else the founding wrote is only staged. The person's own first commit then comes second and holds the rest.

  In a repository without a commit nothing can be taken for a leftover of an earlier state: everything in it is new together and goes into the person's first commit. The CLI does not meet the case by itself, because joy init stamps the marker and the first call runs no sync; joy update in such a repository does.

  To do: commit_project_update writes nothing where the repository has no commit yet and says so in its reason; a test holds it.
