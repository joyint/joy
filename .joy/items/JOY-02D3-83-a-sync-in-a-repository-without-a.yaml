  text: |-
    Plan:
    1. A test in joy-core git_ops.rs: in a repository with no commit, a sync's changes are not committed, the answer is Left with a reason that names the missing first commit, and the files stay as they are.
    2. commit_project_update_at asks for HEAD before it stages anything and answers so.
    3. A bats case in update_command.bats: joy update --force in a freshly founded project, before any commit, writes no commit and says why.
    4. just check, just test-int.
