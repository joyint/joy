description: |-
  **Status:** Accepted

  ## Context

  The original Dispatcher architecture defined two integration surfaces per AI provider:


  1. **Chat/Completions API** for lightweight structured tasks (estimate, plan) - single-turn, no container, inline in the Dispatcher worker.
  2. **CLI Agent in Container** for agentic coding tasks (implement, review) - multi-step, filesystem access, on-demand container.

  This two-surface design seemed logical: why pay for a full agent container when a single API call suffices for an estimation? However, during the provider evaluation (Claude, Mistral, Qwen, OpenAI/Codex, Gemini), two problems emerged:

  * **Two codepaths to build and maintain.** The Chat API surface requires its own context-assembly mechanism (which files to include, how to build the prompt, how to parse structured output). The agent surface has a different execution model (container lifecycle, CLI invocation, output parsing). For a solo founder, maintaining both is unnecessary complexity.
  * **Plan and estimate benefit from agent capabilities.** Estimating items in isolation - as a single API call with a text prompt - ignores code structure, dependencies between items, and architectural context. A plan that can read the codebase, inspect existing items, and understand the project structure produces better decompositions than one operating on description text alone.

  Separately, the decision was made that plan and estimate should operate at **milestone or project scope**, not per item. At that scope, the container startup overhead (2-5 seconds cold, 1-2 seconds warm) is negligible compared to the job duration (1-2 minutes for a milestone plan). The latency argument for a lightweight Chat API surface disappears.

  ## Decision

  **All four capabilities (plan, estimate, implement, review) run as agent jobs in on-demand containers.** There is no separate Chat API surface. One execution pattern for everything.

  The agent in the container:

  * Reads Joy context via CLI (`joy show`, `joy ls`, `joy mode`)
  * Has access to the full codebase (git clone)
  * Operates within capability-specific tool permissions (read-only for estimate, read+write for implement)
  * Is subject to capability-specific cost controls (max_cost, max_turns, timeout)

  ### Scope by capability

  | Capability | Scope | What the agent sees |
  |------------|-------|---------------------|
  | plan       | Milestone / Project | All items in milestone, vision docs, architecture docs, code structure |
  | estimate   | Milestone / Project | All open items, code touched by those items, dependencies |
  | implement  | Item  | Single item context, full codebase access |
  | review     | Item  | Single item context, code changes, acceptance criteria |

  ### Future option: per-item Chat API

  Per-item estimation via a lightweight Chat API call remains a possible future optimization. It is not planned for Phase 2 for two reasons:


  1. **Implementation simplicity** - one execution surface means one codepath to build, test, and maintain in the first phase.
  2. **Quality** - milestone-scoped estimation with codebase access produces more accurate results than isolated per-item API calls. This is the more important reason.

  If per-item estimation becomes desirable (e.g., for real-time cost previews in the UI), it can be added as an additional surface without changing the container-based architecture.

  ## Consequences

  * Provider.md describes a single integration pattern per provider (CLI agent in container), not two.
  * Dispatcher.md defines capability-specific tool permissions and cost controls instead of surface-specific execution paths.
  * All five providers (Claude, Mistral, Qwen, OpenAI/Codex, Gemini) follow the same container lifecycle: create, clone, execute, destroy.
  * Container startup optimization (warm pools, direct OCI runtime) becomes more important since all capabilities use containers.

  (Relocated from umbrella JI-0112-14 as part of the JI-0120 architecture reconciliation.)
