description: The platform keeps live ACP sessions per chat (JP-0085-F4 in the platform repo). A session that already carries the transcript only needs what happened since the AI member's own last message. delta_prompt(chat, ai_member) renders exactly that block; None when the member has not spoken yet, so the caller replays the full transcript instead.
