description: 'Implements browser-side encryption and wrapping in the WebUI using Web Crypto API: AES-256-GCM, Argon2id-derived KEKs, Ed25519 keypair operations. When a user triggers a status change on an encrypted item with an AI assignee, the browser unwraps the user''s zone key locally, re-wraps it for the AI session pubkey, and posts the Job record. Server stores ciphertext only. Same wire format as the Rust client.'
