description: |-
  Every joy command touches the filesystem far more often than its job requires. On a local SSD this is invisible; on a slow filesystem (a network mount, or a host drive shared into a virtual machine) each access costs a fraction of a millisecond and a single command takes seconds.

  Measured with joy 0.21.0 in a test project with 160 items, counting file accesses on project and home (strace, each access attributed to its cause by stack trace):

  | command | total | item files | staging scans | repository opens |
  |---|---|---|---|---|
  | joy ls | 2281 | 1766 | 0 | 324 |
  | joy show <ID> | 4138 | 3608 | 0 | 324 |
  | joy add | 3841 | 1800 | 1152 | 504 |
  | joy rm | 5572 | 3608 | 1074 | 504 |

  Reading one file costs about 5 accesses, so listing 160 items needs about 800. Everything above that is avoidable. Four causes, one task each:

  1. Every pass over the items reads each file twice (once to detect the crypt zone, once to parse).
  2. Loading a single item loads all items.
  3. Staging one file scans the whole working tree twice; a write command stages at least two files.
  4. The git repository is opened 9 times per read command and 14 times per write command, 36 accesses each.

  Goal: a command reads the item files at most once (about 5 accesses per item), and a command on a single item reads only what it touches. At 0.35 ms per access that puts joy ls for 1600 items at about 3 s on a slow filesystem, which is the accepted bar.

  Targets for the 160 item test project (estimates): ls and show about 1050, status/comment/assign about 600, add and rm about 1300.

  Constraints: the public interface of joy-core stays unchanged (desktop app, platform and jyn build against it). No cache or index over the items; the bar above does not need one.

  Proof: the same count before and after, reported as a table on this item, plus regression tests in the tasks.
