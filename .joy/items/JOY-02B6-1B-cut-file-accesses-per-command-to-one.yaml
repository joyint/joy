  text: |-
    Result, measured the same way as the numbers in the description (test project with 160 items, file accesses on project and home, attributed by stack trace).

    Total accesses per command:

    | command | before | after |
    |---|---|---|
    | joy ls | 2281 | 1018 |
    | joy show <ID> | 4072 | 1038 |
    | joy status <ID> open | 3840 | 646 |
    | joy comment | 3838 | 646 |
    | joy add | 3810 | 1454 |
    | joy rm | 5520 | 1391 |

    By cause, after (before in brackets):

    | cause | ls | show | status | add | rm |
    |---|---|---|---|---|---|
    | item files | 805 (1766) | 815 (3542) | 22 (1787) | 818 (1778) | 832 (3564) |
    | staging scans | 0 | 0 | 0 (1169) | 0 (1143) | 0 (1066) |
    | repository opens | 72 (324) | 72 (324) | 180 (504) | 180 (504) | 180 (504) |
    | other git | 35 (85) | 35 (85) | 287 (212) | 288 (212) | 216 (212) |
    | other joy | 106 (106) | 116 (121) | 157 (168) | 168 (173) | 163 (174) |

    Item files are opened once per pass (160 for ls, 2 for status). The repository is opened 2 times by a read command and 5 times by a write command (9 and 14 before). joy add in a repository with 60000 tracked files: 264941 stat calls and 307 ms before, 510 and 90 ms after.

    Other git went up for write commands: staging a file by its own path writes the blob and reads the attributes for that one path, which the walk used to cover. That is the work of staging itself.

    Checks: just check green (1477 cargo tests, smoke tests), just test-int green (592 cases).

    What is left per command is one pass over the items where the command needs the set (ls, show, add for the duplicate title check, rm for the references), and a base of about 200 to 600 accesses.
