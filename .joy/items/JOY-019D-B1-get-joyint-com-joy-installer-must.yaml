  text: '[x] Fixed in the website installer (public/install/joy.{sh,ps1}); tracked there as JISITE-004B-BA. The installer now writes the cargo-dist receipt (${XDG_CONFIG_HOME:-$HOME/.config}/joy-cli/joy-cli-receipt.json; %LOCALAPPDATA%\joy-cli on Windows). E2E verified on Linux: after install, ''joy update --check'' reports ''up to date (0.16.5)'' instead of ''install receipt missing''.'
