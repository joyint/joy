description: Today joy project set <KEY> requires a positional VALUE; calling it without one fails with a clap error. Make VALUE optional and, when absent (and no other write flag is given), open $EDITOR with the current value of the key pre-populated. Saving without changes is a no-op; saving an empty buffer is equivalent to joy project set <KEY> '' (cleared field, docs.* reset to default, etc.). All existing per-key validation (forge supported values, acronym 2-8 chars, ...) runs on the editor result the same way it does on direct CLI input. For list-valued keys (release.version-files after JOY-00F9-D7), the editor shows one entry per line; blank lines and '#' comments are stripped on save. Reuse the existing editor helper used by joy comment <ID> (no text) so behaviour around $EDITOR / $VISUAL / fallback to vi stays consistent.
