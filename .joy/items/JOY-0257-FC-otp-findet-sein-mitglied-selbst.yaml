description: 'Beim Einloesen (joy auth --otp, Platform-Redeem) wird das Mitglied ueber den Einladungs-Verifier gefunden statt ueber die Git-/Konto-Adresse: wer den gueltigen OTP hat, IST der Eingeladene (Operator 2026-08-09). Damit klappt das Einrichten auch mit Alias-Git-Konfiguration, ohne Forge und ohne Plugin. Ersetzt die Alias-Aufloesung NICHT (Folgebefehle loesen weiter ueber die Git-Adresse auf, JOY-0253-8A). Sicherheit: Verifier-Scan nur ueber Mitglieder mit offener Einladung; OTP bleibt hochentropisch; Fehlversuche unveraendert behandelt.'
