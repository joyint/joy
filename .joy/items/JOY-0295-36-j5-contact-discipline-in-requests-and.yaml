  text: 'Plan: (1) contact.rs: the request weight table per verb, the canonical budget table of D1.9 with derived gaps, the poll period rule (requests/budget rounded up), strike exponent and strike survival, the no anonymous polling rule with the 15 minute interval; (2) the classifier vocabulary of D1.8a and D1.8b: the state enum with every new name (needs_sign_in, needs_org_approval, needs_sso, no_push_rights, needs_host_trust, scope_missing, plugin_missing, plugin_outdated, tls_untrusted, proxy_auth, rate_limited, offline, denied, error), ContactEvidence, classify(evidence) on error code, class and a status regex over the two libgit2 formats, the old word mapping and the detail line grammar; (3) forge.rs: ls_remote_refs and the single connection fetch through connection.remote(); (4) the oracle hook of D2.10 behind an interface. Tests: classifier corpora for WinHTTP and OpenSSL texts with non English tails, throttle tests. Worktree: .claude/worktrees/fcng-J5/joy on branch feat/forge-connection-ng-j5.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-17T02:54:42.821559121Z
  text: "Result (implemented, adversarially reviewed, review findings fixed; branch feat/forge-connection-ng-j5, commits: 879f8f2 [JOY-0295-36] Charge the forge budget in requests an, 2823764 [JOY-0295-36] Read a failure by what libgit2 really ).\n\nThe branch now carries two commits: the original J5 work and one commit that answers the adversarial review. All six must_fix items are fixed. The classifier no longer loses an unreachable forge on Linux and macOS: libgit2 writes \"failed to connect to host\" only in the WinHTTP build, while every OpenSSL and Secure Transport build interpolates the host (streams/socket.c:244, with strerror appended by git_error_vset), so the prefix stops before the word that differs and the OpenSSL corpus now carries the real socket.c sentences with a German tail plus a guard that no Windows wording may sit in it. A generic GIT_ERROR_SSH is no longer read as a refusal: only GIT_EEOF, which is how libgit2 marks the remote's own stderr (ssh_libssh2.c:138-139), maps to denied or no_push_rights, and a broken key exchange, a missing libssh2 or an unreadable known_hosts falls through to the code and class rules. A 407 names the proxy and not the forge, and the two libgit2 proxy texts are told apart, because off Windows the second one means the proxy offered only NTLM or Negotiate and no password joy could ask for would help. The oracle's answer, not just its call, is remembered for the strike window, so an organisation approval wall keeps its banner and its button instead of flipping to \"GitHub answered with an error\" two seconds later. The fifteen minute anonymous poll rule is charged rather than merely defined: contact::run_poll is the poll door, forge::ls_remote_ref_poll uses it, and chat_ref::remote_hash, which is the poll question on both hosts, goes through it, while a person's own command still goes through run untouched. Of the ten should_fix items, seven are fixed: the strerror half of the syscall match is gone and the doc comment names the right class, the rate limit sentence carries the number D4.7 writes, the strike window is always 600 s with the forge's retry-after moved to next_try, the operator log line describes the doubling it really does, the poll period is floored at one second so A5 and P2 cannot read a zero, connection.list() failures reach the classifier, the two budget tests take a serial lock before they write the process-wide gap table and say what the criterion's word \"https\" means there, the chats delivery log drops its \"(offline?)\" guess, and the corpora were rebuilt. Three are reported as open questions with their reasons, together with a note that the design text quotes the WinHTTP-only wording and should be corrected by the document's owner. Every a\n\nAcceptance criteria:\n- [met] A counting proxy shows that one fetch_ref against a private https remote costs three requests, not five: crates/joy-core/tests/forge_request_budget.rs: an in-process smart-HTTP server that demands Basic auth counts 3 requests, exactly one 401, two /info/refs and one upload-pack POST, and the objects arrive. The server speaks plain http on 127.0.0.1; TLS adds no HTTP request, and the module comment now \n- [met] The measured HTTP requests per minute per host stay inside the budget table of D1.9 (at most 40 per minute on codeberg.org, at most 60 on github.com): the_poll_period_is_the_verbs_requests_over_the_hosts_budget computes the period from the canonical table (2 requests / 0.9 -> 3 s, / 1.0 -> 2 s) and asserts 40 and 60 requests per minute against the 54 and 60 the budgets allow. The figure is derived from the table and the weights the counting-proxy \n- [met] After a 429 the next contact to that host waits at least twice the gap and the strike survives the next success: a_429_doubles_the_gap_and_the_strike_survives_the_next_success measures 200 ms after one strike and 400 ms after two on a 50 ms gap, and asserts limited_until is still set after a successful contact. The strike window is now always 600 s (a_documented_ban_sets_its_own_next_try checks it), with the f\n- [met] One poll tick makes one contact for two refs: one_poll_tick_makes_one_contact_for_two_refs: ls_remote_refs for three names answers from one advertisement in 2 requests (the 401 and its replay).\n- [met] An https remote with no credential is polled at most once per 15 minutes per host and the surface says why: The gate is now charged, not merely defined: contact::run_poll holds the second anonymous https poll inside the window and returns a ContactError with failure needs_sign_in, no libgit2 detail, a next_try and the message 'Nobody is signed in for <host>, so it is checked once every 15 minutes. Sign in\n- [met] The classifier test passes against both the WinHTTP and the OpenSSL corpus with a non English operating system message tail: Both corpora are read twice, English and German. The OpenSSL corpus now carries genuine streams/socket.c sentences with the host interpolated (GIT_ERROR_OS 'failed to connect to codeberg.org: Connection refused' and 'Network is unreachable', GIT_ERROR_NET resolve and 'error receiving data from socke\n- [met] J5 owns the state vocabulary: the enum with every name of D1.8a and D1.8b, classify(evidence), the mapping, the old-word mapping and the detail line grammar: Failure with 14 states, reason(), old_word(), sentence(), next_step(); classify/verdict over ContactEvidence; classify_plugin for the connector rows; DetailLine with the fixed grammar of D1.8b. verdict() now also supplies the parts a state alone cannot know: the proxy's own name, the rate limit wait\n- [met] The 403 rules of D1.8b including the GitLab wait per instance kind, and the oracle hook of D2.10: GitLab 403 on a fetch is rate_limited with 15 minutes on gitlab.com and 60 minutes self managed and asks nobody; the Gitea family asks nobody; GitHub asks the oracle at most once per host per strike window and the ANSWER is now remembered for that window, so a repeating organisation wall keeps its b\n- [met] Single connection fetch, ls_remote_refs, request weight table and poll period computed by J5 for A5 and P2: download_ref and fetch_heads_raw download through connection.remote() while the connection is alive; ls_remote_refs answers many refs from one advertisement; requests(verb, transport, credentialed) and poll_period/poll_period_for are public and now floored at one second, so A5 and P2 can never read \n\nDeviations from the design:\n- crates/joy-chat-store/src/chat_ref.rs is outside J5's declared file list. It is touched for two lines of substance: remote_hash, which is the poll question on both hosts, now goes through forge::ls_remote_ref_poll so the fifteen minute rule has a real caller (must_fix 6 offered exactly this or moving the criterion out of J5), and the chats delivery log no longer prefixes '(offline?)' onto a classi\n- ContactEvidence gained a field D1.1 does not list: proxy: Option<String>, filled by ContactEvidence::through_proxy. D1.8c requires the 407 sentence to name the proxy, and nothing else in the evidence knows one; the forge host is not it. It defaults to None (the sentence then reads 'A proxy in front of github.com needs ...', naming no wrong machine) and D1.11's owner fills it.\n- Four additive public functions that the package block does not name: contact::run_poll, contact::run_poll_for, forge::ls_remote_ref_poll, forge::ls_remote_refs_poll, plus contact::note_credential_presented for the credential callbacks. Nothing was renamed and no existing signature changed.\n- OS_OFFLINE_PREFIXES matches 'failed to connect to' rather than the design's quoted 'failed to connect to host'. The design quoted libgit2's WinHTTP format string; the OpenSSL and Secure Transport builds interpolate the host instead (streams/socket.c:244). The shorter prefix covers both producers and the code says why.\n\nOpen questions:\n- should_fix 2, second half: scope_missing still reads 'Your GitLab sign in does not allow this.' instead of D4.7's 'does not allow creating projects.' The refused verb is not in the evidence: PluginEvidence::ScopeMissing carries no payload, and giving it one would define the connector's wire shape, w\n- should_fix 5, two of its three consequences: Auth::Local is still credentialed() == true before the contact, so an https local-mode remote is charged the private request column and poll_period's anonymous rule cannot fire for it. Both need the answer before the contact, which only the resolver of D1\n- should_fix 7, second half: connection.list() now goes through the classifier, but open() and origin_or_first() inside a contact still return through err(), whose 'git: <libgit2 text>' lands in ContactError::message. Making run refuse every unclassified message would also flatten joy's own honest sen\n- The design text itself should be corrected where it quotes libgit2: D1.8a step 4 and D1.8b name 'failed to connect to host', which only the WinHTTP build writes. The code now reads the shorter prefix; docs/design/forge-connection-ng.md is shared and was not edited from this worktree.\n- The held anonymous poll reports as needs_sign_in, whose old_word is 'denied'. D4.7 has no row for 'held back because nobody is signed in', and needs_sign_in is the state whose next step actually fixes it, but an older app build reads 'denied' and may block writes on a public checkout. If that matter\n\nTests:\n- cargo test -p joy-core: ok: 455 lib tests passed, 2 ignored (network), plus 5 integration binaries green\n- cargo test -p joy-core --features forge-net: ok: 455 lib tests, forge_request_budget 2/2, all other integration binaries green\n- cargo test -p joy-core --features forge-net --lib vcs::contact: ok: 27 classifier, budget, strike, oracle, proxy and poll-gate tests passed\n- cargo test -p joy-chat-store: ok: 47 passed\n- cargo clippy -p joy-core --features forge-net --all-targets: clean (one type_complexity error was introduced and fixed by naming OracleMemory)\n- cargo clippy -p joy-chat-store --all-targets: clean\n- cargo check --workspace --all-targets: clean\n- cargo fmt -p joy-core -p joy-chat-store: applied, no further diff"
