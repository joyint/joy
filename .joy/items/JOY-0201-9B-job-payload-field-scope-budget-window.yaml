description: 'One optional nested job: field on Item (precedent: validity). scope = list of item ids, REQUIRED at creation, container ref means its subtree; budget (max tokens/cost, currency); window (not_before, deadline); attempts = append-only list (started, ended, tokens, cost, branch, result/error, outcome). Live telemetry never enters git; condensed write-back at lifecycle transitions only.'
