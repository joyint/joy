description: 'Anonymous mode: rekey the member map in project.yaml to opaque stable IDs (form m-<short>), and store a per-member email_match = HKDF-SHA256(normalize(email), salt = kdf_nonce, info = "joy-email-match", 32 bytes) (normalize = lowercase + trim). Verifier lets a member find its own entry at first auth before members.yaml is unlocked. Both are at-rest fields, no PII cleartext. Ref ADR-042 §2/§4.'
