  text: 'Root cause found and proven (2026-09-27, Horst asked for a clean analysis; four CI runs in a row failed on this, 36178633074, 36079826235, 36206800141, 36284120024). Not the sweep (maintain_if_due needs an estimate of 6700 loose objects, a test store has 238) and not a reader race: after the 12 sends the store is quiet and refs/joy/chats points at a commit that no longer exists. The one deletion on the path is discard_lost_commit (chat_ref.rs:297): a writer whose swap fails unlinks the commit it wrote, after checking that the ref does not reach it. Three facts make that unsafe. (1) Chat commits are byte-identical across writers over the same parent and tree: fixed signature joy <joy@localhost> with a day-coarse time (chat_ref.rs:91) and the fixed message ''chat <cid> [no-item]''. (2) write_tree commits even when the tree equals the parent''s, and in this test every ensure_general loser re-saves an unchanged chat on retry, so several writers build the same no-op commit X on the same tip (measured: three chained no-op commits per run). (3) libgit2 1.9.7 validates the target object BEFORE taking the ref lock (refs.c:405, then git_refdb_write at :426), a contender gets GIT_ELOCKED at once without waiting (util/filebuf.c lock_file), and refdb_fs never touches the odb. Interleaving: B writes X (creator); C freshens X, validates it, takes chats.lock; B''s swap returns ELOCKED, which commit_root drops via is_ok(); B reads the ref (still the old tip), judges X unreachable, unlinks it; C renames the lock over the ref. Every fresh process now gets NotFound/Odb, the CI error verbatim. Unit test a_lost_writer_unlinks_the_commit_its_twin_is_publishing (branch fix/joy-02ab-f3-lost-commit-discard) plays this with the real commit_root for B and C''s three syscalls by hand: green. Also measured with the real binary, 10 runs x 12 parallel sends: 3 percent of sends refused with ''try again'' on an idle 24-core box, 11 percent pinned to two cores. The retry loop has no backoff and eight attempts. Fix on the branch: (a) writers on one store take a blocking cross-process file lock (fs4, already a joy-core dependency) around read-tip, build, move-ref, so nobody loses a race and nobody retries; the swap stays as a safety net; (b) commit_root keeps the swap''s error and discards only on ErrorCode::Modified, never on Locked or anything else; (c) write_tree makes no commit when the root tree equals the parent''s; (d) the bats test demands that all 12 sends succeed and none says ''try again''; (e) the proof test stays as the regression test.'
