description: 'Today the tool decides its default model by itself: AiConfig has a model field, but no surface lets a person pick one (joy ai init and edit do not ask, and the app sends an empty model on save). Wanted (Horst, 2026-07-18, confirmed again on 2026-08-22): make the model selectable per tool in joy ai init and joy ai edit, so that clients (the project settings, later flows) can offer a tool dropdown with a dependent model dropdown. Replaces JOY-021B-2B, which never landed, from the closed PR 16 (branch feat/jon-pda).'
