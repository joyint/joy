  date: 2026-06-04T18:46:45.780310914Z
  text: 'Plan: (1) joy-core init.rs: add LEGACY_AI_ARTIFACTS const (.joy/ai/instructions.md, .joy/ai/instructions, .joy/ai/skills, .joy/capabilities). (2) joy-cli commands/ai.rs: add git_rm_hard helper (git rm -r --quiet --ignore-unmatch) plus remove_legacy_ai_artifacts() and legacy_ai_artifacts_present(); reuses existing git_path_is_tracked/git_rm_cached pattern. Hard delete from disk + stage removal; fall back to fs::remove for untracked-on-disk; preserve .joy/ai/jobs and .joy/ai/agents. (3) update_registry.rs: new LegacyAiArtifactsItem (SECTION_REPO) registered in all(); gives joy update --check support. (4) Call remove_legacy_ai_artifacts in ai_init() after untrack_gitignored_tool_files with a one-line notice. (5) Integration test (temp git repo) asserting legacy removed + jobs/agents preserved + idempotent. (6) ADR-024 note. just check before commit (joy-core touched).'
