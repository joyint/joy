description: 'Repos created before ADR-024 still carry dead intermediate files under .joy/ that the current binary no longer reads or writes: .joy/ai/instructions.md, .joy/ai/instructions/setup.md, .joy/ai/skills/joy/SKILL.md and .joy/capabilities/*.md. AI tools sometimes pick these up and treat their content as authoritative. No command removes them today (ai init/update ignore them; ai reset only clears .joy/ai on full tool reset and never .joy/capabilities). Add an idempotent cleanup that hard-removes them (disk + git, staged) from both joy update (as an UpdateItem in the registry, so joy update --check reports them) and joy ai init. Preserve .joy/ai/jobs and .joy/ai/agents (current runtime data).'
