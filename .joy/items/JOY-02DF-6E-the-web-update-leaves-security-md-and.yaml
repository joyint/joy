description: |-
  Found 2026-10-19 on joyint/demo-calc (opened in the production web app): the update window moved the members to format 4 (platform commit fbb07d3, 'update project data from an older joy'), but SECURITY.md still describes .joy/project.yaml and seed_wrap_passphrase. A CLI 'joy update' of the same project renders the new SECURITY.md (joyint-forge-test, 2026-10-18). Web and CLI end in different repositories.

  Cause (read in the code): the window (platform update_project_data, src/api/joy_service.rs) runs only joy_core::migrations::finish_update; no update item runs with it. The server's own sync (platform sync.rs reconcile_and_commit) runs only items of Reach::Data: project.yaml schema, doc paths, chat storage. SecurityMdItem and GitattributesBlockItem have the default Reach::Checkout (joy-core/src/update.rs). The split came with 1ec234e8 (2026-07-31); its only stated reason is the operator's rule of 2026-07-29 that the server must not install hooks into the projects it serves. No decision excludes SECURITY.md.

  Decision (operator, 2026-10-19): what is joy bookkeeping goes along automatically, wherever the project is updated: SECURITY.md and the .gitattributes block. Hooks and CI files (.github/workflows/joy-merge.yml and the other embedded files) are never checked in automatically; the person must see them. The 2026-07-29 rule stands. The version marker is per-clone git config and is not part of this.

  Target: SecurityMdItem and GitattributesBlockItem run wherever the project is opened, server included. The window's commit carries them together with the member files, so a format migration never leaves a SECURITY.md that describes the old layout. A project opened on the platform with a stale SECURITY.md or .gitattributes block gets them in the sync commit of the person who opened it, as the data reconciles do today.

  Acceptance:
  - an e2e repro first: a 0.23 project updated through the web window ends with the current SECURITY.md and .gitattributes block in the pushed commit (fails today)
  - the platform never writes hooks, joy-merge.yml or other embedded files into a served repository (existing guard stays green)
  - CLI 'joy update' unchanged
  - demo-calc is brought up to date by opening it once after the release
