  text: |-
    Built 2026-10-19 on fix/joy-02df-6e-server-bookkeeping in joy and platform, committed, not pushed.

    joy: SecurityMdItem and GitattributesBlockItem now have Reach::Data (joy-core/src/update.rs), so every host that opens a project renders them, server included. Hooks, hooks path, merge driver, embedded files and the version marker keep Reach::Checkout; joy-merge.yml and the AI tool files are joy-cli's own items and never run on a server.

    Differs from the Target text: the bookkeeping does not ride in the window's commit. It lands in the existing commit the platform writes when a person opens the project ('chore(joy): project files refreshed by joy X', sync.rs reconcile_and_commit), which runs before the window, the same order as the CLI's joy update (joyint-forge-test: b09dcd3 before the yes). No second commit path was added.

    Tests: joy-chat-store update::tests::a_server_clone_gets_the_bookkeeping_and_no_hooks (fails without the change); platform sync::tests::an_old_security_md_is_brought_up_to_date_for_the_person_who_opened_the_project (fails without the change); the platform fixture a_clone_with_a_reconcile_pending now carries a SECURITY.md as the CLI's joy init leaves it. joy-chat-store, joy-core update, joy-cli member_fixtures and platform sync:: green; clippy clean. Not run: the web e2e repro named in Acceptance, the full joy and platform suites.
