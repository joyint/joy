description: |-
  open/seal/recipients in joy-chat carried the whole chat model without unit tests of their own; the only proof was a throwaway probe and app journeys in which no chat ever had an AI in it. That is how JAPP-0161-DC (an addressed AI holds no key) could ship.

  Covers the cycle in one process: a human seals, another participant opens, an outsider reads nothing, the everyone convention, a participant without a key, a refused seal for nobody, two writers converging, and a re-save adding no bytes.
