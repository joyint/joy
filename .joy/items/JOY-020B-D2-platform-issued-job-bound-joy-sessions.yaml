description: 'The job agent''s joy CLI inside the container must act as ai:<member> and pass the Guard auth wall without an operator token (AI Automation track, ADR-038: the job is the unit of grant, no TTL, validity state-based on the job lifecycle). Design + implement how the platform mints a session env for the duration of an attempt: bound to the job item (assignee + in-progress status checked at use), revoked by the attempt ending. Prereq for real ACP agents writing item state via CLI in joywork; the mock needs none.'
