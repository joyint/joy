description: |-
  **Status:** Proposed (2026-03)

  ## Context

  Joy generates AI instruction files (CLAUDE.md, QWEN.md, etc.) that tell AI tools how to work with Joy. These files contain session start procedures, identity rules, capabilities, workflow transitions, gates, commands, and behavioral rules.

  Research (docs/dev/research/ai/instructions/2026-03-31.md) confirms that Anthropic recommends a maximum of 200 lines per CLAUDE.md file. Beyond this, instruction adherence drops because important rules get lost in the noise. HumanLayer independently confirms a \~150-200 instruction budget for frontier LLMs, with the system prompt consuming approximately 50 of those.

  Joy needs to support two distinct contexts for AI tools:


  1. **Tool mode**: A developer uses an AI tool interactively. The AI asks questions, proposes approaches, and waits for human confirmation. This is the current behavior.
  2. **Automation mode**: The Joy Executor dispatches work to an AI tool without a human in the chat. The AI communicates via Joy comments, waits for assignee approval on items, and works within its assigned capability and interaction mode.

  These contexts have contradictory instructions ("ask the user" vs "comment on the item and wait for assignee response"). Combining them into a single instruction file would both exceed the 200-line limit and create conflicting directives.

  ## Decision

  ### 200-line quality gate

  All generated AI instruction files must stay under 200 lines. This applies to the rendered output, not the templates.

  Enforcement:

  * CI check on rendered output line count
  * Manual review during template changes
  * Re-evaluate the limit every 3-4 months as AI tool capabilities evolve (next review: 2026-07-01)

  If evidence emerges that the limit should be adjusted (higher or lower), update this ADR.

  ### Separate instruction templates per mode

  ```
  templates/ai/instructions/tool.md        -- interactive tool mode (default)
  templates/ai/instructions/automation.md  -- executor/automation mode
  ```

  Shared content (workflow, capabilities, gates, commit rules) is extracted into includable blocks to avoid duplication between the two templates.

  ### `joy ai setup` mode parameter

  `joy ai setup` generates tool mode by default (the common case for a developer running the command). Automation mode is an explicit parameter:

  ```
  joy ai setup                    -- tool mode (default)
  joy ai setup --mode automation  -- automation mode
  joy ai setup --mode tool        -- explicit tool mode
  ```

  The mode only determines which instruction files are generated. It is not stored in project configuration -- the same repository can have tool instructions in a developer's local checkout and automation instructions in the Executor's checkout. The mode is encoded in the generated file header (e.g. `Generated by Joy 0.7.0, ai tool mode`) so that `joy ai check` can detect which mode is installed without requiring config state.

  ### Mode-specific behavioral differences

  Each interaction level (autonomous, supervised, collaborative, interactive, pairing) behaves differently depending on the mode:

  | Level | Tool mode | Automation mode |
  |-------|-----------|-----------------|
  | autonomous | Works independently, stops at gates | Works independently, stops at gates |
  | supervised | Confirms irreversible actions with user | Creates notification for irreversible actions |
  | collaborative | Proposes approach, waits for user | Comments plan on item, waits for assignee |
  | interactive | Presents options, waits for decision | Comments options, waits for assignee decision |
  | pairing | Step-by-step in chat with user | Step-by-step via comments, waits after each step |

  These behavioral definitions are part of the instruction templates, not the capability files or agent definitions. The capabilities define *what* (permissions, constraints), the instructions define *how* (communication pattern per mode and context).

  ## Consequences

  ### Positive

  * **Adherence stays high.** Each instruction file is focused on one context, well within the 200-line budget.
  * **No contradictions.** "Ask the user" and "comment on the item" never appear in the same file.
  * **Clean separation.** Tool mode and automation mode are distinct use cases with distinct instruction sets.
  * **Quality gate is measurable.** Line count is objective and automatable.

  ### Negative

  * **Two templates to maintain.** Changes to shared content (workflow, capabilities) must be reflected in both. Mitigated by extractable shared blocks.
  * **Mode must be chosen at setup time.** Switching from tool to automation requires re-running `joy ai setup --mode automation`. This is intentional, not a limitation.

  ### Neutral

  * The 200-line limit is based on current research (2026-03). It may change as AI tools improve their instruction processing. The quarterly review cycle accounts for this.
  * Agent definitions (`.claude/agents/*.md`) are not affected by this decision. They are loaded on demand, not as part of the base instructions.

  (Relocated from umbrella JI-010F-79 as part of the JI-0120 architecture reconciliation.)
