description: |-
  joy/.github/workflows/ci.yaml currently runs fmt/lint/test/build only on ubuntu-latest. This is why the Windows path bug (JOY-01A2-96) was never caught: joy-core is never compiled or tested on Windows in CI.

  Add an OS matrix to the test (and build) jobs: runs-on matrix.os over [ubuntu-latest, windows-latest]. fmt and lint can stay ubuntu-only (formatting and clippy are platform-neutral). Keep the sibling joyint/crypt checkout step (path dependency) on both OSes; 'cargo test --workspace' is otherwise identical. This gives real windows-latest verification for the JOY-01A2-96 fix (including the new crates/joy-core/tests/platform_state_dir.rs native-branch roundtrip) and guards the whole codebase against future Windows regressions.

  Acceptance: a green windows-latest test run that includes native_state_dir_roundtrip_lands_under_home_base.
