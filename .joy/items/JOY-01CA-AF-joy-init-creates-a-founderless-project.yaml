description: |-
  Repro: in a repo with no git user.email, run joy init; then set git config user.email; then joy project member add <self> -> 'Error: <email> is not a registered project member'. Reversing the order (git identity first, then joy init) works.

  Root cause: init registers the founding member from git user.email (or --user) at init time, but silently skips it when neither is available, leaving a member-less project. joy project member add then fails because it signs the new member's attestation with the CALLER's keypair (derive_acting_keypair), and the caller is not a member yet -- a chicken-and-egg with no escape, since re-running joy init only sets up the local environment ('already initialized') and never registers the missing founder.

  Fix (founder bootstrap belongs to init and must be robust):
  1. Fail-fast: a fresh joy init with no git user.email and no --user aborts before writing any files, with guidance (set git config user.email / pass --user).
  2. Self-heal: re-running joy init on an already-initialized but member-less project registers the founder from the now-available identity (git email or --user) and persists it -- matching the user's intuition that re-running init fixes it.

  Add a bats regression test for the exact sequence: init without identity, set identity, recover.
