  text: |-
    Fixed in commands/ai.rs reset() + joy_core session helper.

    - project.yaml member change is computed separately from local config cleanup; a member is removed only when orphaned (no delegation remains), driven by delegations, not by the presence of config files.
    - reset drops only the caller's own delegation; the shared member entry is kept while any other operator still delegates it.
    - any project.yaml mutation now requires [y/N]; a non-interactive run refuses instead of mutating silently (needs --force), same is_interactive rule as init.
    - active session on the target member is surfaced as a warning in the plan.
    - ai_delegations are cleaned up on member removal, so no dangling entry is left (the leak from the old orphaned path).
    - new joy_core::auth::session::has_active_session.

    Tests: 5 unit tests for plan_member_reset (decision matrix) + 3 e2e bats in ai_reset_member_safety.bats; ai_init_reset_ownership.bats still green. joy-core 379 + joy-cli 122 tests green; clippy -D warnings clean.
