description: |-
  joy ai reset --tool <t> removes the AI member (e.g. ai:claude@joy) from the versioned project.yaml, not just local per-developer config files, and in the 'no local files' branch it does so with no confirmation at all.

  Two defects in commands/ai.rs reset():
  1. The 'orphaned member' branch (no config files present) removes the member from project.yaml without a [y/N] prompt, and leaves the ai_delegations entries dangling (does not clean them up). 'Orphaned' is wrongly inferred from the absence of local config files, not from the absence of delegations.
  2. The main branch's [y/N] only covers file deletion; the member is removed as a side effect, even when it is actively delegated and carries a live session.

  Root cause: reset conflates per-developer local config cleanup with mutation of shared, versioned project state (the member entry in project.yaml).

  Fix direction:
  - Define 'orphaned' by delegations, not by files: a member is removable only when no ai_delegations reference it.
  - reset removes only the caller's own delegation; keep the member entry while any delegation remains.
  - Any project.yaml mutation must be confirmed ([y/N]); non-interactive runs require --force/--yes (same is_interactive rule as init).
  - Refuse or explicitly warn when the target member has an active (unexpired) session.
  - When a member is removed, also clean up its ai_delegations across all members (fix the dangling-delegation leak).
  - Removing a shared member entry should be consistent with joy project member rm.

  Repro: in a project with ai:claude@joy delegated and an active session, run 'joy ai reset --tool claude' after the local .claude config was already gone; the member disappears from project.yaml with no prompt while the operator's delegation keypair stays.
