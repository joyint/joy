  text: |-
    Plan:
    - `crates/joy-cli/src/main.rs`: add `session: Option<String>` field on `Cli` with `global = true`, `long = "session"`, `value_name = "SESSION"`, help text noting precedence over JOY_SESSION.
    - After `Cli::parse_from`, before the working-dir block: if `cli.session.is_some()`, call `std::env::set_var("JOY_SESSION", value)`. This keeps `joy-core/src/identity.rs` and `crypt_session.rs` unchanged -- both already read JOY_SESSION.
    - Test (tests/): integration test verifying `joy --session <value> add ...` succeeds with the same session as `JOY_SESSION=<value> joy add ...`. Existing tests under tests/ should cover the structure; pick the most similar fixture.

    Out of scope (deferred to JOY-0181-95): tutorial doc updates.
