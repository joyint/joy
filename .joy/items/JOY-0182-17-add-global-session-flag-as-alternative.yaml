description: |-
  Currently the session credential must be passed via the `JOY_SESSION` env var. For AI tool runners that spawn a fresh shell per command (e.g. Claude Code's Bash tool) and for users configuring tool permission allowlists, an inline flag is materially easier -- `joy *` covers all calls, whereas the env var approach requires either persistent shell state or allowing `JOY_SESSION=* joy *` patterns.

  Add a global `--session <SESSION>` flag with precedence over `JOY_SESSION`. The flag is not a replacement for token redemption: `joy auth --token <TOKEN> --json` remains the way to obtain a session from a delegation token (the redemption step is a real security boundary -- crypto binding, granular revocation, audit, expose-minimisation, performance). `--session` only changes how the resulting session is passed to subsequent commands.

  Precedence: `--session` > `JOY_SESSION` > error.

  Document in `joy ai tutorial` (see JOY-0181-95) as the recommended pattern for AI tools. Security note: session value appears in `ps` output when passed as flag; document the tradeoff and that the env-var path remains for environments where that matters.
