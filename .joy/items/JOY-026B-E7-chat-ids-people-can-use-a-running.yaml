description: 'Today a chat id is a 32-hex string (''2902d005c323929221263104f8aac38a''); ''joy chat ls'' is dominated by it and every command needs it. Horst, 2026-08-29: number the chats like jyn does (1, 2, 3 ...), give them a joy-style id as well (e.g. MPS-CHAT-0001-AB, with the short forms 1 or 1-AB accepted), and accept the name too; ''send'' and friends take any of the three. The number also goes into the app''s rail instead of the meaningless ''#'' (JAPP story), and later a short command switches chats by number. The favourite is the number; the combination of number, joy id and name is the goal.'
