description: 'Today a chat id is a 32-hex string (''2902d005c323929221263104f8aac38a''); ''joy chat ls'' is dominated by it and every command needs it. Horst, 2026-08-29: number the chats like jyn does (1, 2, 3 ...), give them a joy-style id as well (e.g. MPS-CHAT-0001-AB, with the short forms 1 or 1-AB accepted), and accept the name too; ''send'' and friends take any of the three. The number also goes into the app''s rail instead of the meaningless ''#'' (JAPP story), and later a short command switches chats by number. The favourite is the number; the combination of number, joy id and name is the goal.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-08-29T06:50:46.072547660Z
  text: 'Decision Horst 2026-08-29: chats get ADR-027 ids with the type segment CHAT (MPS-CHAT-0001-AB), generated by joy-core''s item id mechanism. Display follows jyn''s JOT-002F-4D exactly, minus the ''#'': the counter without prefix, zeros and suffix (''1''), the suffix only when two chats share a counter (''2-AB'', ''2-BC''). ''joy chat ls'' lists the full id; every chat command accepts 1, 0001, MPS-CHAT-0001, the full id, or the name (general stays). Existing chats are numbered in creation order on the first run after the update. The ''#'' is out everywhere (PowerShell reads it as a comment).'
