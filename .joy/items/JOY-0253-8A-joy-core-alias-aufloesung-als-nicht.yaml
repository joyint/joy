description: 'An der einen Trichterstelle (privacy::member_key_for_email-Aufrufer: identity.rs, enroll, login, guard-Pfade): trifft die Git-Adresse kein Mitglied, claims-Frage an registrierte Forge-Plugins ueber die Remote-URLs, dann identity-Frage ans zustaendige Plugin, gelieferte Kandidaten stumpf durch dieselbe Member-Aufloesung. Ergebnis pro Lauf gecacht. Ohne Remotes/Plugins/Zustaendigkeit: Verhalten unveraendert (lokale Repos!). Scheitert die Aufloesung trotz erkanntem Kandidaten, ehrliche Anweisung statt ''kein Mitglied''-Raetsel. Git-Autor bleibt unangetastet. --user-Reparatur: Sitzung wird unter dem aufgeloesten Schluessel abgelegt UND gesucht (heute: Ablage primaer, Suche Alias, auth.rs:1479 reicht --user nicht durch).'
