description: 'joy release bump today fails with ''no occurrences of X.Y.Z found in configured files'' when a file''s version drifts away from joy''s release ledger (common when a scaffolded template starts at 0.1.0, npm version was run by hand, etc.). The error does not say which file has what, and there is no built-in way to adopt the file''s version as the new baseline. Two changes: (1) vertical, narrow-terminal-friendly error format that lists each file''s actually-detected version next to the expected one (heuristic: ''version = "X.Y.Z"'' or ''"version": "X.Y.Z"'' line, else first quoted SemVer in the file); (2) new --adopt flag on ''joy release bump'' that detects the version in the configured files and uses it as the baseline. Requires all configured files to agree on the detected version; errors clearly when they disagree or none is detectable.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-17T17:44:06.618900569Z
  text: 'Plan: (1) Add detect_version(path) helper to joy-cli/src/version_bump.rs: try the line-anchored package-version patterns first (''version = "X.Y.Z"'' for Cargo.toml-style, ''"version": "X.Y.Z"'' for package.json-style), fall back to the first quoted SemVer in the file. Returns Option<String>. (2) Add --adopt flag to BumpArgs. When set: scan all configured files, collect distinct detected versions; require exactly one; on success use it as the baseline for resolve_version (instead of the ledger / git tag). Errors when files disagree or no version is detectable. (3) Rewrite the bump error path with the agreed vertical layout: per-file ''expected/found'' block then ''Error: version mismatch (N of M files)'' then a ''Fix options:'' section with ''joy release bump --adopt'' and ''joy release record <detected>''. The ''detected'' value comes from the same detection helper (use the first file''s detected version, or omit the record hint if detection failed everywhere). (4) Bats tests: --adopt happy path, --adopt with disagreeing files, --adopt with no detectable version, mismatch error includes the detected version, mismatch error stays clean when detection fails. Vertical format keeps every line under ~55 chars on narrow terminals.'
