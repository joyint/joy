description: |-
  2026-11-26, three times in one day: 'just publish' ran 'joy release publish', which created the GitHub release at once; the Release workflow uploads the installers about ten minutes later. In between releases/latest/download/joy-cli-installer.sh answers 404, so every joy-merge check (platform#89) and the website's installer check on the umbrella's main (runs 45794408979, 45795903444) fail. The release.yml host step already creates the release WITH its artifacts when none exists. So joy's own publish pushes the tag only (--forge none) and the workflow creates the release in one step, with joy's notes, which the annotated tag carries (release record writes them as the tag message). Until then releases/latest stays the previous release, which has its downloads.

  ---
  IMPLEMENTIERT: just publish nutzt --forge none und der Release-Workflow (release.yml:561) erstellt das Release erst mit den Artefakten, sodass kein Release als 'Latest' erscheint, bevor die Downloads existieren. Siehe auch justfile:781.
