description: |-
  All joy-cli commands need a --json flag for structured output, required by Jon (subprocess) and gRPC service (ADR-031). Implements ADR-036 §1: machine-readable output as the contract surface for CIs and downstream tooling.

  This item covers the central infrastructure and serves as tracking parent for one subtask per subcommand:

  - top-level --json flag (clap), valid at any position (joy --json ls, joy ls --json, etc.)
  - OutputMode enum (Display | Json) threaded into each commands run()
  - json::Envelope helper that wraps every payload as {"version": 1, "data": ...} and prints it
  - subcommand subtasks (parent=JOY-00C9-5F): ls, show, board, deps, find, log, milestone, project, config, auth status, ai status, release (read); add, edit, comment, assign, rm, status, deps modify, milestone link, ai init, auth, project member (write)

  Schema contract: additive-only between minor versions; breaking changes get a deprecation cycle and a release note (ADR-036 §1).
