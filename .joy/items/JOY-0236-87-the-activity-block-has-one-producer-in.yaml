description: 'JI-0179-4F step 3, the joy half. joy_ai::activity owns the v1 details shape the thread renders: thoughts, tool calls with their last status (normalized lowercase), answered permission round-trips. Three producers existed before: the platform chat lanes, the platform job rounds, and the desktop TypeScript, which rebuilt the shape from streamed events and handed it back down; a platform test tried to keep the copies equal by hand. Both platform builders delegate now, the desktop Rust side collects into this type during the streamed turn, and TypeScript keeps only the parser and the live view.'
