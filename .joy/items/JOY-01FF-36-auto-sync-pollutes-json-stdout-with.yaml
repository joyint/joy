  text: '[x] Fixed. run_full_sync gained a verbose flag; auto_sync_repo passes false so the summary no longer reaches stdout, the explicit joy update passes true (unchanged). Verified with the full local just check (rustc 1.97): fmt-check, clippy -D warnings, all unit/cmd tests, and 526 bats tests pass including the new ''auto-sync keeps --json stdout clean'' regression test. Manual e2e: joy --json auth status stdout stays parseable JSON during a forced auto-sync.'
