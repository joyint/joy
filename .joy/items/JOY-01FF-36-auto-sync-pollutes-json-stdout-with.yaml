description: 'auto_sync_repo (crates/joy-cli/src/lib.rs) runs run_full_sync on the first invocation after a joy upgrade, which prints its per-item summary to stdout via println!. Under --json this corrupts the payload: e.g. joy --json auth status emits the ''Repo state / version marker stamped'' table before the JSON object, so JSON.parse fails for any --json consumer (VS Code extension, AI tools). The ''synced this repo'' banner is already on stderr (eprintln). Fix: the incidental auto-sync summary must not go to stdout; run it quietly during auto-sync (the stderr banner already signals the sync), keep the explicit joy update verbose.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-07-11T13:02:42.022627Z
  text: 'Plan: add a verbose flag to run_full_sync; gate the println! summary on it. auto_sync_repo passes false (quiet, stdout stays clean for --json; the eprintln ''synced this repo'' banner remains), the explicit joy update command passes true (unchanged). Verify with a bats test asserting joy --json auth status stdout is parseable JSON right after a forced stale marker.'
