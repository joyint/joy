- author: ai:agy@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-21T10:42:18.975367Z
  text: |-
    Plan:
    1. SemVer-Parsing & Bumping (crates/joy-core/src/model/release.rs, crates/joy-core/src/releases.rs):
       - Robustes SemVer 2.0 Parsing und Bumping (unter Einbindung des semver Crates).
       - Unterstützung eines optionalen Prerelease-Labels (z. B. 'alpha', 'beta', 'rc1') bei Keyword-Bumps:
         - '0.4.0' + minor + 'alpha' -> 'v0.5.0-alpha'
         - Wenn die Basis bereits ein Prerelease ist (z. B. 'v0.5.0-alpha' oder 'v0.5.0-rc1') und ein Keyword-Bump ohne Prerelease aufgerufen wird (z. B. patch/minor): Graduierung zur stabilen Version 'v0.5.0'.
         - Wenn ein neues Prerelease-Label übergeben wird: Übergang z. B. zu 'v0.5.0-beta'.
    2. SemVer Sortierung & Precedence (crates/joy-core/src/releases.rs):
       - Upgrade von semver_key auf SemVer 2.0 Rangfolge (Normalversion > Prerelease: 0.5.0 > 0.5.0-rc1 > 0.5.0-beta > 0.5.0-alpha).
       - Garantiert deterministische Sortierung für latest_version, joy release ls und joy release show.
    3. Strikte Validierung expliziter Versionen (crates/joy-core/src/releases.rs):
       - Validierung expliziter Versionen mit klarer Fehlermeldung bei ungültigem Format (z. B. '9lives').
    4. CLI-Erweiterung (crates/joy-cli/src/commands/release.rs):
       - 'joy release bump <bump> [prerelease]' und 'joy release record <bump> [prerelease]' unterstützen optionales Prerelease-Argument.
    5. Item-Rollup bei finalem Release Record (crates/joy-cli/src/commands/release.rs & event_log):
       - Bei der Aufzeichnung eines finalen Releases nach vorangegangenen Prereleases desselben Zyklus (z. B. 0.5.0 nach 0.5.0-rc1): Ermittlung des Cutoffs vor dem ersten Prerelease des Zyklus, sodass alle geschlossenen Items und Contributors der Alpha-/Beta-/RC-Phasen vollständig im finalen Release-Record enthalten sind.
    6. Justfile-Anpassungen (joy/justfile, umbrella justfile):
       - 'release bump="patch" prerelease="":' und 'release-all bump="patch" prerelease="":'
       - Weiterleitung des prerelease-Parameters an joy release bump und joy release record.
    7. Tests & Verifikation:
       - Umfangreiche Tests für Bump-Logik, Prereleases, Graduierung, Sortierung und Item-Rollup.
       - Verifikation mit 'just check'.
