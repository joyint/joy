  date: 2026-05-03T16:30:59.511347Z
  text: 'Done: schema gains seed_wrap_passphrase, seed_wrap_recovery on Member. joy auth init generates random seed and recovery key, wraps seed under passphrase KEK and recovery KEK, displays recovery key once. joy auth (passphrase path) prefers wrapped path; legacy entries trigger lazy migration to wrapped-seed (preserves keypair: legacy derived_key becomes the seed). joy auth recover --recovery-key restores passphrase access via recovery key. joy auth recover --regenerate-key rotates recovery wrap. joy auth passphrase preserves keypair across rotation (only seed_wrap_passphrase changes). joy auth --otp also onboards via wrapped seed. ai_init/project_member/token_add/token_rm/ai_rotate use the new joy_core::auth::unlock_identity helper that handles both wrapped and legacy states. derive_delegation_seed signature updated to take seed bytes per ADR-039. 8 new joy-core unit tests + 4 new bats integration tests; existing 285 bats tests still green. Test for legacy-state lazy migration deferred to Rust unit tests (constructing a real legacy state from bats requires reproducing Argon2id parameters).'
