description: 'Implements the wrapped-seed identity model per ADR-039: random per-member seed encrypted under a passphrase-derived KEK and a recovery-key-derived KEK, both AES-256-GCM, stored as seed_wrap_passphrase and seed_wrap_recovery in project.yaml. Includes joy auth init that generates and displays the recovery key once, joy auth recover --recovery-key for passphrase-loss recovery, and joy auth recover --regenerate-key for recovery-key rotation. Foundation for all other Crypt work; the identity keypair stays stable across passphrase changes so Crypt zone wraps remain valid.'
