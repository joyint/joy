description: |-
  commands/add.rs only enforces ID uniqueness (line 124, --id collision). Two items with identical titles can be created via repeated 'joy add task "Foo"' without any warning. Downstream pain: AI agents that resolve a parent epic by title (joy ls | grep) pick the wrong match silently.

  Fix:
  - Detect existing items with the same (case-insensitive) title at add time.
  - Default behaviour: warn 'an item with this title already exists: <ID>; pass --allow-duplicate to create anyway' and abort.
  - --allow-duplicate flag for the rare case where it is desired.
