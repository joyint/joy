description: 'Operator validation 2026-07-26: in a chat with several participants, an AI answered a message that explicitly mentioned somebody else. Cause: joy_ai::chat_turns::decide lets an AI take the turn on two conditions, solo (one human, one AI) and follow_up (the last other text author was this AI), and NEITHER of them looks at whether the new message mentions a different member. A mention of someone else does not stop the previous speaker from answering. Operator rule 2026-07-27, replacing both branches: no matter whether the chat is 1:1 or n:n, a new message that does NOT start with an @mention always belongs to the sender of the last message; if that was an AI member, that AI answers, and only that one. No other logic, no other rule. A message that DOES start with a mention goes to the mentioned member. This is not a stricter rule but a clearer one, and it removes the solo/follow_up special cases entirely.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-07-27T10:40:52.764779742Z
  text: 'Fixed in e686477. decide() now has ONE rule: leading @names address exactly those members, no leading @name addresses the last other speaker, nobody else in either case. mentions::leading_mentions is the new primitive next to the unchanged mentions(); add_mentioned_ais follows the same line, so a referred-to AI is not pulled into the room. Consequence to know: the first message of a fresh chat has no last speaker and therefore needs an @name, which is also what pulls the AI in. The 1:1 special case is gone. Three tests pin it: the leading mention of someone else silences the previous speaker, a mid-sentence mention refers without addressing, and the first message of a 1:1 stays silent until it names someone.'
