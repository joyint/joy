description: 'JOY-01AA-9E made ai_setup::update_gitignore write the full fixed set (base entries plus every tool''s ignore entries) so joy ai init no longer drops tool lines. The joy update path was not aligned: GitignoreBlockItem in crates/joy-cli/src/update_registry.rs checks and refreshes the managed block against GITIGNORE_BASE_ENTRIES only, and its refresh calls update_gitignore_block(root, GITIGNORE_BASE_ENTRIES), which replaces the whole block and drops the per-tool entries (.claude/, .vibe/, AGENTS.md, .qwen/, .github/copilot*). They are only restored when a tool is stale (AiToolItem::fix -> sync_gitignore_for_configured_tools). So on any repo whose AI tools are up to date, joy update un-ignores the local AI scaffolding, and joy update --check still reports the block OK because it only checks the base entries. Fix: GitignoreBlockItem must manage the same canonical set as update_gitignore.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-07-11T10:23:49.971618Z
  text: 'Plan: centralise the managed-block entry set in ai_setup as a public managed_gitignore_entries() (base + all TOOL_GITIGNORE_ENTRIES), have update_gitignore use it, and point GitignoreBlockItem check + refresh at it (refresh via ai_setup::update_gitignore). Add a regression test asserting the set contains the tool entries and that a refresh writes them. Follow-up to JOY-01AA-9E, which only fixed the joy ai init writer.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-07-11T10:28:13.694512Z
  text: '[x] Fixed. Added ai_setup::managed_gitignore_entries() as the single source of truth (base + all TOOL_GITIGNORE_ENTRIES); update_gitignore now derives from it, and GitignoreBlockItem (joy update check + refresh) uses it instead of GITIGNORE_BASE_ENTRIES, so joy update no longer strips the per-tool lines. Added a regression test. Verified: cargo check + 23 ai_setup tests + joy-cli update tests pass; the fixed binary''s joy update --check now reports the .gitignore block out of date on a repo whose managed block lacks the tool entries (was a false OK before).'
