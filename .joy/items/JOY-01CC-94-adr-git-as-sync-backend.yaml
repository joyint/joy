description: |
  **Status:** Accepted (revised 2026-06-15)

  ## Context

  Joy needs to sync project state between machines and collaborators. The choice is between a custom database with a custom sync protocol, or using the version control system that already holds the data.

  ## Decision

  Git is the sync backend for joy-core. There is no custom sync protocol and no application database.

  - The `.joy/` YAML files are already versioned with Git.
  - CLI users sync via `git push` / `git pull`; no server is required.
  - The merge strategy is last-write-wins with file-level conflict detection. Project-management data (status, priority, assignment) does not merge well with three-way merge; Git's conflict markers cover the rare concurrent edit. See the YAML-aware merge decision (JOY-01CF-48).

  How the server side hosts repositories and where the canonical copy lives is out of scope for joy-core and is defined by the platform (see JP-002D-FF for the runtime and sync model, and JP-002F-B1 for the transport).

  ## Consequences

  Greatly reduced complexity: no database, no custom sync code, no migration tooling. Self-hosting is trivial; any Git remote works for basic CLI sync. Trade-off: Git is not optimized for frequent small writes from many concurrent users, which is acceptable at the target scale (teams of 1 to 50).

  ## Revision (2026-06-15, JI-0120 joy pass)

  Trimmed to the joy-core decision. Removed the server-side description (Git-gateway-plus-cron, REST API, CalDAV bridge, and the bring-your-own-Git wording), which predated the platform's current container and sync model and belongs to the platform, not to joy. Replaced the dead cross-reference (the former JP-002F-B1 is now JP-002F-B1).
