  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j0d, 5 commits; merged into feat/forge-connection-ng by the integrator).\n\nBoth must_fix items are fixed in the design and all six should_fix items are fixed in the code, so nothing is deferred. D2.7a no longer claims the platform sends no Gitea scope: it records that it did before Wave 2 (AccessTokenScopeAll, full rights), that P9 corrected it, and it cites the code that proves it, Instance::scopes at platform/src/auth/providers.rs:538-548 and authorize_url at :818-840, with P4's Work line noting the half that already landed. J5's Depends on line no longer promises that J3 fills the oracle interface later; it now says what D2.10 says, that the connector half has no verb in D2.4 and none in JI-0191-99, so the hook stays empty and J5 is accepted that way, and touch up entry 4 records the correction. In crates/joy-core/tests/publish_order.rs the third hold's condition became the pure function version_moves_with_the_bump with its own four case test, so a crate that both sits in release.version-files and inherits its version can no longer short circuit past a root manifest that is in no list. In the justfile the pre-flight now takes the majority version instead of the first crate's, so the diagnostic names the crate that is behind rather than every crate except it; both cargo pkgid substitutions end in || true, so the empty version guard is reachable under set -euo pipefail instead of killing the recipe silently; and a failed just check restores Cargo.toml as well as crates/ and Cargo.lock, the file that now carries three crate versions. Two facts that only lived in a report are now durable: the per crate cargo publish --dry-run table for all thirteen crates (four green, nine failing on the state of the registry and none on the order, with cargo's messages) and the warning that the next successful publish-crates claims seven crates.io names that h\n\nAcceptance:\n- [met] Item (1): decide per crate whether it is published in order or marked publish = false, and remove the release breaker where joy-cl: joy-telemetry is published, in the list between joy-bi and joy-forge-net, with the reason in the justfile comment and the test header: cargo resolves a version+path dependency against crates.io when it packages joy-cli, \n- [met] Item (1) proof: prove the order with cargo publish --dry-run where the registry allows, recording what could not be proven offline: All thirteen were run per crate; four are green and nine fail on the state of the registry, not on the order. The crate by crate result with cargo's messages now sits in the publish-crates comment and in the publish_orde\n- [met] Item (2): D2.7a and the P4 acceptance line say the Gitea default set is write:user write:repository: D2.7a now also states the true present tense and the right citation: Instance::scopes at platform/src/auth/providers.rs:538-548 and authorize_url at :818-840, with the pre-Wave-2 AccessTokenScopeAll state named as past. \n- [met] Item (2): D4.1a and D5 gain the ListSessions and RevokeSession pair P3 built: D4.1a carries the pair with the opaque handle (SHA-256 of the session id, never the id), the current and desktop flags, the idempotent revoke, the one poll bound and the device label P7 supplies; D5 carries the same in o\n- [met] Item (2): the desktop release path is excluded from G3 in writing until J6 lands or the app moves onto forge::commit_index and tag: D4.5 carries the exclusion with the call list per half (release_ops.rs:347-352 and :571-600), the two ways it ends, the matching sentence in app/ARCHITECTURE.md:71-80, a new journey row in section 3, and W2's acceptance \n- [met] Item (3): name the owner of the D2.10 rate limit oracle (A5 for the desktop, P2 for the platform): D2.10 names A5 and P2 as the only two installing hosts and says why no other host does; A5's and P2's blocks carry it, P2 in its acceptance. The design also records that the connector half has no verb and therefore no ow\n- [met] Must fix 1: the D2.7a sentence no longer asserts a broken state that no longer exists, nor cites unrelated code: docs/design/forge-connection-ng.md:529, verified against the shared Wave 2 worktree (Instance::scopes returns \"write:user write:repository\" for Forge::Gitea; :331-339 is by_provider plus the for_repo_url doc comment)\n- [met] Must fix 2: the design says one thing about who fills the oracle's connector half: J5's Depends on line, D2.10 and touch up entry 4 now agree: the hook stays empty, no package fills it, and naming the verb in JI-0191-99 is the first step. I re-checked both halves of the claim: D2.4's verb catalogue has\n- [met] Should fix 1: the inheritance arm of every_published_crate_has_its_version_bumped cannot be short circuited: The decision is the pure function version_moves_with_the_bump(inherits, own_is_bumped, root_is_bumped), if inherits { root_is_bumped } else { own_is_bumped }, with a4-case unit test, because the real tree carries no crat\n- [met] Should fix 2: the pre-flight diagnostic points at the crate that is behind: expected is the version the majority of the resolved list carries, computed with sort | uniq -c | sort -k1,1nr; proven with the stubbed harness for a stale first crate and a stale last crate\n- [met] Should fix 3: a failed just check rolls the root manifest back too: git restore Cargo.toml crates/ Cargo.lock, with the reason in a comment: that file carries the [workspace.package] version three crates inherit and the joy-* pins of [workspace.dependencies]\n- [met] Should fix 4: the empty version guard is reachable under set -euo pipefail: Both cargo pkgid substitutions end in || true, in the pre-flight and in the pre-existing publish loop; the pre-flight also warns by name and the recipe refuses if no crate resolves at all\n- [met] Should fix 5: the per crate dry run result is a durable artefact: The full table with cargo's messages is in the publish-crates comment; the summary and the pointer are in the publish_order.rs header; the design touch up entry 5 says where it lives and why it lives there\n- [met] Should fix 6: the operator reads, before the first upload, that publish-crates claims permanent crates.io names: Stated in the justfile under \"FIRST UPLOAD, PERMANENT NAMES\", in the test header and in design entry 5. The check widened the finding: seven of the thirteen names have never been taken (joy-process, joy-bi, joy-telemetry\n- [met] Rules: git2 only, no new commands or flags, .joy untouched, no joy write command, no push, inside the worktree, no secrets in argv: No Rust code paths were touched at all, only a test, the justfile and the design; the justfile's own git calls are pre-existing tooling, not joy spawning git. .joy was read (release.version-files) and never written, no j\n\nOpen questions (carried to the closeout tasks or named follow ups):\n- The rate limit oracle stays unbuilt until a connector verb for GET /rate_limit is named in JI-0191-99. Decision 29 forbids inventing it here, so A5 and P2 install nothing and D2.10's local rules are the whole behaviour. That item edit is the operator's or JI's, not this package's\n- release.version-files in .joy/project.yaml still names none of crates/joy-process, crates/joy-forge-net, crates/joy-telemetry. The package fixed this from the other side (version.workspace = true against the root manifest, which is in the list) because no package may edit .joy. I\n- joy-model, joy-chat, joy-core, joy-chat-store, joy-ai and joy-cli are already on crates.io at 0.20.0, which is the version in this tree, so the next release has to bump before publish-crates can upload anything at all. Nothing in the repository states that the current version is \n- The first successful publish-crates claims seven permanent crates.io names. The decision is named in the justfile where the operator will read it, but nobody has taken it yet."
