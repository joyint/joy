description: |-
  The trycmd snapshot crates/joy-cli/tests/cmd/help.toml hardcodes 'Usage: joy [OPTIONS] [COMMAND]'. On Windows the binary is joy.exe, so clap prints 'Usage: joy.exe ...' which trycmd normalizes to 'joy[EXE] ...'. The snapshot (authored on Linux) has plain 'joy', so cli_tests fails on windows-latest. Pre-existing latent bug, surfaced for the first time by the new Windows CI matrix (JOY-01A4-5B); unrelated to the path fix (JOY-01A2-96).

  Because cargo test is not run with --no-fail-fast, this failure aborts the whole joy-core test run before the new platform_state_dir integration test executes -- so the Windows path fix is currently unverified on CI purely due to this snapshot.

  Fix: change the Usage line in help.toml to 'Usage: joy[EXE] [OPTIONS] [COMMAND]'. trycmd substitutes [EXE] with '' on Unix and '.exe' on Windows, so the snapshot matches on both. Verify no other hardcoded 'joy ' invocations in the cmd snapshots need the same treatment.
