- review
effort: 2
created_by: ai:qwen@joy
created: 2026-03-31T23:53:49.190175923Z
updated: 2026-08-31T15:19:45.861017967Z
updated_by: ai:claude@joy delegated-by:horst.schwarz@joydev.com
description: 'The SKILL.md that Joy generates began with an HTML comment BEFORE the YAML frontmatter. Qwen Code''s parser expects the file to start with --- at line one, character one (its regex is anchored with ^), so the comment prevented the parsing. The fix is to move the HTML comment AFTER the frontmatter. Affected component: the Joy CLI''s SKILL.md template generation (ai setup, skill export). Test: generate the skill, copy it into .qwen/skills/, restart Qwen Code, and /skills joy should load. The skill does not have to live in ~/.qwen/skills/; the project-local .qwen/skills/ works too. Mistral Vibe is affected as well, because its skill parser also expects the frontmatter at the start of the file.'
