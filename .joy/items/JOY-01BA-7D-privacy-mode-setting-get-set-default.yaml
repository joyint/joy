  text: 'Plan: Add a project-level privacy setting (enum open|anonymous, default open) as the foundation for ADR-042. (1) model/project.rs: add PrivacyMode enum + Project.privacy field (serde default, skip_serializing_if None so default stays implicit). (2) project.defaults.yaml: privacy: open. (3) joy config get/set project.privacy: wire describe_value + field_hint + validation (only open|anonymous accepted). Default open = today''s behaviour, no behavioural change yet. (4) roundtrip + omitted-when-default unit tests. Implemented on branch feat/adr-042-privacy-mode (worktree project/joy-adr042), verified with cargo test / just check in joy.'
