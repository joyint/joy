description: 'Fund beim Backlog-Abgleich 2026-08-19 (Entscheidung Horst: die Plugins sollen oeffentlich nutzbar sein). Die drei neuen Workspace-Member stehen weder in der Publish-Liste des justfile noch auf publish = false, und auch nicht in release.version-files, wuerden also bei einem Release weder mitversioniert noch hochgeladen. Zu tun: Publish-Liste ergaenzen (joy-bi nach joy-core, die beiden Forge-Plugins ohne interne Abhaengigkeit), Metadaten publizierbar machen (license statt license-file mit Pfad ausserhalb der Kiste, repository und homepage wie bei den anderen, joy-bi braucht eine Version an seiner joy-core-Abhaengigkeit) und die Versionen an die Familie angleichen. Offen fuer den Operator: release.version-files in .joy/project.yaml um die drei Pfade erweitern, dafuer gibt es keinen CLI-Befehl.'
