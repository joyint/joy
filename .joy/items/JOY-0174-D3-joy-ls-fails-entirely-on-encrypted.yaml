description: |-
  When the project contains an encrypted item in a zone the acting member has no wrap for, items::load_items walks .joy/items/*.yaml and calls store::read_yaml on every file. read_yaml's JOYCRYPT path returns ZoneAccessDenied for the inaccessible zone; load_items propagates the error via ?, so the entire 'joy ls' invocation aborts. The user cannot even see their plaintext items.

  Fix:
  - items::load_items_with_locked(root) returns (Vec<Item>, Vec<LockedItem>) where LockedItem carries id and zone, derived from filename and JOYCRYPT magic header (no decrypt).
  - items::load_items skips inaccessible encrypted items silently (treats them as not-found for that caller).
  - joy ls uses load_items_with_locked. Locked rows render with *** in TYP / STA / PRI / EFF columns and title '[Crypted in zone <name>]'.
