description: |-
  An AI below the autonomous level could file only SINGLE-LINE joy calls. Any `joy add --description "two\nlines"` was refused, and the refusal reached the person as the AI declining to act, with no reason given.

  `is_bare_joy_command` scanned the whole command line for chaining characters by substring, and "\n" was one of them. A line break inside a quoted argument therefore counted as a second command: `command_invokes_joy` returned false, the "a joy invocation is ALWAYS allowed" rule in `permission_decision` never fired, and `permission_decision(Plan, Mutating, false)` denied it. No human is attached to a chat turn, so a Deny is a rejection.

  Which adapter this hit was accident, not design. `command_invokes_joy` tries several candidates and takes any that matches: an argv array is represented by its program name alone ("joy", no newline in it), and a tool-call title is often a short single line. So one AI could file a multi-line item and the next could not, in the same project, on the same level.

  The scan now honours quoting. A newline inside quotes is text; every operator that genuinely starts another program still disqualifies, and substitution disqualifies inside double quotes too, where the shell still performs it. Single quotes make everything literal, and an unterminated quote counts as not plain, since it is not a string we can reason about.

  Found while the operator watched two AI members do the same thing with different outcomes (2026-09-09).
