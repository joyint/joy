  date: 2026-07-07T09:02:37.529738Z
  text: 'Done. joy-core now stores chats on refs/joy/chats via git2 (chat_ref module): per-message blobs under <id>/messages/ + <id>/meta.yaml, no working-tree checkout, three-way message-union merge (merge_refs). chats.rs delegates its four storage chokepoints; mutation/delete semantics unchanged. git2 pinned to statically-linked vendored-libgit2 (no external lib). 14 chat unit tests green. Working-tree general.yaml removed.'
