description: Part of JAPP-00DD-98 (app), implementing ADR JAPP-00DC-FC. joy-core gets a single chat-persistence module that reads and writes chat blobs on the dedicated ref refs/joy/chats through git2 (build tree, commit against the ref, update it) with no working-tree checkout. Append-only per message so merges union by message id; reuse merge_yaml_doc on blob contents. Expose one API for open/append/delete/rename/list that platform and the desktop app call. Working-branch .joy/chats files are removed.
