description: |-
  The Windows install script (get.joyint.com/joy.ps1) drops the binary into ~/.local/bin but does not modify the User-PATH automatically. It only prints a grey "Note: ... not on your PATH. Add: [Environment]::SetEnvironmentVariable(...)" hint that the user has to copy and run by hand. If the user misses it, `joy` invokes Windows joy.cpl (Game Controllers applet) via PATHEXT instead of the installed binary.

  Fix: have the installer set the User-PATH itself, idempotently, prepending $InstallDir so it wins over System-PATH (and therefore over joy.cpl in System32). Same SetEnvironmentVariable("Path", ..., "User") call, just executed by the script. Detect existing entry to stay idempotent. Print a single confirmation line and a "restart your terminal" hint at the end.

  Acceptance: a fresh Windows user running `irm get.joyint.com/joy.ps1 | iex` and then opening a new terminal can call `joy --version` without ever copying a PATH command. `joy.cpl` is shadowed in the new shell.
comments:
