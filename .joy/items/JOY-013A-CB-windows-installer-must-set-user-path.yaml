  date: 2026-04-30T21:36:26.057313327Z
  text: 'Plan: replace the manual ''Add: ...'' note with an automatic User-PATH set. Use [Environment]::GetEnvironmentVariable(''Path'',''User'') to read the User-scope PATH (not :Path which mixes User+System), prepend  if not already present, and SetEnvironmentVariable(''Path'', ..., ''User''). Same fix in jyn.ps1. WM_SETTINGCHANGE is broadcast automatically. Print ''User PATH updated'' line and a ''Restart your terminal'' hint.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-04-30T21:37:40.395220232Z
  text: '[x] joy.ps1 and jyn.ps1: replaced the manual ''Note: ... Add: ...'' hint with automatic User-PATH set. Reads User-scope PATH (not $env:Path which mixes User+System), checks idempotency by splitting on '';'' (not substring match - avoids false positives if InstallDir is a prefix of another entry), prepends, writes back via SetEnvironmentVariable(''Path'', ..., ''User''). Prints ''User PATH updated'' plus a ''Restart your terminal'' hint. WM_SETTINGCHANGE is broadcast by SetEnvironmentVariable automatically. Linux/macOS sh installer untouched - automatic shell-rc modification would be invasive there.'
