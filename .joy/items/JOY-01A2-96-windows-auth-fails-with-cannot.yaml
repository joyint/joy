description: |-
  On Windows 11, every auth/session operation fails with 'authentication failed: cannot determine state directory'.

  Root cause: dirs_state_dir() in crates/joy-core/src/auth/session.rs only resolves POSIX paths -- it checks XDG_STATE_HOME and HOME, with no Windows branch. On Windows neither variable is typically set (Windows uses USERPROFILE / LOCALAPPDATA), so both branches fall through and the function returns the error. session_dir() depends on it, so save/load session breaks entirely.

  Fix: make dirs_state_dir() platform-aware -- add a Windows branch using LOCALAPPDATA, fall back to USERPROFILE for the home directory, keep XDG_STATE_HOME / ~/.local/state on Unix. Add a unit test covering the Windows resolution.

  Affected: crates/joy-core/src/auth/session.rs:397-408.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-31T18:50:44.615023696Z
  text: |-
    Root cause is broader than the title: two places in joy-core assume POSIX paths and both break on Windows.

    1. auth/session.rs dirs_state_dir() -- checks XDG_STATE_HOME then HOME, no Windows branch. Returns 'cannot determine state directory' -> all auth/session ops crash. (the reported symptom)

    2. store.rs global_config_path()/dirs_path_home() -- same POSIX assumption, but instead of erroring it silently falls back to PathBuf::from('.'). On Windows the global config resolves to .\.config\joy\config.yaml relative to the CWD, so global settings move with the working directory (written in dir A, not found in dir B). Silent wrong behaviour, not a crash.

    Project data under .joy/ is NOT affected (resolved via joy_dir(root), platform-independent), which is why joy add worked and wrote the item correctly.

    Plan: introduce one shared platform-aware home/base-dir helper in joy-core and use it from both call sites. Resolution order: respect XDG_* when explicitly set (all platforms); on Windows use LOCALAPPDATA (state) / APPDATA (config), falling back to USERPROFILE/HOME; on Unix keep ~/.local/state and ~/.config. global_config_path() must stop falling back to '.' silently. Add unit tests for both helpers covering the Windows branches. Verify with just check-all.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-31T19:04:18.488380237Z
  text: |-
    [x] Done. Both POSIX-only path sites are now platform-aware via one shared resolver.

    - Added pub(crate) store::resolve_base_dir(xdg, win_app_data, home, user_profile, is_windows, win_fallback, unix_subdir) -- pure, no env access, so the Windows branches are unit-testable on any host OS.
    - store.rs global_config_path() now uses config_base_dir() -> resolve_base_dir(XDG_CONFIG_HOME, APPDATA, HOME, USERPROFILE, .., 'Roaming', '.config'). The silent PathBuf::from('.') fallback for the *base* is gone; '.' only remains as a last resort if literally nothing resolves (unchanged behaviour for a totally env-less process, but no longer the normal Windows path).
    - auth/session.rs dirs_state_dir() now calls the same resolver: resolve_base_dir(XDG_STATE_HOME, LOCALAPPDATA, HOME, USERPROFILE, .., 'Local', '.local/state'), returning the original AuthFailed error only when nothing resolves.
    - Tests: 5 new unit tests in store::platform_dir_tests covering xdg precedence (all platforms), unix home subdir, windows app-data, windows USERPROFILE/HOME fallback, and empty/none cases. Verified by name (all 5 ok).

    Verification: 'just check' in the joy workspace = fmt clean, clippy -D warnings clean, all tests pass (211 in joy-core, 0 failed), exit 0.

    Scope notes: project data under .joy/ was never affected (joy_dir(root)). TTY-binding weakness filed separately as JOY-01A3-D8.
