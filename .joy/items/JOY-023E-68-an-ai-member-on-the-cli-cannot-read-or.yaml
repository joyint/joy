    Richtung von Horst, 2026-07-28: der Umweg der Plattform ist auch nicht in Ordnung. Chat-Zugriff muss durchgaengig ueber den Session-Key laufen.

    Seine Erwartung im Wortlaut: 'joy chat read --session' entschluesselt alles, was zum Session-Key passt; ohne --session dasselbe fuer den authentifizierten Nutzer, und wenn keiner authentifiziert ist, fordert es zur Authentifizierung auf und entschluesselt danach alles fuer ihn.

    Damit faellt der heutige Sonderweg der Plattform (Seed direkt aus dem hinterlegten Token in den Thread schieben) mit weg: sie loest wie jeder andere eine Session ein und liest damit. Eine Mechanik, ein Pfad, kein Sonderfall fuer den Server.
