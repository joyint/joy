- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-15T23:59:49.622370145Z
  text: |-
    [x] joy auth token add and joy project member add --with-token now print the token wrapped in double quotes ("joy_t_..."). decode_token strips a single surrounding layer of double or single quotes before the base64 stage (whitespace stripping is also preserved as defense in depth). Chat tools treat the quoted value as one atomic string, eliminating the truncation that earlier happened when an AI re-read a visually wrapped paste.

    Tutorial: the long whitespace and truncation hints removed; only the bare fact that the token comes wrapped in quotes stays in the Authentication section. The improved decode error message in joy_core::auth::token stays as a fallback when something goes wrong.

    Tests:
    - decode_accepts_double_quoted_token and decode_accepts_single_quoted_token in token.rs
    - decode_tolerates_embedded_whitespace remains (defense in depth)
    - truncated_token_surfaces_hint remains
    - Bats: setup_ai_session and other token-capture sites in setup.bash, auth.bats, ai.bats, identity.bats, traceability.bats, json_auth.bats, auth_enforcement_ai.bats, member_add_ai_hint.bats, member_add_with_token.bats, passphrase_stdin.bats all updated to handle the quoted output

    All 15 token unit tests and 398 bats integration tests green.
