description: |-
  When a delegation token gets pasted from a chat client into an
  AI tool's input, the token's single ~700-character line is
  visually wrapped by the client. Some AI tools then re-emit only
  the first visible \"line\" when constructing the
  \`joy auth --token …\` command, silently truncating the payload.

  Joy currently reacts to that with:

      Error: authentication failed: invalid token: missing field
      \`delegation_public_key\` at line 1 column 557

  That message is technically correct but doesn't tell the AI
  (or the operator) what really happened, so the AI guesses
  (\"Maybe the token expired? Wrong version?\") instead of asking
  for a fresh paste.

  Fix in three parts:

  1. \`joy_core::auth::token::decode_token\` strips every whitespace
     character (spaces, newlines, tabs, CRs) from the input before
     parsing. This recovers the common case where the chat tool
     passed the token through verbatim with line-break artefacts.

  2. Replace the raw \`serde_json\` / base64 error text with a
     self-explanatory message that names the most likely cause:

         Error: token decode failed: <underlying detail>.
         The token from \`joy auth token add\` is a single string
         that must be preserved verbatim. If it was copied through
         a chat client, the visual line wrap can hide a truncation
         -- paste the full string in one piece and retry.

  3. Add a short note in \`docs/ai/Tutorial.md\` under the
     Authentication section telling AI tools that the token may be
     wrapped in chat clients, that whitespace should be stripped
     before passing it on, and that on a decode/field error the
     correct reaction is to ask the operator to re-paste, not to
     retry with new guesses.

  Tests:

  - Token decode accepts \`joy_t_<base64-with-embedded-newlines>\`.
  - Token decode of a truncated token reports the new hint.
