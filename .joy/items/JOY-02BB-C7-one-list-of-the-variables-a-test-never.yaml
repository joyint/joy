description: 'Measured 2026-10-03: with JOY_SESSION, JOY_USER and JOY_PASSPHRASE set in the shell, cargo test --workspace fails 47 tests in 10 test binaries (joy-ai init_tool_identity; joy-cli act_as_named_member, founder_identity, founder_terminal, identity_call_sites, joy_commits, without_git; joy-core acting_member, founder_identity, resolve_identity_order). A stale JOY_SESSION alone fails joy-core acting_member. Cause: every test binary keeps its own hand-written list of env_remove calls and the lists drifted; most remove JOY_SESSION only. Expected: one place says what a test never inherits (every JOY_ variable and the git identity variables GIT_AUTHOR_EMAIL, GIT_COMMITTER_EMAIL, EMAIL), every test goes through it, and a guard in the gate refuses a test that starts joy past it. Shape (operator decision 2026-10-04): an internal crate, publish = false, a dev-dependency of joy-cli, joy-core and joy-ai, because three crates need the same list and tests/common would be three copies.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-10-03T23:08:16.753115319Z
  text: 'Plan: crates/joy-test-env, publish = false, a dev-dependency of joy-cli, joy-core and joy-ai. One rule instead of a list that can go stale: a test inherits no variable whose name starts with JOY_, and none of GIT_AUTHOR_EMAIL, GIT_COMMITTER_EMAIL, EMAIL. Two entries: command(program), which is joy_process::command with those variables removed, for every process a test starts; and scrub_process() for the cases that call joy-core in their own process. Every test file under crates/*/tests goes through command(); the hand-written env_remove lists go. A guard in just check (guard-test-env) refuses joy_process::command in a tests directory. Proof: the 47 cases fail before and pass after with JOY_SESSION, JOY_USER and JOY_PASSPHRASE set in the shell.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-10-04T00:01:21.765943990Z
  text: '[x] crates/joy-test-env (publish = false, dev-dependency of every crate): one rule, a test inherits no JOY_ variable, no git identity variable, no forge CLI token or config directory, on Linux no session bus, and on Unix finds stand-in gh, glab and tea first on PATH. [x] joy_test_env::isolate!() sweeps the process when the test binary loads; it stands in all 45 files under tests directories and, under cfg(test), in all 18 crate roots, so unit tests in src are covered too. [x] joy_test_env::command replaces every hand-written env_remove list. [x] tests/integration/setup.bash holds the same rule for bats. [x] just guard-test-env, part of just check, refuses a test binary without the line and a plain command under a tests directory; proven both ways. [x] CONTRIBUTING.md states the rule. Widened during the work by operator decision 2026-10-04: session bus, forge CLI, the macro in place of a line per case. Proof, with JOY_SESSION (stale), JOY_USER, JOY_PASSPHRASE, GIT_AUTHOR_EMAIL and GH_TOKEN in the shell, canary gh/glab/tea first on PATH and dbus-monitor on the session bus: 1482 unit cases and 597 bats cases pass, no canary call, no call to org.freedesktop.Secret.Service. Before: 47 unit cases failed, a bats smoke case failed, and the suites made 18 and 4 Secret Service calls. just check green in that shell. Limits, stated in the crate docs: the person''s HOME is not taken away; the session bus rule is Linux only and the forge CLI stand-ins Unix only, so on macOS and Windows a test can still reach the keychain and a signed-in forge CLI; the macro''s loader sections for macOS and Windows are written but were run on Linux only.'
