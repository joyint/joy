description: 'Found via the operator report of an empty adapter badge (JAPP-013F-F6, 2026-07-26). The project.yaml adapter pin (JI-0164) is absent on every AI member registered before it existed, because joy ai init / register_tool_member never wrote the field. Hosts reading the pin got nothing. Fixed with the established systematic: an on-read project_yaml migration (m_2026_07_ai_member_adapter) derives it from the canonical member id, never overwrites a recorded pin, is idempotent, and persists via joy update. DELIVERED in commit d14ca7a, which mistakenly carries the item id of the follow-up rename (JOY-0231-74) instead of this one.'
