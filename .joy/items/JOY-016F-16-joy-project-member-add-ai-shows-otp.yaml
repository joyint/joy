description: |-
  commands/project.rs:533-541 always generates an OTP and prints 'Share the OTP with <id> via a trusted channel. They redeem it with: joy auth --otp <otp>'. AI members do not redeem OTPs; they get a delegation token via 'joy auth token add <ai-id>'. The output is misleading and may push users to share an OTP that has no purpose for the AI member.

  Fix:
  - Detect ai:* member IDs and print the AI-correct flow instead: 'Run joy auth token add <id> to issue a delegation token for this AI member.'
  - Optionally skip OTP generation entirely for AI members (members.<ai>.enrollment_verifier is not used by AI auth).
