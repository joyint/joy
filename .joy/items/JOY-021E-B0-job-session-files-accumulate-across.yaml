description: 'AI sessions are stored in per-session files keyed by (project, member, session_public_key). A job round mints a fresh ephemeral session each round, so successive rounds of the SAME job left multiple session files in the sandbox state dir instead of one, and a prior round''s session lingered valid (replay surface). Fix: session_storage_id keys a JOB-BOUND session (claims.job_id present) by (project, member, job), so a re-mint per round displaces the previous round''s file. Chat sessions (no job_id) keep per-session files so an AI can hold several chats at once. Surfaced by the platform job runner tests (exactly-one-session assertion).'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-07-19T11:36:36.341748267Z
  text: 'Corrected: keeping AI sessions PER-SESSION (session_public_key) is right (JOY-01E1-E7): each survives and is independently restorable, and the session is bound to its job by claims.job_id. The job-keying attempt broke the job_session_mint integration test (which just check does not run: it is --lib only, CI runs cargo test --workspace). Real fix lives on the platform side: the stale exactly-one-session-file assertions in the job runner/watch tests expected displacement; relaxed to present-at-least-once for the per-session design.'
