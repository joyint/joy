    [x] `ensure_human_auth_initialized` returns `Result<Option<String>>`; cold-bootstrap returns the passphrase, warm path returns None.
    [x] `ai_init` forwards the bootstrapped passphrase to `setup_new_tools` as `effective_passphrase`, so the later `derive_acting_keypair` call reuses it and the second prompt is skipped.
