  text: |-
    Review feedback (user):
    1. Passphrase wird in der Cold-Start-Flow zweimal abgefragt -- einmal in `auth::run_init` (Bootstrap), einmal später in `setup_new_tools` via `derive_acting_keypair` (Member-Attestation). Innerhalb derselben `joy ai init`-Sitzung darf das nicht passieren.
    2. Eine kurze Begründung warum AI Init jetzt Auth braucht fehlt im Output.

    Fix: `auth::run_init` signature change to return the validated passphrase. `ensure_human_auth_initialized` returns `Option<String>` (Some if newly bootstrapped). `ai_init` passes that forward to `setup_new_tools` so the subsequent `derive_acting_keypair` skips its prompt. Also: one-line explanation printed before the auth section, e.g. "AI tool members are attested with your project key -- authentication required before registration."
