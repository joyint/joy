- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-08-31T15:20:48.479787953Z
  text: 'State in English for the record (2026-08-31), replacing the German review feedback. The review found two things: in the cold-start flow the passphrase was asked twice, once in auth::run_init for the bootstrap and again later in setup_new_tools through derive_acting_keypair for the member attestation, which must not happen inside one joy ai init; and the output did not say why AI init now needs auth. Both fixed: auth::run_init returns the validated passphrase, ensure_human_auth_initialized hands it on (Some on the cold bootstrap, None on the warm path), and ai_init forwards it to setup_new_tools so the later derive_acting_keypair reuses it and the second prompt is skipped.'
