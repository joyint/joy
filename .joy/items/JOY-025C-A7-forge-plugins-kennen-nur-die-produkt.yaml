  date: 2026-08-19T04:46:37.355519188Z
  text: 'Nachtrag 2026-08-19 nach Hinweis Horst: Gitea hat sehr wohl eine Produkt-Domain (gitea.com, Gitea Cloud und Enterprise); Codeberg ist eine kompatible Alternative auf Forgejo. joy-gitea beansprucht daher gitea.com plus die per tea angemeldeten Hosts, analog zu den beiden anderen. Ausserdem sind die claims-Tests jetzt hermetisch (reine Host-Praedikate statt gesetzter Umgebungsvariablen) - die Variante davor ist in der CI ueber parallel laufende Tests gestolpert. Der Hilfetext zu project.forge nennt jetzt die Plugin-Ids und den Fall selbst gehosteter Instanzen.'
