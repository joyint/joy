description: 'Fund Horst 2026-08-19: joy-gitea beanspruchte codeberg.org fest im Code, obwohl Codeberg nur EINE Forgejo-Instanz ist; joy-github und joy-gitlab konnten umgekehrt GitHub Enterprise und selbst gehostete GitLab-Instanzen gar nicht erkennen. Regel jetzt einheitlich fuer alle drei: ein Plugin beansprucht die eigene Produkt-Domain (github.com, gitlab.com; Gitea hat keine) plus jeden Host, bei dem die Forge-CLI dieser Person angemeldet ist (gh hosts.yml, glab config.yml, tea config.yml). Alias-Formen sind nicht mehr an eine Domain gebunden, sondern an ihre Gestalt. Instanzen ohne Anmeldung nehmen weiter den project.yaml-forge-Override.'
