description: 'joy init reaches git through the git binary: it checks and initializes the repository, reads user.email and the remotes, stages its files, and writes the per-clone config for the merge driver, hooks and last-sync version. The platform may not call the git binary (ADR JP-0034-A2) and its image has none, so it cannot create a joy store in a repository that has none (JP-013E-46). Horst, 2026-09-13: joy init is built on git2 so this is clean as a whole.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-13T17:47:35.252044564Z
  text: 'Done: the Vcs verbs joy init uses (repository check and init, user.email, remotes, staging with the ignore check, local config) run on git2 in vcs::forge, so joy init needs no git binary. Git config, branch and staged files are identical to the git-binary init (compared side by side). For a host creating a project: set_unborn_branch, commit_index, validate_language, tree_paths, head_branch, and is_repository which does not discover upwards. The bats test that pinned the refusal without git now pins that init works without it. Gates green: just check, bats 570/570.'
