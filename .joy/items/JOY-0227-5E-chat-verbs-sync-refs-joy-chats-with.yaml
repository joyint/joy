  text: 'Plan: (1) joy-chat chat_ref gains the SHARED local reconcile (reconcile_with_tracking: adopt absent, fast-forward behind, message-union merge on divergence via the existing merge_refs, returns push-needed) plus the tracking-ref constant - the platform and the desktop each carry a private copy of exactly this decision tree today; the CLI must not become copy number three. Refactoring those two onto the shared helper is noted as follow-up, not done here (working, tested code). (2) joy-cli chat: a sync step around every verb - reads (ls/show/info) fetch+reconcile+push-if-ahead first; writes (send/add/leave/delete/rename/read) persist locally first (truth in the repo), then fetch+merge+push in the same invocation. Network via the git CLI with the user''s ambient auth (ssh agent etc.), remote from sync.remote else origin; a repo without a remote skips silently (local-only project). Failure classification like the app worker: missing remote ref = fine (first sync), auth/permission = permanent wording, everything else transient (''will retry on the next send or read''); a failed push never loses the message (it stays committed on the local ref). (3) Tests: reconcile unit scenarios in chat_ref, plus a bats round-trip over a bare origin with two clones (send in A, visible in B, reply in B, visible in A).'
