description: 'A member who enrols after a team key is set holds no wrap; a departing member leaves stale entries. joy-core: team_coverage_gaps, rewrap_team_keys (owner extends in place, foreign actor stores its own complete entry), purge_member_wraps. CLI: joy ai key rewrap; member rm purges wraps and names the rotation duty; member add hints at the enrolment gap. The platform closes gaps automatically as recipient (JP side).'
