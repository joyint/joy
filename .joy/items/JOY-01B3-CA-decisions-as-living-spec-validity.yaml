description: Treat decisions as the project's living specification, read by humans and AI before any work to know the binding ground rules. Add a validity field (proposed, accepted, rejected, replaced, retired) and a replaced_by link to items, surface them through a --decisions/-D view (val column, own board), and define in the tutorial that a decision binds when status=closed and validity=accepted. Decisions stay normal items in the single workflow; this only extends the feature set, it does not change the architecture.
