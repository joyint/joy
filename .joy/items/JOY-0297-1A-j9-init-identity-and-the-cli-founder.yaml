  text: 'Plan: (1) init.rs: keep InitOptions.user, ask for the founder address on an Interactive host with no git config, refuse by name on Background and Delegated hosts, alias guard for an explicit override; (2) enroll.rs: explicit member parameter for redeem_with_passphrase and joy auth init; (3) forge.rs: demote repo_identity to a prefill helper, the signature rule of D4.5 (open mode, anonymous mode m-<hex>, non empty guarantee, typed error); (4) identity.rs: resolve_identity order session, member pin, git config prefill; (5) the CLI founder path of D3.9 in joy-cli init and auth commands. Tests: init without git config, anonymous mode signature. Worktree: .claude/worktrees/fcng-J9/joy on branch feat/forge-connection-ng-j9.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-17T02:54:42.938218342Z
  text: "Result (implemented, adversarially reviewed, review findings fixed; branch feat/forge-connection-ng-j9, commits: 943bdd6 [JOY-0297-1A] Found a project without a git config, 3ee6c94 [JOY-0297-1A] Sync the crate copy of the tutorial, 21d94cd [JOY-0297-1A] Remember the founder who enrolled with, b6c280c [JOY-0297-1A] Say in the doc what the resolution ord, c46c66a [JOY-0297-1A] Ask the member pin before git config, , f4d2ec9 [JOY-0297-1A] Sign the commits joy writes for the ac).\n\nTwo new commits answer the review; the four earlier ones are unchanged. The first (c46c66a) makes one resolution order true everywhere: `resolve_identity` and `acting_member` both read the delegation session, then the project's member pin, then git config as a prefill, which is the order D3.9 states, so `joy auth status` and `joy auth init` can no longer name two different people on one machine. The pin is kept honest instead of written once: `joy init` and `ensure_founder` pin the founder they register, and `pin_acting_member` removes the pin again the moment git config names the member who authenticated, so a machine whose git config already answers correctly carries no pin at all (which is every machine that worked before, verified against the way the bats corpus switches identity). With the founder pinned at init, the invented last step of `acting_member`, \"the project's only human member\", is gone, and with it the hole where anyone who cloned a project with an unenrolled founder could claim that founder with a bare `joy auth init`. The same commit moves the host kind decision to `cli_main` as D1.1 requires, makes the hook helper and the merge driver Background whoever started them, teaches the `joy init` recovery path to ask instead of printing a `git config` recipe, and routes `joy auth` and `joy auth token add` through `acting_member` so the founder is not locked out when his session expires. The second commit (f4d2ec9) closes acceptance 4 in the product: `auto_git_post_command`, the commit path every joy write goes through in the CLI and in the desktop, now takes the acting member it is already handed, asks `identity::commit_signature` and commits through the new `forge::commit_index_if_changed`, so an anonymous project stamps the opaque id on both fields and a project with no git config can commit at all. `forge::signature_now` became the only place in the engine that builds a `git2::Signature`, and all nine production call sites go through it, which is where D4.5's non-empty guarantee and its typed error now really live. Tests were added where the review said proof was missing: a joy-cli case that drives the real binary through an anonymous project and reads HEAD back with git2, a joy-core case that mints a REAL delegation session and shows it beats a terminal, a case that walks the whole precedence story including the stale pin and the removal rule, and a unit case that drives all three signature outcomes through `commit_index`. joy-core, joy-cl\n\nAcceptance criteria:\n- [met] `joy init --user a@b.c` in a repository with no git config succeeds and the following enrollment enrols a@b.c without reading git config: crates/joy-cli/tests/founder_identity.rs::init_user_founds_and_auth_init_enrols_without_a_git_config drives the real binary in an isolated HOME with GIT_CONFIG_NOSYSTEM and no git identity; joy-core's founder_identity.rs covers the OTP redemption variant. The answer no longer comes from the removed \n- [met] `joy init` with no git config on a terminal asks for the address and completes: joy-core founder_identity.rs::an_interactive_host_asks_for_the_address_and_completes plus the TerminalAsk unit cases; verified by hand on a real PTY via `script`. The recovery path (`joy init` on a member-less project) now asks too: ensure_founder takes the same host kind and ask, and its refusal te\n- [met] the same command under `JOY_SESSION` refuses with the named sentence: Two halves, both tested. The refusal itself: joy-core founder_identity.rs::a_background_or_delegated_host_refuses_by_name asserts the exact sentence for HostKind::Background and HostKind::Delegated, with an ask at hand that is never used. The detection: crates/joy-core/tests/delegated_host.rs mints \n- [met] a commit in an anonymous mode project carries `m-<hex>` in both signature fields: Now true in the product, which is what the review said it was not. joy's own commit path (git_ops::auto_git_post_command, the only commit path the CLI and the desktop use for their writes) resolves the acting member, asks identity::commit_signature and commits through forge::commit_index_if_changed.\n- [met] Work item: keep InitOptions.user, add an explicit member parameter to enrollment, demote repo_identity: InitOptions.user kept and documented as the host's answer; redeem_with_passphrase takes `member: Option<&str>` and reads no git config; forge::repo_identity is demoted in its doc to a prefill and is used only for the display name inside identity::commit_signature.\n- [met] Work item: the signature rule of D4.5 including anonymous mode, the non empty guarantee and the typed error: member_signature holds the rule, and forge::signature_now is now the ONLY place in the engine that builds a git2::Signature: all nine production call sites (commit_joy, the merge commits, commit_index, commit_everything, commit_paths, tag_annotated, commit_all, land and merge) go through it. Unit ca\n- [met] Work item: the alias guard for an explicit override: refuse_forge_alias applies to git config, to --user and to a typed answer alike; crates/joy-core/tests/founder_alias_guard.rs covers all three.\n- [met] Work item: the CLI founder path of D3.9: The host kind is decided once in cli_main (D1.1) and read by the commands; `joy init`, `joy init` on the heal path, `joy auth init`, `joy auth --otp`, `joy auth` and `joy auth token add` all take the member from identity::acting_member instead of git config.\n- [met] D3.9 order: session, then the project's member pin, then git config as a prefill: resolve_identity and acting_member now read the same order, so `joy auth status` and `joy auth init` cannot name two people on one machine. crates/joy-core/tests/acting_member.rs walks the case the review reported (founder pinned, second member added, git config set to the second member) and asserts\n- [met] No new CLI switch (JI-017C-E1): No flag was added. `--user` on `joy init` and on `joy auth` already existed; the second line of the typed error names that existing flag.\n\nDeviations from the design:\n- The pin's WRITE rule is mine, not the design's. D3.9 only orders the reads. The pin is written when git config cannot name the member who just founded or authenticated, and it is REMOVED again as soon as git config can name them. Reason: the pin is read first, so a pin sitting beside a working git identity is the one thing on a machine that can silently go stale (the review's Bea case), and the al\n- `joy init` and `ensure_founder` write the pin for the founder they register. D3.9 does not mention it. It is what lets acceptance 1 hold without the invented \"the project's only human member\" step, and it keeps the answer on this device rather than in the committed project file that every clone carries.\n- `ensure_founder` gained two parameters (`host`, `ask`). That is a public signature change the design does not spell out, taken because D3.9 names this very command as the one that must ask. Its only caller in the whole reference tree is joy-cli; the desktop does not call it.\n- `JoyError::UnknownActingMember` carries a second line, \"On the command line, name it: --user <address>\". D4.5 quotes only the first line, which is unchanged and still the first thing printed; the second exists because this error now reaches a host with no member picker.\n- joy's own automatic commits no longer run the commit-msg hook, because they are written with git2 rather than `git commit`. They could only ever fail it (a summary like \"joy: auth init\" names no item), so the hook silently suppressed them before; the in-process validator of D3.3 is where that rule belongs. They are also unsigned, which D3.6 already decided for the day the CLI moves off the git bin\n- The host kind treats `joy merge` (the merge driver git spawns) as Background beside `joy prepare-commit-msg`. D1.1 names hooks only; a merge driver that prompts would hang the git process waiting for it.\n- The unit tests the review asked for (acting_member, pinned_member, pin_acting_member) live in their own integration binaries, not in identity.rs's `mod tests`. They need HOME, libgit2's config search paths and the working directory to move step by step, and joy-core's lib test binary runs hundreds of tests in parallel in one process.\n- joy-cli gained one dev-dependency, git2, so a test can read the signature fields of the commit joy wrote. joy-core already builds that exact git2.\n\nOpen questions:\n- Cross-repo sequencing, unchanged from the review's should_fix 8 and out of this worktree: the desktop still calls `redeem_with_passphrase` with three arguments (crypt_ops.rs:788, settings_ops.rs:1225, :1330), still builds `InitOptions` as a struct literal (lib.rs:239, write_ops.rs:1003) which now ha\n- The pin lives in the per-project app state file (ADR JAPP-02BD-56), the file the desktop reads into a typed `ProjectState` (app/apps/desktop/src-tauri/src/app_state.rs:25) and writes back whole. The desktop therefore DROPS the `member` key whenever it stores auto-sync or a model pin. Losing the pin \n- The remaining `user_email()` call sites are still J11, and one of them hurts today: `joy project member add` fails with \"git error: git user.email is empty\" on a machine with no git config, so the founder of acceptance 1 can authenticate and write items but cannot invite a second member without sett\n- bats is not installed on this machine, so tests/integration/init_founder_recovery.bats (and the rest of the bats corpus) could not be executed. Both cases it covers were reproduced by hand against the built binary, and the flows most at risk from the pin change (identity switching by git config, set\n- crates/joy-core/tests/commit_signature.rs still computes the signature itself and hands it to commit_index, which the review rightly called a weak proof of the acceptance. It is kept as a unit-level statement of the D4.5 rule; the acceptance itself is now proven end to end in crates/joy-cli/tests/fo\n- Two members sharing one machine, one checkout and one project, where neither is named by git config, still need `--user` (or an OTP, which proves its own member) to act as the other. That follows from D3.9's order and is now consistent between both resolvers rather than contradictory, but it is a pr\n\nTests:\n- cargo test -p joy-core: ok, 445 lib tests plus 9 integration binaries, 0 failed, 2 ignored\n- cargo test -p joy-core --features forge-net: ok, same counts, 0 failed\n- cargo test -p joy-cli: ok, 87 lib tests plus 4 integration binaries (founder_identity 4 cases), 0 failed\n- cargo test -p joy-bi -p joy-chat-store: ok, 51 tests, 0 failed (both build InitOptions and were touched by this branch)\n- cargo test --workspace: ok, 32 test binaries, 0 failures\n- cargo clippy -p joy-core -p joy-cli --all-targets: clean, no warnings (the crates deny clippy warnings; one needless_option_as_deref was fixed)\n- cargo fmt -p joy-core -p joy-cli: applied, tree clean afterwards\n- bats tests/integration/init_founder_recovery.bats: NOT RUN: bats is not installed on this machine. The two cases the branch touches were reproduced by hand with the built \n- manual: isolated HOME, joy init --user a@b.c, joy auth init, joy auth status, session remo: founds, enrols and re-authenticates as a@b.c with no git config anywhere\n- manual: printf 'n\\ntyped@example.com\\n' | script -qec 'joy init --name Asked': asks on the PTY, registers typed@example.com, writes the device pin\n- manual: founder pinned, second member invited, git config switched to the invitee, joy aut: the OTP proves the invitee, the stale founder pin is dropped, auth status then names the invitee\n- manual: bats-shaped identity switching (init and auth init with a git config, member add, : identical to the behaviour before this branch: no pin is written on a machine whose git config names the member"
