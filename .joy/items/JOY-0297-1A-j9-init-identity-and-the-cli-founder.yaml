  Package J9 of the forge connection NG rebuild (JI epic JI-0190-3A; wave 0; owner project JOY). Design: joy/docs/design/forge-connection-ng.md (v5), section 4, and the design sections the package names. Read those sections before starting; every rule there is binding.

