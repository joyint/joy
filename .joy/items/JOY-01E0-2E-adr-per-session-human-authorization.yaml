description: "**Status:** Accepted (2026-04). §1 (stable delegation key) and §2 (ephemeral session keypair bound to `JOY_SESSION`) remain authoritative. §3 (single-use + 2h issuance TTL) superseded by JOY-01E1-E7 on 2026-04-19.\n\n## Context\n\nJOY-01D8-DB introduced per-delegator AI delegation tokens with dual signatures, solving the multi-user conflict where two humans issuing tokens for the same AI member would overwrite each other. After several months of use three remaining problems are now load-bearing enough to revisit:\n\n\n1. `**project.yaml**` **churn on every token issuance.** Each `joy auth token add <ai-member>` overwrites the entry at `members[<human>].ai_tokens[<ai-member>]` with a new `token_key`. The map is keyed by AI member, so per-token revocation is not actually achievable - issuing a second token implicitly revokes the first. The benefit promised by JOY-01D8-DB (\"individual revocation\") was never realised in practice, but the cost (a `project.yaml` write and commit on every issuance) is paid every time. For solo developers working across multiple machines this produces avoidable merge conflicts. For team workflows and Joyint automation it would become a hard blocker.\n2. **Sessions are not bound to the terminal that created them.** `joy auth --token` writes a session file to `~/.local/state/joy/sessions/<hash>.json` keyed by `(project_id, member)`. The `JOY_SESSION` environment variable is only a lookup id; the actual credential is the file. Any process running as the same OS user (a sibling shell, a second AI tool instance) can read the file and operate as the AI without any human action. This violates the implicit expectation that \"an AI session requires an explicit human handover\".\n3. **Tokens are long-lived bearer credentials.** Once issued, a token can be redeemed any number of times until its TTL expires. A human who issues a 30-day token has effectively granted the AI 30 days of unsupervised re-authentication. The design assumes the human re-authorises each AI session, but nothing enforces it.\n\nA second passphrase prompt during first-time delegation (joining a project as a new human, then immediately delegating to an AI) is a smaller ergonomic issue that falls out naturally from the changes below.\n\n## Decision\n\nThree coordinated changes form one trust-model update. Each is independently meaningful but they share the same data and code paths and should land together.\n\n### 1. Stable per-(human, AI) delegation key\n\nReplace the per-token `ai_tokens` map with a stable per-(human, AI) delegation key.\n\n`**project.yaml**`**:** each human member carries an `ai_delegations` map. The entry is written **once** per (human, AI) pair and remains stable until explicitly rotated.\n\n```yaml\nmembers:\n  alice@team.com:\n    capabilities: all\n    public_key: \"alice_ed25519_pk...\"\n    salt: \"...\"\n    ai_delegations:\n      ai:claude@joy:\n        delegation_key: \"stable_ed25519_pk...\"\n        created: \"2026-04-15T10:00:00Z\"\n        rotated: null\n```\n\n**Local state:** the corresponding private key lives at `~/.local/state/joy/delegations/<project-acronym>/<ai-member>.key`, owned by the human. It is never seen by the AI. File permissions 0600. This is a new long-lived secret class - documented as \"SSH-key-equivalent: do not share, protect via filesystem permissions\".\n\n**Token issuance** still requires both the human's identity key (passphrase-derived) and the delegation key (read from local state). Token validation still verifies both signatures, but now against the stable delegation public key.\n\n**Rotation:** `joy ai rotate <ai-member>` generates a new delegation keypair, updates `project.yaml` (single commit), and invalidates all previously issued tokens for that (human, AI) pair.\n\nThis trades per-token revocation (which JOY-01D8-DB promised but the data model never delivered) for explicit per-(human, AI) revocation. The semantics now match what users actually do.\n\n### 2. Ephemeral session keypair bound to `JOY_SESSION`\n\nReplace the on-disk session credential with an ephemeral keypair whose private half lives only in `JOY_SESSION`.\n\n`**joy auth --token**`**:**\n\n\n1. Validates the token as today (dual signatures against `project.yaml`).\n2. Generates an ephemeral Ed25519 keypair.\n3. Writes `~/.local/state/joy/sessions/<id>.json` containing the **public** key, claims, expiry, and revocation linkage. The file alone proves nothing.\n4. Encodes the **private** key into `JOY_SESSION` and emits `export JOY_SESSION=...`.\n\n**Each Joy write command:**\n\n\n1. Reads `JOY_SESSION` from the environment.\n2. Signs its request claims (command, arguments hash, timestamp) with the ephemeral private key.\n3. `joy-core` looks up the session file by id, verifies the signature against the stored public key, and proceeds.\n\nA process without `JOY_SESSION` in its environment cannot operate as the AI even if it can read the session file. The credential travels with the environment, not the filesystem.\n\nThe AI tool's child processes inherit `JOY_SESSION` (intended). An AI that deliberately exfiltrates `JOY_SESSION` to another terminal is a sandbox-break threat outside the scope of the auth design.\n\n### 3. Single-use delegation tokens with 2 hour issuance TTL\n\nMake tokens single-use and short-lived so each AI session traces to a recent, deliberate human action.\n\n* **Issuance TTL:** 2 hours between `joy auth token add` and `joy auth --token`. Redemption after expiry rejected. Two hours covers realistic handover delays (compose chat message, switch context, paste in AI tool) without becoming a usable bearer credential window.\n* **Single-use:** every token carries a stable id (UUID generated at creation, included in claims and covered by both signatures). On successful redemption the AI's local state records the consumed id at `~/.local/state/joy/consumed-tokens.json`. Subsequent redemption attempts for the same id are rejected as replay.\n* **Session lifetime is a separate concern** (24 hours, unchanged).\n\nResult: each AI session corresponds to exactly one human passphrase entry within the last two hours. There is no mechanism for the AI to silently re-authenticate.\n\n### 4. Token lifecycle and expiry handling\n\nA token is in exactly one of three states:\n\n\n1. **Issued, unredeemed, within 2h.** The only state in which `joy auth --token` succeeds. The token exists only as the string the human passed to the AI (chat message, clipboard) - nothing about it lives on disk anywhere on the issuer's machine.\n2. **Issued, expired (>2h), never redeemed.** Validation rejects with a precise message: `\"Token expired (issued <ts>, expired <ts>). Ask the human to issue a new one with: joy auth token add <ai-member>\"`. Nothing to clean up - the token never touched the filesystem.\n3. **Redeemed.** Token id is recorded in `~/.local/state/joy/consumed-tokens.json` on the AI's machine. Subsequent redemption attempts for the same id are rejected as replay with: `\"Token already consumed (redeemed at <ts>). Ask the human to issue a new one with: joy auth token add <ai-member>\"`.\n\n**Consumed-tokens GC.** `consumed-tokens.json` is garbage-collected lazily on every write: entries older than the 2h issuance TTL fall out. Rationale: after 2h, a replayed token would be rejected by the expiry check anyway, so the replay record adds no protection. The file stays small without a background sweeper.\n\n**No issuer-side token bookkeeping.** The human's machine does not record outstanding tokens. Once handed off, the token is purely the recipient's problem. This matches the \"fire and forget\" model that makes tokens easy to use - the only persistent state on the issuer is the long-lived delegation keypair.\n\n**AI tool instructions.** The `joy update` templates (CLAUDE.md, QWEN.md, AGENTS.md, etc.) gain a clause: *\"If* `*joy auth --token*` *fails with EXPIRED or CONSUMED, do not retry. Ask the human to run* `*joy auth token add <your-id>*` *and pass you the new token.\"* This makes the failure mode self-resolving without the AI guessing.\n\n**No relationship to delegation key or session lifetimes.** Token TTL (2h, issuance window), session TTL (24h, post-redemption), and delegation key lifetime (until explicit `joy ai rotate`) are three independent clocks. A token expiring does not affect any session it has already produced. A session expiring does not affect the delegation key. Rotating the delegation key invalidates all three categories at once for that (human, AI) pair.\n\n## Properties achieved\n\n| Property | Before (JOY-01D8-DB) | After (JOY-01E0-2E) |\n|----------|------------------|-----------------|\n| AI cannot self-issue a token | yes (human passphrase required) | yes (unchanged) |\n| Cross-machine session isolation | yes (filesystem locality) | yes (unchanged) |\n| Same-user-different-terminal session isolation | **no** (file is the credential) | yes (env var carries the secret) |\n| Each AI session = explicit recent human approval | **no** (long-lived bearer) | yes (single-use, 2h TTL) |\n| `project.yaml` stable across token issuances | **no** (write per issuance) | yes (write only on first delegation and on rotation) |\n\n## Consequences\n\n### Positive\n\n* Eliminates the `project.yaml` merge-conflict class entirely for token issuance.\n* Closes the same-machine-different-terminal session reuse path.\n* Makes \"human in the loop per AI session\" a structural property rather than a convention.\n* Simpler operator mental model: one stable delegation, ephemeral session per use.\n\n### Negative\n\n* **Migration cost.** Existing projects with `ai_tokens` entries need a one-time migration to `ai_delegations`. The migration is mechanical (generate fresh delegation keypair, write public part to `project.yaml`, write private part to local state, drop `ai_tokens`) but cannot be done remotely - each human must run it on each of their machines.\n* **New secret class on disk.** The local delegation private key is a long-lived asset. It cannot forge tokens alone (the human's passphrase-derived identity key is still required for the delegator signature) but it must still be protected. Documentation update required.\n* **More frequent passphrase entry for the human.** Each AI session start now requires `joy auth token add` (one passphrase) within the prior 2 hours. Previous workflow of \"issue a 30-day token, forget about it\" is gone by design.\n* **Slightly more crypto on the hot path.** Every Joy write command now signs and verifies a request. Ed25519 sign+verify is fast (microseconds); negligible against YAML I/O and git overhead.\n\n### Neutral\n\n* Token wire format gains a `token_id` field. Backwards-incompatible (acceptable - tokens are short-lived and scoped to single redemption).\n* `joy ai reset --tool <name>` now wipes `ai_delegations` entries (and consequently invalidates everything downstream).\n* Session files become useful as audit records (who started a session, when, against which delegation key) without being credentials themselves.\n\n## Migration\n\nA `joy ai migrate-delegations` command performs the per-human migration:\n\n\n1. For each `members[<self>].ai_tokens[<ai-member>]` entry in `project.yaml`:\n\n   \n   1. Prompt for passphrase (once).\n   2. Generate fresh delegation keypair.\n   3. Write public key to `members[<self>].ai_delegations[<ai-member>]`.\n   4. Write private key to `~/.local/state/joy/delegations/<project>/<ai-member>.key` (0600).\n2. Delete `members[<self>].ai_tokens` from `project.yaml`.\n3. Single commit: \"migrate ai_tokens to stable ai_delegations (JOY-01E0-2E)\".\n\nOld tokens issued under the JOY-01D8-DB model become invalid at migration. AI tools must re-receive a fresh token. This is the expected break - the whole point of JOY-01E0-2E is that AI sessions should require fresh human action.\n\n## Related\n\n* JOY-01D8-DB (per-delegator AI delegation tokens) - this ADR refines JOY-01D8-DB's data model and extends its trust properties; JOY-01D8-DB remains accepted as the predecessor.\n* Joy epic JOY-00E7-B1 tracks the implementation across three stories (delegation key, ephemeral session, single-use tokens) plus a shell-completion task.\n"
