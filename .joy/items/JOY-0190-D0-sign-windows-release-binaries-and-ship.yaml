description: 'Wire the shared signing action from the umbrella epic JI-00F4-20 into joy''s release CI to produce signed joy.exe artifacts for tagged releases (Authenticode via Microsoft Trusted Signing). Add a workflow that opens a PR to microsoft/winget-pkgs with an updated manifest pointing at the signed artifact when a release is published. Motivation: CyberArk and similar EPM scanners quarantine unsigned binaries, blocking enterprise installs.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T16:47:43.756496159Z
  text: |-
    Plan: Sign Windows release binaries via Microsoft Artifact Signing (formerly Trusted Signing) and ship a WinGet manifest. Agreed with operator in collaborative mode.

    Microsoft side (in progress): Azure org subscription set up (tenant Joydev GmbH). Resource provider Microsoft.CodeSigning registered; Artifact Signing account 'joydevsign' created (resource group rg-signing, region northeurope, SKU Basic, account URI https://neu.codesigning.azure.net/). Operator holds the 'Artifact Signing Identity Verifier' role. Organization Public identity validation submitted (id 518e6001-bb5a-499a-8b5c-da7f2d415689), status In Progress at Microsoft (1-20 business days). When completed: create a PublicTrust certificate profile via CLI and assign 'Artifact Signing Certificate Profile Signer' to the CI identity (GitHub OIDC service principal).

    Code side (this story): joy builds via cargo-dist; joy.exe is built on windows-latest (x86_64-pc-windows-msvc) in the build-local-artifacts job of .github/workflows/release.yml. Add a shared composite action in the ci submodule (ci/.github/actions/sign-windows-exe) wrapping signtool against Trusted Signing, invoked Windows-only after 'dist build' and before artifact upload (~release.yml:171). Add a separate post-release workflow to open a WinGet manifest PR to microsoft/winget-pkgs. jyn mirrors this via JYN-0003-D0; the shared action serves both.

    Ref: umbrella epic JI-00F4-20.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T17:17:32.623259672Z
  text: |-
    [x] Phase B draft written (working tree only, not committed/pushed), pending review:
    - ci/.github/actions/sign-windows-exe/action.yml: shared composite action, OIDC (azure/login@v3) + azure/artifact-signing-action@v2, signs in place. Defaults endpoint https://neu.codesigning.azure.net/, account joydevsign, profile joydevPublicTrust.
    - joy/.github/workflows/release.yml: added id-token: write; after dist build, sign the Windows binary (target/<triple>/dist) then re-run dist build to re-archive the signed exe and refresh manifest hashes. Windows + publishing only.
    - joy/.github/workflows/winget-submit.yml: winget-releaser on release published (stable only), identifier Joydev.Joy, matches the signed Windows zip.

    Why sign-then-re-archive: cargo-dist has no native Trusted Signing support (SSL.com only), and dist build compiles + archives in one step.

    Still open before a real signed release:
    1. Azure OIDC infra: Entra app + federated credential bound to joyint/joy + Artifact Signing Certificate Profile Signer role (can be done during the validation wait).
    2. Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, WINGET_TOKEN.
    3. Certificate profile joydevPublicTrust created via CLI after org identity validation (id 518e6001) completes.
    4. ci repo visibility + pin the cross-repo action ref to a SHA.
    5. Shared action commit likely needs its own item in the ci repo (or track under epic JI-00F4-20).
