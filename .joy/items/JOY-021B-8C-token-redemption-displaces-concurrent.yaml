  text: 'Plan: store AI sessions one file per session (storage id = hash of project:member:ephemeral session pubkey) instead of one deterministic slot per member, so token redemptions and job-session mints never displace concurrent sessions (implements JOY-01E1-E7). Humans keep the per-member slot. Wire through: deauth/rotate/member removal drop all sessions of the member; auth status and the member-state mirror resolve via the env sid and enumerate; lazy sweep of expired files on save; legacy files and sids stay valid until expiry.'
