  text: 'Plan: the loop is a merge problem, so it is fixed in merge_refs and nowhere else - four explicit cases, each with a test, and refusal reserved for plaintext on both sides where no resolution exists. The retired ref (refs/joy/chats-retired) is dropped from the design on the operator''s call: it kept data nobody can decrypt on a second ref while remove_chat already commits onto the previous tip, so git keeps those bytes anyway. The sealing migration therefore deletes an unreadable chat instead, and stays registered as a standing update item because a project untouched for a year must still migrate on the joy update that finally reaches it. Folded in from the same session: is_tool_active (registration, not the git-ignored marker) and the Failure::Other wire word. The adapter label becomes Claude Agent - Anthropic''s branding rules for third-party products forbid Claude Code as a product label and name Claude Agent as the preferred form in a picker.'
