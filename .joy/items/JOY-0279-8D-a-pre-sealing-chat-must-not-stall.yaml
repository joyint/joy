description: 'The chat-ref merge refused by name as soon as it saw ANY subtree in the pre-sealing plaintext layout, so two clones that could not both convert it retried forever (operator 2026-09-02: the desktop''s sealed general against the platform''s unconvertible plaintext copy). merge_refs now settles all four cases instead: a chat only one side carries travels through, two sealed sides union, sealed-against-plaintext takes the sealed side and drops the other, and only plaintext on BOTH sides still refuses. The fix lives entirely in the merge, so the loop clears on the next sync without anyone running joy update. The sealing migration stays a standing update item for old projects and now deletes an unreadable chat outright rather than shelving it on a second ref: remove_chat commits onto the previous tip, so the bytes stay reachable through the ref''s own history and a parallel retired ref preserved nothing git did not already keep. Also carries two findings from the same session: is_tool_active gates an AI member on its registration in project.yaml instead of the git-ignored marker file, and Failure::Other reports the wire word error instead of the empty string that surfaced as a false offline banner.'
