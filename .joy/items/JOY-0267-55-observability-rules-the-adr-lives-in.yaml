description: 'Pointer, not a copy: how and when joyint logs, traces and measures is decided ONCE, in JP-00ED-EE (platform backlog, epic JP-0077-F8). The Rust telemetry core (JOY-0266-CA) and every tracing call in the joy crates follow it: spans at boundaries, records for decisions/transitions/failures with structured fields, metrics for rates and durations, redaction in the core, every caught error recorded once with its cause chain. Read the ADR there before adding a signal here.'
