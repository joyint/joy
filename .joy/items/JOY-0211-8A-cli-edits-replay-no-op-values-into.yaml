description: Backfill for commit ee66414 (tagged no-item at commit time). touch_for_attribute_change touches unconditionally; the CLI commands used flag presence as change detection, so joy edit X --priority high on an already-high item bumped updated, swapped updated_by to an actor who changed nothing and appended a history entry (a looping web client once flooded a job with 600+ such entries through the analogous platform path). joy-core gains touch_if_changed(item, &before, by); edit, assign, status and milestone link snapshot after load and touch only on a real difference. deps, unassign, unlink and the milestone-delete sweep already checked real values.
