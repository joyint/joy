  date: 2026-07-11T17:29:55.518990756Z
  text: 'Clarifications from the sandbox design discussion (2026-07-11, operator-approved): (1) Job agents never leave their container and never talk to the platform for writes - no ACP write back-channel; item state is written exclusively via the joy CLI (Guard/gates in-process) against a job-owned checkout of main (joywork/) inside the job workspace; code is edited in the branch worktree. (2) Agents commit their code themselves (they know when a unit is done); the platform validates after process exit (any branch commit touching .joy fails the attempt), pushes branch and .joy changes (no forge credentials in the container, completion = process exit, no polling). (3) AcceptJob refuses branches whose diff touches .joy. (4) The job branch is platform-owned and deterministic (joy/<member>/<job-id>), recorded per attempt; agents need no knowledge of it. (5) The app needs no branch switcher: review happens on the forge via the branch link from the latest attempt. (6) Enforcement lives at seams the platform owns (attempt end, merge), backend-agnostic across AgentRunner backends; container mounts may add hardening but never carry the policy (no sparse checkout - libgit2 lacks it).'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-01T21:00:37.630019226Z
  text: 'Closed in the backlog sweep of 2026-09-01 (ordered by Horst): delivered. decision in force: jobs are items in CLI, platform and app.'
