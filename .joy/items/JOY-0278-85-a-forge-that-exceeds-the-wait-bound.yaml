description: 'Since the wait bound (JOY-0276-FA: 10 s connect, 15 s server), a forge that answers too slowly fails after ~15 s with "SSL error: syscall failure: Resource temporarily unavailable", libgit2''s EAGAIN surfacing raw. On integration on 2026-09-04 (07:13 to 19:44 UTC) that was 149 fetches, 62 ls-remotes and 57 pushes against codeberg.org (mps-netbrain-demo), all logged as errors, the write-behind retries covering the pushes (main was never left ahead). The message must say what happened: the forge did not answer within the bound. Open with Horst: whether 15 s is the right bound for a forge like Codeberg that regularly needs longer.'
