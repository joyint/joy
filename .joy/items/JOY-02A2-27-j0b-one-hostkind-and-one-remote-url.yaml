  text: 'Plan: pick joy_core::host as the home of HostKind (it is where the CLI entry point sets it), move may_prompt there, re-export from vcs for the engine, delete vcs::host_kind; make contact::host_of and transport_of thin wrappers over remote_url::RemoteUrl::parse; run the whole workspace. Worktree: the shared joy worktree on feat/forge-connection-ng, directly, since no other package runs in joy right now.'
