description: |-
  JI-0166-D8 §4 says the adapter derives its native mode from the effective level "at setup and turn time". Setup exists (joy ai setup writes .claude/settings.json); turn time never did. The turn mode lived only in the lane, used to ANSWER permission requests. An agent that never asks - Claude Code in its own plan mode - ran in whatever its setup file said, and switching the level in the composer changed nothing anyone could see (operator, 2026-09-09).

  ACP has the mechanism: the agent advertises available_modes at session/new, and session/set_mode switches. claude-agent-acp advertises plan, acceptEdits and bypassPermissions; qwen plan, auto-edit and yolo. The lane now keeps what each session advertised and, at EVERY turn, sets the advertised mode the turn level means before the prompt goes out. Every turn, not only on change: an agent may leave a mode on its own (plan mode ends itself), and a stale cache would let it run less restricted than the level says. An adapter that advertises nothing matching keeps running under the permission answers, with a log line saying so.

  The candidate ids live next to the setup writers in level_enforcement and a test holds the two tables together, so they cannot drift.

  Not covered by a test: the wire itself. joy-ai has no fake ACP agent; the selection is unit-tested, the effect is verified at the running app. The composer side of this (the choice as a turn parameter instead of a chat write) is the JAPP twin.
