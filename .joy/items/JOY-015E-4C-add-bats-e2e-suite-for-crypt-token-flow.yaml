      - joy crypt revoke for AI removes the entire delegations.<ai> map
      - (plus die delegation rotate / ls Tests aus JOY-015C-60)
    [x] Drei alte Tests entfernt, die geloeschte file-IO und acronym-rename-Pfade testeten:
      - project set acronym migrates local delegation directory
      - project set acronym refuses when target delegation directory exists
      - joy auth token add self-heals when local private key is missing
    [x] Zwei alte Tests aktualisiert auf neuen Stand:
      - joy ai rotate replaces delegation keypair: ohne file-hash-checks
      - joy auth token add bails on legacy delegation: neue Fehlermeldung
    [x] Zwei Verhalten bewusst auf Rust-unit-test-Ebene gelassen statt bats:
      - session.expires Klemmung (date -j -f Portabilitaet zwischen macOS/GNU)
      - AI-side decrypt round-trip (eval+JOY_SESSION cross-shell flakiness)
