id: JOY-013F-33
title: Switch AI delegations to passphrase-derived keys
type: decision
status: new
priority: high
capabilities:
- conceive
effort: 5
created_by: ai:claude@joy delegated-by:horst.schwarz@joydev.com
created: 2026-05-01T12:08:13.095471Z
updated: 2026-05-01T12:08:13.095471Z
description: |-
  ADR-033 §1 made the per-(human, AI) delegation keypair *stable* but bound it to the local machine on which it was first generated. Working from a second machine on the same project breaks this assumption: the local private key file is missing, `joy auth token add` bails with "delegation state is inconsistent", and `joy ai rotate` is the only sanctioned recovery. Rotation rewrites `project.yaml` (new `delegation_verifier`, new `rotated:` timestamp) and invalidates the other machine in turn. Each machine-switch produces a `project.yaml` commit that has no architectural meaning -- it just records "today I worked on the other machine".

  Multi-machine work for a single human (laptop + desktop, work + home) is normal, not an edge case. The current cost (a project.yaml commit per crossover) is paid by every contributor in this position.

  A naive fix -- store a list of delegation public keys per (human, AI) pair, one per machine -- removes the pingpong but leaks per-developer machine count and per-machine timestamps to every reader of `project.yaml`. That privacy regression is itself a non-starter.

  The proposed alternative is to derive the delegation seed deterministically from the human's existing passphrase-derived identity key, plus a per-(human, AI) salt stored once in `project.yaml`. Identical inputs on any machine yield identical Ed25519 keypairs, so the same human reaches the same delegation from anywhere. The salt is the only thing in `project.yaml`; no per-machine state, no leak. ADR-033 §2 (ephemeral session keypair bound to JOY_SESSION) and ADR-034 (multi-use tokens) are unaffected.

  The decision is captured in ADR-037 in the umbrella repo (docs/dev/architecture/decisions/ADR-037-passphrase-derived-delegation-keys.md), which spells out the derivation, the security delta versus ADR-033 §1, the migration path, and the rotation semantics under the new model.

  Acceptance:
  - ADR-037 ratified and merged in the umbrella repo.
  - A follow-up implementation epic links back to this decision and ADR-037.
  - No code change in this item; implementation proceeds under the follow-up epic.
