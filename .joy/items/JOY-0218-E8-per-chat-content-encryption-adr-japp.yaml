description: 'chat_crypt module: AES-256-GCM content key per chat, X25519 pairwise wraps in the chat object (recipient header, no zone), epochs with rotation forward on removal, add as one wrap, sealed envelope over text/payload/details with chat+epoch+message AAD, custodian seed (platform or signed-in person) sealing at the chats::save_chat choke point and opening on load, no plaintext at rest, identity precondition (ephemeral otherwise). Regression test for the custodian roundtrip.'
