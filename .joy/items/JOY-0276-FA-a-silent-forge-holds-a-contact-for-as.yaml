  text: 'Delivered: forge contacts are bounded process-wide on the first remote callback (10s connect, 15s socket silence; socket bounds, a living transfer is untouched), with a test against a listener that accepts and stays silent (gives up at 15.06s). joy-chat-store exports fetch_from_forge, the network half of pull_from_forge, for hosts that must not hold a lock across the network. 420 joy-core and 43 chat-store tests green, clippy -D warnings clean.'
