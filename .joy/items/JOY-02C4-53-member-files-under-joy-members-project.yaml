description: |-
  Delivery 1 of JI-019E-40, decided in JI-019D-46 sections 4, 5 and 8.

  Model: joy-core reads and writes one file per member, .joy/members/<id>.yaml, and project.yaml keeps name, acronym, description, language, forge, privacy, docs, release, status_rules and members as a list of ids. The in-memory Project with its member map stays, so Guard, auth, platform and app keep their API; only the store assembles it. members.yaml (members_file.rs) is unchanged. The member file carries updated (merge driver), email in open mode, capabilities, adapter, model, description, the signed project maximum (JOY item of delivery 2 fills it; this item carries it through), the key material fields of today's Member struct, ai_delegations, and origin.

  File id: m-<short> as today's shape (member_id.rs), but for migrated members derived with an own HKDF domain tag over the verify key (else over the current map key), so it never equals the derived anonymous id, and random for new members. In open mode the id appears only as the file name; items and logs keep the e-mail. In anonymous mode the id is what items and logs reference, replacing the derived id, and the derivation of opaque_member_id goes once the old reader is gone. The platform reads the id from the file, it no longer recomputes it.

  Origin instead of attestation (section 5): humans carry origin { attester, signed_at, signature over project id, member id, otp hash }, made in joy project member add and the enrollment path (auth/enroll.rs), verified in login.rs when present. The capability comparison, founder_must_be_attested and maybe_auto_seal are removed. AI members carry no attestation. Migrated humans get origin { attester, signed_at } copied from the old attestation plus commit: the HEAD before the migration; login accepts it.

  Migration (section 8): a repo migration in migrations/repo that runs only when a human session or an unlocked seed is available (CLI: the auth gate of the first command; desktop and portal: their unlock path calls into joy-core), never from an AI session, never on the platform server. It writes the files, the head, the list, the origins, and signs the project maximum of every AI member with the acting human's key from today's values (capabilities as held, level = max-interaction-level if set else autonomous, no personal grants). It is deterministic so that two hosts produce identical files. Before it has run, the old project.yaml reader serves the same Project; both readers live behind load_project. The downgrade guard applies as for every migration; the old reader is removed after the window.

  Tests: the fixtures and the migration test of the safety net task pass unchanged after the migration; a test that a member file edited by hand to add a capability to an AI member changes nothing for the AI (delivery 2 proves the refusal, this item proves the file is not the source).
