  date: 2026-10-08T00:18:51.394103370Z
  text: 'Result: every member lives in .joy/members/<id>.yaml, project.yaml keeps the head and the list of ids (store.rs load_project/save_project, member_files.rs). The id is only the file name: random for new members, deterministic for brought-over ones, the existing id for people of an already anonymous project. A project from before is brought over once by the first person whose key is at hand (login, unlock, any passphrase command), never by an AI session and never by the platform server; member_migration::prepare/finish split the same step for a key held in a browser. Origin replaces the attestation for people; an AI member carries what the project allows it, signed by that person. Fixture projects (open and anonymous, tests/fixtures/members) stay in the old format and are asked the same questions after each host opened them, including a NEW token for the AI member after the move. Found on the way: the delegation key was derived over the old id, so a renamed member could not get a new token; the derivation now uses one form for both spellings (crypt 7ffd62e).'
