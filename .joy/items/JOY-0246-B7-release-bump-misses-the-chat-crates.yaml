description: 'just release-all minor failed: joy release bump rewrote joy-core, joy-cli and joy-ai but left joy-model, joy-chat and joy-chat-store at 0.19.0, so the Cargo.lock refresh could not resolve joy-chat ^0.20.0 and the release aborted mid-way (platform and the umbrella failed downstream). release.version-files in .joy/project.yaml never learned the crates added since: crates/joy-model/Cargo.toml, crates/joy-chat/Cargo.toml, crates/joy-chat-store/Cargo.toml, plus the workspace root Cargo.toml which pins joy-model as a workspace dependency. Fix: add the four files via joy release version-files add.'
