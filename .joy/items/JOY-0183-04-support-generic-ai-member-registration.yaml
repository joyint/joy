description: |-
  Current `joy ai init` only handles AI tools that can be auto-detected from the filesystem (Claude Code, Qwen Code, Mistral Vibe, GitHub Copilot CLI). Tools that exist only at runtime (e.g. GitHub Copilot Chat in VS Code, Cursor's built-in chat, generic chat-only AIs) cannot be registered, so they have no member entry, cannot redeem delegation tokens, and effectively cannot use Joy under governance.

  Underlying support already exists: `is_ai_member(id)` accepts any `ai:*` ID, and `joy auth --token <TOKEN> --json` returns the `member` field so the AI learns its identity from the token redemption response (no out-of-band identity step needed).

  What is missing is a way to register an AI member without tool-specific file generation. Add:

    joy ai member add <ID> [--capabilities <list>]

  Behaviour:
  - Validates ID is in `ai:<name>@joy` form.
  - Registers the member with AI-default capabilities (same defaults as `setup_new_tools()` applies today).
  - Signs an attestation with the acting human's keypair (same flow as the tool-driven path).
  - Writes no tool-specific files. Operational instructions come from `joy ai tutorial` (JOY-0181-95), which is universal.
  - Final output: a copy-paste hello snippet the user can give the AI on first contact, e.g. "In this Joy project, get a delegation token from the user, redeem with `joy auth --token <TOKEN> --json`, take `member` as your identity and `session_env` as auth. Then run `joy ai tutorial`."

  Optional follow-up in `joy ai init`: after iterating detected tools, offer "Add a generic AI member? [y/N]" so users without any detected tool still complete the init flow with something usable. Depends on JOY-0181-95 (tutorial must be the universal instruction source) and JOY-0182-17 (`--session` flag makes the AI's auth permission setup simpler).
