description: Create members.yaml at joy auth init, stored encrypted via the existing Crypt model (one zone key, wrapped per member against verify_key; no new primitive). Decrypt into memory after auth; display only (name -> e-mail fallback), never the match. Erasure = remove the entry and re-encrypt (shared zone key, per-member wrap), not per-entry crypto-shredding. Ref ADR-042 §3.
