description: 'Operator 2026-08-09, Doku ''Joy Identitaet'' (docs.int.joydev.com/doc/joy-identitat-hm9930cQC3): In der Platform eine E-Mail-Adresse einrichten, zweistufig (Adresse angeben, Bestaetigungslink klicken). Ab dann Login per Magic Link und Konto-Wiederherstellung (Fall: einzige Forge gekuendigt; Abo und Daten haengen an der Konto-UUID und bleiben erhalten). Die Adresse ist eine TUER, keine Identitaet: Projektarbeit braucht weiter die Mitglieds-Aufloesung, Registrieren/Sync praktisch eine Forge-Identitaet. Keine Identitaetspruefung noetig (Abo: Zahlerpruefung macht der Zahlungsdienstleister).'
