  text: 'Umgesetzt: Platform-Endpoints /auth/email/{start,set,remove,callback} (Token nur gehasht, einmalig, kurzlebig; Mailer log/file/smtp hinter JOYINT_MAIL_TRANSPORT), App-UI (Sign-in-Seite + Settings Login e-mail), E2E grün (setzen, per Link bestätigen, per Link anmelden, Link einmalig). joy-core: member_key_for_addresses_or_forge + Direction-two-Bats-Beweis. Commits joy 69900b8, platform 88d16d5, app 39557d1.'
