description: |-
  joy add/edit accept short-form IDs (JOY-0042 for JOY-0042-A3) for --parent; joy deps --add does the same for dep refs. The short form is stored as-is in YAML. Internal lookups use exact string match, so silently:

    - joy ls --tree, joy roadmap render children flat
    - joy deps lists deps as "(not found)"
    - joy ls --blocked misses blocked items
    - delete cleanup misses short-form refs

  Reproducer:
    joy add task "Parent A"                  # id TST-0001-79
    joy add task "Child B" --parent TST-0001
    joy ls --tree                             # appear as siblings

  Fix: in the central item-loading path, build short->full map from loaded items and rewrite parent/deps fields in memory. YAML stays untouched on read; the next regular write persists the normalized form. Out of scope: milestone refs.
