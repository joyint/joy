description: 'Every joy call in a freshly created project with an AI member prints ''warning: project.yaml uses legacy auth field names from before v0.12; run joy update to normalise''. Cause: migrations::project_yaml::apply returns ONE changed flag for all migrations, and m_2026_07_ai_member_adapter fills in the missing adapter pin for a new AI member. That sets the flag although nothing about the auth fields is old, so the message is untrue and sends people to joy update for nothing. Proposal: split the flags (legacy_auth for the warning, any for joy update). Found while setting up the chat e2e projects.'
