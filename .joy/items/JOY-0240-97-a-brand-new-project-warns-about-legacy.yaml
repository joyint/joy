description: 'Jeder joy-Aufruf in einem frisch angelegten Projekt mit AI-Member druckt ''warning: project.yaml uses legacy auth field names from before v0.12; run joy update to normalise''. Ursache: migrations::project_yaml::apply liefert EIN changed-Flag fuer alle Migrationen, und m_2026_07_ai_member_adapter fuellt bei einem neuen AI-Member den fehlenden adapter-Pin nach. Das setzt das Flag, obwohl an den Auth-Feldern nichts alt ist. Die Meldung ist also unwahr und schickt Leute grundlos zu joy update. Vorschlag: zwei Flags trennen (legacy_auth fuer die Warnung, any fuer joy update). Gefunden beim Aufsetzen der Chat-e2e-Projekte.'
