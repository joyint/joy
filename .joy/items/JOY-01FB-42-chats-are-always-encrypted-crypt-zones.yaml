description: 'Operator directive (2026-07-04): all chats are ALWAYS encrypted and decryptable only by their participants (crypt zones and grants per chat); signing in happens when a project is opened; and online too every chat is persisted encrypted (the web through wasm, the AI keys inside the container). Counterparts: JAPP-00C8-3E (app), JP-0064-C1 (platform). Built on the chat channel (message ids, JAPP-00C9-80): encryption per message with the zone key, and the merge filter keeps working because it is id-based.'
