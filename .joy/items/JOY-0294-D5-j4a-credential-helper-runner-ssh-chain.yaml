  text: 'Plan: (1) new module joy-core/src/vcs/credential_helper.rs per D1.3: config lookup incl. port and multivar, value mapping to git-credential-<name> binaries found via the Git for Windows registry keys or the libexec dir, argv splitting with single quotes, per spawn env for Background and Delegated, get/store/erase, stderr capture; (2) new module vcs/ssh_config.rs (ssh2-config) with Host, HostName, Port, User, IdentityFile, IdentityAgent, UserKnownHostsFile, GlobalKnownHostsFile, StrictHostKeyChecking, HashKnownHosts, ProxyCommand refusal; (3) the ssh chain of D1.4 in forge.rs Auth::Local: agent probe, key pre validation, constant user name, no attempt cap; (4) credential shapes of D1.6 replacing basic_auth_user, the allowed mask fix, remote_url aligned with origin_or_first; (5) the cross process file lock primitive joy_core::util::file_lock (fs4) for J4h and J3. Tests: unit tests with fake helper scripts and fake keys, no network. Worktree: .claude/worktrees/fcng-J4a/joy on branch feat/forge-connection-ng-j4a.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-17T04:15:47.641483076Z
  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j4a, commits 3ce0dfa [JOY-0294-D5] Add the credential helper runner,, 4ea00c6 [JOY-0294-D5] Resolve credentials in Auth: shap, 3c17e5f [JOY-0294-D5] Dial the ssh config's own address; merged into feat/forge-connection-ng by the integrator, 12 conflicts with J5 resolved, 950 workspace tests green).\n\nThe branch now holds three commits for JOY-0294-D5, and the third one closes the review: the 766 uncommitted lines that made the reviewed HEAD and the handed-over worktree two different implementations are committed, together with the fixes the review asked for, and the tree is clean and green. The engine's forge table keeps github.com, gitlab.com and codeberg.org and guesses at no host name, so a self-hosted GitLab reachable at code.github-mirror.acme.example is no longer classified as GitHub Enterprise, sent x-access-token and then denied the oauth2 second shape, which is what made a valid token read as refused and counted towards GitLab's ban. HostName and Port are applied for the first time: ssh_config::effective_url builds the address joy dials, keeping the remote's own form and using the bracketed scp form [git@host:2222]:owner/repo.git where a port has to go in, because the scp form's path has no leading slash and the ssh:// form's does; forge::contact_remote hands libgit2 an anonymous remote on that address at every contact site, clone puts the caller's URL back into the new origin, and .git/config is never rewritten. The alias's own Host block is still what the chain reads, through the new ssh_config::for_contact, so the IdentityFile, IdentityAgent and User written under Host work survive the rewrite, and contact::run keys the throttle and the strike gate on the host a socket is actually opened to. Where an insteadOf rule matches the configured URL joy stands back, because libgit2 applies those rules to the URL as configured and git applies them before ssh reads anything. The ssh config is now read the way ssh reads it: Include is spliced in where it stands with glob patterns and a bounded depth, so a ProxyJump inside a config.d fragment is refused by name instead of being invisible; a Match block no longer falls into the Host block above it; the machine's file begins in its own Host * scope; and the IdentityAgent socket is put back when the contact ends. The ssh chain follows ssh's own order too: the URL's user beats the config's User, the six default identity files are in readconf's order, .pub is appended to the whole file name, and a named IdentityF\n\nAcceptance:\n- [met] Acceptance 1: on a machine with credential.helper=manager and no git on PATH, joy obtains a credential and a process trace shows no git proc: tests/credential_helper_no_git.rs sets PATH to one directory holding git-credential-manager and no git, asserts Search::of_this_machine() finds git nowhere, and gets the credential; it also asserts the store that follows. The no-git-process half is proved by c\n- [met] Acceptance 2: a passphrase protected key file is skipped with 'passphrase needed' instead of aborting the whole fetch: ssh_auth::candidate_for returns 'key <path>: passphrase needed, skipped' for a Background or Delegated host; pinned by the lib tests and by tests/ssh_chain_from_home.rs, where the locked id_ed25519 is named and the readable id_rsa is still offered.\n- [met] Acceptance 3: a GitHub Enterprise host without 'github.com' in its name authenticates on the first attempt: a_claimed_ghes_host_is_sent_x_access_token_on_the_first_attempt drives the real credentials closure and reads the user and password out of libgit2's own git_credential_userpass_plaintext struct.\n- [partly] Acceptance 4: on Windows an openssh-key-v1 file is reported as unreadable by name: The rule and its sentence are pinned through the windows: bool parameter of chain_for and candidate_for, which runs on this Linux host. The Windows-only code itself (the Git for Windows registry lookup, the .exe/.cmd/.bat helper names, the named-pipe agent con\n- [met] Acceptance 5: a remote whose ssh config carries ProxyCommand fails with the named sentence and not with a DNS error: tests/ssh_proxy_command.rs asserts the exact D1.4 sentence, asserts the words resolve, dns, getaddrinfo and connect do not appear, and now also asserts the refusal spends no turn of the host's five second gap.\n- [met] Review must_fix 1: the worktree holds 766 uncommitted lines and does not pass its own tests: Everything is committed in 3c17e5f and the tree is clean. The test it broke, a_helper_that_refuses_is_quoted_with_its_own_sentence, passes again because quoted() was restored to D1.3's exact sentence; the implementer's concern (an exit code lost) is answered b\n- [met] Review must_fix 2: known_forge_kind keeps a substring guess over the host name: The three-host table only, no guess. the_engine_table_holds_three_hosts_and_guesses_at_none asserts None for github.internal.example, gitlab.acme.example, gitea.int.joydev.com, forgejo.example.org and then asserts that host gets oauth2 first and x-access-token\n- [met] Review must_fix 3: HostName and Port are parsed but never applied: ssh_config::effective_url builds the address joy dials, keeping the remote's form (bracketed scp where a port must go in); forge::contact_remote hands libgit2 an anonymous remote on it at every contact site, clone_raw dials it and puts the caller's URL back in\n- [met] Review should_fix 1: the ssh config User wins over the URL's user: The URL's user wins now, as ssh -l does; the test that pinned the opposite was rewritten and a second case asserts the config's User is used when the URL names none.\n- [met] Review should_fix 2: apply_identity_agent sets SSH_AUTH_SOCK process-wide and never restores it: AgentScope restores the previous value on drop and the scope is held for the lifetime of the chain; the test the_identity_agent_is_put_back_when_the_contact_is_over covers it. The variable is still process-wide while the contact runs, which is an open question\n- [met] Review should_fix 3: an Interactive host gets no deadline and can hang the fetch: wait_bounded takes a Duration, not an Option, so there is no unbounded branch left; PROMPT_DEADLINE is 600 s for a host that may prompt and QUIET_DEADLINE stays 30 s. a_helper_that_never_answers_is_stopped_whoever_is_watching runs a sleeping child through it.\n- [met] Review should_fix 4: a stale presented entry is stored by a later contact: credential_helper::forget_presented is called at the start of every contact::run, with the reasoning in the comment.\n- [met] Review should_fix 5: store and erase go only to the helper that answered: The whole chain is resolved before the first get and remembered, and tell() runs the operation over every helper of it, the way git's credential_approve and credential_reject do.\n- [met] Review should_fix 6: parse_files concatenates the two files and Include is not handled: A Host * line separates the two files, and splice_includes expands Include where it stands, with glob patterns, resolved against ~/.ssh or /etc/ssh, depth bounded at 8 so a cycle stops. Two unit tests and the alias integration test cover it, including a ProxyJ\n- [met] Review should_fix 7: a named IdentityFile that is not there is dropped silently: It is now a note naming the file and the host; ssh's own six defaults stay silent, because most of them never exist. Asserted in the_chain_offers_the_agent_first_then_every_key_that_survived.\n- [met] Review should_fix 8: with_extension(\"pub\") is wrong for a key file name with a dot: .pub is appended to the whole file name.\n- [met] Review should_fix 9: a refusal spends the host's throttle turn: contact::run asks ssh_config::refusal_for_url before take_turn and skips the turn when nothing will open a socket; timed in tests/ssh_proxy_command.rs against a five second gap.\n- [met] Review should_fix 10: default_identity_files is not in ssh's order: id_rsa, id_ecdsa, id_ecdsa_sk, id_ed25519, id_ed25519_sk, id_dsa, the order ssh's add_identity_file calls produce. The stale comment in tests/ssh_chain_from_home.rs was corrected too.\n- [met] Review should_fix 11: the bracketed scp form parses as nonsense: scp_like splits the authority at the first colon outside every bracket, with a bracket counter like libgit2's state machine, and tells the bracketed port form from an IPv6 literal with libgit2's own is_ipv6 rule. Two new unit tests cover [git@host:2222]:path, \n- [met] Review should_fix 12a: the allowed mask fix of D1.6 has no test for an insteadOf rewrite to ssh under Auth::Token: a_mask_without_user_and_password_never_gets_the_token drives the real closure with an https URL under an ssh-only mask and then with the ssh URL an insteadOf rewrite produces, asserting the answer is the user name and never a user-and-password credential.\n- [not_testable_here] Review should_fix 12b: the Windows leg has no test that executes: This host is Linux; the registry lookup, the .exe/.cmd suffixes and the named-pipe agent are behind cfg(windows) and cannot run. Reported as an open question for CI on Windows.\n- [met] Review should_fix 12c: 'no git process' is proved by a shim, not by git being absent from PATH: tests/credential_helper_no_git.rs is the acceptance run with PATH holding one directory and no git in it; the shim test stays beside it.\n- [partly] Review should_fix 13: joy-core still enables git2's cred feature: Dropped from joy-core and from joy-chat-store (cargo unifies features, so leaving it on the sibling would have re-enabled it for the whole build). It cannot be dropped altogether: git2 0.21's https and ssh features both depend on cred, so under forge-net Cred:\n\nDeviations:\n- A contact over a rewritten ssh alias runs on an anonymous remote (git_remote_create_anonymous), which carries no configured refspecs, so libgit2's own push-side tracking ref update does not fire for it. J4b owns 'the push side tracking ref write and push_update_reference' (D1.5) and covers this case with the twin; until then a push over an aliased \n- quoted() keeps D1.3's exact failure detail (the helper's own sentence alone) rather than the implementer's uncommitted 'exit 1: <sentence>'. The exit status is logged at debug level in run() instead, so the number is not lost.\n- The Windows agent is offered even when joy's probe found no SSH_AUTH_SOCK. This change stood uncommitted in the worktree, the review did not flag it, and it broke tests/ssh_chain_from_home.rs. It was kept and the test was corrected, because the claim checks out in the vendored sources: libssh2 reaches Pageant through a window message and the OpenSS\n- The alias resolution the review implied for forge.rs lives in ssh_config as the public for_contact(dialled, configured) instead of a private helper in forge.rs, so it is testable through the public API in a test binary that owns HOME.\n- The private cred_config(repo) became cred_source(repo) returning a CredSource that carries the config and the configured remote URL. This is what lets the chain read the alias's Host block after the URL was rewritten. No public function was renamed and every call site kept its shape.\n- contact_remote stands back when a url.*.insteadOf or url.*.pushInsteadOf rule matches the configured URL, because libgit2 applies those rules to the URL as configured (remote.c:509-510) and git applies them before ssh reads its config. Predicting WHICH rule wins is J4b's work (D1.5); this only asks whether there is one.\n- crates/joy-chat-store/Cargo.toml is one line outside the package's file list. It had to change with joy-core's, because cargo unifies features across the workspace and leaving git2/cred on the sibling would have kept the forbidden API compiled in everywhere.\n- git2 was added as a dev-dependency of joy-core (same version and features as the normal dependency, so nothing extra is compiled) because credential_helper::get takes a git2::Config and the no-git-on-PATH acceptance test has to build one.\n\nOpen questions:\n- The Windows leg is untested on this host: the Git for Windows registry lookup, the .exe/.cmd/.bat helper names and the named-pipe agent connect are behind cfg(windows) and never execute here. The openssh-key-v1 acceptance is proved only through the windows: bool parameter. This needs a run on the Wi\n- ssh_config::AgentScope still sets SSH_AUTH_SOCK in joy's own process, which D1.4 asks for and which is the only way to reach 1Password, Secretive or KeePassXC, because libgit2 hands libssh2 no agent path. The scope puts the old value back when the contact ends, but for the duration of that contact e\n- Match blocks other than 'Match host <patterns>' are dropped rather than applied, because joy cannot evaluate exec, user or canonical. A ProxyCommand that lives inside a 'Match exec' block is therefore not seen and that host is not refused by name, which costs the named sentence for that one host and\n- Should the throttle key and the strike gate name the dialled host or the configured alias? This commit chose the dialled host, so two aliases for one host share one gap, which is what D1.1 asks for ('the throttle key, the twin source and the contacted remote agree'). If any surface displays that key\n- review should_fix 13 cannot be closed mechanically: git2 0.21's https and ssh features both depend on cred, so under forge-net Cred::credential_helper is compiled in whatever joy asks for. Making it impossible would need a patched git2 or a CI grep; the manifest comment carries the rule for now."
