  date: 2026-09-16T23:25:37.438774121Z
  text: 'Plan: (1) new module joy-core/src/vcs/credential_helper.rs per D1.3: config lookup incl. port and multivar, value mapping to git-credential-<name> binaries found via the Git for Windows registry keys or the libexec dir, argv splitting with single quotes, per spawn env for Background and Delegated, get/store/erase, stderr capture; (2) new module vcs/ssh_config.rs (ssh2-config) with Host, HostName, Port, User, IdentityFile, IdentityAgent, UserKnownHostsFile, GlobalKnownHostsFile, StrictHostKeyChecking, HashKnownHosts, ProxyCommand refusal; (3) the ssh chain of D1.4 in forge.rs Auth::Local: agent probe, key pre validation, constant user name, no attempt cap; (4) credential shapes of D1.6 replacing basic_auth_user, the allowed mask fix, remote_url aligned with origin_or_first; (5) the cross process file lock primitive joy_core::util::file_lock (fs4) for J4h and J3. Tests: unit tests with fake helper scripts and fake keys, no network. Worktree: .claude/worktrees/fcng-J4a/joy on branch feat/forge-connection-ng-j4a.'
