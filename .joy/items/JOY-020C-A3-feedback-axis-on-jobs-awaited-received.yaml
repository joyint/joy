description: 'Orthogonal dialog field on the job payload, exactly the validity recipe: job.feedback with values awaited (assignee asked, operator is up) and received (answer in, assignee is up), absent = no dialog. joy edit <JOB> --feedback awaited|received|none (assignee/operator set it alongside a normal comment); column in ls -J and board -J grouping; shown in joy show. See JOY-01FE-37 DIALOG section.'
