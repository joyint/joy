description: |-
  \`tests/integration/ai_init_auth_inline.bats\` calls \`joy ai init\`
  through \`run env PATH=... joy ai init --passphrase ...\` without
  redirecting stdin. The other ai-init tests in \`ai.bats\` all close
  stdin with \`</dev/null\`.

  \`joy ai init\` reaches \`std::io::stdin().read_line()\` in two places
  without a TTY check:

  - \`crates/joy-cli/src/commands/ai.rs\` doc-template prompt
    (\`Create template? [Y/n]\`)
  - \`confirm_default_yes()\` for the per-tool \`configure? [Y/n]\` prompt

  When stdin is a TTY (i.e. \`just check\` from an interactive shell),
  the subprocess blocks on the first prompt and the test appears to
  hang. In CI (and in any \`stdin = pipe/null\` environment) the
  \`read_line\` returns 0 bytes, the empty-input branch picks the
  Default-Y, and the test passes -- which is why the regression was
  invisible in automated runs.

  This item is the test-side fix only: add \`</dev/null\` to the three
  \`joy ai init\` invocations in \`ai_init_auth_inline.bats\` so the
  suite is robust against the caller's terminal state. A separate
  hardening (TTY-aware prompt helper in \`joy ai init\`) can be
  discussed later if needed.
