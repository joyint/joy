description: Implement the cross-member zone-key wrap that joy crypt grant needs. Add X25519 conversion of Ed25519 verify_keys to joy-crypt, add an authenticated ECDH primitive (sender's seed + recipient's verify_key produces a pairwise KEK), wrap zone keys for granted members, decrypt on the recipient side. Replaces the bail in joy-cli/commands/crypt::run_grant. Required to ship joy crypt grant; default-zone CLI in JOY-0148-84 ships without grant pending this primitive.
