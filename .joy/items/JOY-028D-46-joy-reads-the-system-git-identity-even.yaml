description: 'Found on 2026-09-14 in the nightly check-all on the self-hosted runner: bats tests 306, 307 and 310 in init_founder_recovery.bats fail; joy init finds a git identity although the test removes the repo identity and isolates HOME and XDG_CONFIG_HOME and sets GIT_CONFIG_NOSYSTEM=1. Since JOY-0288-72 joy reads user.email through git2::Config::open_default, and libgit2 1.9.6 always adds the system config (git_config_open_default) and knows no GIT_CONFIG_NOSYSTEM, while git itself honours it. The runner has an identity in its system config; mule has none, so the suite passes there.'
