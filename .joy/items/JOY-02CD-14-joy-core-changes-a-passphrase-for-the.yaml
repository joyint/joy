description: 'Part of the passphrase change across the surfaces (operator 2026-10-12). auth::change_passphrase(project: &mut Project, member_key, current, new) -> Result<(), JoyError>: accept_passphrase(new), refuses a new passphrase equal to the current one, rewraps through joy-crypt (CRYPT-0017-E7) and sets the member''s seed_wrap_passphrase; kdf_nonce, recovery wrap and verify_key stay. joy auth passphrase calls it and keeps its prompts, its session removal and its messages; the desktop calls it from its command (JAPP item). Test in joy-core: the project''s member opens with the new passphrase afterwards and not with the old, same identity, the same-passphrase refusal, the empty refusal.'
