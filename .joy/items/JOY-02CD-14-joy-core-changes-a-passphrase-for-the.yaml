  date: 2026-10-12T10:48:18.768261255Z
  text: 'Done on feat/passphrase-meter (87c725a): auth::check_new_passphrase (any text, not the current one; JoyError::PassphraseUnchanged) and auth::change_passphrase (unwrap with the current, rewrap through joy-crypt, set seed_wrap_passphrase; a member without a wrap is refused, the CLI migrates such an entry itself). joy auth passphrase keeps its prompts, its legacy migration and its session removal and asks the shared check. Tests: the check''s three cases, the change''s wrap moves with the identity kept and a wrong current passphrase leaves the wrap alone. The desktop command joy_auth_change_passphrase calls it (JAPP-0318-E8).'
