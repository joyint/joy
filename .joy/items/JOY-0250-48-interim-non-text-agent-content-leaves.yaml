description: 'Until content v2 (JOY-024B-AC) carries the payloads, a non-text ACP block (image, audio, embedded resource, resource link, unknown kind) is never dropped: the collector records kind plus ONE label (name/MIME/size, built once in Rust so live view and record say the same), the details JSON gains an optional contents array (v1 stays readable for older parsers), and the live wire carries a turn-content event. The activity block renders the rows with a paperclip next to thoughts and tools, live and after reload; the agent panel shows the same fact. Superseded by JOY-024D-3C. Known limit: a turn whose ONLY output is non-text still posts no message, so its record exists only in the live view until content v2.'
