    [x] AiToolItem reports 'installed, not configured' and 'not installed' as RowMark::Info so they no longer count toward the --check exit code.
    [x] 319 unit tests, 56 sanity bats green, clippy + fmt clean. Adding a new artefact now means: write one impl, append one entry in update_registry::all(); orchestrator and check pick it up automatically.
