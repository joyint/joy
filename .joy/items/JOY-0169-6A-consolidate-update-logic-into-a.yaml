    [x] New module crates/joy-cli/src/update_registry.rs with UpdateItem trait + RowMark enum (Ok / Stale / Info) + CheckRow / RefreshRow value types + all() returning Vec<Box<dyn UpdateItem>>.
    [x] Items implemented: VersionMarkerItem, GitignoreBlockItem, GitattributesBlockItem, MergeDriverItem, HooksPathItem, EmbeddedFilesItem (parameterised, three instances for HOOK_FILES / CONFIG_FILES / PROJECT_FILES), SecurityMdItem, ProjectYamlSchemaItem, AiToolItem (parameterised, four instances for claude / qwen / vibe / copilot).
    [x] commands/update.rs is now a thin orchestrator: iterate the registry by section, format rows joy-style, drive the binary self-update around it. run_check is comprehensive (every row), run_full_sync is terse (only changed rows + lazy section headers).
    [x] commands/auth.rs and commands/ai.rs lost their per-domain run_update_default / run_check_default / update_terse functions; the work moved into the registry items. They now expose only the helpers the items need (auth_state_pub, write_migrated_project, tool_display_name, tool_ids, is_tool_installed, is_tool_configured_pub, is_tool_stale_pub, refresh_tool_by_id, sync_gitignore_for_configured_tools).
