description: |-
  Today the update logic is split across joy-cli (commands/update.rs orchestrator, commands/auth.rs run_update_default + run_check_default, commands/ai.rs configure_* + is_tool_stale + run_update_default + run_check_default) and joy-core (init::onboard, ensure_gitattributes, ensure_gitignore, register_merge_driver, install_hooks; embedded::diff_files, sync_files). joy update and joy update --check have to know about every domain explicitly to stitch the output.

  Refactor to a registry pattern: a trait UpdateItem with name(), section(), check(root), refresh(root), exposed by each domain. A single const list (or builder) registered centrally drives both joy update and joy update --check. Adding a new updateable artefact means writing one impl, not threading a third call into each side.

  Acceptance:
  - New UpdateItem trait + registry in joy-cli (or joy-core if portable).
  - Existing per-domain refreshers/checkers re-expose themselves as registry entries; legacy run_update_default / run_check_default disappear in favour of registry iteration.
  - joy update and joy update --check produce equivalent output (terse vs comprehensive) with no per-domain plumbing.
  - Adding a fictional new item (e.g. .joy/foobar.yaml) requires only an impl + registry entry, no edit in update.rs.
  - Tests stay green; behaviour identical for existing items.
