description: 'Heute entscheidet das Tool sein Default-Modell selbst: AiConfig hat ein model-Feld, aber keine Oberfläche lässt den Menschen eines wählen (joy ai init/edit fragen nicht danach; die App schickt beim Speichern ein leeres model). Gewünscht (Horst, 2026-07-18, erneut bestätigt 2026-08-22): bei joy ai init und joy ai edit das Modell pro Tool wählbar machen, damit Clients (Project Settings, künftige Flows) ein Tool-Dropdown mit abhängigem Modell-Dropdown anbieten können. Ersetzt das nie gelandete JOY-021B-2B aus dem geschlossenen PR 16 (Branch feat/jon-pda).'
