description: 'mps-netbrain-demo, 2026-08-29 21:47Z: ''@vibe wie spät ist es?'' sent with joy chat send reached the web app, and ai:vibe@joy never answered. An AI turn is started by the client that sends the message, under the sender''s delegation (web app: the platform host, desktop app: the local host); the CLI has no chat session and no turn host, so a mention from it can never be answered, and the sender learns nothing. Decision (Horst, 2026-08-30): the CLI refuses a message that mentions an AI member of the project, naming the reason, instead of sending a mention into the void. Platform side: JP-00FC-9B (closed in favour of this).'
