  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j3, 2 commits; merged into feat/forge-connection-ng by the integrator).\n\nAll four must_fix items and all seven should_fix items are fixed and tested, on branch feat/forge-connection-ng-j3 in the fcng-J3 worktree. `logout` now takes the refresh lock of D2.6a before it reads the entry, re-reads under it, and answers busy rather than deleting beside a refresh; it also refuses to guess between two of joy's own logins and reports a failed write instead of claiming success. The probe of D4.1c reads Reach.push against a direction the `token` verb takes with `--for`, and the login memory records only a login that pushed, which closes the \\\"This is not academic\\\" failure in both the probe and the cache. A forge that could not be reached is no longer reported as logins that cannot reach the repository, and the login memory survives it. The 0600 file is written under a whole-file lock beside the document and through a staging file and a rename, and a document joy cannot read is never overwritten. Beyond the list: the login order now runs inside every verb and not only inside `token` (one probe per remote per call), every secret-carrying type prints a fingerprint, a delegated session never opens this person's credential store, and the keychain half of D2.6 is executed by tests for the first time, including a login end to end that answers \\\"source\\\":\\\"keychain\\\" with the granted scopes, which was the half-met acceptance criterion. Tests: 301 passing in the connector and CLI crates, 705 in joy-core with forge-net, 225 in the rest of the workspace, clippy and fmt clean; nothing contacts a real forge.\n\nAcceptance:\n- [met] MUST FIX 1: logout writes the credential store and takes no refresh lock: verbs.rs logout takes lock::take(state_dir, host, login) before it reads the entry, re-reads under it, revokes and removes, then drops the lock before the branch that spawns gh (flock belongs to the open file description\n- [met] MUST FIX 2: the probe of D4.1c throws the push half away, and token has no direction: token gained --for (the flag decision 29 already names). Need::Push (write|create|release) accepts only a candidate whose Reach.push is true, Need::Read takes the first that reads, and no --for prefers a pusher but still\n- [met] MUST FIX 3: a forge that cannot be reached is reported as \"none of your logins can reach this repository\" and the memory is delete: probe now distinguishes reaches()==None (transport) from Some(Reach{read:false}) (a real 404). Any silent candidate with no winner ends in Probed::Unreachable: pin::forget_remote is not called, no-login-for-repo is not a\n- [met] MUST FIX 4: the 0600 file is one document for every host and login but the lock is per host and login: Vault::put and Vault::remove hold one whole-file advisory lock (joy_core::util::file_lock, beside forge-tokens.json) across read, change and write, and write_private writes a staging file, fsyncs and renames it into plac\n- [met] SHOULD FIX 1: logout on a host with two of joy's own logins removes nothing and names gh's command: logout answers {\"removed\":false,\"revoked\":false,\"source\":null,\"logins\":[..],\"message\":\"... Say which one to sign out with --login.\"} before the foreign branch is reached. Test: logout_on_a_host_with_two_logins_asks_which\n- [met] SHOULD FIX 2: the login order of D4.1c runs in the token verb only: Ctx carries the forge (cli::run_from now takes &[&'static dyn Forge]; the four binaries needed no change) and find_token runs step 4 after step 3, so store, files, release, repositories and create-repository all reach a \n- [met] SHOULD FIX 3: Vault::remove discards its write error while logout reports success: remove returns Result<Option<Source>, String>; a keychain removal that succeeded is still reported when only the file half failed, and logout answers removed:false with the reason in message. Test: logout_that_could_not_\n- [met] SHOULD FIX 4: the PKCE door buffers its waiting events: the tick closure emits straight into the sink. Test: a_pkce_login_reports_the_seconds_left_while_it_is_still_waiting waits for a waiting event BEFORE it knocks on the loopback listener, so the buffered version cannot pas\n- [met] SHOULD FIX 5: secret-carrying types on the connector side derive Debug: Record, Resolved, Grant and DeviceStart (the device code is spendable too) print auth::Redacted, which is the twelve hex digits of the SHA-256 D2.6a already compares; Keys::Fake prints an entry count. Poll inherits it th\n- [partly] SHOULD FIX 6: D1.10 mechanism 5 is unimplemented for the credential store: Ctx::new reads the host kind: a Delegated session gets Vault::none() and never opens this person's entry (its credential travels in --token-env, and D3.11 already refuses the interactive verbs there). A Background host k\n- [met] SHOULD FIX 7: the keychain branch is never executed by any test: the store behind a Vault is now a small enum. A test installs an in-process one with an operating system's semantics (it persists across Entry objects), which executes the entry addressing, the read-back detector, the IN\n- [met] J3: `joy-forge github login --host github.com` prints the verification line within 15 s and the caller sees it before the process : a_login_prints_its_verification_line_while_it_is_still_running reads the first line off the shipped binary's stdout and asserts child.try_wait() is still None. Against an in-process fake, never github.com.\n- [met] J3: after a successful login `token --host github.com` answers \"source\":\"keychain\" with the granted scopes: was the partly-met criterion. a_login_stores_its_token_in_the_credential_store_and_token_reads_it_back runs login end to end against a credential store, asserts \"stored\":\"keychain\", then token with \"source\":\"keychain\", t\n- [met] J3: on a machine with a signed in gh, `token` answers \"source\":\"gh\" with zero clicks and zero dialogs: a_signed_in_gh_answers_the_token_verb_by_being_spawned, with PATH holding only a fake gh and no credential store reachable.\n- [met] J3: `token-store` reads a token from stdin, validates it and stores it, and `ps` during the run shows no token: the_token_of_a_token_store_is_never_in_the_process_list reads /proc/<pid>/cmdline of the running child, which is what ps reads. The ps half is Linux only; the rest runs everywhere.\n- [partly] J3: `logout` removes the entry and revokes the token while the platform's token for the same user still works: removal and revocation are proved (DELETE /applications/{client_id}/token, never .../grant, which is exactly what keeps another holder's token alive), and the verb is now locked, honest about a failed write, and refuses \n- [met] J3: two joy processes refreshing the same Codeberg entry at once produce one refresh and one busy, and the token still works after: two_processes_refreshing_one_entry_produce_one_refresh_and_one_busy spawns two real processes. The fake is GitHub shaped; the refresh grant is the same OAuth exchange Codeberg uses, and rotation is covered separately by \n- [met] J3: a host with two gh accounts answers `token` for a repository only the second account can reach, and reports \"chose_by\":\"probe\": a_host_with_two_gh_accounts_probes_for_the_one_that_reaches_the_repository, with the ACTIVE gh account unable to reach it; one request per candidate, and the second call answers \"memory\" and spends nothing.\n- [met] J3: `joy release publish` against a github.com remote succeeds on a machine with neither gh nor curl: a_release_is_published_from_the_connectors_own_credential_alone in forge_connector.rs, whose setup sets PATH to the empty string, so neither gh nor curl is reachable.\n\nOpen questions (carried to the packages named or to follow up items):\n- Background hosts still ask the operating system credential store. Skipping it there would break the desktop's own sync poll, which is a Background host and whose credential D2.6 puts in the keychain, and D1.10's caveat paragraph names that dialog as bounded by the verb deadline r\n- A Delegated session now gets Vault::none(), so it cannot read joy's own entry, but it can still spawn gh and receive the machine owner's gh token (decision 19 allows the spawn). Worth confirming that the asymmetry is what the operator wants; if not, the foreign CLI branch needs t\n- The three `keyring::Entry` calls themselves are still not executed by a default test, because a test that writes into the person's own store must not run by default. Everything around them (addressing, detector, index, fallback) now is. A machine-specific, opt-in test would be th\n- J3's fifth acceptance criterion says \"while the platform's token for the same user still works\". That needs the platform and cannot be observed here; the connector-side guarantee is that it revokes the TOKEN and never the grant.\n- `--for` on a plugin verb should be checked against JI-0191-99 decision 29 before it is treated as settled: the flag word is in the allowed set, but the decision lists the flags for the `joy forge` commands and this is a connector verb.\n- The `interactive` cargo feature, the platform manifest and the CI guard of D3.11 layer 1 and 4 remain J10's; the joy-core module is written so that marking it #[cfg(feature = \"interactive\")] moves nothing else, and `Access` was moved out of it for exactly that reason."
