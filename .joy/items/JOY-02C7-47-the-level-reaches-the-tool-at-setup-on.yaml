description: |-
  Delivery 2 of JI-019E-40, decided in JI-019D-46 section 3.

  Setup: joy ai init, joy ai add and joy update write the tool's native mode (level_enforcement.rs: Claude permissions.defaultMode, Qwen approvalMode, Vibe bash permission) from the member's effective maximum; the per-capability resolution and managed_block_section go; is_tool_stale compares the written mode so joy update --check reports a change after joy project member edit --level.

  Chat turns: the turn carries the level chosen with the composer pills (JI-018C-06, JOY-0280-A5); joy clamps it to the effective maximum of (project maximum, the delegator's grant) and sets the session mode on every turn as today. host_turn_level and turn_meta::resolve_effective_level collapse into one function in joy-ai that both hosts call; the personal config layer and the member default drop out of the chain.

  Jobs: the job item gets a level field, set at joy add job (--level, default the assignee's effective level, never above it), validated again at joy approve and snapshotted there (JI-0166-D8 section 6). The job runner receives the job's level instead of always autonomous; confirmed in the job context keeps running over the feedback axis as decided. joy add job refuses an assignee that does not hold the job's capability.

  Tests: the lane test of the safety net extended with the clamp, a setup test per tool for the three levels, a job created above the assignee's level is refused, and a job runs with its own level in the mock adapter.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-10-08T00:18:51.523537528Z
  text: 'Result: the level reaches the tool. Setup writes the tool''s native mode from the project''s side, and is_tool_stale now compares it (it never did, so a changed level did not reach the tool settings). A chat turn runs at the chosen level held to what the member may do for the sender (grants::turn_level_at, one function for desktop and platform); a refused turn says why as ''@x did not run: ...''. A job carries a level (joy add job --level), the approval fixes it: the one asked for, at most what the project allows the assignee, else that maximum. Redeeming a token now tells the AI its level and capabilities, and the AI tutorial points there instead of at the removed config key. Deviations from the item text, to be decided: (1) a job''s level is checked at the approval, not already at joy add job; (2) joy add job does not filter assignees by a capability, it only requires an AI assignee to be a member; (3) without --level the released level is the project''s maximum for the assignee, not the approver''s own grant. Tests: jobs_level.bats, interaction_level.bats, session_mode_per_turn.rs, guard.rs.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-10-08T08:43:54.394951587Z
  text: 'Revised 2026-10-08 on the operator''s word (branch feat/job-start-and-model-choice). A job goes only to a member that holds the jobs capability for the person, at a level it may run at for them: grants::job_assignee and job_terms decide at joy assign, at new -> open and, in the guard, when the assignee starts the job. The exemption this item had put into the guard (the assignee starts its own job without the jobs capability) is removed; it contradicted the rule. Accepting a job (review -> closed) is denied to AI members by default. A job round sets its level on the agent''s session over ACP and answers its permission requests at that level (acp_lane::single_round, answer_job_permission); before, the level of a job reached the tool only as an env variable and every request with an allow option was allowed. Model: grants::model_for, the project''s or else the person''s own (AiDelegationEntry.model, set_personal_model, joy project member edit <ai> --model). Tests: grants unit tests, guard test, acp_lane test, jobs_level.bats (9), interaction_level.bats (model cases). Open for the operator: jobs is not among a new AI member''s default capabilities.'
