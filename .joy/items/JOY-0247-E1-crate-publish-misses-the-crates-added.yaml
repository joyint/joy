description: 'just publish failed after the v0.20.0 release: publish-crates only knows (joy-core joy-ai joy-cli), so joy-model, joy-chat and joy-chat-store were never uploaded and joy-core 0.20.0 cannot be packaged (no matching package joy-model on crates.io). Same gap in the crypt repo: its list only carries joy-crypt, while joy-core now depends on the unpublished joy-token 0.1.0, whose joy-crypt path dependency also lacks the version field crates.io requires. Fix: joy list becomes (joy-model joy-chat joy-core joy-chat-store joy-ai joy-cli), crypt list becomes (joy-crypt joy-token), joy-token pins joy-crypt with a version. The crypt commits ride without an item, there is no crypt delegation token.'
