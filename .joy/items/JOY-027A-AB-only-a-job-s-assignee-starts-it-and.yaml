description: 'Horst, 2026-09-08: a job is under its assignee''s control. Only the assignee may move it from open to in-progress and from in-progress to review; anyone else doing so would take the job out of control. Changing the assignee stays allowed for others, which is how control is handed over. The rule belongs in joy-core, so the CLI and every host enforce the same thing.'
