description: |-
  **Status:** Accepted (2026-03)

  ## Context

  The `.joy/` directory contains different kinds of data: project data that is the source of truth, generated artifacts that can be recreated from the Joy binary, and local configuration that is user-specific or sensitive. Without a clear policy, contributors are unsure what to commit and what to gitignore. This matters especially in multi-repo setups (umbrella with submodules) where each project has its own `.joy/`.

  ## Decision

  Every subdirectory or file in `.joy/` falls into one of three categories:

  ### Versioned (committed to Git)

  Project data that is the source of truth. Cannot be recreated without loss.

  | Path | Content |
  |------|---------|
  | `items/` | Backlog items (YAML) |
  | `milestones/` | Milestone definitions (YAML) |
  | `project.yaml` | Project metadata (name, acronym, language) |
  | `logs/` | Append-only event log (audit trail, supplements git log) |
  | `jobs/` | AI job tracking (planned, not yet implemented) |

  ### Generated (gitignored)

  Artifacts created by Joy commands (`joy init`, `joy ai setup`) from templates embedded in the Joy binary. Can be recreated at any time. Source of truth is `data/` in the Joy source repository. See ADR-016 for the embedded file sync mechanism.

  | Path | Content |
  |------|---------|
  | `ai/` | AI instructions, skills, agent definitions |
  | `hooks/` | Git hooks (commit-msg) |

  ### Local (gitignored)

  User-specific or sensitive data that must not be shared.

  | Path | Content |
  |------|---------|
  | `config.yaml` | Project-local configuration overrides |
  | `credentials.yaml` | API keys, OAuth tokens (file permissions 0600) |

  ### Adding new paths

  When adding a new subdirectory or file to `.joy/`, assign it to one of the three categories. Update `joy init` (.gitignore template) accordingly. If unclear, default to versioned -- it is easier to gitignore later than to recover lost data.

  ## Consequences

  * `joy init` creates a `.gitignore` with patterns for generated and local files
  * `.joy/ai/` is fully regenerated by `joy ai setup` and never committed
  * AI tool configs (`.claude/`, `.qwen/`, `.vibe/`, etc.) are also generated and gitignored
  * The event log (`logs/`) is versioned as part of the project audit trail
  * `jobs/` lives at `.joy/jobs/` (not `.joy/ai/jobs/`) because jobs are a project-level concept, not an AI-only concept

  (Relocated from umbrella JI-0103-E5 as part of the JI-0120 architecture reconciliation.)
