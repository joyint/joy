description: 'Add a per-project privacy setting (open|anonymous, default open) stored in project.yaml, readable and writable via joy project get/set privacy. Foundation for the mode switch; everything else branches on this value. Not joy config: that writes the personal, gitignored local config, whereas the mode must be committed and project-wide, hence project.yaml. Ref ADR-042 Decision.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T15:16:37.030533528Z
  text: 'Plan: Add a project-level privacy setting (enum open|anonymous, default open) as the foundation for ADR-042. (1) model/project.rs: add PrivacyMode enum + Project.privacy field (serde default, skip_serializing_if None so default stays implicit). (2) project.defaults.yaml: privacy: open. (3) joy config get/set project.privacy: wire describe_value + field_hint + validation (only open|anonymous accepted). Default open = today''s behaviour, no behavioural change yet. (4) roundtrip + omitted-when-default unit tests. Implemented on branch feat/adr-042-privacy-mode (worktree project/joy-adr042), verified with cargo test / just check in joy.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T15:29:06.634500589Z
  text: 'Correction to the plan above: the interface is joy project get/set privacy (not joy config), and the mode lives in project.yaml (not project.defaults.yaml). joy config writes only the local, gitignored config, which cannot hold a committed project-wide mode. Task-1 scope: add a PrivacyMode enum plus Project.privacy field (default open when absent) in joy-core; extend joy project get/set to handle privacy; setting anonymous is deferred to the mode-transition task JOY-01BF-2E and returns not-yet-implemented for now. Tests: serde roundtrip, default-when-absent, get/set.'
