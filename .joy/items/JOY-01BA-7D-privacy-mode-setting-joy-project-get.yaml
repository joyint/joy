description: 'Add a per-project privacy setting (open|anonymous, default open) stored in project.yaml, readable and writable via joy project get/set privacy. Foundation for the mode switch; everything else branches on this value. Not joy config: that writes the personal, gitignored local config, whereas the mode must be committed and project-wide, hence project.yaml. Ref ADR-042 Decision.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-11T15:16:37.030533528Z
  text: 'Plan: Add a project-level privacy setting (open|anonymous, default open) as the foundation for ADR-042. (1) joy-core model/project.rs: add PrivacyMode enum plus Project.privacy field (serde default, skip_serializing_if None so the open default stays implicit; accessor returns Open when absent). (2) joy-cli commands/project.rs: extend joy project get to return privacy and joy project set to accept privacy open|anonymous (value validated). (3) Setting open works now; setting anonymous is deferred to the mode-transition task JOY-01BF-2E and returns not-yet-implemented for now, to avoid a half-migrated state. (4) Tests: serde roundtrip, default-when-absent, get/set. Implemented on branch feat/adr-042-privacy-mode (worktree project/joy-adr042), verified with cargo test and just check. Note: not joy config, which writes the local gitignored config; the committed project-wide mode lives in project.yaml.'
