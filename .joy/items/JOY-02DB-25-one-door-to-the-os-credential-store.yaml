description: |-
  Today three places talk to the keyring crate directly: joy-forge-net/src/auth/store.rs (Keys::Os), and in the app apps/desktop/src-tauri/src/crypt_ops.rs and platform_ops.rs. Tests are kept off the real store by patchwork: isolate!() points DBUS_SESSION_BUS_ADDRESS at nothing (Linux only) and installs keyring's in-memory mock in the test binary (bcbc397), which processes a test starts (joy-forge in forge_sign_in.rs, forge_connector.rs) do not inherit, so on macOS and Windows they read and write the developer's real keychain.

  Decision (operator 2026-10-18): one module in joy-core, behind its own cargo feature (the platform must not carry keyring; the connector additionally needs keyring's vendored feature for a container without libdbus), is the only code that reaches the OS credential store. All three places use it. One environment variable that exists for tests only switches it off: then the store behaves like a machine without a keychain and every caller takes its existing fallback (the joy-owned 0600 file). No config setting: joy-forge runs without a project. isolate!() sets the variable after its sweep, so every process a test starts inherits it on every OS; the in-memory mock and the DBUS override in isolate!() go. Proof: an e2e that starts the real joy-forge under isolate!() and shows it never reaches the store, on Linux under an observed private bus; the windows-latest CI leg runs the same.
