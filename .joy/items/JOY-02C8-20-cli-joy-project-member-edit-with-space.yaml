  text: 'Result: joy project member edit <id> --capabilities a b c (commas still read), --add-capability/--rm-capability, --level, --project, --model, --description; without --project the caller''s own grant is written and signed, and the answer says that a new token is due. joy project member add takes the same words plus --adapter and --with-token. joy project member show prints project | mine | effective for an AI member and the capabilities alone for a person. joy ai add <name> [--adapter] [--model] registers, sets the tool up and prints the token. The members table shows all twelve capabilities. Help: one short sentence each. Tutorials (user and AI) rewritten for the two settings.'
