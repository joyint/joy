description: |-
  Follow-up to JOY-0118-DD (released in v0.12.0). The completer accepts uppercase hex chunks but rejects lowercase ones: typing `13F<TAB>` completes to `JOY-013F-33`, but `13f<TAB>` does not.

  The original fix described full-ID matching as case-insensitive but did not extend the same treatment to the post-acronym prefix and substring branches in `matches_item_id`, where the comparison still appears to be case-sensitive.

  Expected: lowercase and uppercase hex chunks are interchangeable everywhere in the completer (full-ID, post-acronym prefix, post-acronym substring).

  Repro: in any joy project, run `joy show 13f<TAB>` -- nothing completes. `joy show 13F<TAB>` works.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-01T17:40:36.857956Z
  text: 'Plan: refactor matches_item_id into rewrite_candidate(id, prefix) -> Option<String>. On a case-insensitive match, return the canonical id with the matched substring overwritten by the user''s exact prefix. The candidate then contains the user''s typed casing as a substring, so zsh''s case-sensitive _describe accepts it. joy commands already resolve case-insensitively, so the rewritten candidate still maps to the right item.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
