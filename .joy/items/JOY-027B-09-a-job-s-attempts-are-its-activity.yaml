description: 'Horst, 2026-09-08: ''attempts'' is a needlessly negative word, and ''rounds'' implies several by definition. The list of a job''s execution records is its activity: the field in the item YAML (old files keep reading), the type, the proto message, the CLI output and the app all say activity. A rename in full, no facade over the old name.'
