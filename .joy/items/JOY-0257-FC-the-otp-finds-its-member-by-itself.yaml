description: 'On redemption (joy auth --otp, and the platform redeem) the member is found through the invitation verifier rather than the git or account address: whoever holds a valid OTP IS the invited person (operator, 2026-08-09). That makes setup work with an alias git configuration too, with no forge and no plugin. It does NOT replace the alias resolution: later commands still resolve over the git address (JOY-0253-8A). Security: the verifier scan runs only over members with an open invitation, the OTP stays high-entropy, and failed attempts are handled as before.'
