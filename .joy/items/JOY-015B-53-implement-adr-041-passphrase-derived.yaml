    [x] Token scopes (auth / auth+crypt) implementiert; --crypt-Flag bettet 32-Byte Delegation-Seed in Token-String ein
    [x] JOY_SESSION extended encoding (auth-only 44 Bytes / auth+crypt 76 Bytes); parse_session_env_full Helfer
    [x] session.expires = min(session_ttl, token.expires) Klemmung in create_session_for_ai
    [x] Token-Redemption extrahiert Delegation-Privkey, validiert gegen registriertes delegation_verifier, packt in JOY_SESSION
    [x] CryptZone Schema um delegations: BTreeMap<ai-id, BTreeMap<operator, wrap>> erweitert
    [x] joy crypt grant ai:<id> --zone X schreibt einen Wrap pro Operator mit ai_delegations-Eintrag, alles in einem Commit
    [x] joy crypt revoke ai:<id> --zone X entfernt die ganze delegations.<ai>-Map
    [x] AI-Crypt-Unwrap-Pfad in ensure_zone_keys: liest delegation_priv aus JOY_SESSION, walks crypt.zones[*].delegations[ai], probiert je Wrap
    [x] Tests: token + session unit-tests, 406 Workspace-Tests gruen
    [x] Tutorial Mission 10 erweitert um AI-Tool-Crypt-Flow
    [x] Website features.mdx Crypt-Section um --crypt-Tokens erweitert

