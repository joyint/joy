  text: 'Done: --zone <name> already worked through the global flag from JOY-0148-84; this story adds joy crypt zone list and joy crypt zone rm. zone list prints a one-line-per-zone table with PATHS/ITEMS/MEMBERS counts. zone rm refuses to drop non-empty zones (items still tagged or members still granted). HKDF salts zone keys with the zone name so different zones derive distinct member KEKs from the same seed; no cross-zone key reuse. 2 new bats tests cover the new subcommands; existing 295 still green.'
