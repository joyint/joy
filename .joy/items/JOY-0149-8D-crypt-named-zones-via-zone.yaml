description: Extends the four crypt verbs and joy crypt list with the --zone <name> flag for named zones (multi-tenant case). Auto-creates a zone on first reference. Adds joy crypt zone list and joy crypt zone rm for zone administration. Items reference their zone via the crypt_zone field; paths via the top-level crypt.zones[].paths registry in project.yaml.
