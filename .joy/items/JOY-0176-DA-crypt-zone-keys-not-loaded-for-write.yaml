description: |-
  joy edit / comment / start / close / assign / deps / milestone link / rm fail with 'no access to zone X' on encrypted items, even when the acting member has a wrap. Only ls and show currently call ensure_zone_keys; the rest never unwrap and so cannot read or save items in any zone.

  Fix: move ensure_zone_keys into Context::load() so every command that goes through Context picks up the keys exactly once per joy invocation. The JOY-0173-B3 pre-check keeps plaintext-only projects prompt-free.

  Repro:
    joy ls            -- prompts, succeeds
    joy edit X-0001 --description '...'  -- 'no access to zone default'
