description: 'Remaining open part of JOY-01BF-2E. Today a human can only be onboarded into an anonymous project by switching to open, adding them, having them redeem their OTP (joy auth init), then switching back, so the project stays open until redemption and the e-mails land in committed git history. Implement true anonymous onboarding: the project stays anonymous throughout and no cleartext e-mail ever reaches project.yaml or history. The manager creates an opaque id and email_match verifier in project.yaml and the e-mail/name in the encrypted members.yaml; the members.yaml zone key is wrapped for the new member at OTP redemption, once their verify_key exists. The core design problem is the key-wrapping timing: at add time the joiner has no verify_key, so the operator cannot wrap the zone key to them yet. Resolve via a wrap-at-redemption step (operator re-wraps once the verify_key lands, or the OTP carries a key exchange so the joiner gains access themselves). Refs ADR-042 and the concept Pseudonyme Identitaeten und Loeschrecht (Umsetzungsstand).'
