description: 'Add a --passphrase-stdin flag to joy auth (and related subcommands that accept --passphrase) that reads the passphrase from stdin in a single line, even when stdin is not a TTY. Pattern matches gh auth login --with-token and docker login --password-stdin. Motivation: GUI frontends (e.g. the upcoming VS Code extension, JVSC-0005) need to collect the passphrase via their own input widget and pass it to joy without exposing it in the process listing (--passphrase <value>) or requiring a real terminal (current rpassword path). Behavior: --passphrase, --passphrase-stdin, and the interactive TTY prompt are mutually exclusive. Documented in the auth tutorial.'
