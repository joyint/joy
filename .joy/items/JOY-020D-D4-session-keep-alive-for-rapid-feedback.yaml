description: 'Optimization idea, deliberately NOT built (JOY-01FE-37 dialog design): keep the job container alive across very short question/answer cycles instead of ending the round, to skip even the cheap session-resume. Only worth revisiting if provider session resume + prompt caching ever proves too costly in practice. The round-based model stays the default: waiting is git state, not a process.'
