  text: 'Plan (J6, the package for JOY-01FD-ED): the forge-net flip in joy-cli/Cargo.toml as the first commit; every remaining git binary call in vcs/mod.rs (add -A, commit, tag -a, push, push_tag, push_with_tags, status --porcelain, describe, ls-files, rm --cached, rm, log -1 --format=%ct, fetch and push of one refspec) replaced by engine functions; the in process commit message validator shared with the bash hook; joy''s own commits stage only joy''s paths; hooks chaining with core.hooksPath and .joy/hooks/chained-path; one failure vocabulary with --json on every forge contacting command and classify_sync_error retired; the non interactive rule; commit_all and commit_everything audited for clean filters. Acceptance: joy works end to end with no git binary on PATH (including chat push and release tag). Worktree .claude/worktrees/fcng-J6/joy, branch feat/forge-connection-ng-j6.'
