- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-05T17:25:54.995594Z
  text: |-
    Heutiger Crypt-Scope an einem Token deckt alle Zonen ab, in die der Operator gewrappt ist. Per-Zone-Verfeinerung erlaubt zeitlich/raeumlich engere Freigaben.

    Spec-zuerst: erfordert Erweiterung in Crypt.md / ADR-041, dann Implementation. Vorschlag-Skizze:
    - Token-Scope-Vokabular akzeptiert crypt:<zone-name> neben dem generischen crypt
    - joy auth token add --crypt --zone customer-x setzt scopes auf [auth, crypt:customer-x]
    - joy CLI prueft beim Crypt-Operationsstart die Scope-Liste gegen die Zone des Item/Files; lehnt mit klarer Meldung ab wenn nicht abgedeckt
    - Mehrere --zone Flags moeglich -> mehrere crypt:<name>-Scopes
    - Bare --crypt ohne --zone bleibt als 'alle Zonen' erhalten

    Voraussetzung: Umbrella-Spec-Erweiterung von ADR-041 oder neue ADR. Vor Implementation kurzes Designgespraech, dann eigenes Spec-Item im umbrella anlegen.

    Aufschiebbar bis ein Anwender den Bedarf konkret meldet; aktuell low-Priority weil --ttl + --crypt scope schon eine zeitliche Verengung erlauben.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-08-31T15:20:14.608251794Z
  text: 'State in English for the record (2026-08-31), replacing the German sketch. Still new. Today a token''s crypt scope covers every zone the operator is wrapped into; a per-zone refinement would allow narrower grants in time and space. Spec first: it needs an extension in Crypt.md and ADR-041 before any implementation. The sketch: the token scope vocabulary accepts crypt:<zone-name> beside the generic crypt, joy auth token add --crypt --zone customer-x sets the scopes to [auth, crypt:customer-x], and the CLI checks the scope when unwrapping.'
