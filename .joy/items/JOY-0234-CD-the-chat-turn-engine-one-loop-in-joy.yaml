description: 'The joy half of JI-0179-4F step 1. turn_engine.rs owns the chat turn loop both hosts used to duplicate: the rounds, the decide choreography, the mention add, moderation, the usability notices (hosts answer with an enum, the engine formats the one sentence), level and mode resolution, the waiting-marker ordering (Start before the model runs, Done after the append), sanitize_reply, the withheld and error and budget wording, the execution record via turn_meta, and the append spec. Hosts implement the narrow TurnHost trait: load a chat, commit a write, run one agent turn, deliver an ephemeral event, answer capability questions. humanize_turn_error moved here from the platform with its tests; sanitize_reply moved into chat_turns with its tests the same day. Reviewable invariant downstream: no user-facing sentence in platform chat_ai.rs or desktop chat_ops.rs.'
