description: 'TDD acceptance suite for the activated anonymous privacy mode (ADR-042), written test-first. Asserts: (1) after switching a project to privacy=anonymous and exercising it, no member e-mail appears in any generated .joy file (project.yaml including attestation, items, logs; members.yaml encrypted). (2) joy log and joy show resolve a member to the name when set, else the e-mail, and never show a raw opaque id. Both variants covered. Red until JOY-01BD-51, JOY-01BE-A2, JOY-01BF-2E and display resolution land. File: tests/integration/privacy_anonymous.bats.'
