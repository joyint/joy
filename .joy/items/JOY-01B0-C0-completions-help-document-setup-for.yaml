description: |-
  joy completions --help lists all 5 shells in the <SHELL> arg (bash/zsh/fish/powershell/elvish) but the 'Recommended setup' section only covers bash/zsh/fish. Add PowerShell and Elvish, each with its idiomatic method, and a one-line dynamic-vs-static note.

  Setups (verified working):
  - Bash: source <(joy completions bash)  (dynamic, colon-aware wrapper)
  - Zsh:  source <(COMPLETE=zsh joy)
  - Fish: source (COMPLETE=fish joy | psub)
  - PowerShell: joy completions powershell | Out-String | Invoke-Expression  (add to $PROFILE)
  - Elvish: eval (COMPLETE=elvish joy | slurp)

  Note: the COMPLETE= dynamic scripts add item/milestone/member ID completion; 'joy completions <shell>' emits a static script (subcommands+flags), which is the simplest route for PowerShell profiles on Windows. Update the after_help in crates/joy-cli/src/commands/completions.rs. just check (snapshot/help).
