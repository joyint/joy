description: |-
  Two small UX fixes for 'joy auth token add' (crates/joy-cli/src/commands/auth.rs):

  1. The interactive 'Passphrase:' prompt stays on screen after entry, making it look as if Joy printed the passphrase. In read_passphrase, after a successful interactive (TTY) prompt, clear the prompt line (ANSI \r + erase-line). Only in the terminal case; do not touch --passphrase-stdin or piped input.

  2. run_token_add prints only the quoted token (intentional per JOY-0185-66 so stdout stays clean for copy/paste). Add a one-line redeem hint on STDERR before it, so stdout remains exactly the token: 'To redeem within {hours}h: joy auth --token <TOKEN> --json'. {hours} is the effective TTL (ttl_hours_override.unwrap_or(24)), so --ttl is reflected. JSON output path unchanged.

  Tests: stdout is still exactly the quoted token (hint goes to stderr); hint shows the right hours for default and --ttl. just check.
