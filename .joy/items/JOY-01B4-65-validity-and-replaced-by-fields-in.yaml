description: Add two fields to the item model in joy-core. validity with values proposed, accepted, rejected, replaced, retired; empty while a decision is still being decided. replaced_by holds the ID of the item that took over; setting it implies validity=replaced. Keep replaced_by single-meaning, distinct from deps and parent. On joy close of a decision, default validity to accepted. The reverse lookup (supersedes) is derived, like deps/dependents.
