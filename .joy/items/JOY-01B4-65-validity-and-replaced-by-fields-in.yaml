  text: 'Plan (ai:claude@joy): 1) joy-core model/item.rs: add enum Validity (proposed/accepted/rejected/replaced/retired) mirroring Status (serde lowercase, Display, FromStr); add fields validity Option<Validity> and replaced_by Option<String> with serde default plus skip_serializing_if None; update Item::new to init both None; add unit and serde-roundtrip tests. 2) joy-cli add/edit: new flags --validity and --replaced-by; setting replaced-by validates the target exists and implies validity=replaced. 3) joy-cli status.rs: on close of a decision default validity to accepted when unset. 4) Tests: unit plus bats integration; run just check. Scope here: model plus ability to set and validate the fields. The --decisions/-D view and val column are the separate task JOY-01B5-21.'
