    [x] joy update --check now aggregates per-section: Binary / Repo state / Auth artefacts / AI tool files. One section per topic, exit 2 if anything stale. No process::exit inside the per-domain helpers.
    [x] joy init also calls auth::run_update_default after init::init succeeds, so SECURITY.md is rendered immediately and joy update --check is clean right after init.
