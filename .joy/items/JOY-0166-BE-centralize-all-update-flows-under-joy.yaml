description: |-
  Two halves:

  (1) Make joy update / --check complete and well-typed.
  - joy update -> change run_full_sync to call init::onboard (covers commit-msg hook + core.hooksPath + .joy/config.defaults.yaml + .joy/project.defaults.yaml) instead of init::run_sync, then auth update routine, then ai update routine.
  - joy update --check -> aggregate per-domain readiness checks: binary version, .gitattributes block, merge driver git config, commit-msg hook freshness, SECURITY.md, project.yaml schema, AI tool files. One section per topic, ok / stale, exit 2 if any stale.

  (2) Drop the per-domain CLI surface.
  - Remove joy auth update subcommand (Update variant in AuthCommand enum, AuthCommand::Update arm, UpdateArgs).
  - Remove joy ai update subcommand (same shape).
  - The internal run_update_default helpers stay; they are called by joy update's orchestrator and the auto-sync hook.
  - Update bats tests, SKILL.md, copilot-instructions.md, and any other reference to the removed subcommands.

  Acceptance:
  - joy update --check produces an aggregated, per-section report with no writes.
  - joy update writes everything that init / onboard would write plus what the old joy auth update + joy ai update would write.
  - joy auth update and joy ai update are gone from the CLI; their absence does not break joy update or the auto-sync hook.
  - Existing bats suites pass.
