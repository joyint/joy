description: crates/joy-ai/src/ai_setup.rs:754 runs 'which <tool>' to find an AI tool binary. Windows has no which; the probe always fails there, so a tool that IS installed looks missing. Found 2026-09-16 while inventorying the process spawns for JOY-028F-0B. Use a PATH lookup that works on all three platforms (the 'which' crate is already a common dependency, or resolve over PATH plus PATHEXT ourselves).
