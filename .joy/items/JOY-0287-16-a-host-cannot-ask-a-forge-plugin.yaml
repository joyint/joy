updated_by: horst.schwarz@joydev.com
description: The platform must know, without cloning, whether a repository holds a joy store the account can read, or may create one (JP-013A-7B, registration JP-013C-11, project list JP-013D-9F). All forge knowledge lives in the forge plugins (docs/plugins.md), but their query contract only knows claims, identity, resolve and release. There is no way to ask a plugin about a repository's store, and joy-core can only parse project.yaml from a file on disk, so content a forge answers cannot be read with the same migrations.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-13T17:47:35.080183141Z
  text: 'Done: the forge plugins answer the read-only store query (docs/plugins.md). One API call reads .joy/project.yaml raw from the default branch; only a 404 asks the repository, which also names the push permission (GitLab: access level plus default branch protection). The token reaches curl on stdin. joy-core gained forge_plugins::store and store::parse_project. Verified live against GitHub, Codeberg and gitlab.com, and through the platform on the dev stack (add, list, open). Gates green: just check, bats 570/570.'
