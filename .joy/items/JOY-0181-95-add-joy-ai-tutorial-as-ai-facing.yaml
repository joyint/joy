description: |-
  Introduce `joy ai tutorial` as the canonical AI-facing operational guide, covering patterns that depend on how AI tools execute commands and differ from human-facing docs:

  - Session env var (`JOY_SESSION`) handling: explicit instructions for AI tools that spawn independent shells per command (capture the value once from `joy auth --token --json`, prefix every subsequent joy invocation with it). Document common stumbling blocks (e.g. `eval $(joy auth ...)` does not persist across separate shell calls in tool-based runners).
  - Token/delegation flow: requesting delegation tokens, multi-use within TTL, scope.
  - Common error patterns and recovery (e.g. distinguishing "delegator must authenticate" from delegation scope issues).
  - Member ID conventions.

  AI instruction files (CLAUDE.md, COPILOT.md, QWEN.md, VIBE.md) reference this tutorial as a required read at session start, rather than embedding the same content in every tool's file. Consider tying re-reads to the existing auto-sync version mechanism so tutorial changes are picked up automatically.

  Note: `joy auth --token <TOKEN> --json` already exists and returns the session value via the `session_env` field -- no new CLI flag needed, just documentation.
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-14T18:10:40.085687263Z
  text: 'Emphasis: the tutorial must explicitly explain JOY_SESSION usage for AI tools whose runners spawn a fresh shell per command (Claude Code''s Bash tool is one such case). The current CLAUDE.md instruction "propagate JOY_SESSION into every subshell" assumes a persistent shell model and led to a clumsy first attempt (`eval $(joy auth --token ... | grep export)`) that silently fails because env does not survive between separate tool calls. Tutorial should show the correct pattern end-to-end: `JOY_SESSION=$(joy auth --token <TOKEN> --json | jq -r .data.session_env)` captured once, then inline-prefixed (`JOY_SESSION=<value> joy ...`) or re-exported at the start of each compound bash invocation.'
