description: |-
  Feedback from a real user: 6-word passphrase floor on 'joy auth init' / 'joy auth passphrase' is unnecessarily long for everyday use. With Argon2id parameters joy uses, 3 well-chosen words still give substantial brute-force resistance.

  Fix:
  - Drop the hardcoded 6-word minimum to 3 words.
  - Update the matching error message ('passphrase too short (minimum 6 words)' -> 'minimum 3 words').
