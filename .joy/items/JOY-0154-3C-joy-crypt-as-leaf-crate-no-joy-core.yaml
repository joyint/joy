description: 'Establish that joy-crypt is a leaf crate exposing only cryptographic primitives on bytes: Argon2id KDF, AES-256-GCM AEAD, Ed25519 sign/verify, seed/zone-key wrapping, Job-bound session wraps. joy-core depends on joy-crypt; joy-crypt has no reverse dependency. Schema knowledge of project.yaml, session/token storage, and orchestration live in joy-core''s auth module. WebUI mirrors the same byte-level contract via Web Crypto API. Resolves Auth.md Open Question #5. Rationale appended to ADR-039.'
comments:
