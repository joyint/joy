  date: 2026-05-03T10:17:39.547437Z
  text: 'Decision recorded in ADR-039 §"Crate boundary and dependency direction". Auth.md updated ("Where auth lives" section, Open Question #5 removed) to reflect the split: joy-crypt owns the cryptographic primitives, joy-core/auth keeps the identity application layer and depends on joy-crypt. No reverse dependency.'
