description: 'Operator, 2026-08-09, per the ''Joy identity'' document (docs.int.joydev.com/doc/joy-identitat-hm9930cQC3): an e-mail address can be set up in the platform in two steps (give the address, click the confirmation link). From then on it serves for signing in by magic link and for recovering the account (the case being that the only forge was cancelled, while subscription and data hang on the account UUID and survive). The address is a DOOR, not an identity: project work still needs the member resolution, and registering or syncing still needs a forge identity in practice. No identity check is needed, because the payment provider checks the payer for the subscription.'
