description: 'joy project member add checks the manage gate (ctx.enforce) before the passphrase given with --passphrase is used anywhere; that passphrase only serves the attestation signature. Without an existing joy auth session the command ends with ''must authenticate. Run joy auth'', although the correct passphrase is right there on the command line. Reproduction: a fresh XDG_STATE_HOME, then member add --passphrase in a project with auth material. Expected: the passphrase given also authenticates the gate, or the message says honestly that joy auth comes first.'
