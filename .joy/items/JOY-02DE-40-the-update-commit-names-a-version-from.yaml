description: 'joy update wrote ''project files updated from joy X to joy Y'' with X from joy.last-sync-version in the clone''s git config: a machine last synced with 0.15 wrote ''from 0.15'' into a repository that had been on 0.23 for long. The subject is now always ''project files refreshed by joy Y''; the local marker still decides whether a sync runs and is said on stderr, never in a commit.'
