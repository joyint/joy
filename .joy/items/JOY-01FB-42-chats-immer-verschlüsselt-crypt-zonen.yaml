description: 'Operator-Direktive (2026-07-04): Alle Chats sind IMMER verschlüsselt, entschlüsselbar nur durch die Teilnehmer (Crypt-Zonen/Grants je Chat); Anmeldung beim Öffnen eines Projekts; auch online werden alle Chats verschlüsselt persistiert (Web via wasm, KI-Keys im Container). Gegenstücke: JAPP-00C8-3E (App), JP-0064-C1 (Plattform). Aufbauend auf dem Chat-Kanal (message ids, JAPP-00C9-80): Verschlüsselung pro Nachricht mit Zonen-Key, Merge-Filter bleibt id-basiert funktionsfähig.'
