description: 'Hard-switch migration per JI-0166-D8: joy update rewrites project.yaml, project.defaults.yaml, and config.yaml (value map pairing/interactive/collaborative -> proposing, supervised -> confirmed, autonomous unchanged; key renames mode -> level, max-mode -> max-level) and regenerates all joy ai setup artifacts from the three-level templates. After migration, old values and keys are a hard error with a clear message pointing at joy update; no fallback, no warning-and-continue. The existing downgrade guard covers old binaries on migrated repos. Migration code lives in the dedicated migrations module so it can be removed later.'
