  text: '[x] Added untrack_gitignored_tool_files(root), called at the end of joy ai init after update_gitignore. For each managed tool path it runs git ls-files --error-unmatch; if tracked, git rm --cached -r (file stays on disk) and prints a one-line notice that a follow-up commit is needed. Implemented as local git-shell helpers (git_path_is_tracked, git_rm_cached) mirroring vcs::is_ignored. Tests: untracks_committed_paths (real git repo: AGENTS.md + .vibe/ untracked, files remain) and is_noop_when_nothing_tracked. just check green.'
