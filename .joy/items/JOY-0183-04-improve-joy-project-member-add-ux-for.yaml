description: |-
  `joy project member add` already supports AI member IDs (`ai:*@joy`) since JOY-016F-16: it detects the prefix, skips OTP generation, signs the attestation, and uses the same default capabilities that AI members get from `joy ai init` (con/pln/des/imp/tst/rev/doc/crt/asg). What the command does not do today is guide the user through the rest of the flow, so AI tools that cannot be auto-detected by `joy ai init` (e.g. GitHub Copilot Chat in VS Code, Cursor's built-in chat, generic chat-only AIs) end up registered as members with no obvious next step.

  Gaps to close:
  - **Next-steps hint** on stdout after registering an `ai:*@joy` member: "AI member registered. Issue a delegation token with `joy auth token add <ID>` and share it with the AI. The AI will run `joy auth --token <TOKEN> --json` to pick up its identity and session, then `joy ai tutorial` for operational rules."
  - **Optional `--with-token` flag** for one-shot register-and-issue-token, so the user does not have to run two commands. JSON output mode emits `{member, token}` so scripted flows pick up both atomically.
  - **Discoverability from `joy ai`**: add a short "For chat-only or unsupported AI tools, register manually with `joy project member add ai:<name>@joy`" line to `joy ai --help` (and possibly an alias `joy ai member add` that forwards to `joy project member add` for users who look under the `ai` namespace).
  - **Hello snippet** the user can paste into the AI session, e.g. "In this Joy project you are `ai:copilot-chat@joy`. Get a delegation token from the user, redeem with `joy auth --token <TOKEN> --json`, take `member` as your identity and `session_env` as auth. Then read `joy ai tutorial`." The snippet should not be needed at all once the AI parses the token-redemption JSON, but is helpful for first-contact when the AI has no instructions loaded.

  Out of scope: a new `joy ai member add` command. The existing command path is sufficient with the UX additions above. Dependencies: JOY-0181-95 (tutorial is what the AI will read for operations) and JOY-0182-17 (`--session` flag makes the AI's permission setup simpler).
