  date: 2026-10-07T20:30:20.579165184Z
  text: 'Result: crates/joy-ai/tests/session_mode_per_turn.rs drives five turns of one chat through the lane against a shell stand-in agent (tests/fake_agent.sh) and asserts the session mode set per turn: plan, acceptEdits, bypassPermissions, plan, plan, so every turn sets it, not only a change. guard.rs gains the case an_ai_without_the_capability_is_refused_for_management_and_only_warned_for_work, whose second half JOY-02C6-25 turns into a refusal. Found on the way: the lane test and the 40 existing acp_lane unit tests need the acp feature, which neither just test-unit nor the CI test step enables; they run only when asked for with --features acp.'
