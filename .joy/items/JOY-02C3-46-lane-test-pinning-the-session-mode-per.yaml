description: |-
  Safety net for JI-019E-40 (delivery 0), against today's code.

  Lane: a test with the mock adapter that drives one chat turn per interaction level and asserts the ACP session mode the lane sets for that turn (joy-ai acp_lane.rs, pick_session_mode, JOY-0280-A5): proposing sets plan, confirmed sets the accept-edits candidate, autonomous the bypass candidate, and the mode is set on every turn, not only on change.

  Guard: a test that an AI member without a work capability moving an item to in-progress today gets Verdict::Warn and the action runs (joy-core guard.rs), and without a management capability gets Deny. Named so that JI-019D-46 section 2 flips the first assertion to Deny deliberately.
