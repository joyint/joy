description: 'At the one funnel point (the callers of privacy::member_key_for_email: identity.rs, enroll, login, the guard paths): when the git address matches no member, ask the registered forge plugins the claims question over the remote URLs, then the identity question of the plugin that claims them, and run the returned candidates through the same member resolution unchanged. The result is cached per run. Without remotes, plugins or a claim, behaviour is unchanged (local repositories). If the resolution fails despite a recognised candidate, give an honest instruction instead of the ''not a member'' riddle. The git author stays untouched. The --user repair: the session is stored AND looked up under the resolved key (today it is stored under the primary address and looked up under the alias).'
