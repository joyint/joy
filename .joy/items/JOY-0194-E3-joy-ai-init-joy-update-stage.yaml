description: |-
  JOY-0184-4A added auto-git-add to the AI tool file writer
  (\`write_if_changed\` in \`crates/joy-cli/src/commands/ai.rs\`). That
  helper is the path for every AI-tool artefact: \`.claude/*\`,
  \`.vibe/*\`, \`.github/copilot-instructions.md\`, \`.github/prompts/*\`,
  \`.github/agents/*\`, \`AGENTS.md\`, etc. All of those are listed in
  the joy-managed \`.gitignore\` block.

  Result: on first \`joy ai init\` the files get \`git add\`-ed before
  the \`.gitignore\` block is rewritten with the AI tool patterns, so
  they end up in the index. On every later \`joy update\` the same
  helper runs but now \`git add\` is refused with "paths are ignored
  by one of your .gitignore files" -- producing a wall of warnings
  even though the files were updated correctly on disk.

  Fix: \`write_if_changed\` must not stage. AI-tool files belong
  outside the index. The original JOY-0184-4A intent ("no
  joy-managed file is left untracked") is preserved for the files
  that *should* be in git (\`.joy/project.yaml\`, docs templates,
  \`.gitignore\`, \`.gitattributes\`, \`SECURITY.md\`,
  \`CONTRIBUTING.md\`) -- those have their own explicit
  \`auto_git_add\` calls already.

  Acceptance:

  - \`joy update\` finishes without any "auto-git add failed" warning
    on a project that has the standard \`.gitignore\` block.
  - \`joy ai init\` does not stage \`.claude/\`, \`.vibe/\`,
    \`.github/copilot-instructions.md\`, \`.github/prompts/\`,
    \`.github/agents/\`, or \`AGENTS.md\`.
  - The existing \`ai_init_auto_stage.bats\` test stays green: it
    asserts every joy-managed *trackable* file is staged and the
    rest is gitignored, both still hold.
