description: "A friend-of-a-project request: make 'git commit' pre-fill a commit message that matches the uncommitted changes, with the right Joy item ID(s) suggested. Real completion of the editor text is impossible, but a prepare-commit-msg hook can pre-populate the template before the editor opens.\n\nHard constraint (Horst): NEVER produce a half-filled placeholder template that the user must cursor around and delete. Either a complete, correct message (just save), or an empty subject with candidates offered as commented-out ready lines (uncomment one). Comment lines start with '#'; git's default editor cleanup=strip removes them, so they never reach the stored commit (verified). Otherwise people will leave templates/false info and pollute the repos -- unacceptable.\n\nArchitecture:\n- Add a prepare-commit-msg hook (data/hooks/prepare-commit-msg) to HOOK_FILES in init.rs, synced like commit-msg.\n- The hook calls a hidden internal subcommand (precedent: Commands::Merge, #[command(hide=true)]), e.g. 'joy __prepare-commit-msg <msg-file> <source>'. All logic in Rust, not bash.\n- Only act for normal commits (source empty); skip for merge/squash/commit -m/-F/templated (source = message/merge/squash/commit) so we never clobber an explicit message.\n\nSubject fill priority (Staged-before-Status):\n1. If a .joy/items/JOY-XXXX-YY-*.yaml is STAGED -> its ID is exact. Build a complete subject: '<type>(<scope>): <item title> [JOY-XXXX-YY]'. Save = done.\n2. Else if exactly ONE in-progress item exists -> use its ID, complete subject. (Covers the 'committed the item file in between, item still in-progress, file no longer staged' case.) Save = done.\n3. Else ambiguous (several in-progress, or none): leave subject EMPTY; list candidates as commented-out ready-to-use subject lines ('# <type>: <title> [ID]'), user removes one '#'. If no candidate at all: just a hint to add an ID or [no-item].\n\nField rules (avoid anything you'd have to delete):\n- type from item.type (rework/feat/fix/docs/...). \n- scope ONLY if all changed code files live in exactly one crate (e.g. all under crates/joy-cli -> '(cli)'); otherwise OMIT scope (a bare 'type: ... [ID]' is valid). Never emit a wrong scope.\n- subject text = item title.\n- Trailers ALWAYS present as a footer (Co-Authored-By for the tool if known, Delegated-By from session/delegated_by), regardless of which case above; these are safe and never noise.\n- Multiple staged item files: include all their IDs in the subject (e.g. '[JOY-A] [JOY-B]').\n\nOut of scope: review-state items are not auto-used (only in-progress); could be listed as candidates later. No LLM/heuristics for the message body.\n\nImplementation: new module for the message builder + the hidden subcommand; unit tests for each case (staged item, single in-progress, multiple in-progress, none, multi-crate scope omitted, single-crate scope set); a bats test that runs a real 'git commit' via the hook and asserts the prepared file. Respect workflow.auto-git interplay. just check."
