  text: 'Trailer rule finalised (resolved during impl): the hook runs on every git commit, so trailers must be conditional. Use resolve_identity: only when committing under an AI delegation (member is ai:*@joy AND delegated_by present) emit trailers; for a human commit emit NONE. In the AI case: ''Delegated-By: <operator>'' from the session, and ''Co-Authored-By: <line>'' derived from the member via the tool key (ai:claude@joy -> claude -> ai_templates::coauthor_line_for_tool). If the mapping returns empty (unknown tool), omit Co-Authored-By rather than emit a wrong value. Session/auth status only carry member + delegated_by, no explicit tool, so the member->tool->coauthor mapping is the bridge. Make coauthor_line_for_tool reusable (pub(crate)) and add a member->tool helper. Subject-fill rules unchanged (staged item file > single in-progress > candidates).'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-06-03T21:50:00.173074951Z
  text: |-
    Implemented. New prepare-commit-msg hook pre-fills the editor before it opens.

    Layout:
    - crates/joy-core/src/commit_msg.rs: pure, git-free message builder (build_suggestion). Staged-before-status priority: (1) staged .joy/items/*.yaml -> exact id(s), complete subject; (2) exactly one in-progress item -> complete subject; (3) ambiguous/none -> EMPTY subject + candidates as commented '# <type>: <title> [ID]' lines (git cleanup=strip drops them, so nothing to delete). 7 unit tests.
    - crates/joy-cli/src/commands/prepare_commit_msg.rs: hidden subcommand. Skips when a source is given (-m/-F/merge/squash) and when the user already typed a subject. Gathers staged paths, maps them to items, collects in-progress items, derives the single-crate scope, resolves identity, prepends the suggestion. 3 unit tests.
    - crates/joy-core/data/hooks/prepare-commit-msg: fail-open bash shim (no-op if joy is off PATH or errors), added to HOOK_FILES so 'joy init' syncs it alongside commit-msg.
    - tests/integration/prepare_commit_msg.bats: 5 tests driving 'joy prepare-commit-msg' over a real message file (complete subject, single in-progress, ambiguous candidates, source given -> untouched, user text preserved).

    Conventional type from item.type (bug->fix, rework->rework, story/epic/task->feat, decision/idea->docs). Scope only when all changed code lives in exactly one crate, else omitted (never a wrong scope).

    One deliberate deviation from the spec text: trailers (Co-Authored-By / Delegated-By) are emitted ONLY under an AI delegation, not 'always' as the draft said. Per Horst's later call: a plain human commit must not carry a meaningless Delegated-By or a wrong Co-Authored-By.

    just check green: clippy clean, all rust + bats tests pass.
