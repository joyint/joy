description: |-
  A pass over the items reads every file twice. list_metadata_in (joy-core/src/items.rs) reads the whole file only to detect the crypt zone, then load_items_with_locked and load_jobs read the same file again through read_item_file. On top of that, path.is_file() costs one more access per file. Measured: 11 accesses per item where 5 are needed (160 items: 1766 instead of about 800 for joy ls).

  Change:
  - The directory walk hands the bytes it read on to the parser, internally. list_item_metadata and list_job_metadata keep their signature and drop the bytes.
  - Split the decrypt-and-parse half out of store::read_yaml so it can run on bytes already in memory.
  - Take the file type from the directory entry instead of a separate is_file() call.

  Unchanged: load_items, load_jobs and the metadata functions answer exactly as before, including locked items in a crypt zone without a key.

  Done when:
  - A test with a read counter (test builds only) shows that load_items reads each item file exactly once.
  - Existing tests are green.
  - The access count for joy ls in the 160 item test project is reported on the parent.
