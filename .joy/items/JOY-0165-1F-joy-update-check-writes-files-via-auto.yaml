  date: 2026-05-07T05:03:59.953222Z
  text: |-
    [x] main.rs: skip auto_sync_repo when cli.command is Some(Commands::Update(_)). joy update runs the sync itself with full output; joy update --check is read-only.
    [x] new bats test verifying joy update --check does not write or change the version marker even when the marker is forced stale.
    [x] all 6 update_command.bats tests green.
