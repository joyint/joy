updated: 2026-05-07T05:04:00.031660Z
description: |-
  main() runs auto_sync_repo before dispatching, which on a stale or missing version marker calls run_full_sync (auth update + ai update + lazy activation). When the user invokes 'joy update --check' (read-only), that hook still writes SECURITY.md, AI tool files, etc. before the actual --check run reports back. Real symptom on 2026-05-07: joy update --check rendered SECURITY.md and updated all configured AI tools, then said 'binary: install receipt missing; repo: synced (0.14.2)'. Second invocation was silent because the marker was now current.

  Fix: skip auto_sync_repo when the dispatched subcommand is Commands::Update(_). joy update runs the full sync itself; joy update --check must never write.
comments:
