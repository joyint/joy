description: 'joy-core vendors libgit2 statically so that nothing external is expected on the system, but its forge-net feature (git2/https + git2/ssh, enabled by the desktop and the platform) pulls openssl-sys WITHOUT vendoring, so the binary links whatever OpenSSL the build machine has: on the operator''s Mac, Homebrew''s /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib and libcrypto.3.dylib. Found 2026-09-09 by the first Developer-ID-signed local build: the hardened runtime refuses to load a library with a different Team ID (Homebrew''s are ad-hoc signed), so the app dies in dyld before main - ''Library not loaded ... different Team IDs''. Unsigned it only ever ran because the build machine happened to have that exact Homebrew path; on any user''s Mac the first download would have failed with ''Library not loaded'' regardless of signing. The CLI is unaffected because it does not enable forge-net. Fix: forge-net also enables git2/vendored-openssl, which builds OpenSSL from source into the binary for every consumer of the feature (desktop and platform), consistent with the crate''s own libgit2 stance.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-09T07:37:23.435265Z
  text: 'Plan: forge-net gains git2/vendored-openssl, one line in joy-core, so every consumer of the feature (desktop, platform) links OpenSSL statically instead of whatever the build machine has. Why it is safe, read off the crates'' build scripts rather than assumed: libgit2-sys speaks https through SecureTransport on Apple targets (GIT_SECURE_TRANSPORT, build.rs:259), so on a Mac OpenSSL only serves as libssh2''s crypto backend and no certificate store is involved; on Linux libgit2 does use OpenSSL for https, and git2 enables openssl-probe there (cfg unix-not-macos) so the CA bundle is found on the system at runtime - the platform runtime image must therefore carry ca-certificates, being checked; on Windows openssl-sys is not a dependency of libgit2-sys or libssh2-sys at all (WinHTTP, WinCNG), so the feature is inert. Cost: OpenSSL compiles from source once per clean target directory and needs perl and make - present on the Linux runner (build-essential, perl-base) and in rust:1-bookworm (buildpack-deps), and on the Mac. Verification: rebuild the desktop and show otool -L free of /opt/homebrew, launch the signed app; just check in joy and app; platform and jyn built against the changed crate per the shared-library rule in CONTRIBUTING.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-09-09T08:02:40.485935Z
  text: '[x] forge-net = [git2/https, git2/ssh, git2/vendored-openssl], with the reasoning on the feature. Verified far beyond the one machine. Desktop: rebuilt, the release binary and the Developer-ID-signed hardened-runtime bundle link only /usr/lib and /System frameworks, no LC_RPATH, codesign --verify --deep --strict passes; the operator installed it and the app starts again (the /Applications binary is byte-identical to the new bundle, md5 match, process running). Every consumer of joy-core built against the change in parallel: joy just check green (199 s; openssl-src does not compile there since nothing enables forge-net), platform cargo check AND just check green (openssl-src 300.6.1 built from source, 209 tests), jyn cargo check green with openssl-sys absent from its graph. Three adversarial lenses failed to refute the design: on Apple libgit2 speaks https through SecureTransport (GIT_SECURE_TRANSPORT in git2_features.h; SecureTransport symbols imported, 672 OpenSSL symbols defined, 0 undefined, the only git_openssl symbol is the stub), so the static OpenSSL serves libssh2''s crypto alone; on Linux git2::init runs openssl-probe before git_libgit2_init and every joy-core forge path enters through git2, and the platform runtime image carries ca-certificates; on x86_64-pc-windows-msvc openssl-sys is not in the graph of either consumer, so the Windows runner (no perl) is untouched. Two precisions from the review, recorded rather than hidden: it is dpkg-dev''s full perl, not perl-base, that satisfies OpenSSL''s Configure on the Linux builders - both have it; and the platform''s libssl-dev in the builder stage is now dead weight, harmless. Not verified here: a container run of the platform (no Docker daemon on this Mac) - one https forge contact from inside the built image would close it, and belongs to the next integration deploy. Lockfiles: openssl-src is added in joy, app and platform; each is committed in its repo.'
