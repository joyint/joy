  text: |-
    Plan:

    Current user tutorial `docs/user/Tutorial.md` has two relevant sections:
    - **§8 AI Tool Integration** (~70 lines, includes deprecated info)
    - **§9.7 AI Delegation Tokens** (~15 lines, minimal)

    Outdated items to fix:
    - `--author` flag examples in §8 (`joy comment ... --author ai:claude@joy`) -- flag does not exist in code; identity comes from auth/session.
    - `.joy/ai/` path for AI instructions in §8 -- actual paths are `.claude/`, `.qwen/`, `.vibe/`, `.github/`.
    - No mention of inline auth bootstrap in `joy ai init` (single passphrase since JOY-0180-AA).
    - No mention of `joy ai tutorial` (AI operational guide, JOY-0181-95).
    - No mention of `--session` flag (JOY-0182-17).
    - No mention of generic AI member registration for chat-only AIs (JOY-0183-04).
    - §9.7 token flow lacks `--json` mention and the `session_env`/`member`/`delegated_by` pickup.

    Changes (human-facing, operator perspective; AI mechanics stay in `joy ai tutorial`):
    1. §8 `joy ai init` overview: keep three-bullet list, fix the path note, add a one-line note that auth is bootstrapped inline (single passphrase).
    2. §8 AI Identity: drop `--author` examples; reframe as 'AI authenticates with a delegation token from you, then acts as its member identity'. Mention `joy ai tutorial` as the AI's side.
    3. §9.7 AI Delegation Tokens: add `--json` form returning `session_env`/`member`/`delegated_by`, mention `--session` flag and `JOY_SESSION` env, mention generic AI registration for chat-only tools (`joy project member add ai:<name>@joy`).

    Out of scope: §8 The Trust Model, AI Identity capabilities table, Keeping Instructions Current. Those are still correct.
