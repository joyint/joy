description: |-
  Bring `docs/user/Tutorial.md` in sync with the AI-side changes shipped under JOY-0180-AA, JOY-0182-17, JOY-0183-04, and JOY-0181-95:

  - New `--session` flag (recommended over `JOY_SESSION` for AI tools, JOY-0182-17).
  - Inline auth bootstrap in `joy ai init` (JOY-0180-AA): single passphrase for the whole flow.
  - Generic AI member registration via `joy project member add ai:<name>@joy` for chat-only AIs (JOY-0183-04) with the new next-steps hint.
  - `joy ai tutorial` command and its role as the canonical AI operational guide (JOY-0181-95).
  - Token redemption with `--json` returns `member` / `session_env` / `delegated_by`; commit trailers are per-tool `Co-Authored-By:` plus `Delegated-By:`.

  Keep the user tutorial human-facing: short paragraphs explaining the flow from the operator's perspective. The AI side stays in `joy ai tutorial`.
