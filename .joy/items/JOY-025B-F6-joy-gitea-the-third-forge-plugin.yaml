description: 'Horst''s finding of 2026-08-19: since Codeberg is set up as a Gitea-compatible forge on the integration instance, exactly those repositories have no alias resolution - the registry knew only github and gitlab, and for a Codeberg remote no plugin felt responsible. Gitea and Forgejo have the same class of problem: Keep Email Private hands out addresses of the form <user>@noreply.<instance>. joy-gitea follows the joy-gitlab pattern: claims for codeberg.org (other instances through the forge override), alias parsing, the tea configuration, the API for the verified addresses; plus a registry row in joy-core, install, publish, CI, the platform image and the documentation.'
