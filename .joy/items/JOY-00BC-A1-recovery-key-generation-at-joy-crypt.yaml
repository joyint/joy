  text: Closing as obsolete. The wrapped-seed Auth model (ADR-039) provides recovery via Auth (joy auth recover --recovery-key). Crypt no longer has its own recovery key concept and inherits recovery from Auth. The joy crypt init command itself was superseded by the selective Crypt model (ADR-038). Replacement work is tracked in epic JOY-0145-51.
