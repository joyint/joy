description: |-
  Security audit 2026-10-22, re-checked 2026-11-13 (Joyint Docs, Horst > Reviews). A cloned repository is untrusted content. Three places trusted it.

  C1/E3 version files: release.version-files patterns were joined to the project root and globbed as they stood, so '../x' or an absolute path, or a symlink inside the project, let 'joy release' rewrite files outside the project. Now a pattern with a parent or root component is refused, and every match is canonicalized and must lie under the canonical project root (joy-core version_bump.rs, expand_glob).

  E2 editor: the editor command came from the layered config, so the committed .joy/config.defaults.yaml could name a command that 'joy edit' ran through sh -c on the member's machine. Now only the member's own personal config names the editor, then VISUAL, EDITOR, the built-in fallback (joy-cli editor.rs).

  I1: rustls-webpki 0.103.17, webpki-root-certs 1.0.12 in Cargo.lock.

  Not in this item, needs Horst's decision: E1 (core.hooksPath pointing at the committed .joy/hooks).
