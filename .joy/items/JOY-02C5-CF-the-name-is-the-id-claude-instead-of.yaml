description: |-
  Delivery 1 of JI-019E-40, decided in JI-019D-46 section 6.

  An AI member's id is its name (claude, vibe, qwen, copilot, reviewer). is_ai_member and is_human_key no longer look at an ai: prefix: a member is an AI member when its entry has an adapter; a human id contains @, a name never does; m- stays reserved. joy_ai::naming::canonical_member_id(adapter) returns the bare adapter name. The chat mention @claude resolves as before.

  Input: everywhere a member is expected (member_resolver.rs, joy auth token add, joy assign, joy project member, joy ai rotate), ai:<name>@joy is accepted and normalised to <name>; the CLI prints one line, "note: ai:claude@joy is now called claude", not under --json. Token redemption (auth/redeem.rs) maps an ai_member claim in the old form to the name so issued tokens keep working. Delegated-By and created_by/updated_by/author fields write the name.

  Migration: the repo migration of the member-files story rewrites ai:<name>@joy to <name> in items, logs, ai_delegations keys and job assignees; sealed chats are not rewritten, the resolver maps the old form when reading participants. Generated instruction files and the joy skill use the name; joy update regenerates them.

  Tests: resolver round trip for both forms, redemption of an old-form token, the migration fixture after rewrite, and a bats case for the note line.
