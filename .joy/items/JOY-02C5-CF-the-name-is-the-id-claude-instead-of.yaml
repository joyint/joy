  text: 'Result: an AI member is known by its name (claude). The older ai:claude@joy is accepted wherever a member is named: the CLI replaces a whole argument and says once what the member is called now (not under --json); Project::member_key, Member::delegation_to and friends find either spelling, so an old session, an old chat record and an old assignment keep meaning the same member. Work is assigned to an AI member by its name and only to one the project has (Project::assignee, used by CLI, platform and desktop). Bats: ai_member_names.bats.'
