description: 'Platform side JP-0133-82. A chat turn had a fixed wall-clock limit (180 s): a live analysis streaming tool calls was cut off and its result thrown away, while an agent stuck on a decision sat equally silent for 180 s and only that one is a timeout. Every ACP adapter on both hosts shares joy_ai::acp_lane, so the rule lives there: the lane keeps a pulse per running turn, touched by every notification and request from the agent; the waiter cancels the agent''s turn once the pulse has been still for the idle span (the same env value, now meaning silence), takes what streamed and marks the record ''ended: idle-timeout''; an agent that does not answer the cancel within the grace ends the lane. Tool calls and permission answers are logged so a postmortem can see the ACP exchange.'
