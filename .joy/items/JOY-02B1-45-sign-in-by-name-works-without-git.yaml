description: 'Operator decision 2026-09-27: a person must always be able to work without a git identity, and to act as a member other than the one git config names. resolve_identity and acting_member read the newest live human session of this terminal right after the delegation session and before git config; the session joy auth --user leaves behind therefore names the member for every later command. joy ai init takes --user <address> and signs that member in when needed. The UnknownActingMember text names remedies that work. Tests that asserted the opposite (nothing answers without git config after enrolling) are inverted.'
