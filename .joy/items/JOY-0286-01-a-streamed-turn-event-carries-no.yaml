description: 'Seen on mule 2026-09-11 (JAPP-0278-A2): the reply''s last chunks reached the phone after the reply itself and showed as a second message. The turn''s marker and its outcome carry the message id; the activity events the lane streams (turn-chunk, turn-thought, turn-tool, turn-content, turn-plan) carry only the author, so a client can neither attach them to the turn nor tell a straggler of a finished turn from the start of a new one. The chat bus and the turn''s RPC are two connections with no order between them.'
