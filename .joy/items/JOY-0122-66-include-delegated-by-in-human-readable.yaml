created: 2026-04-28T17:21:41.589583168Z
updated: 2026-04-28T17:32:06.886768847Z
description: |-
  Vision/Auth and Judge specify that delegated AI actions must be attributed as `[ai:claude@joy delegated-by:horst@...]` wherever a human reads them. The event log does this. Item-level fields do not:

    - Comment.author stores only the AI member ID.
    - Item.created_by stores only the AI member ID.

  Fix: in writers, use ctx.log_user() (member + delegated-by) instead of ctx.identity.member.clone(), so comments and created_by carry the same delegation chain as the event log.

  Out of scope: assignees - those name a concrete actor responsible for the work, not an audit attribution, and stay member-only.
