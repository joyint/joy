description: |-
  Several --help lines exceeded 80 chars due to multi-sentence descriptions or comma-padded value lists. Trim to single-line, pipe-separated value lists, drop implementation-detail tail clauses. Remaining lines >80 are clap-alignment driven (description column padded to widest option signature) and would only shrink further by dropping value lists, which is more loss than gain.

  Touched: main.rs (--json), filter_args.rs (--parent/--type/--status/--priority/--members/--mine), add.rs (TYPE/--priority/--effort/--status/--capabilities), edit.rs (--priority/--deps/--assignee/--capabilities), show.rs (--passphrase), ls.rs (--passphrase), status.rs (status arg), project.rs (Get/Set), auth.rs (--token/--otp/--user/--passphrase, AuthCommand::Init), crypt.rs (--passphrase/--zone, several subcommands).
