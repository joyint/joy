description: |-
  The joy repo tracks AI tool files that the joy-managed .gitignore block already lists as ignored: .vibe/ (config.toml, 7 agent TOMLs, skills/joy/SKILL.md, setup.md) and AGENTS.md. They were committed before the ignore entry existed; .gitignore does not retroactively untrack, so they stay versioned and reappear as modified whenever the Vibe integration rewrites them. .claude/, .qwen/, .github/copilot* are correctly untracked.

  Fix: git rm --cached -r .vibe AGENTS.md (keep the files on disk), commit, so they are no longer versioned. This is the concrete instance of JOY-019E-3A (joy ai init should do this automatically) and is caused by JOY-01AA-9E (gitignore stability). Verify afterwards: git ls-files shows no .vibe/ or AGENTS.md, working copies still present, just check green.
