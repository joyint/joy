description: |-
  AI assistants in confirmation-requiring interaction modes (supervised, collaborative, interactive, pairing) have been observed writing unagreed concrete decisions into project documentation: invented configuration fields, file paths, command flags, schema fragments, internal storage layouts, dependency choices, marketing claims, all phrased as if they were settled. The fabricated content is plausible and well-integrated, which forces the user to audit every diff line by line.

  The existing 'Complexity / No unrequested abstractions' rule under Working style in the AI instructions template was interpreted as code-only. Documentation was treated as lower-stakes commentary rather than normative specification, which is the gap to close.
