description: |-
  The Joy skill template at
  \`crates/joy-core/templates/ai/skills/joy/SKILL.md\` duplicates a
  lot of what \`joy ai tutorial\` already states:

  - Item lifecycle commands (joy ls / show / add / edit / comment /
    deps / milestone link / roadmap) are in the tutorial table.
  - Status transitions (joy start / submit / close / reopen) are in
    the tutorial Workflow section.
  - Item types, priorities, effort scale are in the tutorial.
  - AI hygiene (item before code, plan/result comments) is in the
    tutorial Minimum AI hygiene section.

  The skill should keep only what is *specific* to the slash-command
  entry point and not redocument the CLI:

  1. Natural-language to joy-command mapping (a small handful of
     example phrasings so the AI sees the pattern).
  2. Multi-step planning procedure for feature decomposition.
  3. Triggering context and confirmation policy.

  Acceptance:
  - The shipped skill template is significantly shorter and points
    to \`joy ai tutorial\` as the canonical source for the CLI surface.
  - Existing skill rendering snapshot tests stay green (or are
    updated where they assert against verbatim removed content).
