  text: 'Plan: rewrite crates/joy-core/templates/ai/skills/joy/SKILL.md as a thin entry point that defers to joy ai tutorial for the CLI surface. Keep the frontmatter, the slash-command framing, a few exemplar natural-language mappings, the planning procedure, and the confirmation policy. Drop the per-command tables, the per-status mappings, and the item-types/priority list that live in the tutorial. Update or regenerate snapshot tests if they pin verbatim content.'
