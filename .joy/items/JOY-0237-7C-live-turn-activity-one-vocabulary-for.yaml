description: 'JI-0179-4F step 4, the joy half. turn_engine::TurnActivity names what a running turn streams: chunk, thought, tool call, with the wire kinds turn-chunk, turn-thought, turn-tool. Hosts publish these WHILE their run_turn blocks (the platform on its chat bus, the desktop on a Tauri event) and the one channel renderer upgrades the waiting skeleton to the live turn view, whichever host streamed it (JI-0172-EE). Ephemeral like the pending markers; the persisted reply is the only truth.'
