description: |-
  joy.last-sync-version is compared with string equality today. Two real failure modes:

  1. Auto-sync downgrade: a colleague synced the repo with joy 0.15.0 and another developer runs joy 0.14.2. Auto-sync sees 'mismatch', re-runs onboard/auth/ai update, and rolls repo state back to the older templates / schema.

  2. Generic write path: even outside auto-sync, an older binary touching newer joy-managed files (joy edit, joy add, joy auth ...) can drop nested-structure fields the newer version introduced, mishandle .gitattributes entries it does not know, or run schema-migrations that already happened.

  Fix:
  - Add a semver-style version tuple comparator (X.Y.Z) in update_registry.
  - Top-level guard in main.rs: before dispatching any subcommand, if joy.last-sync-version > CARGO_PKG_VERSION, print one-line stderr warning 'your joy 0.14.2 is older than this repo's last sync (0.15.0). Update joy before continuing.'
  - joy update (write path) refuses: skip onboard / auth / ai refresh entirely, suggest 'joy update' on the user's install method.
  - joy update --check reports VersionMarkerItem as RowMark::Stale with the downgrade detail; exits 2.
  - Read-only commands (joy ls, joy show, joy log, joy roadmap, joy config, joy project) still run after the warning so the user can inspect; write-path commands are not blocked here (the warning suffices) since making those refuse hard would break workflows where the in-flight schema is compatible.
