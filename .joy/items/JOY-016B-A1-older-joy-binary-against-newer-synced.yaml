    [x] main.rs auto_sync_repo: detects downgrade, prints one-line stderr warning, skips the in-repo refresh; read-only commands keep working with that warning visible.
    [x] commands/update.rs run() (write path): binary swap still runs (so the user CAN bring joy up to date); in-repo sync is skipped with an explicit footer telling the user to re-run joy update from a new shell once the binary upgrade is in PATH.
    [x] commands/update.rs run_update_json: surfaces downgrade_blocked: <marker-version> in the JSON envelope so machine callers can react.
    [x] 321 unit tests, sanity bats green, clippy + fmt clean. Manual verification against a fake marker = 99.0.0: warning fires, joy update behaves as documented, JSON envelope carries the field.
