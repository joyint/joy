description: 'The setup of a new joy project on the platform (JAPP-0293-A7, JP-013E-46) points at the repository''s vision, architecture and contributing documents, and Horst wants a file picker next to each. Nothing lets a host see which files a repository''s default branch carries without cloning it. And a repository without a store may be empty: its first push has to go to the branch the forge names as default, which the store answer does not say.'
comments:
