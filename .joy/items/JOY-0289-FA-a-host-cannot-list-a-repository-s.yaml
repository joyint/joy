  date: 2026-09-13T17:47:35.424763988Z
  text: 'Done: the forge plugins answer the read-only files query: the default branch''s tree, one call on GitHub, bounded pages on Gitea and GitLab, with truncated when cut off; an empty repository lists nothing. The store answer for a repository without a store carries default_branch. Verified live (GitHub 1147 files, Codeberg truncated at the page bound, gitlab.com 1440) and in the setup mask''s document pickers on the dev stack.'
