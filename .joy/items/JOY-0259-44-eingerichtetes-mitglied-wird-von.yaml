description: 'Fund Roland 2026-08-17: Enthält die Adressmenge eines Kontos sowohl den echten (eingerichteten) Member-Eintrag als auch eine nie eingelöste Einladung unter einer anderen Adresse derselben Person, entschied bisher die zufällige Kandidaten-Reihenfolge. Der leere Einladungs-Slot verdeckte die echte Mitgliedschaft: Die App verlangte ein OTP, das es längst nicht mehr gibt, während Passphrase und Wraps am echten Eintrag hängen. Regel jetzt: verify_key schlägt Einladungs-Slot; ein Slot löst nur noch auf, wenn er der einzige Treffer ist (OTP-Posture für echte Neu-Eingeladene bleibt).'
