description: 'Chat lane rebuild, phase 2 (JAPP retry story, JAPP-0145-DB): a retry re-runs the same turn under the same message id, and its outcome must replace the first attempt on every device even when it is shorter. The fold''s richer-copy rule cannot express that. The message carries an attempt counter (0 unwritten for the first attempt) and the fold ranks by attempt before length.'
