description: 'Platform bug JP-00B8-4B: a changed model pin never reached the running turn — the spawn env only suggests a default, and an agent with persisted per-chat state (vibe) keeps its previously active model. The lane machine now carries the pin in LaneConfig.model and sets it on every session it creates (chat sessions and single rounds) via session/set_config_option, config id model; a refused pin is a loud error. list_models stays unpinned.'
