description: 'Found 2026-10-10 by running the joy production runs (a696595, reads format 2) against a job written by main: joy show names no window, and its next write of the job leaves ''window: {}'', the end is gone. until replaced deadline in the job file (JOY-02C9-70) without the format number that makes an older joy stop. Fix: PROJECT_FORMAT 3. The number a project.yaml says is what its data needs: 2 for member files, 3 as soon as a job says until. Writing such a job raises the number in the same write, so the marker and the field reach the forge together; a project without until stays at 2 and readable for a joy that reads 2.'
comments:
- author: claude delegated-by:horst.schwarz@joydev.com
  date: 2026-10-10T19:08:41.314138519Z
  text: 'Plan: PROJECT_FORMAT 3 with the two data levels named (member files 2, job until 3); save_project keeps the number the file already says and never writes less than the layout needs; store::raise_format lifts the number and stages project.yaml; items::save_item calls it when the job it writes has an until. Tests: unit (a job with until raises the number once, a job without does not, a project save keeps 3), bats (the file says format 3 after joy edit --until, stays 2 without), and the proof with a reader of format 2 through the existing newer-format test.'
- author: claude delegated-by:horst.schwarz@joydev.com
  date: 2026-10-10T19:13:28.555313919Z
  text: '[x] Reproduced with the joy production runs (a696595): it showed a job with until without its window and its next write left ''window: {}''. [x] PROJECT_FORMAT 3; the number a project.yaml says is what its data needs (2 member files, 3 from the first job that says until). [x] items::save_item lifts the number before it writes such a job (store::raise_format), project.yaml is staged with the job file: one commit. [x] save_project keeps the number the file says. [x] A merge never lowers the number. [x] Tests: store (a_job_that_says_until_lifts_the_projects_format, a_project_kept_the_old_way_is_lifted_too), merge (the_format_of_a_project_never_sinks), jobs_window.bats (lifted in the same commit, a job file from before lifts it when written again, without an end the project stays at 2). [x] Proof against the old binary: without an end the project stays at 2 and the old joy reads it; after --until it says ''this project needs a newer joy: install the update'' on show, edit and ls, and the end stays in the file. [x] just check green. Limit: joy 0.22.0 and older know no format number at all; they cannot read a project in member files anyway.'
