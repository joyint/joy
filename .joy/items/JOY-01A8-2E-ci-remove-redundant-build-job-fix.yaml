description: |-
  Two coupled CI cleanups:

  1. The 'build' job (cargo build --workspace) is redundant: 'cargo test --workspace' already compiles the whole workspace, and release binaries come from cargo-dist (release.yml), not this job. Remove it.

  2. The OS matrix renamed status checks to 'Test (ubuntu-latest)/(windows-latest)' and 'Build (...)', but main's branch protection still requires bare 'Test' and 'Build' contexts -> every PR is permanently BLOCKED (surfaced merging PR #2). After removing build, update required contexts to: Format, Lint, Test (ubuntu-latest), Test (windows-latest), Integration (bats).

  Acceptance: PR #2 mergeable via normal (non-admin) merge; future PRs not blocked by stale contexts.
