  date: 2026-09-17T10:32:11.916439637Z
  text: "Result (implemented, adversarially reviewed, findings fixed; branch feat/forge-connection-ng-j4h, commits 5e1e8808d07b7837240cec66b4171ccf94fd0ede [JOY-0299, df626bbf8cbe05efe5d9b48b8b865cf9399d7143 [JOY-0299; merged into feat/forge-connection-ng by the integrator).\n\nAll four must-fix items and all five should-fix items are fixed in one commit (df626bb) on top of the package commit (5e1e880); nothing was deferred. The pin file is data again: joy reads host-keys.json from the release at run time, beside the binary or in <prefix>/share/joy, with the compiled-in copy only as a fallback, and the file a release ships is now empty, which is what J4h's acceptance says while decision 23 is open. The blobs are parked beside the release in host-keys.published.json, which no joy binary carries, and the const gate pins::CONSULTED is gone because the shipped artefact is now the gate. The known_hosts pre-validation no longer slices a &str by byte index: it walks bytes, so the line that used to panic inside the OnceLock the transport guard reads before every ssh contact is now reported by line number, with a regression test for the exact shape. The Codeberg pin build step runs in CI every night (just check-host-key-pins in the new host-key-pins job); it ran green here against the live forges. Beside those: the refusal an Interactive host gets where no front end installed a question now names the file and the line to paste, a known_hosts file with a byte that is not UTF-8 is read lossily instead of dropped in silence with every skip logged, Trust::into_check is gated on the feature of its only caller, guard_transport takes the known_hosts verdict as an argument so the new branch has a real test, and guard-certificate-check reads every Rust file of the workspace, knows RemoteCallbacks::default() and counts occurrences instead of lines. Six criteria are met, two are partly met for one reason only: the trust question has no caller in this tree, because joy-cli's call sites are J6's.\n\nAcceptance:\n- [partly] a fresh machine with an empty known_hosts contacts github.com over ssh and is offered the fingerprint, which matches the one GitHu: Proven end to end against the real github.com (a_fresh_machine_is_offered_the_fingerprint_github_publishes, forge-net, ignored by default), but the test lends joy-core its own question. No binary in this tree installs on\n- [partly] accepting writes one hashed line and the next run is silent: Same test, same limit: the write and the silent second contact are proven against github.com, with the question installed by the test. The engine side is complete (line_for, append under joy_core::util::file_lock, never \n- [met] a changed key is refused in all three host kinds with both fingerprints and the file and line number: a_changed_key_is_refused_in_every_host_kind: Interactive, Background and Delegated all get the presented and the expected fingerprint, the file and the one based line, and the instruction to remove that line by hand. Not\n- [met] a hashed entry written by OpenSSH matches: a_hashed_entry_written_by_openssh_matches uses a line OpenSSH wrote (HMAC-SHA1 over the host field, knownhost.c:416-441), including the bracketed form for a port other than 22.\n- [met] a Background host refuses with needs_host_trust, the state name J5 already defines, and prints the line to paste: a_background_host_refuses_an_unknown_host_and_prints_the_line_to_paste for the sentence, and the_refusal_reaches_the_person_as_needs_host_trust_with_joys_own_sentence for the state: the code survives libgit2's overwrite,\n- [met] a known_hosts file with one unparsable line is reported by line number instead of killing the connection: This was the one broken criterion of the review and it is fixed. The validator walked a &str by byte index, so a host field of at most two bytes with a multi-byte key field panicked inside the OnceLock the transport guar\n- [met] once decision 23 is taken, the Codeberg pin file is produced by the build step and its fingerprints equal the ones Codeberg publis: The shipped pin file crates/joy-core/data/host-keys.json is now empty and that is asserted (the_pin_file_a_release_ships_is_empty_while_decision_23_is_open), so the artefact the criterion names is the one shipped. The bl\n- [met] an https contact in the same process goes through the same closure and no second certificate_check is installed anywhere in the tr: an_https_contact_goes_through_the_same_closure (forge-net, ran green against github.com) plus just guard-certificate-check, which is in just check. The guard now reads every Rust file under crates (tests and build script\n\nOpen questions:\n- Decision 23 is still open, so a Background or Delegated host on a fresh machine still has no way onto github.com, gitlab.com or codeberg.org over ssh. The material is ready: answering it is one copy of data/host-keys.published.json over data/host-keys.json.\n- Nothing places host-keys.json into the release yet. cargo-dist ships the binary alone (dist-workspace.toml, install-path ~/.local/bin), so today the loader falls back to the copy compiled in, which is byte for byte the same empty file and changes nothing. The moment decision 23 i\n- D1.4a says 'a data file inside the release' but names no path. joy now looks beside the binary and then in <prefix>/share/joy. If the operator wants another layout (a state directory, or a path per OS), it is one function, pins::candidates.\n- just check-all does not run check-host-key-pins. The recipe talks to three forges, and check-all is the local gate before a release, so a forge outage would block a release for a pin file that ships empty. The nightly CI job is where it runs. Worth revisiting once the pin file sh\n- The trust question has no caller. J6 owns joy-cli's call sites and its acceptance ('no ssh contact fails without a way to accept'), so an Interactive person is offered a fingerprint only once J6 lands. Until then the refusal carries the file and the line to paste. If the operator\n- joy-core logs a skipped known_hosts file at warn and a lossy decode at debug. If the desktop's log surface wants either as a visible note rather than a log line, that is a caller's decision, not the engine's.\n\nRemaining: the pin file host-keys.json is not yet placed into the release archive (J8 ships it beside the binary or under share/joy); the CLI and the app still have to install the Interactive question (J10 and A2); decision 23 is approved, so Background hosts use the pins once they ship."
