description: 'Rework the AI integration instructions generated for all supported tools so the acting Joy identity is taken exclusively from data.member returned by joy auth --token --json, and write commands use data.session_env. Delegation attribution uses data.delegated_by from that redemption; before redemption the agent must obtain a token and must not assume an identity from project instructions. Remove mandatory Co-Authored-By attribution from Joy policy and templates; tools may add their own attribution. Preserve Delegated-By on AI commits and align commit-message preparation and Joy auto-Git output with the new policy. Keep shared AGENTS.md usable by multiple tools: do not embed Vibe-specific identity, interaction levels, permission mode, or Co-Authored-By there; retrieve effective member-specific capabilities and levels via Joy after authentication. Update joy ai tutorial, CONTRIBUTING.md, generated templates, relevant lifecycle behavior, and tests. Acceptance: re-running init regenerates consistent instructions for existing tools; Vibe and another reader of AGENTS.md receive no conflicting identities or tool-specific requirements; token redemption is the source of truth; existing tool skills and delegated commit attribution still work.'
