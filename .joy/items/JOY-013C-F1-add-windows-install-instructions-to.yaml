description: |-
  Website docs at content/joy/docs/{en,de}/index.mdx currently show only the curl Linux/macOS install line. Windows users land on the same page and have no install path. The Windows installer (get.joyint.com/joy.ps1) is deployed and must be surfaced.

  Add a tabbed or sectioned install block per platform:
  - Windows (PowerShell): irm get.joyint.com/joy.ps1 | iex
  - macOS / Linux: curl -fsSL get.joyint.com/joy | sh
  - Any platform with Rust: cargo install joy-cli

  Same change in the German index.mdx. Same change in any other public-facing install hint we ship (README.md, Tutorial). Verify against the bundled and the website tutorial that no install line is platform-implicit.
