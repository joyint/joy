description: |-
  The purpose of the 'open' status and the gate model is not self-evident in user-facing surfaces (joy ai tutorial, joy project workflow display, joy --help). Pilot users asked why 'open' exists and whether the workflow is arbitrary.

  Update crates/joy-cli/docs/ai/Tutorial.md (canonical; sync to embedded copy via just sync-tutorial) and the workflow visualization in joy project:
  - Explain the status flow new -> open -> in-progress -> review -> closed (+ deferred) and what each state means: new = exists/proposed, open = approved/triaged into the backlog, etc.
  - Explain that 'open' matters mainly with the new->open triage gate, especially for AI-generated items (approve = human review/approval before work starts; gate allow_ai:false keeps AI out of self-approval).
  - Document the new verbs approve/defer/rework alongside start/submit/close/reopen.
  - Add a short design-rationale note: Joy uses ONE intentionally minimal workflow with gates as dimmers, not multiple configurable processes; this avoids well-meant over-modelling becoming an effort trap. Reference the existing wording in docs/dev/vision/README.md (single source of truth).

  Depends on JOY-01AC-14 (verbs must exist first). just check (incl. in_crate_ai_tutorial_matches_canonical).
