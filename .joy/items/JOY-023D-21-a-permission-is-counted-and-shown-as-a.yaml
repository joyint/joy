  date: 2026-09-01T15:29:53.007753800Z
  text: 'Checked against the code on 2026-09-01: delivered. crates/joy-ai/src/activity.rs carries ToolStep with an optional answered, the permission list keeps only answers that matched no call, and the app renders it that way (AgentTurnView takes tools with an optional answered beside the permissions). One action is one row again, and the count is the calls.'
