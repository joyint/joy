description: 'Operator 2026-07-27: the activity box said "2 tool steps" while the info hover on the same message said "tool steps 1", and the box listed "tool call allowed (joy)" above "bash: joy ls" - two rows for one action. Two defects with one root. The box counted tools PLUS permissions, the persisted record counts only calls, so the same turn had two different numbers. And a permission is not a step: it is the door to the call standing right next to it. joy_ai::activity now carries a ToolStep {title, status, answered} and the hosts attach the gate answer to the call it belongs to, matched by tool call id; the permissions list keeps only answers that matched no call, which is normally empty. The persisted v1 block gains an optional "answered" per tool entry, which older readers ignore.'
comments:
