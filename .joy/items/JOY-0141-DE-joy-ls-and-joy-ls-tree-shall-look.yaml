  text: 'Polish round 3: column alignment for VS-16 emoji glyphs (♻️ rework, ▶️ in-progress, ⏸️ deferred). The unicode_width crate counts the base character but ignores the U+FE0F variation selector, so terminals that render base+VS-16 as a 2-cell emoji ended up with one extra padding space. display_width now adds one cell per VS-16 occurrence.'
