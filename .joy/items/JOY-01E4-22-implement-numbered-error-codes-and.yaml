description: 'Open point from JOY-01D1-B6 - ADR: Error output format modeled on rustc diagnostics. Already in place: the diagnostic style (= help: / = note:), defensive parsing, and the lib/CLI error boundary. Not yet built: the numbered error codes (error[E042]) and the source-line caret (^) rendering specified in that ADR; JoyError is currently plain thiserror with no codes. Implement once the overall architecture is settled. Aligns with machine-readable output (JOY-01E2-0B - ADR: Rename auth schema fields / schema-evolution direction).'
