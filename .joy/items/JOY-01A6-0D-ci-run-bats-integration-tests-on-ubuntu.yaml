description: |-
  The 68 bats integration tests under tests/integration/*.bats (run locally by 'just test-int', part of 'just check') are NOT executed in GitHub CI -- ci.yaml only runs 'cargo test --workspace'. So 'green CI' currently does not cover the CLI integration suite at all.

  Add a CI job that installs bats-core and runs the bats suite on ubuntu-latest: build the joy-cli debug binary (with fast-kdf for speed, as 'just test-int' does), install bats, run 'bats tests/integration/*.bats' (or 'just test-int'). Keep the joyint/crypt sibling checkout like the other jobs. The bats setup helper relies on bash, git, mktemp, sed and util-linux 'script' (PTY) -- all present on ubuntu-latest.

  Acceptance: a green ubuntu bats job that actually executes the integration suite. Windows bats coverage is tracked separately (bats needs a bash env and several tests touch platform-specific paths/TTY/permissions).
