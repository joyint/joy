description: 'Initial implementation of Crypt, the encryption layer that protects items and files in a Joy project. Covers selective encryption with a default zone and optional named zones, Git filter integration so working-directory ciphertext is invisible to AI without breaking diff/blame, the wrapped-seed Auth model that makes recovery possible without losing identity, Job-bound AI access via Job records, lazy migration of existing projects, and Web Crypto API parity for the WebUI. References: ADR-038 (selective encryption), ADR-039 (wrapped-seed identity model), Crypt.md, Auth.md.'
