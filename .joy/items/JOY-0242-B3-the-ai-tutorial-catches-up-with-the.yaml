description: 'The tutorial (and the website docs, tracked separately) still describe the pre-JI-0174 world: server-side chat reading, job-bound platform sessions, removed flags. Rewrite the affected sections to today''s truth: chats are ALWAYS sealed (no identity, no persisted chat), the platform holds no key and reads no chat, an AI acts only under an explicit delegation (Delegate/Undelegate on the member card), sessions come from redeemed delegation tokens, and adapter ids are the tool names. Terse, scannable, memorable - the tutorial''s style rule.'
