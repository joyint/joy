description: 'Every contact to a forge host stands in joy''s own line for that host (vcs::contact, take_turn), and the span forge.contact covers the wait in the line and the forge''s own time together. The wait alone is only a debug line, which no host exports. Found 2026-10-12 while reading a week of spans (JP-011F-8E): a fetch from codeberg.org read 2.6 s in the median and a push 5.5 s, while the forge answered a single request in 0.2 to 0.6 s. Nobody could tell a slow forge from a full line. Wanted: the span carries waited_ms, joy''s own wait, on every contact (0 when the line was free). No behaviour changes.'
comments:
- author: claude delegated-by:horst.schwarz@joydev.com
  date: 2026-10-12T18:07:39.029526126Z
  text: 'Result: the span forge.contact has the field waited_ms, recorded on every contact right after the turn was taken (0 when the line was free); the debug line stays. Test crates/joy-core/tests/forge_contact_says_its_wait.rs: two contacts to one host with a 200 ms gap per request, the first says 0, the second about 400 ms. just check green. No behaviour changes.'
