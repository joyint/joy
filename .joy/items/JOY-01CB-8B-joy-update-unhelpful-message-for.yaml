  text: 'Plan: add foreign_install() -> Option<(manager, upgrade_cmd)> inferred from current_exe path (winget/cargo/other), gated on a missing axoupdater receipt. Use it in the human ''joy update'' binary line and in ''joy update --check'' to print ''managed by <mgr>'', the exact upgrade command, and ''managed files are re-synced automatically after you upgrade.'' Inform-only. bats assertion for the message.'
