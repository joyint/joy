description: 'When joy was installed by a foreign package manager (no axoupdater receipt, e.g. winget), ''joy update'' only prints ''managed by another installer'' and gives the user no way forward. Infer the manager from the binary path (std::env::current_exe) and print the exact upgrade command (winget: ''winget upgrade -s winget joyint.joy''; cargo: ''cargo install joy-cli''; else a winget example), plus a line clarifying that the managed files re-sync automatically after the upgrade. Inform-only: joy never shells out to the foreign manager (a failing winget must not entangle joy; the receipt-gating in JOY-0164-B5 stands). The in-repo managed-files sync already runs regardless of the receipt, and only ever matches the currently installed version, so there is no extra step. Same change applies to jyn in its own repo.'
