description: ADR JAPP-02BD-56 (Horst, 2026-09-14) puts every piece of app state and every local setting of the desktop into one directory per person, beside joy's sessions and on each system where apps keep such data. joy-core resolves the state base for its sessions but offers hosts no resolver for that app directory, so each host would re-derive the platform rules.
