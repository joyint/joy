description: |-
  JOY-02CC-46 added a sentence to this repository's SECURITY.md by hand: no minimum is enforced on a passphrase, and what is shown while a new one is typed is the zxcvbn estimate in bits and five levels. SECURITY.md is rendered from crates/joy-core/templates/SECURITY.md, which was not changed. So every sync writes the old paragraph back; seen on 2026-10-13, when the first joy call in a fresh worktree removed the sentence again. joyint/crypt carries the same sentence in its own words and loses it the same way.

  Since JOY-02CF-EE the sync commits what it changes, so after the next release the sentence would be removed by a commit in both repositories.

  To do: the template carries the sentence, in words that hold in any project (no name of a workspace); this repository's SECURITY.md is the template's rendering; a test holds that the template says it.
