description: 'Implements the default-zone CLI surface: joy crypt add <id|path>, joy crypt rm, joy crypt grant <email>, joy crypt revoke <email>, joy crypt list, joy crypt status. Per-zone AES-256-GCM key, per-member wraps stored under crypt_wraps in member entries in project.yaml. Default zone is implicit; first add creates it. Recovery is inherited from Auth (no separate Crypt recovery key).'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-03T16:32:48.437673Z
  text: 'Plan: (1) Schema: top-level crypt: { zones: { default: { ... } } } block in project.yaml. Member gains crypt_wraps: BTreeMap<zone_name, wrap_hex>. Item gains crypt_zone: Option<String>. (2) Zone-key handling in joy-crypt: zone keys are random 32-byte AES-GCM keys; per-member wrap = wrap(member_kek, zone_key) where member_kek derives from member''s seed via HKDF (joy-crypt::kdf::derive_hkdf_sha256 with info=''crypt-member-kek''). (3) joy-cli/commands/crypt.rs with subcommands add, rm, grant, revoke, list, status. add <ID> sets item.crypt_zone, auto-creates zone (default) on first call. add <PATH> appends to zone.paths. grant unwraps the actor''s zone_key and re-wraps for the target member. (4) Tests: bats coverage for grant/revoke roundtrip, list output shape, status on empty/non-empty zone.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-03T16:51:15.582767Z
  text: 'Done: schema gains top-level crypt: { zones: { name: { paths: [...] } } }, Member.crypt_wraps (zone -> hex wrap), Item.crypt_zone. joy-core/crypt module manages zone keys (random AES-256-GCM, member KEK = HKDF(seed, zone_name, ''crypt-member-kek''), wrap/unwrap_for_member roundtrip). joy crypt CLI: add (item or path; auto-creates default zone on first use), rm, list, status, revoke. The grant subcommand requires the X25519-based pairwise wrap primitive, deferred to JOY-0157-86 (split out so this default-zone work can ship); a clear bail message points there. 4 joy-core unit tests + 5 bats integration tests cover add/list/status/revoke and the grant deferral. 304 + 88 + 293 tests green.'
