  text: 'Done on branch feat/adapter-behaviour (joy 6188a7b): adapter_behaviour with one behaviour per tool (vibe: plan file named in its write_file/edit calls, control tags dropped from the reply; Claude: the Approve Plan call, else its todo list; every other tool: the protocol''s plan entries as a checklist), applied by the lane once a turn ends for chat turns, job rounds and the desktop''s own session. Record: details.plan; wire: turn-plan as the turn''s last event. Proven against the real tools on 2026-09-10 through the platform''s probe tests: vibe in a container (plan read from plans/<time>-<slug>.md), Claude via claude-agent-acp 0.76 (plan from the Approve Plan call). Sources read for this: mistral-vibe 2.19.1 (acp/, core/plan_session.py, core/middleware.py, core/agents/models.py) and claude-agent-acp 0.76 (tools.js, exit-plan.js, acp-agent.js).'
