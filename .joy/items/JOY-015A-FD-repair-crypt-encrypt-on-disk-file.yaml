- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-03T20:21:26.284197Z
  text: |-
    Spec refinements after discussion:

    (a) joy crypt list -> joy crypt ls (and zone list -> zone ls). Joy uses 'ls' everywhere; the original Crypt.md spec used 'list', that was inconsistent.

    (b) Free-file verbs split into a safe default and an explicit fallback:
      - Default (plaintext never on FS): joy crypt read (decrypt to stdout, pipe-friendly), joy crypt write (encrypt stdin), joy crypt edit ($EDITOR on temp, re-encrypt + delete temp on save).
      - Fallback (plaintext on FS until lock): joy crypt unlock <file>, joy crypt lock <file>. Documented as the larger AI-readable window, opt-in for tools that need a real path (PPT, PDF, images, video).

    (c) Session storage consolidates into one file. No separate zone-keys sidecar, no separate unlocked-files sidecar. The session JSON gets two new top-level fields:
      - zone_keys: { zone -> hex } - decrypted at joy auth, lives only as long as the session.
      - unlocked_files: [ { path, zone } ] - tracks files currently in plaintext on disk via joy crypt unlock.
    The signature still covers only 'claims'; zone_keys and unlocked_files are local mutable state.

    (d) Session lifetime = zone-key lifetime. On joy auth: derive zone keys fresh, write to session. On joy deauth: re-encrypt any unlocked files first, then delete the session file. On expiry detection (next joy command after the 24h TTL): read old file's unlocked_files + zone_keys, prompt re-auth, re-encrypt unlocked files with old zone keys, write fresh session, delete old.

    (e) joy crypt unlock prints a one-shot reminder. joy crypt status shows count. joy crypt ls --unlocked lists them explicitly. No 'WARNING: N unlocked' on every command.

    (f) Permission errors at the read path produce 'no access to zone X' (joy_core::error::ZoneAccessDenied), not a YAML-parse error.

    These refinements are part of Phase 1 (Crypt.md update) before any code lands.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-03T20:55:34.818055Z
  text: |-
    Final design after the long thread - simplified and consolidated:

    THREAT MODEL (revised):
    This item flips ADR-038's 'forge sees plaintext' decision for marked content. Working directory, Git history, and the forge all hold ciphertext for items and files added via joy crypt add. Selective E2E - the user opts in per item/path/zone; everything outside stays plaintext as today. Joyint.com optionally re-enters the loop as a *trusted decrypt gateway* via a platform-wrap, configured in the Joyint Web UI (NOT in the joy CLI), used for review surface or decrypt-on-mirror to other forges.

    CLI SURFACE (no token verbs):
    Zone admin: joy crypt add, rm, grant, revoke, ls, ls --unlocked, status.
    Items: implicit decrypt via joy show/edit (no special verbs).
    Free files: joy crypt read/write/edit (default, plaintext never on FS) + joy crypt lock/unlock (opt-in fallback for binary tools, AI-readable window during unlock).
    Bulk: --all flag on add/rm.
    Named zones: --zone <name> on every verb.
    Zone admin: joy crypt zone ls / zone rm.

    OUT OF CLI (deferred to joyint platform / WebUI):
    - Platform-wrap (forge token equivalent) is set via Joyint Web UI as part of MS-03 WebUI Crypt parity (JOY-0150-B0).
    - Decrypt-on-mirror logic in joyint-server is a separate platform item.
    - Cross-forge review surfaces (browser extension, joyint as cross-forge UI) are future, not in any active item.

    ENCRYPT-ON-DISK SEMANTICS:
    joy crypt add encrypts the file in place at the moment of the call. No git checkout dependence. After the call the working-dir file IS the JOYCRYPT blob.

    ITEM READ PATH:
    joy-core/store::read_yaml (or a wrapper for item files) detects JOYCRYPT magic, decrypts via session zone-keys, then serde_yaml. Permission errors map to JoyError::ZoneAccessDenied with a friendly 'no access to zone X' message, NOT a YAML parse error.

    SESSION STORAGE:
    One file at ~/.local/state/joy/sessions/<hash>.json, mode 0600. Holds claims+signature (auth) AND zone_keys (decrypted at joy auth) AND unlocked_files (tracking). The pre-existing zones.json sidecar from JOY-014B-09 is removed - everything consolidates into the session file. zone_keys lifetime equals session lifetime; on expiry detection joy reads old file's unlocked_files and zone_keys, prompts re-auth, re-encrypts unlocked files with old zone keys, writes fresh session, removes old.

    GIT FILTER FATE:
    With true E2E, the clean filter is no longer needed (working dir = git blob = ciphertext). The smudge filter and textconv stay relevant only when the user temporarily checks files out via git tooling (rare, since joy crypt verbs cover most use cases). To be confirmed during Phase 2 implementation - may simplify the filter pipeline.

    SPEC TOUCHPOINTS (Phase 1):
    - Crypt.md: rewrite Server-side exposure, CLI verbs (incl. ls vs list), new sections for free-file workflows, permission errors, session lifetime, encrypt-on-disk diagram.
    - ADR-038: amend or supersede the Server-side exposure section. New ADR-040 candidate vs amendment - decide during draft.
    - Auth.md: minor cross-link update.

    PHASE ORDER (unchanged):
    1. Spec (Crypt.md + ADR amendment) - approved by user before code.
    2. Implementation (encrypt-on-disk, item decrypt path, file verbs, error type, session-file consolidation).
    3. Docs (Tutorial, website features.mdx).

    JOYINT PLATFORM-SIDE (out of scope here, separate item):
    Decrypt-on-mirror gateway: configured per mirror (--decrypt or default-ciphertext), per zone. Joyint stores ciphertext at rest. Browser-side WebUI reads user seed, computes pairwise wrap against joyint's published platform pubkey, sends to backend. Joyint uses the wrap to decrypt for review-rendering and for plaintext-mirroring on push.
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-05-04T06:16:21.311504Z
  text: |-
    Phase 2 (implementation) complete. Sub-phases:

    (2a) Filter/sidecar rollback. crypt_filter.rs deleted, Filter subcommand removed, setup_git_filter and ensure_gitattributes_for_item removed, save_zone_keys / load_zone_keys / cache_zone_keys removed. Session file no longer holds Crypt secrets. CryptCommand::List + ZoneCommand::List renamed to Ls per Joy convention.

    (2b) ZoneAccessDenied + transparent decrypt. New JoyError::ZoneAccessDenied { zone } variant. joy_core::crypt has a thread-local active-zone-keys context (set_active_zone_keys / clear_active_zone_keys / active_zone_key / has_active_zone_keys). store::read_yaml peeks for the JOYCRYPT magic and decrypts via the active context before serde_yaml; missing zone surfaces as ZoneAccessDenied.

    (2c) Encrypt-on-disk in joy crypt add/rm. items::save_item now uses an internal write_item_file that encrypts when item.crypt_zone is set, atomic via temp + rename. run_add / run_rm / run_add_all / run_rm_all walk through update_item with the active zone key installed. Free-file paths walk crypt.zones[].paths with resolve_target_paths (file or recursive directory), encrypt_file_in_place / decrypt_file_in_place per file. Persist-wrap-first ordering for crash safety.

    (2d) Free-file verbs. joy crypt read (decrypt to stdout), write (encrypt stdin), edit ($EDITOR on temp), unlock (decrypt in place), lock (re-encrypt). All run via a fresh per-command unlock_for_file path - passphrase prompt every time, seed in memory only for the command's lifetime, no persisted secrets.

    (2e) Auto re-lock walk in joy auth. After a successful passphrase verification, walk crypt.zones[].paths for every zone the member has a wrap for, encrypt any file currently in plaintext, print 'Re-locked N file(s).' Best-effort, no daemon - the next joy auth (or any other crypto-touching joy command via crypt_session::ensure_zone_keys) does the same opportunistic walk.

    (crypt_session helper) New joy-cli/src/crypt_session.rs with ensure_zone_keys() that any read command (joy show, joy ls) calls upfront. No-op on plain projects; populates the thread-local context for projects with Crypt activity. joy show and joy ls grew an optional --passphrase flag that hooks into this.

    Tests: 310 joy-core, 88 joy-cli unit tests; 304 bats integration tests including the new crypt e2e (read/write/edit/lock/unlock roundtrips, joy show on encrypted item, joy auth re-lock). cargo fmt + cargo clippy --all-D warnings both green. Phase 3 (Tutorial + website docs) follows next.
