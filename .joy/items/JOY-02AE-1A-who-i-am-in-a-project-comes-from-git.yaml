  text: 'Built by a Sonnet agent on fix/joy-identity-order (8 commits), reviewed 2026-09-19. resolve_identity: delegation session, then git config user.email (one git2 read, local over global over system), then the forge account''s verified address through the connector''s identity verb (already shipped: GET /user/emails on all three forges), matched through privacy::member_key_for_any. The pin is no longer read for identity; the pin functions stay for acting_member and the D4.5 name check. Gates green: clippy -D warnings, 985 tests in joy-core and joy-cli. Acceptance (c) verified on a copy of the Mac checkout of mps-netbrain-demo (user.email names the member, no pin): the old binary answers ''this project does not know who you are'', the new one answers member horst.schwarz@joydev.com, auth_initialized true. Behaviour change to know: joy auth --user on a machine without git config no longer sticks for later bare commands, by design.'
