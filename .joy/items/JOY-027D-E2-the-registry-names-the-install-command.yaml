description: 'Operator 2026-09-09, on the desktop''s new AI-member card: the reason a member cannot run was one sentence with the command inside it, which reads badly and cannot be copied. AdapterSpec.install_hint and ToolBinary.install_hint were prose and command mixed (''npm i -g @agentclientprotocol/claude-agent-acp; Claude Code signs in inside the tool''). Both gain install_command: Option<&str> and keep prose only, so a surface can print the sentence and offer the command as something to copy, and a surface with no room for a box can still join them into one line. None where installing means downloading an application (Claude Code, Mistral Vibe).'
