description: 'Git work on a repository is implemented four times today: (1) joy-core''s vcs.rs shells out to the git CLI (trait Vcs, ADR-017, JOY-003E) and can neither fetch nor fast-forward nor merge; (2) joy-chat-store''s chat_ref uses git2 for refs/joy/chats; (3) the platform has its own git2 layer in src/git/mod.rs (fetch, fast-forward, merge, push, chats, worktrees); (4) the desktop app has a third git2 layer in src-tauri/git_ops.rs that duplicates a subset of the platform''s logic. The consequences were shown on 2026-08-26 (demo-calc on halcyon): the desktop sync does not know the platform''s YAML-aware merge, hangs on divergence and contradicts ADR JAPP-00D8, under which divergence is the normal case for write-behind.'
comments:
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-08-26T09:35:04.759182775Z
  text: 'Plan (mit Horst 2026-08-26): Komplettloesung statt Einzelfix. Neue Workspace-Crate mit der gemeinsamen git2-Sync-Engine: Fetch ohne FETCH_HEAD-Schreiben (Fast-Forward vom Tracking-Ref, eliminiert die Riss-Klasse aus JP-00DB-61 und JAPP-0198-EA an der Wurzel), YAML-bewusster write-behind-Merge, Push, Schreibprobe, Fehlerklassen, Chats-Sync via joy-chat-store; Credentials als Parameter (Platform: Forge-Token; Desktop: Credential-Helper/SSH-Agent). Platform ersetzt src/git/mod.rs durch die Engine (Job-Worktree-Helfer bleiben platform-eigen), Desktop ersetzt git_ops.rs komplett. Arbeiter-Schleifen bleiben je Host duenn.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-08-26T13:04:33.891006994Z
  text: 'Umgesetzt in Commit 3ad9ff9 (joy), 9439356 (platform), 6d2d10b (app). Eine Engine in joy_core::vcs (forge.rs kopflos per git2, mod.rs CLI-Verben und benannte CLI-git-Helfer); Platform-Fassade und Desktop restlos umgezogen, joy-chat-store komponiert seinen Forge-Sync ueber die Primitiven. Kerninvariante: FETCH_HEAD wird nie mehr geschrieben oder gelesen (libgit2s update_tips entfaellt; es schneidet die Datei bedingungslos ab, Beleg remote.c truncate_fetch_head), per Test erzwungen. Waechter: git2 ausserhalb joy-core/joy-chat-store nur dev-dependency, guard-vcs prueft git-Binary-Aufrufe in joy- und platform-Check. Testkette gruen: joy just check (inkl. bats), platform just check, app just check, beide e2e-Bloecke des Umbrella-check-all. Adversariales Audit gefahren; Funde eingearbeitet (discover, Remote-Name-Tracking, Repo-Config fuer Local-Auth, Erstpublish, leere Advertisements, refresh ohne update_tips). Bewusst offen: das git2-Objekt-Plumbing von joy-chat-store (eigene Speicherschicht, sanktionierte Stelle) und die Lizenzfrage des umgezogenen Codes (vormals Commercial, jetzt MIT in joy-core) liegen bei Horst.'
- author: ai:claude@joy delegated-by:horst.schwarz@joydev.com
  date: 2026-08-31T15:38:56.733993143Z
  text: 'State in English for the record (2026-08-31), replacing the German plan and result notes. Agreed with Horst on 2026-08-26: a complete solution rather than a single fix - one shared git2 sync engine (fetch without writing FETCH_HEAD, fast-forward from the tracking ref, a YAML-aware write-behind merge, push, the write probe, error classes, and the chats sync through joy-chat-store, with credentials as a parameter). Delivered in commits 3ad9ff9 (joy), 9439356 (platform) and 6d2d10b (app): one engine in joy_core::vcs (forge.rs headless over git2, mod.rs the CLI verbs), with the platform facade and the desktop moved over completely and joy-chat-store composing its forge sync from the primitives. The core invariant: FETCH_HEAD is never written or read again, because libgit2''s update_tips truncates the file unconditionally, which was the root of the tearing class (JP-00DB-61, JAPP-0198-EA).'
