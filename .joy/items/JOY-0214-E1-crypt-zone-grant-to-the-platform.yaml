description: 'The container concept''s ''Zonen-Grant an die Plattform'', user-decided per zone: joy crypt grant <zone> platform wraps the zone key against the registered platform verify_key (zone-major, crypt.zones.<zone>.platform_wrap). joy-core platform_zone_keys unwraps every granted zone from the platform seed. With it the platform serves zone content to joy-unlocked app sessions and can later provision job containers. Revoke by removing the wrap; real revocation of a leaked key means re-keying the zone.'
