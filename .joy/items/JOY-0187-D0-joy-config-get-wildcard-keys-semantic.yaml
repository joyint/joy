  date: 2026-05-15T19:26:54.553233147Z
  text: '[x] Added describe_value(key, value) -> Option<String> and flatten_under(value, prefix) -> Vec<(key, value)> helpers in joy-core/model/config.rs. Descriptions cover modes.default, workflow.auto-git, output.color, and the boolean toggles (workflow.auto-assign, auto-sync, output.emoji/short/fortune). joy config get now accepts a trailing .* for wildcard listings under a prefix (e.g. modes.*, output.*, *) and a --describe flag that adds a one-line semantic description to each value. Display renders aligned key/value/description rows; JSON for the wildcard form returns an entries array; the legacy scalar/object JSON shape on non-wildcard keys is preserved (--describe just adds an optional description field). Tests: tests/integration/config_describe.bats (7 cases) plus three unit tests in joy-core (describe_value_modes_default, flatten_under_modes_returns_default, flatten_under_output_lists_scalars_only). All cargo + bats checks green.'
