description: The release's lockfile refresh on 2026-11-26 took filetime 0.2.29 -> 0.2.30, which deprecates set_file_mtime when built with Rust >= 1.99 (std::fs::set_times is stable there). CI runs 1.100 with -D warnings, so Lint, Test and bats fail to compile joy-core. joy still builds on older toolchains (zara had 1.95), where std::fs::set_times does not exist, so the calls stay on filetime with the deprecation allowed at the four sites, and the Windows reason for filetime (FILE_WRITE_ATTRIBUTES on read-only loose objects) is kept.
