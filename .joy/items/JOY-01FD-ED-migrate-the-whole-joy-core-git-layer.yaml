description: Stage 2 of the git2 move (stage 1 = JOY-01FC-4B, chats on refs/joy/chats). Once git2 is a joy-core dependency for refs/joy/chats, migrate the remaining CLI-subprocess git away from GitVcs in vcs.rs (add, add_all, commit, push, push_tag, is_ignored, is_clean, config_get/set, remotes, version tags, forge detection, init_repo, user_email) and the direct Command::new("git") calls in ai_setup.rs (git rm --cached, ls-files) onto git2, so joy-core has a single git engine. Verify release/version-tag and ai-setup paths keep working. Avoids a permanent CLI/git2 hybrid.
