description: On first joy auth after upgrade, detects legacy member entries (no seed_wrap_*), derives the seed via the legacy passphrase + kdf_nonce path, generates a fresh recovery key, writes seed_wrap_passphrase and seed_wrap_recovery to project.yaml. Identity keypair preserved; existing Crypt wraps unaffected. One additional prompt at first login to capture the recovery key for external storage.
