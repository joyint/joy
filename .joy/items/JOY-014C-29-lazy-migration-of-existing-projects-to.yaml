  text: 'Done as part of JOY-0147-85: lazy migration runs on the first joy auth after upgrade for any member entry without seed_wrap_*. Detects legacy state, takes the legacy derived_key as the seed (so the existing keypair stays valid), generates a fresh recovery key, wraps the seed under both KEKs, persists, displays the recovery key once. Identity keypair preserved; existing Crypt wraps unaffected. Same migration path is reused by joy auth passphrase when called on a legacy entry.'
