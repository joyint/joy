description: |-
  Since mid 2026 GitHub puts every workflow run that a GITHUB_TOKEN push creates on a pull request into an approval-required state (docs: Triggering a workflow, GITHUB_TOKEN; verified on 2026-10-18 in joyint-test/joy-merge-probe and on joyint/joy#89, #90). The merge commit that 'joy merge ci' pushed is such a push, so every pull request it helped waited for a person to click 'Approve and run'. The push setting of the repository changes nothing, workflow_dispatch runs do not count for the pull request, and no event announces the waiting run. The only pushes the forge trusts come from an identity a person set up (GitHub App, token), and that is one mechanism per forge.

  Decision (operator, 2026-10-18): the job pushes nothing any more. It tries the merge where joy is installed and, only when Joy files stand in the way, tells the author in a comment what to do on their machine: switch to the branch, pull the target, push. The pull runs the merge driver joy init registered, so the Joy files resolve by themselves. Where plain git can merge, the job stays silent. On later pushes it updates its comment instead of adding one. GitHub, Gitea and GitLab alike.

  - [ ] joy merge ci: never pushes; --advise <file> writes the comment when Joy files were resolved or stay in conflict; silent when the target is contained or plain git merges
  - [ ] The head branch for the 'git switch' line from --head or the CI (GITHUB_HEAD_REF, CI_MERGE_REQUEST_SOURCE_BRANCH_NAME)
  - [ ] Templates: permissions contents read, the comment step posts the advice (gh pr comment --edit-last, GitLab notes API), the fork step uses the same words
  - [ ] Tests in init.rs and merge.rs; tutorial chapter 13 and the AI tutorial say what the job does now
  - [ ] This repository's own joy-merge.yml refreshed from the template
