    Result on feat/joy-merge-advises:
    [x] joy merge ci pushes nothing. --advise <file> gets the note when only Joy's rules merge a file, or when git stops at a file outside Joy's own (then the note names it). Silent when the target is contained or plain git merges alone. --head from the flag, GITHUB_HEAD_REF / CI_MERGE_REQUEST_SOURCE_BRANCH_NAME, or the checked out branch.
    [x] Templates GitHub, Gitea, GitLab: contents read, the note posted as a comment (gh pr comment --edit-last, else a new one; a later clean run tells the last comment so; GitLab a note over the API with JOY_PUSH_TOKEN, now with the api scope). The fork step says the same words with the base repository's clone URL.
    [x] Tests: merge.rs (note text, what git stops at), init.rs (the_job_advises_and_never_pushes, the GitLab job, the token on the Try step). just check green.
    [x] Tutorial chapter 13 and the AI tutorial.
    [x] Tried against joyint-test/joy-merge-probe with the built binary: a branch behind main with the same item commented gets the note and nothing is pushed; a code-only branch and a contained target stay silent.
    Open: this repository's own joy-merge.yml is refreshed by joy update once the release with --advise is out; refreshed earlier, the job would call a flag the installed joy does not have. The same holds for every project, which is why the template and the binary ship together.
