description: 'Horst on mule, 2026-08-29: a chat named f created in the app; joy chat send f <text> answers ''no chat with id or name f''. A write deliberately does not fetch refs/joy/chats before it appends (JOY-026C-34, one forge contact per message), so a chat born elsewhere is unknown to the CLI until a read (joy chat ls/show) fetched once. The person had to learn this the hard way; the error names no way out. Requirement: a send to an unknown chat must not fail on the local state alone.'
