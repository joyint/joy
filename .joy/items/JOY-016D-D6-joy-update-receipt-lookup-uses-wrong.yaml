created: 2026-05-09T21:38:36.840263Z
updated: 2026-05-09T21:38:50.931851Z
description: |-
  axoupdater is invoked via AxoUpdater::new_for("joy"), but cargo-dist's installer writes the receipt under the Cargo package name joy-cli (~/.config/joy-cli/joy-cli-receipt.json). joy update --check therefore reported 'install receipt missing (managed by another installer)' even on cargo-dist installs done via curl get.joyint.com/joy.

  Fix: PKG_NAME = "joy-cli" so the lookup matches the receipt path written by the installer.
comments:
