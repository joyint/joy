  date: 2026-05-09T21:38:50.845441Z
  text: '[x] PKG_NAME changed from "joy" to "joy-cli" in commands/update.rs. Verified locally: receipt at ~/.config/joy-cli/joy-cli-receipt.json now found, joy update --check shows Binary ''up to date (0.15.0)'' instead of ''install receipt missing''.'
