description: Wrap the opaque member ID in a MemberRef type whose Display/serialization yields the resolved value (name, else e-mail), never the raw ID; raw-ID access only via an explicit method used on internal paths. Guarantee no Joy command emits a raw ID on the terminal or in --json; when resolution is impossible (members.yaml locked) request authentication instead of printing an ID. Ref ADR-042 §2.
