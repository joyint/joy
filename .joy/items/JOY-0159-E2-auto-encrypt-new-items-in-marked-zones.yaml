description: joy crypt add --all sets every existing item's crypt_zone, but joy add task ... creates a new item without it. Add a --crypt[=<zone>] flag on joy add and joy edit so users can opt new items into a zone explicitly. Plus a project-level default (CryptConfig.default_zone or similar) that auto-tags new items in --all mode. Touches joy-cli/commands/add.rs and edit.rs and joy-core/model/project.rs.
